  // Convierte un timestamp en milisegundos (Date.now()) al formato "dd/mm/aaaa hh:mm a.m./p.m."
  // en hora de Lima -- usado para "Creado el" y "Entregado el" en la orden impresa. Distinto de
  // fmtFechaCorta/fmtFechaLarga (que trabajan con una fecha "yyyy-mm-dd" sin hora) porque acá
  // sí importa la hora exacta, no solo el día.
  function fmtFechaHoraMillis(ms){
    if(!ms) return "";
    var s = new Date(ms).toLocaleString("es-PE", { timeZone:"America/Lima", day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:true });
    return s.replace(",", "");
  }
  // Datos de trazabilidad del pedido (quién lo atendió, cuándo se creó, cuándo se entregó de
  // verdad) -- lo que Jessica pidió para superar en información a la hoja del sistema viejo
  // ("Creado por / Creado el / Fecha Entrega Única"). Cada línea solo aparece si hay dato --
  // un pedido antiguo, de antes de este cambio, simplemente no trae "Atendido por" ni
  // "Entregado el" y no debe salir con datos en blanco.
  function buildPedidoMetaHTML(p){
    var rows = [];
    if(p.atendidoPor && String(p.atendidoPor).trim()) rows.push(["Atendido por:", esc(p.atendidoPor)]);
    if(p.createdAt) rows.push(["Creado el:", esc(fmtFechaHoraMillis(p.createdAt))]);
    if(p.entregadoEn){
      var entregadoTxt = fmtFechaHoraMillis(p.entregadoEn) + (p.entregadoPor && String(p.entregadoPor).trim() ? " — " + p.entregadoPor : "");
      rows.push(["Entregado el:", esc(entregadoTxt)]);
    }
    if(rows.length === 0) return "";
    var html = '<div style="font-size:10px; color:#666; margin-top:4px; padding-top:3px; border-top:1px dashed #ccc;">';
    html += rows.map(function(r){ return '<span style="margin-right:14px;"><strong>' + r[0] + '</strong> ' + r[1] + '</span>'; }).join("");
    html += '</div>';
    return html;
  }
  // Color principal de las franjas/encabezados oscuros de la orden -- un marrón café en vez
  // del azul de la primera prueba (Jessica: "el azul con el amarillo se ve feo... uno sutil,
  // que se vea bien, bonito y sofisticado"), a tono con la tinta del logo y el amarillo que
  // ya tenía la franja de Recojo/Entrega. Un poco más claro que el primer marrón, a pedido
  // de Jessica, pero todavía con suficiente contraste para el texto blanco encima.
  var PEDIDO_DARK = "#8a5c3c";
  // Filas mínimas que siempre se ven en la tabla, aunque el pedido tenga solo 1 o 2 productos
  // -- Jessica: "yo quiero que se vea ahí más espacio... 8 filas" -- para que no se vea vacía o
  // chica cuando el pedido es corto. Si el pedido tiene más productos que esto, no se recorta
  // nada; solo se agregan filas en blanco hasta llegar al mínimo.
  var PEDIDO_FILAS_MIN = 8;
  // Un pedido masivo (varios productos x varios días de entrega) puede juntar muchas filas --
  // Jessica: "es importante que salga todo en una hoja (siempre usamos hoja A4)". En vez de un
  // tamaño de letra fijo, la tabla se va achicando por niveles según cuántas filas tenga, para
  // que quepa completa en una sola hoja A4 vertical sin recortar productos. Con pocas filas se
  // queda en el tamaño normal (igual que antes); estos niveles solo entran a tallar cuando el
  // pedido realmente tiene muchas filas.
  // Umbrales verificados imprimiendo (a PDF, con el mismo A4 y margen de 10mm que usa la app
  // de verdad) pedidos de prueba de 8 a 140 filas y confirmando en cuáles se mantenía en 1 sola
  // hoja -- no son números "a ojo". Cada nivel solo se usa hasta la cantidad de filas que de
  // verdad le entra en una hoja A4 vertical; pasado ese punto se achica al siguiente nivel.
  function pedidoTableDensity(n){
    if(n <= 12) return { font:12, cell:"5px 6px", head:"6px 6px", margin:"10px 0 4px", obs:10 };
    if(n <= 20) return { font:10.5, cell:"3px 6px", head:"4px 6px", margin:"8px 0 3px", obs:9 };
    if(n <= 30) return { font:9.5, cell:"2px 5px", head:"3px 5px", margin:"6px 0 2px", obs:8.5 };
    if(n <= 40) return { font:8.5, cell:"1.5px 4px", head:"2px 4px", margin:"5px 0 2px", obs:8 };
    if(n <= 48) return { font:7.5, cell:"1px 3px", head:"1.5px 3px", margin:"4px 0 1px", obs:7 };
    return { font:6.5, cell:"0.5px 2px", head:"1px 2px", margin:"3px 0 1px", obs:6 };
  }
  function pedidoTableHTML(p){
    var isMasivo = p.canal === "masivo";
    var subtotal = 0;
    var items = p.items || [];
    var filas = Math.max(items.length, PEDIDO_FILAS_MIN);
    var d = pedidoTableDensity(filas);
    var headStyle = "border:1px solid " + PEDIDO_DARK + "; padding:" + d.head + "; background:" + PEDIDO_DARK + "; color:#fff; font-size:11px; letter-spacing:.02em;";
    function th(label, align){ return '<th style="' + headStyle + 'text-align:' + align + ';">' + label + "</th>"; }
    var head = th("N°", "center") + (isMasivo ? th("FECHA ENTREGA", "left") : "") + th("CANT.", "center") + th("PRODUCTO", "left") + th("PRECIO", "right") + th("TOTAL", "right");
    // Anchos fijos por columna (via colgroup + table-layout:fixed) para que Cantidad, Precio y
    // Total queden siempre alineados en la misma posición en todas las filas, en vez de que el
    // ancho se acomode según el texto más largo de cada pedido.
    var colgroup = "<colgroup>" +
      '<col style="width:30px;">' +
      (isMasivo ? '<col style="width:80px;">' : "") +
      '<col style="width:44px;">' +
      "<col>" +
      '<col style="width:64px;">' +
      '<col style="width:68px;">' +
      "</colgroup>";
    var body = "";
    items.forEach(function(it, idx){
      var lineTotal = num(it.cantidad) * num(it.precio);
      subtotal += lineTotal;
      // color:#111 explícito acá (antes se dejaba heredar del div contenedor) -- en la imagen
      // JPEG generada con html2canvas, Cantidad/Producto/Precio salían con una letra clarísima,
      // casi ilegible, mientras Total sí se veía bien -- html2canvas no está heredando bien el
      // color del contenedor para estas celdas. Fijar el color en cada celda lo arregla sin
      // tocar nada del layout, tamaño de letra ni el resto de la tarjeta impresa/compartida.
      var cellStyle = "border:1px solid #ccc; padding:" + d.cell + "; vertical-align:top; color:#111;";
      var obsHtml = it.obs && it.obs.trim()
        ? '<div style="font-size:' + d.obs + 'px; font-style:italic; color:#555;">' + esc(it.obs.trim()) + "</div>"
        : "";
      body += "<tr>" +
        '<td style="' + cellStyle + 'text-align:center; color:#888;">' + (idx + 1) + "</td>" +
        (isMasivo ? '<td style="' + cellStyle + 'text-align:left;">' + esc(fmtFechaCorta(it.fecha)) + "</td>" : "") +
        '<td style="' + cellStyle + 'text-align:center; font-weight:700;">' + fmt(it.cantidad) + "</td>" +
        '<td style="' + cellStyle + 'text-align:left;">' + esc(it.producto) + obsHtml + "</td>" +
        '<td style="' + cellStyle + 'text-align:right;">S/' + fmtMoney(it.precio) + "</td>" +
        '<td style="' + cellStyle + 'text-align:right; font-weight:700;">S/' + fmtMoney(lineTotal) + "</td>" +
        "</tr>";
    });
    // Filas en blanco de relleno hasta el mínimo -- mismo N° correlativo, sin datos.
    for(var i = items.length; i < PEDIDO_FILAS_MIN; i++){
      var blankCellStyle = "border:1px solid #ccc; padding:" + d.cell + ";";
      body += "<tr>" +
        '<td style="' + blankCellStyle + 'text-align:center; color:#bbb;">' + (i + 1) + "</td>" +
        (isMasivo ? '<td style="' + blankCellStyle + '"></td>' : "") +
        '<td style="' + blankCellStyle + '"></td>' +
        '<td style="' + blankCellStyle + '"></td>' +
        '<td style="' + blankCellStyle + '"></td>' +
        '<td style="' + blankCellStyle + '"></td>' +
        "</tr>";
    }
    var theadHtml = "<thead><tr>" + head + "</tr></thead>";
    return { html: '<table style="width:100%; border-collapse:collapse; table-layout:fixed; font-size:' + d.font + 'px; margin:' + d.margin + ';">' + colgroup + theadHtml + "<tbody>" + body + "</tbody></table>", subtotal: subtotal };
  }

  // ---------- Vista previa de un pedido en pantalla (para WhatsApp) ----------
  // Jessica: "Necesito Vista previa de pedidos, puedo enviar al WhatsApp del cliente para que
  // lo verifique". Reutiliza la misma tarjeta de la orden impresa (buildPedidoPrintCardHTML),
  // pero mostrada dentro de la app en una ventana flotante en vez de abrir el diálogo de
  // imprimir del navegador -- así puede revisarla al toque y tomarle una captura de pantalla
  // para mandarla directo por WhatsApp, sin tener que guardar ni buscar ningún archivo PDF.
  function closePedidoVistaPrevia(){
    var ov = document.getElementById("pedidoPreviewOverlay");
    if(ov) ov.remove();
    document.removeEventListener("keydown", pedidoVistaPreviaEscHandler);
  }
  function pedidoVistaPreviaEscHandler(ev){
    if(ev.key === "Escape") closePedidoVistaPrevia();
  }
  // Número de WhatsApp del cliente del pedido, listo para abrir el chat directo con
  // "https://wa.me/...". Jessica: "si puedes enviar al WhatsApp del cliente sería genial" --
  // WhatsApp no deja adjuntar una imagen automáticamente desde un link (por seguridad, ningún
  // sitio puede hacer eso), así que este botón abre el chat correcto del cliente ya listo, y la
  // imagen (bajada o compartida con los otros botones) se adjunta ahí con un toque.
  function pedidoWhatsappLink(p){
    var tel = ((p.cliente && p.cliente.telefono) || "").trim();
    if(!tel) return null;
    var digits = tel.replace(/\D/g, "");
    if(!digits) return null;
    // Celulares de Perú: 9 dígitos, empiezan con 9. Si no trae el código de país (51)
    // todavía, se lo agregamos; si ya lo trae (11 dígitos empezando en 51), se deja tal cual.
    if(digits.length === 9 && digits.charAt(0) === "9") digits = "51" + digits;
    return "https://wa.me/" + digits;
  }
  // Nombre de archivo para la imagen descargada/compartida del pedido. Jessica (set-2026):
  // WhatsApp mostraba la orden como archivo/documento en vez de foto -- .jpg (con el archivo
  // realmente codificado como JPEG, no solo renombrado) es el formato que WhatsApp y el resto
  // del celular reconocen como foto, igual que cualquier imagen tomada con la cámara.
  function pedidoImagenNombre(p){
    var base = p.esBorrador ? "Cotizacion" : ("Pedido-" + (p.numero || "sinnumero"));
    var cliente = ((p.cliente && p.cliente.nombre) || "").trim().replace(/[^\w\s-]/g, "").replace(/\s+/g, "-");
    return (cliente ? base + "-" + cliente : base) + ".jpg";
  }
  // Calidad del JPEG exportado -- alta (95%) porque es texto y precios que hay que poder leer
  // bien en la pantalla chica de un celular, no una foto donde el peso del archivo importa más
  // que el detalle fino.
  var PEDIDO_IMAGEN_CALIDAD = 0.95;
  // Convierte la tarjeta del pedido (tal como se ve en pantalla) en un canvas nítido, en una
  // resolución fija (2x o la del dispositivo, lo que sea mayor) -- así ya no depende de cuánto
  // zoom tenga la pantalla al tomar una captura manual, que era lo que la pixelaba. El canvas en
  // sí no tiene formato de archivo todavía -- eso se decide recién al convertirlo con toBlob()
  // (ver más abajo), que es donde se elige JPEG de verdad.
  function capturePedidoPreviewCanvas(callback){
    var body = document.querySelector("#pedidoPreviewOverlay .pedido-preview-body");
    if(!body || typeof html2canvas === "undefined"){ callback(null); return; }
    html2canvas(body, { backgroundColor:"#ffffff", scale: Math.max(2, window.devicePixelRatio || 1), useCORS:true }).then(function(canvas){
      callback(canvas);
    }).catch(function(){ callback(null); });
  }
  function pedidoPreviewActionBtn(text){

  function showPedidoVistaPrevia(p){

    var box = document.createElement("div");

    var head = document.createElement("div");

    box.appendChild(body);

    // Botones de acción. Jessica (set-2026): "CREAR PEDIDO → VISTA PREVIA → COMPARTIR LA ORDEN
    // → ENVIAR AL CLIENTE", y que WhatsApp la reciba como FOTO, no como documento (el problema
    // no era solo la extensión -- .png/.jpg da igual si WhatsApp la trata como archivo). El
    // cambio real es doble: 1) la imagen ahora se genera como JPEG de verdad (canvas.toBlob con
    // "image/jpeg", no solo un nombre .jpg) que es el formato que un celular reconoce como foto,
    // igual que las que toma la cámara; 2) "Compartir por WhatsApp" ya no depende de que el
    // navegador tenga Web Share -- ahí (celular) abre el menú nativo para elegir WhatsApp sin
    // pasar por la carpeta de descargas; si no está disponible (computadora, la mayoría de las
    // veces), en un solo toque descarga la foto YA en JPG y además abre el chat del cliente
    // listo para adjuntarla, en vez de obligar a hacer esos dos pasos por separado como antes.
    var actions = document.createElement("div");
    actions.className = "pedido-preview-actions";
    var waLinkPrev = pedidoWhatsappLink(p);

    var shareBtn = pedidoPreviewActionBtn("📤 Compartir por WhatsApp");
    shareBtn.addEventListener("click", function(){
      var original = shareBtn.textContent;
      shareBtn.disabled = true;
      shareBtn.textContent = "Generando imagen…";
      capturePedidoPreviewCanvas(function(canvas){
        shareBtn.disabled = false;
        shareBtn.textContent = original;
        if(!canvas){ showToast("No se pudo generar la imagen. Revisa tu conexión e intenta de nuevo."); return; }
        canvas.toBlob(function(blob){
          if(!blob){ showToast("No se pudo generar la imagen."); return; }
          var file = new File([blob], pedidoImagenNombre(p), { type:"image/jpeg" });
          var shareData = { files:[file], title:"Pedido" };
          if(navigator.share && (!navigator.canShare || navigator.canShare(shareData))){
            navigator.share(shareData).catch(function(){});
            return;
          }
          // Sin menú nativo de compartir (computadora, casi siempre): se descarga la foto en
          // JPG y de una vez se abre el chat correcto del cliente, para que solo falte
          // adjuntarla -- eligiendo la opción de FOTO/imagen de WhatsApp, no "Documento".
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = pedidoImagenNombre(p);
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
          if(waLinkPrev){
            window.open(waLinkPrev, "_blank");
            showToast('Foto descargada. En WhatsApp usa el clip 📎 y elige "Fotos", no "Documento".');
          } else {
            showToast('Foto descargada (JPG). Adjúntala en WhatsApp como foto, no como documento.');
          }
        }, "image/jpeg", PEDIDO_IMAGEN_CALIDAD);
      });
    });
    actions.appendChild(shareBtn);

    // "Copiar imagen" (set-2026): la vista previa es HTML, no una imagen -- por eso clic derecho
    // no ofrecía "Copiar imagen" (nada de eso existe hasta tocar un botón). Este botón genera su
    // PROPIO PNG (Clipboard API solo copia PNG de forma confiable) a partir del mismo canvas de
    // siempre, sin tocar el JPEG que usan "Compartir"/"Descargar" ni la calidad configurada ahí.
    var copyBtn = pedidoPreviewActionBtn("📋 Copiar imagen");
    copyBtn.addEventListener("click", function(){
      if(!navigator.clipboard || !window.ClipboardItem){
        showToast('Tu navegador no permite copiar la imagen directamente. Usa "Descargar imagen" y adjúntala en WhatsApp.');
        return;
      }
      var original = copyBtn.textContent;
      copyBtn.disabled = true;
      copyBtn.textContent = "Generando imagen…";
      capturePedidoPreviewCanvas(function(canvas){
        copyBtn.disabled = false;
        copyBtn.textContent = original;
        if(!canvas){ showToast("No se pudo generar la imagen. Revisa tu conexión e intenta de nuevo."); return; }
        canvas.toBlob(function(blob){
          if(!blob){ showToast("No se pudo generar la imagen."); return; }
          navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ]).then(function(){
            showToast("Imagen copiada -- pégala con Ctrl+V (o mantén presionado y elige Pegar) en el chat de WhatsApp.");
          }).catch(function(){
            showToast('No se pudo copiar la imagen. Usa "Descargar imagen" y adjúntala en WhatsApp.');
          });
        }, "image/png");
      });
    });
    actions.appendChild(copyBtn);

    var downloadBtn = pedidoPreviewActionBtn("⬇️ Descargar imagen");
    downloadBtn.addEventListener("click", function(){
      var original = downloadBtn.textContent;
      downloadBtn.disabled = true;
      downloadBtn.textContent = "Generando imagen…";
      capturePedidoPreviewCanvas(function(canvas){
        downloadBtn.disabled = false;
        downloadBtn.textContent = original;
        if(!canvas){ showToast("No se pudo generar la imagen. Revisa tu conexión e intenta de nuevo."); return; }
        canvas.toBlob(function(blob){
          if(!blob){ showToast("No se pudo generar la imagen."); return; }
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = pedidoImagenNombre(p);
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        }, "image/jpeg", PEDIDO_IMAGEN_CALIDAD);
      });
    });
    actions.appendChild(downloadBtn);

    if(waLinkPrev){
      var waBtn = pedidoPreviewActionBtn("💬 Abrir WhatsApp del cliente");
      waBtn.addEventListener("click", function(){ window.open(waLinkPrev, "_blank"); });
      actions.appendChild(waBtn);
    }

    box.appendChild(actions);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
    document.addEventListener("keydown", pedidoVistaPreviaEscHandler);
  }

  // ---------- Reporte "Pedidos Orden de Tienda" / "Pedidos Delivery" ----------
  // Reemplaza los reportes que Jessica bajaba de Universalio y recortaba a mano en Excel
  // antes de mandarlos a su grupo: una lista clara, línea por producto, ordenada por hora
  // de entrega, separada por origen del pedido (Tienda o Whatsapp).
  function pedidoTipoEntregaLabel(p){
    if(p.canal === "masivo") return p.masivoModo === "delivery" ? "Delivery" : "Recojo";
    return p.canal === "tienda" ? "Recojo" : "Delivery";
  }
  function fmtHora12(hhmm){
    if(!hhmm) return "";
    var parts = hhmm.split(":");
    var h = parseInt(parts[0], 10);
    if(isNaN(h)) return hhmm;
    var m = parts[1] || "00";
    var suf = h >= 12 ? "p. m." : "a. m.";
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + suf;
  }
  function fmtFechaReporte(iso){
    if(!iso) return "";
    var d = new Date(iso + "T12:00:00");
    var dia = DIAS_LARGO[d.getDay()].toLowerCase();
    var mes = MESES_LARGO[d.getMonth()].toLowerCase();
    return dia + ", " + d.getDate() + " de " + mes + " de " + d.getFullYear();
  }
  function buildPedidosReporteRows(date, origen){
    var rows = [];
    (PEDIDOS || []).forEach(function(p){
      if(p.anulado) return;
      if((p.origen || "whatsapp") !== origen) return;
      (p.items || []).forEach(function(it){
        if(it.fecha !== date) return;
        if(!it.producto || !it.producto.trim() || !(num(it.cantidad) > 0)) return;
        rows.push({
          cliente: (p.cliente && p.cliente.nombre) || "",
          cantidad: num(it.cantidad),
          producto: it.producto,
          hora: p.hora || "",
          tipoEntrega: pedidoTipoEntregaLabel(p)
        });
      });
    });
    rows.sort(function(a, b){
      var ha = a.hora || "99:99";
      var hb = b.hora || "99:99";
      if(ha !== hb) return ha < hb ? -1 : 1;
      return a.cliente.localeCompare(b.cliente);
    });
    return rows;
  }
  function buildPedidosReporteHTML(date, origen){

    } else {

    html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 4px; border-bottom:2px solid #ddd; flex-wrap:wrap; gap:.4rem;">';
    html += '<div style="font-size:18px; font-weight:800; color:' + color + ';">' + titulo + '</div>';

    html += "</div>";

  // ---------- Reporte "Pedidos tomados" (quién atendió cada pedido, por día) ----------
  // Jessica: "Dónde puedo sacar el reporte de todos los pedidos que tome en el día quien lo
  // tomo". A diferencia de "Producción por día" y de "Reportes del día" de arriba (que juntan
  // por FECHA DE ENTREGA), este reporte junta por la fecha en que el pedido se registró en el
  // sistema (p.createdAt) -- para poder revisar al cerrar el día cuántos pedidos tomó cada
  // persona del equipo, sin importar para cuándo eran esos pedidos. Muestra el detalle completo
  // de cada pedido (así lo pidió ella), agrupado por "Atendido por".
  function isoDateFromMillis(ms){
    try{ return new Date(ms).toLocaleDateString("en-CA", { timeZone:"America/Lima" }); }
    catch(e){ return new Date(ms).toISOString().slice(0,10); }
  }
  function fmtHoraCortaMillis(ms){
    if(!ms) return "";
    try{ return new Date(ms).toLocaleTimeString("es-PE", { timeZone:"America/Lima", hour:"2-digit", minute:"2-digit", hour12:true }); }
    catch(e){ return ""; }
  }
  function buildPedidosTomadosRows(date){
    var rows = [];
    (PEDIDOS || []).forEach(function(p){
      if(p.anulado) return;
      if(!p.createdAt) return;
      if(isoDateFromMillis(p.createdAt) !== date) return;
      var productosLabel = (p.items || []).map(function(it){ return fmt(it.cantidad) + "x " + it.producto; }).join(", ");
      var total = (p.items || []).reduce(function(s, it){ return s + num(it.cantidad) * num(it.precio); }, 0) + num(p.deliveryMonto);
      var canalLabel = CANAL_LABEL[p.canal] || p.canal;
      if(p.canal === "masivo" && p.masivoModo){ canalLabel += " (" + (p.masivoModo === "delivery" ? "Delivery" : "Recojo") + ")"; }
      rows.push({
        id: p.id,
        atendidoPor: (p.atendidoPor && String(p.atendidoPor).trim()) ? String(p.atendidoPor).trim() : "Sin especificar",
        numero: p.numero || "—",
        hora: fmtHoraCortaMillis(p.createdAt),
        horaSort: p.createdAt,
        cliente: (p.cliente && p.cliente.nombre) || "—",
        canal: canalLabel,
        productos: productosLabel || "—",
        total: round2(total),
        pagado: !!p.pagado
      });
    });
    rows.sort(function(a, b){
      if(a.atendidoPor !== b.atendidoPor) return a.atendidoPor.localeCompare(b.atendidoPor);
      return a.horaSort - b.horaSort;
    });
    return rows;
  }
  function pedidosTomadosResumenPorPersona(rows){
    var map = {};
    var orden = [];
    rows.forEach(function(r){
      if(!map[r.atendidoPor]){ map[r.atendidoPor] = { pedidos:0, total:0 }; orden.push(r.atendidoPor); }
      map[r.atendidoPor].pedidos += 1;
      map[r.atendidoPor].total += r.total;
    });
    return orden.map(function(nombre){ return { nombre:nombre, pedidos:map[nombre].pedidos, total:round2(map[nombre].total) }; });
  }

    resumen.forEach(function(r){

    });
    html += "<tr><td style='" + tdStyle + "font-weight:800;'>TOTAL</td><td style='" + tdStyle + "text-align:center; font-weight:800;'>" + totalPedidos + "</td><td style='" + tdStyle + "text-align:center; font-weight:800;'>S/ " + fmtMoney(totalGeneral) + "</td></tr>";
    html += "</tbody></table>";

    html += '<div style="font-size:14px; font-weight:800; color:#c2660c; margin:14px 4px 4px;">DETALLE</div>';
    html += '<table style="width:100%; border-collapse:collapse; font-size:11.5px; margin-top:4px;">';
    html += '<thead><tr>' +
      '<th style="' + thStyle + '">Atendido por</th>' +
      '<th style="' + thStyle + '">N°</th>' +

      '<th style="' + thStyle + 'text-align:center;">Pagado</th>' +

    var lastPersona = null;
    rows.forEach(function(r, i){

      html += "<tr>" +

        "<td style='" + tdStyle + rowBorder + "'>" + esc(r.numero) + "</td>" +
        "<td style='" + tdStyle + rowBorder + "text-align:center;'>" + esc(r.hora) + "</td>" +
        "<td style='" + tdStyle + rowBorder + "'>" + esc(r.cliente) + "</td>" +
        "<td style='" + tdStyle + rowBorder + "'>" + esc(r.canal) + "</td>" +
        "<td style='" + tdStyle + rowBorder + "'>" + esc(r.productos) + "</td>" +
        "<td style='" + tdStyle + rowBorder + "text-align:center;'>" + fmtMoney(r.total) + "</td>" +
        "<td style='" + tdStyle + rowBorder + "text-align:center;'>" + (r.pagado ? "Sí" : "No") + "</td>" +
        "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

        { s:{r:resumenTotalIdx,c:4}, e:{r:resumenTotalIdx,c:5} },
        { s:{r:detalleTitleIdx,c:0}, e:{r:detalleTitleIdx,c:7} }
      ];
      resumen.forEach(function(r, i){
        var ri = resumenFirstIdx + i;
        merges.push({ s:{r:ri,c:0}, e:{r:ri,c:1} });
        merges.push({ s:{r:ri,c:2}, e:{r:ri,c:3} });
        merges.push({ s:{r:ri,c:4}, e:{r:ri,c:5} });
      });
      ws["!merges"] = merges;

      try{
        var ref;
        ref = XLSX.utils.encode_cell({r:0,c:0});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, underline:true, sz:14, color:{rgb:ORANGE} }, alignment:{ horizontal:"center" } };
        ref = XLSX.utils.encode_cell({r:1,c:0});
        if(ws[ref]) ws[ref].s = { font:{ italic:true, sz:10, color:{rgb:"666666"} }, alignment:{ horizontal:"center" } };
        ref = XLSX.utils.encode_cell({r:2,c:0});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, sz:11, color:{rgb:DARK} }, alignment:{ horizontal:"center" } };
        ref = XLSX.utils.encode_cell({r:resumenTitleIdx,c:0});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, sz:11, color:{rgb:ORANGE} } };
        [0,2,4].forEach(function(c){
          var href = XLSX.utils.encode_cell({r:resumenHeaderIdx, c:c});
          if(ws[href]) ws[href].s = { font:{ bold:true, color:{rgb:"FFFFFF"} }, fill:{ fgColor:{rgb:BLUE} }, alignment:{ horizontal:"center" } };
        });
        resumen.forEach(function(r, i){
          var ri = resumenFirstIdx + i;
          [0,2,4].forEach(function(c){
            var rref = XLSX.utils.encode_cell({r:ri, c:c});
            if(ws[rref]) ws[rref].s = { font:{ sz:10 }, alignment:{ horizontal: c===0 ? "left" : "center" } };
          });
        });
        [0,2,4].forEach(function(c){
          var tref = XLSX.utils.encode_cell({r:resumenTotalIdx, c:c});
          if(ws[tref]) ws[tref].s = { font:{ bold:true, color:{rgb:DARK} }, alignment:{ horizontal: c===0 ? "left" : "center" }, fill:{ fgColor:{rgb:LIGHT} } };
        });
        ref = XLSX.utils.encode_cell({r:detalleTitleIdx,c:0});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, sz:11, color:{rgb:ORANGE} } };
        for(var hc=0; hc<headers.length; hc++){
          ref = XLSX.utils.encode_cell({r:headerRowIdx, c:hc});
          if(ws[ref]) ws[ref].s = { font:{ bold:true, color:{rgb:"FFFFFF"} }, fill:{ fgColor:{rgb:BLUE} }, alignment:{ horizontal:"center" } };
        }
        for(var ri2=firstDataIdx; ri2<=lastDataIdx; ri2++){
          for(var ci=0; ci<headers.length; ci++){
            ref = XLSX.utils.encode_cell({r:ri2, c:ci});
            if(!ws[ref]) continue;
            var st = { font:{ sz:10 } };
            if(ci === 1 || ci === 2 || ci === 6 || ci === 7) st.alignment = { horizontal:"center" };
            if((ri2 - firstDataIdx) % 2 === 1) st.fill = { fgColor:{rgb:"FBF7F0"} };
            ws[ref].s = st;
          }
        }
      }catch(e){}

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Pedidos tomados");
      XLSX.writeFile(wb, "pedidos-tomados-" + date + ".xlsx");
      showToast("Reporte descargado.");
    }catch(err){
      showToast("No se pudo generar el archivo. Intenta de nuevo.");
    }
  }

  // Totales por producto (Delivery/Tienda/Masivo) para un día de entrega -- usado tanto para
  // la tabla en pantalla de "Producción por día" como para el Excel exportado, así los dos
  // salen siempre iguales entre sí (una sola fuente de verdad).
  function pedidosProduccionTotales(date){
    var totals = {};
    (PEDIDOS || []).forEach(function(p){
      if(p.anulado) return;
      (p.items || []).forEach(function(it){
        if(it.fecha !== date) return;
        if(!totals[it.producto]) totals[it.producto] = { delivery:0, tienda:0, masivo:0 };
        totals[it.producto][p.canal] = (totals[it.producto][p.canal] || 0) + num(it.cantidad);
      });
    });
    return totals;
  }
  // Excel de Producción del día: una hoja con los totales por producto (igual que la tabla en
  // pantalla) y una hoja por canal (Tienda, Delivery) con el detalle cliente/cantidad/producto/
  // hora -- todo junto en un solo archivo, listo para mandar o revisar sin tener que armarlo
  // a mano como antes.
  function doExportProduccion(date){
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    var totals = pedidosProduccionTotales(date);
    var names = Object.keys(totals).sort();
    var tiendaRows = buildPedidosReporteRows(date, "tienda");
    var deliveryRows = buildPedidosReporteRows(date, "whatsapp");
    if(names.length === 0 && tiendaRows.length === 0 && deliveryRows.length === 0){
      showToast("No hay pedidos con entrega para esa fecha.");
      return;
    }
    try{
      var wb = XLSX.utils.book_new();

      // Hoja 1: Totales por producto.
      var totAoa = [
        ["PANADERÍA CARMELITAS — PRODUCCIÓN POR DÍA","","","",""],
        [fmtDateLabel(date),"","","",""],
        ["","","","",""],
        ["Producto","Delivery","Tienda","Masivo","Total"]
      ];
      var grand = { delivery:0, tienda:0, masivo:0 };
      names.forEach(function(name){
        var t = totals[name];
        var rowTotal = (t.delivery||0) + (t.tienda||0) + (t.masivo||0);
        grand.delivery += t.delivery||0; grand.tienda += t.tienda||0; grand.masivo += t.masivo||0;
        totAoa.push([name, t.delivery||0, t.tienda||0, t.masivo||0, rowTotal]);
      });
      totAoa.push(["TOTAL", grand.delivery, grand.tienda, grand.masivo, grand.delivery+grand.tienda+grand.masivo]);
      var wsTot = XLSX.utils.aoa_to_sheet(totAoa);
      wsTot["!cols"] = [{wch:34},{wch:12},{wch:12},{wch:12},{wch:12}];
      wsTot["!merges"] = [{ s:{r:0,c:0}, e:{r:0,c:4} }, { s:{r:1,c:0}, e:{r:1,c:4} }];
      XLSX.utils.book_append_sheet(wb, wsTot, "Totales");

      // Hoja 2 y 3: detalle por canal (mismo contenido que "Reportes del día para el grupo de
      // WhatsApp", ver buildPedidosReporteRows).
      [["tienda","Tienda", tiendaRows], ["whatsapp","Delivery", deliveryRows]].forEach(function(triple){
        var rows = triple[2];
        var headers = ["Cliente","Cantidad","Producto","Hora Entrega","Tipo Entrega"];
        var aoa = [
          ["PEDIDOS " + triple[1].toUpperCase(), "", "", "", ""],
          [fmtDateLabel(date), "", "", "", ""],
          ["", "", "", "", ""],
          headers.slice()
        ];
        rows.forEach(function(r){
          aoa.push([r.cliente, r.cantidad, r.producto, fmtHora12(r.hora), r.tipoEntrega]);
        });
        var ws = XLSX.utils.aoa_to_sheet(aoa);
        ws["!cols"] = [{wch:26},{wch:10},{wch:32},{wch:14},{wch:14}];
        ws["!merges"] = [{ s:{r:0,c:0}, e:{r:0,c:headers.length-1} }, { s:{r:1,c:0}, e:{r:1,c:headers.length-1} }];
        XLSX.utils.book_append_sheet(wb, ws, triple[1]);
      });

      XLSX.writeFile(wb, "Produccion_" + date + ".xlsx");
    } catch(e){
      showToast("No se pudo generar el Excel. Intenta de nuevo.");
    }
  }

    fechaInput.value = pedidosListaFecha || todayISO();

    });

    var verTodosBtn = document.createElement("button");
    verTodosBtn.type = "button";
    verTodosBtn.className = "btn btn-sm";
    verTodosBtn.textContent = pedidosListaVerTodos ? "Ver solo esta fecha" : "Ver todos (sin filtrar fecha)";
    verTodosBtn.addEventListener("click", function(){
      pedidosListaVerTodos = !pedidosListaVerTodos;
      renderPanel();
    });
    fechaFilterRow.appendChild(verTodosBtn);
    card.appendChild(fechaFilterRow);

    // Filtro por origen: de dónde vino el pedido (Whatsapp o Tienda), para poder ver por
    // separado, como los reportes "Hoy Canal Tienda" / "Hoy Canal Whatsapp" que se usaban antes.
    var origenFilterRow = document.createElement("div");
    origenFilterRow.className = "shift-toggle";
    origenFilterRow.style.marginBottom = "1rem";
    [["todos","Todos"], ["whatsapp","WhatsApp"], ["tienda","Tienda"]].forEach(function(pair){
      var fb = document.createElement("button");
      fb.type = "button";
      fb.className = "shift-btn" + (pedidosOrigenFilter === pair[0] ? " active" : "");
      fb.textContent = pair[1];
      fb.addEventListener("click", function(){
        pedidosOrigenFilter = pair[0];
        renderPanel();
      });
      origenFilterRow.appendChild(fb);
    });
    card.appendChild(origenFilterRow);

    var targetFecha = pedidosListaFecha || todayISO();
    var pedidosFiltrados = PEDIDOS.filter(function(p){
      if(pedidosOrigenFilter !== "todos" && (p.origen || "whatsapp") !== pedidosOrigenFilter) return false;
      if(!pedidosListaVerTodos){
        var tieneEseDiaria = (p.items || []).some(function(it){ return it.fecha === targetFecha; });
        if(!tieneEseDiaria) return false;
      }
      return true;
    });

    if(pedidosFiltrados.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = PEDIDOS.length === 0
        ? "Todavía no hay pedidos registrados."
        : (pedidosListaVerTodos ? "No hay pedidos de este origen." : "No hay pedidos con entrega esta fecha (prueba cambiar la fecha, o \"Ver todos\").");
      card.appendChild(empty);
      wrap.appendChild(card);
      return wrap;
    }

    // Barra de desplazamiento horizontal ARRIBA de la tabla (además de la de abajo, que el
    // navegador sigue mostrando solo): Jessica pidió esto porque con la lista larga, tenía que
    // bajar hasta el final para poder desplazarse hacia los lados. Esta barra de arriba se
    // sincroniza con el scroll real de la tabla en los dos sentidos.
    var scrollTop = document.createElement("div");
    scrollTop.className = "table-scroll-top";
    var scrollTopInner = document.createElement("div");
    scrollTop.appendChild(scrollTopInner);
    card.appendChild(scrollTop);

    var tableWrap = document.createElement("div");
    tableWrap.className = "table-wrap";
    var table = document.createElement("table");
    table.className = "data-table";
    table.innerHTML = "<thead><tr><th>N°</th><th>Fecha(s)</th><th>Hora</th><th>Cliente</th><th>Origen</th><th>Canal</th><th>Productos</th><th>Total</th><th>Pagado</th><th>Entregado</th><th></th><th></th><th></th><th></th><th></th></tr></thead><tbody></tbody>";
    // Para la fila de detalle expandible de un pedido Masivo (colspan = todas las columnas).
    var PEDIDOS_TABLE_COLS = table.querySelectorAll("thead th").length;
    var tbody = table.querySelector("tbody");
    pedidosFiltrados.forEach(function(p){
      var tr = document.createElement("tr");
      if(p.anulado) tr.style.background = "#fdecea";
      var seen = {};
      var fechas = [];
      (p.items||[]).forEach(function(it){
        if(it.fecha && !seen[it.fecha]){ seen[it.fecha] = true; fechas.push(it.fecha); }
      });
      fechas.sort();
      var fechaLabel = fechas.length <= 1 ? (fechas[0] || "—") : (fechas[0] + " → " + fechas[fechas.length-1]);
      var itemsValidos = (p.items||[]).filter(function(it){ return it.producto && it.producto.trim() && num(it.cantidad) > 0; });
      var esMasivo = p.canal === "masivo";
      var productosLabel = itemsValidos.map(function(it){ return it.cantidad + "x " + it.producto; }).join(", ");
      var subtotal = (p.items||[]).reduce(function(s,it){ return s + num(it.cantidad)*num(it.precio); }, 0) + num(p.deliveryMonto);
      // Pedido Masivo: en vez de las líneas completas (pueden ser docenas), un resumen
      // ejecutivo -- "Francés + Francés Especial · 14 entregas · 2 productos" -- con "Ver
      // detalle" para desplegar la lista completa (fecha, producto, cantidad, precio, subtotal)
      // sin perder nada. Jessica (set-2026): "una sola fila enorme" dificultaba revisar la lista.
      var productosCellHtml;
      if(esMasivo){
        var nombresVistos = {}, nombresProductos = [];
        itemsValidos.forEach(function(it){
          var key = pedidoProductoNorm(it.producto);
          if(!nombresVistos[key]){ nombresVistos[key] = true; nombresProductos.push(it.producto.trim()); }
        });
        var abierto = !!pedidosMasivoDetalleAbierto[p.id];
        productosCellHtml = "<td class='pedido-productos-cell'>" +
          "<div class='pedido-masivo-resumen-linea'>" + esc(nombresProductos.join(" + ")) + "</div>" +
          "<div class='pedido-masivo-resumen-conteo'>" + itemsValidos.length + " entrega" + (itemsValidos.length === 1 ? "" : "s") + " · " + nombresProductos.length + " producto" + (nombresProductos.length === 1 ? "" : "s") + "</div>" +
          "<button type='button' class='pedido-ver-detalle-btn' data-id='" + p.id + "'>" + (abierto ? "Ocultar detalle ▴" : "Ver detalle ▾") + "</button>" +
        "</td>";
      } else {
        productosCellHtml = "<td class='pedido-productos-cell'>" + esc(productosLabel) + "</td>";
      }
      var pagadoClass = "chip pedido-pagado-toggle " + (p.pagado ? "good" : "bad");

        "<td><button type='button' class='btn btn-sm pedido-pdf' data-id='" + p.id + "'>Generar PDF</button></td>" +

      tbody.appendChild(tr);

      if(esMasivo){

        detTr.hidden = !pedidosMasivoDetalleAbierto[p.id];
        var detBody = itemsValidos.map(function(it){

          return "<tr><td>" + esc(it.fecha || "—") + "</td><td>" + esc(it.producto) + "</td><td>" + fmt(it.cantidad) + "</td><td>S/ " + fmt(it.precio) + "</td><td>S/ " + fmt(sub) + "</td></tr>";
        }).join("");
        var totalDetalle = itemsValidos.reduce(function(s, it){ return s + num(it.cantidad) * num(it.precio); }, 0);
        detTr.innerHTML = "<td colspan='" + PEDIDOS_TABLE_COLS + "'><div class='pedido-masivo-detalle-wrap'>" +

          "<tfoot><tr><td colspan='4'>Total</td><td>S/ " + fmt(totalDetalle) + "</td></tr></tfoot></table>" +

    });

    // Ancho real de la tabla, para que la barrita de arriba tenga el mismo largo que la de

    tbody.querySelectorAll(".pedido-pdf").forEach(function(btn){

    if(!readOnly){
      tbody.querySelectorAll(".pedido-editar").forEach(function(btn){

      tbody.querySelectorAll(".pedido-pagado-toggle").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
          if(!p || !db) return;
          var vaAPagado = !p.pagado;

          if(vaAPagado && pedidoFaltaFotoComprobante({ pagado:true, tipoPago:p.tipoPago, comprobante:p.comprobante })){

            return;

            showToast("No se pudo actualizar. Intenta de nuevo.");

      tbody.querySelectorAll(".pedido-entregar").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
          if(!p || !db) return;

          var quien = prompt('Vas a marcar como entregado el pedido de "' + nombre + '".\n\n¿Quién lo entregó? (opcional, puedes dejarlo en blanco):');
          if(quien === null) return;
          db.collection("pedidos").doc(id).update({ entregadoEn: Date.now(), entregadoPor: quien.trim() }).then(function(){

            showToast("No se pudo actualizar. Intenta de nuevo.");

      tbody.querySelectorAll(".pedido-quitar-entrega").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
          if(!p || !db) return;
          if(!confirm('¿Quitar la marca de "entregado" de este pedido? (por si se marcó por error)')) return;
          db.collection("pedidos").doc(id).update({ entregadoEn: null, entregadoPor: "" }).catch(function(){
            showToast("No se pudo actualizar. Intenta de nuevo.");
          });
        });
      });
      tbody.querySelectorAll(".pedido-del").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
          if(!p || !db) return;
          // Antes bastaba un solo "Aceptar" en el confirm() del navegador -- muy fácil de tocar
          // sin querer, sobre todo en celular, y sin vuelta atrás. Ahora hay que escribir
          // "ELIMINAR" a propósito, con una advertencia aparte si el pedido ya está pagado.
          var nombre = (p.cliente && p.cliente.nombre) || "este cliente";
          var msg = 'Vas a eliminar el pedido de "' + nombre + '". Esto no se puede deshacer.';
          if(p.pagado) msg += '\n\n⚠ OJO: este pedido ya está marcado como PAGADO.';
          msg += '\n\nEscribe ELIMINAR (en mayúsculas) para confirmar:';
          var typed = prompt(msg);
          if(typed === null) return;
          if(typed.trim().toUpperCase() !== "ELIMINAR"){
            showToast("No se eliminó: no escribiste ELIMINAR.");
            return;

          db.collection("pedidos").doc(id).delete().catch(function(){
            showToast("No se pudo eliminar. Intenta de nuevo.");
          });

      });
      // Anular: a diferencia de Eliminar, no borra el pedido -- se queda visible en la lista
      // marcado como ANULADO junto con el motivo, y deja de contar en Producción, Cuentas por
      // Cobrar y los reportes del día (para que el equipo no lo prepare por error).
      tbody.querySelectorAll(".pedido-anular").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
          if(!p || !db) return;

          var motivo = prompt('Vas a anular el pedido de "' + nombre + '".\n\nEscribe el motivo de la anulación:');
          if(motivo === null) return;
          if(!motivo.trim()){ showToast("No se anuló: falta el motivo."); return; }
          db.collection("pedidos").doc(id).update({
            anulado: true,
            motivoAnulacion: motivo.trim(),
            fechaAnulacion: todayISO()
          }).then(function(){
            showToast("Pedido anulado.");
          }).catch(function(){
            showToast("No se pudo anular. Intenta de nuevo.");
          });
        });
      });
      tbody.querySelectorAll(".pedido-reactivar").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
          if(!p || !db) return;
          if(!confirm('¿Reactivar este pedido? Volverá a contar en Producción, reportes y Cuentas por Cobrar.')) return;
          db.collection("pedidos").doc(id).update({ anulado: false }).then(function(){
            showToast("Pedido reactivado.");

          });

    }

    wrap.appendChild(buildPedidosBusquedaAntiguaCard());

    return wrap;
