  // Aplica un snapshot remoto (de otro dispositivo) ya confirmado por el servidor a STATE/
  // baseline de este dispositivo. Se usa desde el listener de attachRemoteSync Y desde el
  // final de doSave() (ver pendingRemoteSnapshot) -- así SIEMPRE hay un solo lugar que toca
  // STATE/baseline por una llegada remota, nunca dos al mismo tiempo.
  function applyRemoteSnapshot(data){
    if(dirty || saving){
      // Llegó un cambio de otro dispositivo mientras acá había algo sin guardar todavía (o
      // un guardado propio en camino). Se combinan los cambios de ese otro dispositivo con
      // lo que se está editando acá mismo, campo por campo, para que no se pierda ni lo de
      // uno ni lo del otro.
      STATE = mergeStateForSave(data, STATE, baseline);
      renderAll();
      // OJO: "baseline" tiene que quedar con SOLO lo confirmado en la base de datos
      // (relleno para que tenga la misma forma que STATE), nunca con lo que se está
      // editando acá mismo todavía sin guardar -- si se guardara con eso mezclado, la
      // próxima comparación ya no reconocería esos cambios como "cambios pendientes"
      // y se quedarían sin guardar nunca.
      baseline = backfillAllDays(deepClone(data));
      showToast("Se combinaron cambios de otro dispositivo.");
      scheduleAutosave();
      return;
    }
    STATE = data;
    renderAll();
    baseline = deepClone(STATE);
  }

  function attachRemoteSync(onFirstLoad){
    var ref = db.collection("arqueo").doc("state");
    var firstLoadDone = false;
    ref.onSnapshot(function(snap){
      if(!snap.exists){
        // Primera vez que se usa esta base de datos: la sembramos con los datos que
        // ya tenía la app (incluido lo migrado del Excel de setiembre).
        ref.set(readEmbeddedSeed()).catch(function(){});
        return;
      }
      var data = normalizeState(snap.data());
      if(data.meta && data.meta.lastSavedAt && data.meta.lastSavedAt === lastSavedBySelf){
        // Es el eco de nuestro propio guardado — ya lo tenemos aplicado.
        if(!firstLoadDone){ firstLoadDone = true; onFirstLoad(data); }
        return;
      }
      if(!firstLoadDone){
        firstLoadDone = true;
        onFirstLoad(data);
        return;
      }
      if(saving){
        // Hay una transacción de guardado propia en camino ahora mismo: NO se toca
        // STATE/baseline acá (chocaría con lo que esa transacción está por escribir).
        // Se guarda esta llegada y se procesa apenas esa transacción termine.
        pendingRemoteSnapshot = data;
        return;
      }
      applyRemoteSnapshot(data);
    }, function(){
      readOnly = true;
      showBanner("bad", "No se pudo conectar con la base de datos. Revisa tu conexión a internet y recarga la página.", []);
      setSaveStatus();
    });
  }

  // Rendimiento a futuro: cargar TODA la colección con un solo onSnapshot (como era antes)
  // crece sin límite -- entre más pedidos se guarden con los años, más lento se pone abrir la
  // app, sin importar cuántos sean por día. En vez de eso, se mantienen dos listeners en vivo,
  // chicos y de tamaño FIJO, que se combinan en PEDIDOS:
  //  1) Los últimos PEDIDOS_LIMITE_RECIENTES pedidos (por "createdAt", cuándo se tomaron) --
  //     alimenta "Todos los pedidos" y "Producción". Por CANTIDAD, no por días: así el
  //     tamaño de lo que se carga y se dibuja en pantalla queda igual de rápido así el
  //     negocio haga 50 pedidos al día o 500 -- nunca crece más de ese número.
  //  2) TODAS las deudas sin pagar, sin importar la antigüedad -- así "Cuentas por Cobrar"
  //     nunca deja de mostrar una deuda vieja solo porque quedó fuera de los recientes de
  //     arriba. Esta sí puede crecer con el tiempo, pero solo si se acumulan deudas de
  //     verdad sin cobrar -- no con el volumen total de pedidos.
  // Un pedido antiguo y ya pagado que quede fuera de ambos se puede seguir encontrando con el
  // buscador de "Pedidos antiguos" en la pestaña Pedidos (una consulta aparte, no un listener
  // en vivo -- no vuelve a cargar todo el historial cada vez).
  // ---------- Aviso en pantalla de pedido "para ahora" (sonido + banner) ----------
  // Jessica pidió aviso "desde el inicio" tanto en pantalla como al celular (ver
  // pedidoNotificarDespacho para el push por ntfy.sh), y luego corrigió el alcance: YA NO es
  // solo Delivery -- es "todo pedido que necesite ser preparado ahora", de cualquier canal, y
  // un pedido PROGRAMADO debe avisar solo, solo, cuando llegue su hora (aunque nadie toque
  // nada). Por eso revisarAlertasCola() de más abajo no depende de que llegue un documento
  // nuevo de Firestore -- se revisa también con un timer, porque el paso del tiempo por sí
  // solo puede volver "para ahora" a un pedido que ya estaba guardado desde antes.
  function reproducirBeepDespacho(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      o.connect(g);
      g.connect(ctx.destination);
      var now = ctx.currentTime;
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.3, now + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);
      g.gain.exponentialRampToValueAtTime(0.3, now + 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
      o.start(now);
      o.stop(now + 0.9);
      o.onended = function(){ try{ ctx.close(); }catch(e){} };
    }catch(e){}
  }
  function alertarPedidoParaAhora(p){
    reproducirBeepDespacho();
    var nombre = (p.cliente && p.cliente.nombre) || "Cliente";
    var canalTxt = pedidoCanalBadgeTxt(p);
    showBanner("despacho-nuevo", "🔔 Para ahora — " + canalTxt + " #" + (p.numero || "") + " — " + nombre, [
      { label:"Ver en Despacho", action:function(){
          hideBanner("despacho-nuevo");
          currentTab = "pedidos";
          pedidosView = "despacho";
          pedidosDespachoFilter = "ahora";
          renderAll();
        }}
    ]);
    pedidoNotificarDespacho(p);
  }

  // ---------- Cola operativa: quién ya se avisó, para no repetir ni inundar ----------
  // "colaInicializada" evita el chaparrón de alertas al recién abrir la app (todo lo que ya
  // estaba "para ahora" antes de abrir se da por avisado en silencio, sin sonido ni banner).
  // Después de eso, cualquier pedido que PASE a "para ahora" -- recién creado, o uno
  // programado cuya hora recién llega -- sí dispara el aviso, una sola vez por pedido.
  var pedidosAlertados = {};
  var colaInicializada = false;
  function revisarAlertasCola(){
    if(!PEDIDOS) return;
    // Mismo filtro que la cola visible (pedidosDespachoLista): solo alerta por pedidos del día
    // operativo de hoy (ver pedidoEsDelDiaOperativo). Uno que no tiene ninguna línea para hoy
    // no debe sonar ni aparecer aunque su hora "llegue" en otra fecha.
    var activos = PEDIDOS.filter(function(p){ return p.estado && p.estado !== "ENTREGADO" && p.estado !== "CANCELADO" && pedidoEsDelDiaOperativo(p); });
    if(!colaInicializada){
      colaInicializada = true;
      activos.forEach(function(p){ if(despachoEsInmediato(p)) pedidosAlertados[p.id] = true; });
      return;
    }
    activos.forEach(function(p){
      if(despachoEsInmediato(p) && !pedidosAlertados[p.id]){
        pedidosAlertados[p.id] = true;
        alertarPedidoParaAhora(p);
      }
    });
  }

  function attachPedidosSync(){
    var recientesMap = {};
    var impagosMap = {};
    function mergeAndSetPedidos(){
      var merged = {};
      Object.keys(recientesMap).forEach(function(id){ merged[id] = recientesMap[id]; });
      Object.keys(impagosMap).forEach(function(id){ merged[id] = impagosMap[id]; });
      var list = Object.keys(merged).map(function(id){ return merged[id]; });
      // Defensa: un pedido guardado sin "estado" (por ejemplo, desde una pestaña vieja del
      // navegador que quedó abierta con una versión anterior de la app, antes de que el
      // estado se guardara para todos los canales) NO debe desaparecer de la cola de
      // Despacho -- eso sería justo perder un pedido, que es lo que Jessica pidió evitar
      // por sobre todo ("ningún pedido se pierda"). Si falta, se asume NUEVO (recién
      // ingresado), que es el estado real de un pedido que nadie ha tocado todavía.
      list.forEach(function(p){ if(!p.estado) p.estado = "NUEVO"; });
      list.sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
      PEDIDOS = list;
      // No repintamos si está en "Nuevo pedido": así no se pierde lo que está escribiendo
      // si otra persona (ej. quien toma pedidos por WhatsApp) guarda algo al mismo tiempo.
      if(currentTab === "pedidos" && pedidosView !== "nuevo") renderPanel();
      revisarAlertasCola();
      if(pedidoHashAbrir){
        var pedidoDesdeHash = list.filter(function(x){ return x.id === pedidoHashAbrir; })[0];
        if(pedidoDesdeHash){
          pedidoHashAbrir = null;
          showPedidoDespachoDetalle(pedidoDesdeHash);
          try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
        }
      }
    }
    // Revisión periódica: el simple paso del tiempo puede volver "para ahora" a un pedido
    // PROGRAMADO sin que llegue ningún documento nuevo de Firestore -- por eso esto no puede
    // depender solo de onSnapshot.
    setInterval(revisarAlertasCola, 30000);
    db.collection("pedidos").orderBy("createdAt", "desc").limit(PEDIDOS_LIMITE_RECIENTES).onSnapshot(function(snap){
      recientesMap = {};
      snap.forEach(function(doc){ var data = doc.data(); data.id = doc.id; recientesMap[doc.id] = data; });
      mergeAndSetPedidos();
    }, function(){
      // Si falla, dejamos PEDIDOS como esté (puede seguir null) y avisamos solo si
      // el usuario está mirando esa pestaña.
      if(currentTab === "pedidos" && PEDIDOS === null){
        showToast("No se pudo cargar los pedidos. Revisa tu conexión e intenta de nuevo.");
      }
    });
    db.collection("pedidos").where("pagado", "==", false).onSnapshot(function(snap){
      impagosMap = {};
      snap.forEach(function(doc){ var data = doc.data(); data.id = doc.id; impagosMap[doc.id] = data; });
      mergeAndSetPedidos();
    }, function(){});
  }
  // ---------- Buscar pedidos antiguos (fuera de la ventana reciente de arriba) ----------
  // Consulta de una sola vez (.get(), no onSnapshot) por rango de fecha de creación -- para
  // encontrar un pedido viejo y ya pagado sin tener que cargar todo el historial en vivo.
  function doBuscarPedidosAntiguos(){
    if(!db) return;
    if(!pedidosBusquedaDesde || !pedidosBusquedaHasta){
      showToast("Elige una fecha \"Desde\" y una \"Hasta\" para buscar.");
      return;
    }
    pedidosBusquedaCargando = true;
    pedidosBusquedaError = false;
    renderPanel();
    var desdeMs = new Date(pedidosBusquedaDesde + "T00:00:00").getTime();
    var hastaMs = new Date(pedidosBusquedaHasta + "T23:59:59").getTime();
    db.collection("pedidos").where("createdAt", ">=", desdeMs).where("createdAt", "<=", hastaMs).get().then(function(snap){
      var list = [];
      snap.forEach(function(doc){ var data = doc.data(); data.id = doc.id; list.push(data); });
      list.sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
      pedidosBusquedaResultados = list;
      pedidosBusquedaCargando = false;
      renderPanel();
    }).catch(function(){
      pedidosBusquedaCargando = false;
      pedidosBusquedaError = true;
      renderPanel();
    });
  }

  function attachClientesSync(){
    db.collection("clientes").onSnapshot(function(snap){
      var map = {};
      snap.forEach(function(doc){ map[doc.id] = doc.data(); });
      CLIENTES = map;
      if(currentTab === "pedidos" && pedidosView !== "nuevo") renderPanel();
    }, function(){
      if(currentTab === "pedidos" && CLIENTES === null){
        showToast("No se pudo cargar los clientes guardados.");
      }
    });
  }

  function initFirebase(){
    var firebaseConfig = {
      apiKey: "AIzaSyApjo00nK0Vc_5cESnAPvjEg1-hIuv2zCE",
      authDomain: "arqueo-panaderia-carmeli-9a193.firebaseapp.com",
      projectId: "arqueo-panaderia-carmeli-9a193",
      storageBucket: "arqueo-panaderia-carmeli-9a193.firebasestorage.app",
      messagingSenderId: "176026150204",
      appId: "1:176026150204:web:c2059275bb0b8b8298aa39"
    };
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }

  // Al tocar la notificación de un pedido nuevo (push de ntfy.sh, ver pedidoNotificarDespacho)
  // el celular abre la app en "#pedido=<id>" -- esto la manda directo a Despacho y abre el
  // detalle de ESE pedido apenas termine de cargar (ver el gancho en attachPedidosSync).
  var pedidoHashAbrir = null;
  function checkPedidoHashInicial(){
    var h = "";
    try{ h = location.hash || ""; }catch(e){}
    var m = h.match(/^#pedido=(.+)$/);
    if(!m) return;
    pedidoHashAbrir = decodeURIComponent(m[1]);
    currentTab = "pedidos";
    pedidosView = "despacho";
  }

  function init(){
    checkPedidoHashInicial();
    initFirebase();
    wireStatic();
    document.getElementById("panel").innerHTML = '<div class="empty-state">Cargando datos…</div>';
    attachRemoteSync(function(data){
      STATE = data;
      renderAll();
      baseline = deepClone(STATE);
      restoreBackupBanner();
    });
    attachPedidosSync();
    attachClientesSync();
    attachCajerosSync();
    // Avisa ANTES de cerrar o recargar la página si todavía hay cambios del arqueo sin
    // guardar -- así nadie pierde lo que avanzó por cerrar la pestaña justo cuando un
    // guardado está fallando o todavía está en camino (ver saveRetryCount más arriba).
    window.addEventListener("beforeunload", function(ev){
      if(dirty){
        ev.preventDefault();
        ev.returnValue = "";
        return "";
      }
    });
  }

  // ---------- lock screen (contraseña compartida del equipo) ----------
  var APP_PASSWORD = "Carmelitas2026";
  function isUnlocked(){
    try{ return sessionStorage.getItem("arqueo_unlocked") === "1"; }catch(e){ return false; }
  }
  function setUnlocked(){
    try{ sessionStorage.setItem("arqueo_unlocked", "1"); }catch(e){}
  }
  function showLock(){
    document.getElementById("lockScreen").hidden = false;
    document.getElementById("appRoot").hidden = true;
    var input = document.getElementById("lockInput");
    setTimeout(function(){ input.focus(); }, 30);
  }
  function hideLock(){
    document.getElementById("lockScreen").hidden = true;
    document.getElementById("appRoot").hidden = false;
  }
  function wireLock(){
    var form = document.getElementById("lockForm");
    var input = document.getElementById("lockInput");
    var err = document.getElementById("lockError");
    var toggle = document.getElementById("lockToggle");
    toggle.addEventListener("click", function(){
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      toggle.textContent = show ? "Ocultar" : "Mostrar";
      input.focus();
    });
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      // Recorta espacios de más al principio/final: en el celular es fácil que el
      // teclado agregue un espacio sin que se note, sobre todo escribiendo a mano
      // (con copiar y pegar eso no pasa, por eso ahí sí entraba).
      var typed = input.value.replace(/^\s+|\s+$/g, "");
      if(typed === APP_PASSWORD){
        setUnlocked();
        hideLock();
        init();
      } else {
        err.hidden = false;
        input.value = "";
        input.focus();
      }
    });
  }

  function boot(){
    wireLock();
    if(isUnlocked()){ hideLock(); init(); }
    else { showLock(); }
  }

  if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", boot); }
  else { boot(); }
})();
</script>
