  function handleCellInput(ev, tab, section, tbody){
    var t = ev.target;
    var idx = t.getAttribute("data-idx");
    if(idx === null) return;
    idx = parseInt(idx, 10);
    var shift = shiftView[tab];
    var day = ensureDay(currentDate);
    var sec = day[section.key];
    var row = shift === "am" ? sec.am[idx] : sec.pm[idx];

    if(t.classList.contains("field-input")){
      var field = t.getAttribute("data-field");
      if(field === "vc" || field === "f" || field === "a"){ row[field] = numOrNull(t.value); }
      else { row[field] = num(t.value); }
    } else if(t.classList.contains("ag-input")){
      var map = shift === "am" ? sec.agAm : sec.agPm;
      if(t.value){ map[idx] = t.value; } else { delete map[idx]; }
    } else {
      return;
    }

    markDirty();
    scheduleAutosave();
    updateComputedRow(tab, section, tbody, idx, shift, day);
    renderTabs();
  }

  function updateComputedRow(tab, section, tbody, idx, shift, day){
    var sec = day[section.key];
    var amRow = sec.am[idx];
    var row = shift === "am" ? amRow : sec.pm[idx];
    var v = ventasOf(row, shift, amRow);
    var c = cuadreOf(row, v);
    var flagged = isFlagged(row, shift, amRow);

    var vCell = tbody.querySelector('.ventas-cell[data-ridx="'+idx+'"]');
    if(vCell){
      if(v === null){ vCell.textContent = "—"; vCell.className = "ventas-cell pending"; }
      else {
        vCell.textContent = fmt(v);
        vCell.className = "ventas-cell " + (v < -0.004 ? "bad" : (v === 0 && row.vc===null ? "neutral" : "good"));
      }
    }
    var cCell = tbody.querySelector('.cuadre-cell[data-ridx="'+idx+'"]');
    if(cCell){
      if(c === null){ cCell.textContent = "—"; cCell.className = "cuadre-cell pending"; }
      else { cCell.textContent = fmt(c); cCell.className = "cuadre-cell " + (Math.abs(c) > 0.004 ? "bad" : "good"); }
    }
    var pendingData = shift === "am" ? row.a === null : amRow.f === null;
    var tr = tbody.querySelector('tr[data-ridx="'+idx+'"]');
    if(tr){
      tr.classList.toggle("flag", flagged);
      tr.classList.toggle("pending-data", pendingData);
    }

    if(shift === "pm"){
      var derived = tbody.querySelector('.derived[data-ridx="'+idx+'"]');
      if(derived){
        derived.textContent = amRow.f === null ? "—" : fmt(amRow.f);
        derived.classList.toggle("pending-warn", amRow.f === null);
      }
    } else {
      var aInput = tbody.querySelector('.field-input[data-idx="'+idx+'"][data-field="a"]');
      if(aInput) aInput.classList.toggle("pending-warn", row.a === null);
    }

    var agNote = tbody.querySelector('.ag-note[data-ridx="'+idx+'"]');
    if(agNote){
      var t = day.turno;
      var agTime = (shift === "am" ? sec.agAm : sec.agPm)[idx];
      var closeTime = shift === "am" ? t.sAM : t.sPM;
      var mins = minutesBetween(agTime, closeTime);
      agNote.textContent = fmtDuration(mins);
    }
  }

  function renderTableBody(tab, tbody, rowCountEl){
    var section = SECTIONS[tab];
    var shift = shiftView[tab];
    var day = getDay(currentDate);
    var sec = day[section.key];
    var t = day.turno;
    var closeTime = shift === "am" ? t.sAM : t.sPM;
    var q = filters[tab].trim().toLowerCase();
    tbody.innerHTML = "";
    var shown = 0;
    var catalog = catalogFor(tab);
    catalog.forEach(function(name, idx){
      if(q && name.toLowerCase().indexOf(q) === -1) return;
      shown++;
      var amRow = sec.am[idx];
      var row = shift === "am" ? amRow : sec.pm[idx];
      var v = ventasOf(row, shift, amRow);
      var c = cuadreOf(row, v);
      var flagged = isFlagged(row, shift, amRow);
      var agMap = shift === "am" ? sec.agAm : sec.agPm;
      var agTime = agMap[idx] || "";
      var mins = minutesBetween(agTime, closeTime);

      // "Sin dato anterior": todavía no hay un número real de dónde partir (nadie lo contó
      // el día/turno anterior) — se avisa con un borde ámbar en la fila, distinto del rojo
      // de descuadre, para que se sepa que hay que contarlo, no que algo está mal.
      var pendingData = shift === "am" ? row.a === null : amRow.f === null;

      var tr = document.createElement("tr");
      tr.setAttribute("data-ridx", idx);
      if(flagged) tr.classList.add("flag");
      if(pendingData) tr.classList.add("pending-data");

      var saldoAntCell = shift === "am"
        ? '<input class="num-input field-input' + (row.a===null?" pending-warn":"") + '" type="number" step="any" min="0" data-idx="'+idx+'" data-field="a" value="'+(row.a===null?"":row.a)+'" placeholder="—">'
        : '<span class="derived' + (amRow.f===null?" pending-warn":"") + '" data-ridx="'+idx+'">'+(amRow.f===null?"—":fmt(amRow.f))+'</span>';

      var nameCell = tab === "otros"
        ? '<td class="name-cell">' + esc(name) +
          (readOnly ? "" : '<button type="button" class="btn-del" data-idx="'+idx+'" title="Eliminar de Otros">✕</button>') +
          '</td>'
        : "<td>" + esc(name) + "</td>";

      tr.innerHTML =
        nameCell +
        "<td>" + saldoAntCell + "</td>" +
        '<td><span class="ing-group">' +
          '<input class="num-input mini field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="i1" value="'+row.i1+'" title="Ingreso 1">' +
          '<input class="num-input mini field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="i2" value="'+row.i2+'" title="Ingreso 2">' +
          '<input class="num-input mini field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="i3" value="'+row.i3+'" title="Ingreso 3">' +
        '</span></td>' +
        '<td><input class="num-input field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="m" value="'+row.m+'"></td>' +
        '<td><input class="num-input field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="f" value="'+(row.f===null?"":row.f)+'" placeholder="—"></td>' +
        '<td><input class="time-input ag-input" type="time" data-idx="'+idx+'" value="'+esc(agTime)+'">' +
          '<div class="ag-note" data-ridx="'+idx+'">' + esc(fmtDuration(mins)) + '</div></td>' +
        '<td class="ventas-cell ' + (v===null?"pending":(v<-0.004?"bad":(v===0&&row.vc===null?"neutral":"good"))) + '" data-ridx="'+idx+'">' + (v===null?"—":fmt(v)) + "</td>" +
        '<td><input class="num-input vc field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="vc" value="'+(row.vc===null?"":row.vc)+'" placeholder="—"></td>' +
        '<td class="cuadre-cell ' + (c===null?"pending":(Math.abs(c)>0.004?"bad":"good")) + '" data-ridx="'+idx+'">' + (c===null?"—":fmt(c)) + "</td>";
      tbody.appendChild(tr);
    });
    if(readOnly){ tbody.querySelectorAll("input").forEach(function(i){ i.disabled = true; }); }
    if(rowCountEl){
      if(tab === "otros" && catalog.length === 0){
        rowCountEl.textContent = "Todavía no registraste nada en Otros. Usa el campo de arriba cuando haya un regalo, bonificación u otra situación.";
      } else {
        rowCountEl.textContent = shown + " de " + catalog.length + " productos" + (q ? " (filtrados)" : "");
      }
    }
  }

  function buildField(labelText, type, value, onChange, full){
    var field = document.createElement("div");
    field.className = "field" + (full ? " full" : "");
    var label = document.createElement("label");
    label.textContent = labelText;
    field.appendChild(label);
    var input;
    if(type === "textarea"){ input = document.createElement("textarea"); input.value = value || ""; }
    else { input = document.createElement("input"); input.type = type; input.value = value || ""; }
    if(readOnly) input.disabled = true;
    input.addEventListener("input", function(){ onChange(input.value); });
    field.appendChild(input);
    return field;
  }

  // ---------- Pedidos (delivery / recojo en tienda / pedido masivo) ----------
  var CANAL_LABEL = { delivery:"Delivery", tienda:"Recojo en tienda", masivo:"Pedido masivo" };
  // Origen del pedido: de dónde vino (Whatsapp o Tienda física), independiente del canal de
  // entrega de arriba — un pedido masivo, por ejemplo, puede venir tanto de Whatsapp como
  // de un cliente que lo pide directo en la tienda (ej. Tanta pidiendo pan para toda la semana).
  var ORIGEN_LABEL = { whatsapp:"WhatsApp", tienda:"Tienda" };
  var pedidosProduccionDate = null;

  function newPedidoDraft(canal){
    canal = canal || "delivery";
    var fecha = currentDate;
    return {
      canal: canal,
      origen: "whatsapp",
      cliente: { nombre:"", dni:"", ruc:"", direccion: canal === "tienda" ? "Recojo en tienda" : "", referencia:"", telefono:"", correo:"" },
      tipoPago: "",
      pagado: false,
      comprobante: null,
      deliveryMonto: 0,
      notas: "",
      fechaDefault: fecha,
      hora: "",
      masivoModo: "recojo",
      masivoDeliveryRate: 0,
      items: [ { producto:"", cantidad:1, precio:0, fecha: fecha, obs:"" } ]
    };
  }

  // Mapa de la lista de precios subida (PEDIDO_PRECIO_SEED), armado una sola vez y
  // normalizado para búsqueda. Solo se usa dentro de Pedidos.
  var pedidoPrecioSeedMap = null;
  function getPedidoPrecioSeedMap(){
    if(pedidoPrecioSeedMap) return pedidoPrecioSeedMap;
    pedidoPrecioSeedMap = {};
    PEDIDO_PRECIO_SEED.forEach(function(item){
      var key = normalizePrecioKey(item.n);
      if(key && item.p > 0) pedidoPrecioSeedMap[key] = item.p;
    });
    return pedidoPrecioSeedMap;
  }

  // Los Triples viven en el catálogo del Arqueo con un nombre genérico por sabor
  // ("Triples Clásicos", "Triple de Aceituna", ...), que es justo el nombre que aparece
  // para elegir en un Pedido. Pero en la lista oficial de precios (PEDIDO_PRECIO_SEED,
  // subida del Excel) cada sabor figura con dos precios distintos según cómo se vende:
  // "UND T. X" (por unidad) y "TIRA DE X" (la tira de 3 unidades). Como en un Pedido
  // normalmente se cuenta por unidad (cantidad = número de triples), el nombre genérico
  // del catálogo se enlaza aquí al precio por UNIDAD, para que nunca se quede sin precio
  // oficial ni caiga en un precio antiguo guardado por error.
  var TRIPLE_PRECIO_ALIAS = [
    { catalogo:"Triples Clásicos", seed:"UND T. CLÁSICO" },
    { catalogo:"Triple de Aceituna", seed:"UND T. ACEITUNA" },
    { catalogo:"Triple de Asado", seed:"UND T. ASADO" },
    { catalogo:"Triple de Pollo Durazno", seed:"UND T. POLLO DURAZNO" },
    { catalogo:"Triple de Pavo", seed:"UND T. PAVO" },
    { catalogo:"Triple Glaseado Piña", seed:"UND T. GLASEADO PIÑA" },
    { catalogo:"Triple Champiñón y Tocino", seed:"UND T. CHAMPIÑÓN Y TOCINO" },
    { catalogo:"Triple Pollo Jamón y Queso", seed:"UND T. POLLO CON JAMÓN Y QUESO" }
  ];
  var pedidoPrecioAliasMap = null;
  function getPedidoPrecioAliasMap(){
    if(pedidoPrecioAliasMap) return pedidoPrecioAliasMap;
    pedidoPrecioAliasMap = {};
    TRIPLE_PRECIO_ALIAS.forEach(function(item){
      var key = normalizePrecioKey(item.catalogo);
      var seedKey = normalizePrecioKey(item.seed);
      if(key && seedKey) pedidoPrecioAliasMap[key] = seedKey;
    });
    return pedidoPrecioAliasMap;
  }

  function buildCatalogNameList(){
    var idx = buildCatalogIndex();
    var names = [];
    var seen = {};
    Object.keys(idx).forEach(function(k){
      var name = idx[k].name;
      var key = normalizePrecioKey(name);
      if(!seen[key]){ seen[key] = true; names.push(name); }
    });
    PEDIDO_PRECIO_SEED.forEach(function(item){
      var key = normalizePrecioKey(item.n);
      if(!seen[key]){ seen[key] = true; names.push(item.n); }
    });
    names.sort();
    return names;
  }

  function normalizeClienteName(s){
    return (s || "").trim().toLowerCase().replace(/\s+/g, " ");
  }

  // Lista de precios (STATE.precios): el precio oficial de la lista subida (PEDIDO_PRECIO_SEED)
  // manda siempre para cualquier producto que ya esté ahí — así escribir "pan", "empanada" o
  // lo que sea, siempre trae el precio real, sin importar qué se haya escrito antes por error
  // en un pedido. STATE.precios solo sirve para "aprender" el precio de productos que todavía
  // NO están en la lista oficial (algo nuevo que Jessica no ha subido), para que al menos no
  // se quede en cero — pero nunca pisa ni cambia un precio que ya viene de la lista oficial.
  // Vive dentro del documento principal del arqueo (no en su propia colección) porque es una
  // lista chica y acotada (un precio por producto), no algo que crezca sin límite.
  function normalizePrecioKey(s){
    return (s || "").trim().toLowerCase().replace(/\s+/g, " ");
  }
  function getPrecioFor(producto){
    var key = normalizePrecioKey(producto);
    if(!key) return null;
    var seedMap = getPedidoPrecioSeedMap();
    if(seedMap.hasOwnProperty(key)) return seedMap[key];
    var aliasMap = getPedidoPrecioAliasMap();
    if(aliasMap.hasOwnProperty(key) && seedMap.hasOwnProperty(aliasMap[key])){
      return seedMap[aliasMap[key]];
    }
    var map = STATE.precios || {};
    return map.hasOwnProperty(key) ? map[key] : null;
  }
  function setPrecioFor(producto, precio){
    var key = normalizePrecioKey(producto);
    if(!key || !(precio > 0)) return;
    var seedMap = getPedidoPrecioSeedMap();
    if(seedMap.hasOwnProperty(key)) return; // el precio de la lista oficial no se pisa
    var aliasMap = getPedidoPrecioAliasMap();
    if(aliasMap.hasOwnProperty(key) && seedMap.hasOwnProperty(aliasMap[key])) return; // ídem, vía alias de Triples
    if(!STATE.precios) STATE.precios = {};
    if(STATE.precios[key] !== precio){
      STATE.precios[key] = precio;
      markDirty();
      scheduleAutosave();
    }
  }

  function findClienteByNombre(nombre){
    var target = normalizeClienteName(nombre);
    if(!target) return null;
    var map = CLIENTES || {};
    var found = null;
    Object.keys(map).forEach(function(id){
      if(found) return;
      if(normalizeClienteName(map[id].nombre) === target){ found = { id: id, data: map[id] }; }
    });
    return found;
  }

  function buildClienteNameList(){
    var map = CLIENTES || {};
    var names = [];
    Object.keys(map).forEach(function(id){ if(map[id].nombre) names.push(map[id].nombre); });
    names.sort();
    return names;
  }

  function upsertCliente(cliente){
    if(!db || !cliente || !cliente.nombre || !cliente.nombre.trim()) return;
    var match = findClienteByNombre(cliente.nombre);
    var payload = {
      nombre: cliente.nombre.trim(),
      dni: cliente.dni || "",
      ruc: cliente.ruc || "",
      direccion: cliente.direccion || "",
      referencia: cliente.referencia || "",
      telefono: cliente.telefono || "",
      correo: cliente.correo || "",
      updatedAt: Date.now()
    };
    if(match){
      db.collection("clientes").doc(match.id).update(payload).catch(function(){});
    } else {
      db.collection("clientes").add(payload).catch(function(){});
    }
  }

  // Comprime la foto del comprobante (Yape/transferencia) antes de guardarla: cada Pedido vive
  // en su propio documento de Firestore (límite de 1 MB), así que se reduce el tamaño de la
  // imagen y se prueba con menos calidad hasta que quede liviana y quepa sin problema.
  function compressImageFile(file, done){
    var maxDim = 1000, maxBytes = 550000;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        function tryQuality(q){
          var dataUrl = canvas.toDataURL("image/jpeg", q);
          var approxBytes = Math.round(dataUrl.length * 0.75);
          if(approxBytes > maxBytes && q > 0.3){
            tryQuality(q - 0.12);
          } else {
            done(dataUrl);
          }
        }
        tryQuality(0.72);
      };
      img.onerror = function(){ done(null); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ done(null); };
    reader.readAsDataURL(file);
  }

      saveBtn2.textContent = pedidosSaving ? "Guardando…" : "Guardar pedido";
      saveBtn2.disabled = pedidosSaving || readOnly;
      saveBtn2.addEventListener("click", savePedido);
      saveRow.appendChild(saveBtn2);
      card.appendChild(saveRow);
    }

    var datalist = document.createElement("datalist");
    datalist.id = "pedidoProductList";
    buildCatalogNameList().forEach(function(name){
      var opt = document.createElement("option");
      opt.value = name;
      datalist.appendChild(opt);
    });
    card.appendChild(datalist);

    var clienteDatalist = document.createElement("datalist");
    clienteDatalist.id = "pedidoClienteList";
    buildClienteNameList().forEach(function(name){
      var opt = document.createElement("option");
      opt.value = name;
      clienteDatalist.appendChild(opt);
    });
    card.appendChild(clienteDatalist);

    var pagoDatalist = document.createElement("datalist");
    pagoDatalist.id = "pedidoPagoList";
    ["Efectivo","Yape","Plin","Transferencia","Tarjeta"].forEach(function(name){
      var opt = document.createElement("option");
      opt.value = name;
      pagoDatalist.appendChild(opt);
    });
    card.appendChild(pagoDatalist);

    renderPedidoItems(tbody, totalsRow);
    updatePedidoTotals(totalsRow);

    if(pedidoEditingId){
      card.addEventListener("input", function(){ schedulePedidoAutosave(); });
      card.addEventListener("change", function(){ schedulePedidoAutosave(); });
    }

    return card;
  }

  function renderPedidoItems(tbody, totalsRow){
    var draft = pedidoDraft;
    var isMasivo = draft.canal === "masivo";
    tbody.innerHTML = "";
    draft.items.forEach(function(item, idx){
      var tr = document.createElement("tr");
      var fechaCell = isMasivo
        ? '<td><input type="date" class="pedido-item-fecha" data-idx="'+idx+'" value="'+esc(item.fecha)+'"></td>'
        : "";
      tr.innerHTML =
        fechaCell +
        '<td><input type="text" list="pedidoProductList" class="pedido-item-producto" data-idx="'+idx+'" value="'+esc(item.producto)+'" placeholder="Buscar producto…"></td>' +
        '<td><input type="text" class="pedido-item-obs" data-idx="'+idx+'" value="'+esc(item.obs||"")+'" placeholder="Ej: poca grasa, cortado en 10…"></td>' +
        '<td><input type="number" step="any" min="0" class="pedido-item-cantidad num-input mini" data-idx="'+idx+'" value="'+item.cantidad+'"></td>' +
        '<td><input type="number" step="any" min="0" class="pedido-item-precio num-input mini" data-idx="'+idx+'" value="'+item.precio+'"></td>' +
        '<td class="pedido-item-total" data-idx="'+idx+'">S/ ' + fmt(item.cantidad*item.precio) + '</td>' +
        '<td>' + (draft.items.length > 1 ? '<button type="button" class="btn-del pedido-item-del" data-idx="'+idx+'" title="Quitar línea">✕</button>' : '') + '</td>';
      tbody.appendChild(tr);
    });
    if(readOnly){
      tbody.querySelectorAll("input, button").forEach(function(el){ el.disabled = true; });
      return;
    }
    tbody.querySelectorAll(".pedido-item-fecha").forEach(function(input){
      input.addEventListener("change", function(){
        draft.items[+input.getAttribute("data-idx")].fecha = input.value || draft.fechaDefault;
      });
    });
    tbody.querySelectorAll(".pedido-item-producto").forEach(function(input){
      function syncProductoYPrecio(){
        var idx = +input.getAttribute("data-idx");
        draft.items[idx].producto = input.value;
        var savedPrecio = getPrecioFor(input.value);
        if(savedPrecio !== null && !(num(draft.items[idx].precio) > 0)){
          draft.items[idx].precio = savedPrecio;
          var precioInput = tbody.querySelector('.pedido-item-precio[data-idx="'+idx+'"]');
          if(precioInput) precioInput.value = savedPrecio;
          var cell = tbody.querySelector('.pedido-item-total[data-idx="'+idx+'"]');
          if(cell) cell.textContent = "S/ " + fmt(draft.items[idx].cantidad * draft.items[idx].precio);
          updatePedidoTotals(totalsRow);
        }
      }
      // Se escucha "input", "change" y "blur" a la vez porque en algunos celulares, elegir
      // una sugerencia de la lista no siempre dispara el evento "input" de forma confiable.
      input.addEventListener("input", syncProductoYPrecio);
      input.addEventListener("change", syncProductoYPrecio);
      input.addEventListener("blur", syncProductoYPrecio);
    });
    tbody.querySelectorAll(".pedido-item-obs").forEach(function(input){
      input.addEventListener("input", function(){
        draft.items[+input.getAttribute("data-idx")].obs = input.value;
      });
    });
    function wireQtyPrice(cls, field){
      tbody.querySelectorAll(cls).forEach(function(input){
        input.addEventListener("input", function(){
          var idx = +input.getAttribute("data-idx");
          draft.items[idx][field] = num(input.value);
          var cell = tbody.querySelector('.pedido-item-total[data-idx="'+idx+'"]');
          if(cell) cell.textContent = "S/ " + fmt(draft.items[idx].cantidad * draft.items[idx].precio);
          updatePedidoTotals(totalsRow);
          if(field === "precio"){ setPrecioFor(draft.items[idx].producto, draft.items[idx].precio); }
        });
      });
    }
    wireQtyPrice(".pedido-item-cantidad", "cantidad");
    wireQtyPrice(".pedido-item-precio", "precio");
    tbody.querySelectorAll(".pedido-item-del").forEach(function(btn){
      btn.addEventListener("click", function(){
        draft.items.splice(+btn.getAttribute("data-idx"), 1);
        renderPedidoItems(tbody, totalsRow);
        updatePedidoTotals(totalsRow);
        if(pedidoEditingId) schedulePedidoAutosave();
      });
    });
  }

  function pedidoSubtotal(draft){
    return draft.items.reduce(function(sum, it){ return sum + (num(it.cantidad) * num(it.precio)); }, 0);
  }
  // Para pedido masivo en modo delivery, el envío se cobra una vez por cada fecha distinta
  // de entrega (no por línea de producto) — así un cliente que recibe pan todos los días de
  // la semana paga el delivery multiplicado por esos días, no por cada producto.
  function masivoDeliveryCount(draft){
    var seen = {};
    var count = 0;
    draft.items.forEach(function(it){
      if(!it.producto || !it.producto.trim() || !(num(it.cantidad) > 0)) return;
      var f = it.fecha || draft.fechaDefault;
      if(!seen[f]){ seen[f] = true; count++; }
    });
    return count;
  }
  function pedidoDeliveryTotal(draft){
    if(draft.canal === "delivery") return num(draft.deliveryMonto);
    if(draft.canal === "masivo" && draft.masivoModo === "delivery"){
      return num(draft.masivoDeliveryRate) * masivoDeliveryCount(draft);
    }
    return 0;
  }
  function updatePedidoTotals(totalsRow){
    var draft = pedidoDraft;
    var subtotal = pedidoSubtotal(draft);
    var delivery = pedidoDeliveryTotal(draft);
    var total = subtotal + delivery;
    var html = "<div>Subtotal productos: <strong>S/ " + fmt(subtotal) + "</strong></div>";
    if(draft.canal === "delivery"){
      html += "<div>Delivery: <strong>S/ " + fmt(delivery) + "</strong></div>";
    } else if(draft.canal === "masivo" && draft.masivoModo === "delivery"){
      var count = masivoDeliveryCount(draft);
      html += "<div>Delivery: <strong>S/ " + fmt(delivery) + "</strong> (" + count + " entrega" + (count === 1 ? "" : "s") + " × S/ " + fmt(num(draft.masivoDeliveryRate)) + ")</div>";
    }
    html += "<div>Total: <strong>S/ " + fmt(total) + "</strong></div>";
    totalsRow.innerHTML = html;
  }

  function savePedido(){
    var draft = pedidoDraft;
    if(!draft || readOnly || !db) return;
    var validItems = draft.items.filter(function(it){ return it.producto && it.producto.trim() && num(it.cantidad) > 0; });
    if(!draft.cliente.nombre || !draft.cliente.nombre.trim()){ showToast("Falta el nombre del cliente."); return; }
    if(validItems.length === 0){ showToast("Agrega al menos un producto con cantidad."); return; }
    if(pedidosSaving) return;
    pedidosSaving = true;
    renderPanel();
    nextPedidoNumero().then(function(numero){
      var payload = {
        canal: draft.canal,
        origen: draft.origen || "whatsapp",
        cliente: draft.cliente,
        tipoPago: draft.tipoPago || "",
        pagado: !!draft.pagado,
        comprobante: draft.comprobante || null,
        deliveryMonto: pedidoDeliveryTotal(draft),
        masivoModo: draft.canal === "masivo" ? draft.masivoModo : "",
        masivoDeliveryRate: draft.canal === "masivo" ? num(draft.masivoDeliveryRate) : 0,
        hora: draft.hora || "",
        notas: draft.notas || "",
        numero: numero,
        items: validItems.map(function(it){
          return { producto: it.producto.trim(), cantidad: num(it.cantidad), precio: num(it.precio), fecha: it.fecha || draft.fechaDefault, obs: (it.obs || "").trim() };
        }),
        createdAt: Date.now()
      };
      return db.collection("pedidos").add(payload).then(function(){
        pedidosSaving = false;
        upsertCliente(payload.cliente);
        pedidoDraft = newPedidoDraft(payload.canal);
        showToast("Pedido guardado.");
        renderPanel();
      });
    }).catch(function(){
      pedidosSaving = false;
      showToast("No se pudo guardar el pedido. Revisa tu conexión e intenta de nuevo.");
      renderPanel();
    });
  }

  // ---------- Editar un pedido ya guardado (con guardado automático) ----------
  // A diferencia de crear un pedido nuevo (que exige apretar "Guardar pedido"), corregir
  // uno que ya existe se guarda solo, como el resto del arqueo — así Jessica o quien tome
  // el pedido puede arreglar un error sin pasos extra.
  function startEditPedido(p){
    pedidoDraft = {
      canal: p.canal || "delivery",
      origen: p.origen || "whatsapp",
      cliente: {
        nombre: (p.cliente && p.cliente.nombre) || "",
        dni: (p.cliente && p.cliente.dni) || "",
        ruc: (p.cliente && p.cliente.ruc) || "",
        direccion: (p.cliente && p.cliente.direccion) || "",
        referencia: (p.cliente && p.cliente.referencia) || "",
        telefono: (p.cliente && p.cliente.telefono) || "",
        correo: (p.cliente && p.cliente.correo) || ""
      },
      tipoPago: p.tipoPago || "",
      pagado: !!p.pagado,
      comprobante: p.comprobante || null,
      deliveryMonto: num(p.deliveryMonto),
      masivoModo: p.masivoModo || "recojo",
      masivoDeliveryRate: num(p.masivoDeliveryRate),
      hora: p.hora || "",
      notas: p.notas || "",
      fechaDefault: (p.items && p.items[0] && p.items[0].fecha) || currentDate,
      items: (p.items && p.items.length) ? p.items.map(function(it){
        return { producto: it.producto || "", cantidad: num(it.cantidad), precio: num(it.precio), fecha: it.fecha || currentDate, obs: it.obs || "" };
      }) : [ { producto:"", cantidad:1, precio:0, fecha: currentDate, obs:"" } ]
    };
    pedidoEditingId = p.id;
    pedidosView = "nuevo";
    renderPanel();
  }
  function updatePedidoSaveStatus(){
    var el = document.getElementById("pedidoSaveStatus");
    if(!el) return;
    el.textContent = pedidoAutosaving ? "Guardando…" : "Los cambios se guardan solos";
  }
  function schedulePedidoAutosave(){
    if(!pedidoEditingId || readOnly) return;
    clearTimeout(pedidoSaveTimer);
    pedidoSaveTimer = setTimeout(function(){ doPedidoAutosave(); }, 1200);
  }
  function doPedidoAutosave(){
    if(!pedidoEditingId || !db || readOnly) return;
    var draft = pedidoDraft;
    if(!draft) return;
    // Si está a mitad de corregir (ej. borrando el nombre para escribir uno nuevo), esperamos
    // a que vuelva a haber algo válido en vez de guardar un pedido a medio llenar.
    if(!draft.cliente.nombre || !draft.cliente.nombre.trim()) return;
    var validItems = draft.items.filter(function(it){ return it.producto && it.producto.trim() && num(it.cantidad) > 0; });
    if(validItems.length === 0) return;
    var id = pedidoEditingId;
    var payload = {
      canal: draft.canal,
      origen: draft.origen || "whatsapp",
      cliente: draft.cliente,
      tipoPago: draft.tipoPago || "",
      pagado: !!draft.pagado,
      comprobante: draft.comprobante || null,
      deliveryMonto: pedidoDeliveryTotal(draft),
      masivoModo: draft.canal === "masivo" ? draft.masivoModo : "",
      masivoDeliveryRate: draft.canal === "masivo" ? num(draft.masivoDeliveryRate) : 0,
      hora: draft.hora || "",
      notas: draft.notas || "",
      items: validItems.map(function(it){
        return { producto: it.producto.trim(), cantidad: num(it.cantidad), precio: num(it.precio), fecha: it.fecha || draft.fechaDefault, obs: (it.obs || "").trim() };
      })
    };
    pedidoAutosaving = true;
    updatePedidoSaveStatus();
    db.collection("pedidos").doc(id).update(payload).then(function(){
      pedidoAutosaving = false;
      updatePedidoSaveStatus();
      upsertCliente(payload.cliente);
    }).catch(function(){
      pedidoAutosaving = false;
      updatePedidoSaveStatus();
      showToast("No se pudo guardar el cambio. Revisa tu conexión e intenta de nuevo.");
    });
  }

  var MESES_LARGO = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Setiembre","Octubre","Noviembre","Diciembre"];
  var DIAS_LARGO = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  function fmtFechaLarga(iso){
    if(!iso) return "";
    var d = new Date(iso + "T12:00:00");
    var dia = DIAS_LARGO[d.getDay()];
    var num2 = (d.getDate() < 10 ? "0" : "") + d.getDate();
    var mes = MESES_LARGO[d.getMonth()];
    return dia + ", " + num2 + " de " + mes + " de " + d.getFullYear();
  }
  function fmtFechaCorta(iso){
    if(!iso) return "";
    var parts = iso.split("-");
    return parts.length === 3 ? (parts[2] + "/" + parts[1] + "/" + parts[0]) : iso;
  }
  // Número correlativo de pedido (0001, 0002, ...), en vez del código al azar de antes --
  // Jessica lo pidió así porque un código como "eodros0p" no le sirve para identificar/ordenar
  // sus pedidos. Se guarda un contador en su propio documento de Firestore (separado de
  // STATE, que ya tiene su propia lógica de fusión) y se actualiza dentro de una transacción
  // para que dos personas guardando un pedido al mismo tiempo, desde equipos distintos, nunca
  // se queden con el mismo número.
  function nextPedidoNumero(){
    var ref = db.collection("contadores").doc("pedidos");
    return db.runTransaction(function(tx){
      return tx.get(ref).then(function(snap){
        var ultimo = (snap.exists && num(snap.data().ultimo)) || 0;
        var siguiente = ultimo + 1;
        tx.set(ref, { ultimo: siguiente });
        return siguiente;
      });
    }).then(function(n){
      var s = String(n);
      while(s.length < 4) s = "0" + s;
      return s;
    });
  }
  // Etiqueta corta para mostrar junto al título -- Jessica pidió poder identificar de un
  // vistazo de dónde vino el pedido, igual que responde el selector "¿De dónde vino este
  // pedido?" (WhatsApp / Tienda) del formulario -- por eso usa el mismo campo "origen" y el
  // mismo texto (ORIGEN_LABEL), en vez del canal de entrega (delivery/recojo/masivo).
  function pedidoDestinoLabel(p){
    return (ORIGEN_LABEL[p.origen] || ORIGEN_LABEL.whatsapp).toUpperCase();
  }
  function pedidoBannerHTML(p){
    if(p.canal === "masivo"){
      if(p.masivoModo === "delivery") return "Pedido Masivo — Delivery";
      if(p.masivoModo === "recojo") return "Pedido Masivo — Recojo en Tienda";
      return "Pedido Masivo";
    }
    if(p.canal === "tienda"){
      return "Recojo en Tienda" + (p.hora ? " " + esc(p.hora) : "");
    }
    return p.hora ? ("Enviar antes de las " + esc(p.hora)) : "Pedido Delivery";
  }
  function pedidoInfoRowsHTML(p){
    var c = p.cliente || {};
    var rows = [
      ["NOMBRES:", c.nombre],
      ["DNI:", c.dni],
      ["RUC:", c.ruc],
      ["DIRECCION:", c.direccion],
      ["REFERENCIA:", c.referencia],
      ["TELÉFONO:", c.telefono],
      ["CORREO:", c.correo]
    ];
    var html = "";
    rows.forEach(function(r){
      // Solo se imprime el dato que sí se llenó — si el campo quedó vacío, ni el título ni
      // la línea aparecen en el PDF.
      if(!r[1] || !String(r[1]).trim()) return;
      html += '<div style="display:flex; padding:1px 0;">' +
        '<div style="width:130px; flex:none; font-weight:700;">' + esc(r[0]) + '</div>' +
        '<div>' + esc(r[1] || "") + '</div></div>';
    });
    // La forma de pago (Yape, Transferencia, Efectivo…) y si ya está pagado o no van juntas
    // y siempre visibles — a diferencia de los datos de arriba, esto sí le importa al equipo
    // aunque no se haya llenado la forma de pago todavía.
    var tipoPago = p.tipoPago && String(p.tipoPago).trim() ? esc(p.tipoPago) : "—";
    var pagadoBadge = p.pagado
      ? '<span style="color:#3D7A57; font-weight:800;">✓ PAGADO</span>'
      : '<span style="color:#B34428; font-weight:800;">PENDIENTE DE PAGO</span>';
    html += '<div style="display:flex; padding:1px 0; align-items:center;">' +
      '<div style="width:130px; flex:none; font-weight:700;">PAGO:</div>' +
      '<div>' + tipoPago + ' &nbsp;—&nbsp; ' + pagadoBadge + '</div></div>';
    return html;
  }
  // Color principal de las franjas/encabezados oscuros de la orden -- un marrón café en vez
  // del azul de la primera prueba (Jessica: "el azul con el amarillo se ve feo... uno sutil,
  // que se vea bien, bonito y sofisticado"), a tono con la tinta del logo y el amarillo que
  // ya tenía la franja de Recojo/Entrega. Un poco más claro que el primer marrón, a pedido
  // de Jessica, pero todavía con suficiente contraste para el texto blanco encima.
  var PEDIDO_DARK = "#8a5c3c";
  // Filas mínimas que siempre se ven en la tabla, aunque el pedido tenga solo 1 o 2 productos
  // -- Jessica: "yo quiero que se vea ahí más espacio... 8 filas" -- para que no se vea vacía o
  // chica cuando el pedido es corto. Si el pedido tiene más productos que esto, no se recorta
  // nada; solo se agregan filas en blanco hasta llegar al mínimo.
  var PEDIDO_FILAS_MIN = 8;
  // Un pedido masivo (varios productos x varios días de entrega) puede juntar muchas filas --
  // Jessica: "es importante que salga todo en una hoja (siempre usamos hoja A4)". En vez de un
  // tamaño de letra fijo, la tabla se va achicando por niveles según cuántas filas tenga, para
  // que quepa completa en una sola hoja A4 vertical sin recortar productos. Con pocas filas se
  // queda en el tamaño normal (igual que antes); estos niveles solo entran a tallar cuando el
  // pedido realmente tiene muchas filas.
  // Umbrales verificados imprimiendo (a PDF, con el mismo A4 y margen de 10mm que usa la app
  // de verdad) pedidos de prueba de 8 a 140 filas y confirmando en cuáles se mantenía en 1 sola
  // hoja -- no son números "a ojo". Cada nivel solo se usa hasta la cantidad de filas que de
  // verdad le entra en una hoja A4 vertical; pasado ese punto se achica al siguiente nivel.
  function pedidoTableDensity(n){
    if(n <= 12) return { font:12, cell:"5px 6px", head:"6px 6px", margin:"10px 0 4px", obs:10 };
    if(n <= 20) return { font:10.5, cell:"3px 6px", head:"4px 6px", margin:"8px 0 3px", obs:9 };
    if(n <= 30) return { font:9.5, cell:"2px 5px", head:"3px 5px", margin:"6px 0 2px", obs:8.5 };
    if(n <= 40) return { font:8.5, cell:"1.5px 4px", head:"2px 4px", margin:"5px 0 2px", obs:8 };
    if(n <= 48) return { font:7.5, cell:"1px 3px", head:"1.5px 3px", margin:"4px 0 1px", obs:7 };
    return { font:6.5, cell:"0.5px 2px", head:"1px 2px", margin:"3px 0 1px", obs:6 };
  }
  function pedidoTableHTML(p){
    var isMasivo = p.canal === "masivo";
    var subtotal = 0;
    var items = p.items || [];
    var filas = Math.max(items.length, PEDIDO_FILAS_MIN);
    var d = pedidoTableDensity(filas);
    var headStyle = "border:1px solid " + PEDIDO_DARK + "; padding:" + d.head + "; background:" + PEDIDO_DARK + "; color:#fff; font-size:11px; letter-spacing:.02em;";
    function th(label, align){ return '<th style="' + headStyle + 'text-align:' + align + ';">' + label + "</th>"; }
    var head = th("N°", "center") + (isMasivo ? th("FECHA ENTREGA", "left") : "") + th("CANT.", "center") + th("PRODUCTO", "left") + th("PRECIO", "right") + th("TOTAL", "right");
    // Anchos fijos por columna (via colgroup + table-layout:fixed) para que Cantidad, Precio y
    // Total queden siempre alineados en la misma posición en todas las filas, en vez de que el
    // ancho se acomode según el texto más largo de cada pedido.
    var colgroup = "<colgroup>" +
      '<col style="width:30px;">' +
      (isMasivo ? '<col style="width:80px;">' : "") +
      '<col style="width:44px;">' +
      "<col>" +
      '<col style="width:64px;">' +
      '<col style="width:68px;">' +
      "</colgroup>";
    var body = "";
    items.forEach(function(it, idx){
      var lineTotal = num(it.cantidad) * num(it.precio);
      subtotal += lineTotal;
      var cellStyle = "border:1px solid #ccc; padding:" + d.cell + "; vertical-align:top;";
      var obsHtml = it.obs && it.obs.trim()
        ? '<div style="font-size:' + d.obs + 'px; font-style:italic; color:#555;">' + esc(it.obs.trim()) + "</div>"
        : "";
      body += "<tr>" +
        '<td style="' + cellStyle + 'text-align:center; color:#888;">' + (idx + 1) + "</td>" +
        (isMasivo ? '<td style="' + cellStyle + 'text-align:left;">' + esc(fmtFechaCorta(it.fecha)) + "</td>" : "") +
        '<td style="' + cellStyle + 'text-align:center; font-weight:700;">' + fmt(it.cantidad) + "</td>" +
        '<td style="' + cellStyle + 'text-align:left;">' + esc(it.producto) + obsHtml + "</td>" +
        '<td style="' + cellStyle + 'text-align:right;">S/' + fmtMoney(it.precio) + "</td>" +
        '<td style="' + cellStyle + 'text-align:right; font-weight:700;">S/' + fmtMoney(lineTotal) + "</td>" +
        "</tr>";
    });
    // Filas en blanco de relleno hasta el mínimo -- mismo N° correlativo, sin datos.
    for(var i = items.length; i < PEDIDO_FILAS_MIN; i++){
      var blankCellStyle = "border:1px solid #ccc; padding:" + d.cell + ";";
      body += "<tr>" +
        '<td style="' + blankCellStyle + 'text-align:center; color:#bbb;">' + (i + 1) + "</td>" +
        (isMasivo ? '<td style="' + blankCellStyle + '"></td>' : "") +
        '<td style="' + blankCellStyle + '"></td>' +
        '<td style="' + blankCellStyle + '"></td>' +
        '<td style="' + blankCellStyle + '"></td>' +
        '<td style="' + blankCellStyle + '"></td>' +
        "</tr>";
    }
    var theadHtml = "<thead><tr>" + head + "</tr></thead>";
    return { html: '<table style="width:100%; border-collapse:collapse; table-layout:fixed; font-size:' + d.font + 'px; margin:' + d.margin + ';">' + colgroup + theadHtml + "<tbody>" + body + "</tbody></table>", subtotal: subtotal };
  }

    // max-width en 700px (no 780px) a propósito: una hoja A4 vertical con margen de 10mm por

      '<div style="font-size:13px; font-weight:800; color:#c2660c; margin-top:2px;">(' + esc(pedidoDestinoLabel(p)) + ')</div>' +

      '</div>';
    html += '</div>';

    html += '<div style="background:#fff200; color:#cc0000; font-weight:800; font-size:17px; text-align:center; padding:7px 4px; margin:10px 0 0;">' + pedidoBannerHTML(p) + '</div>';
    html += '<div style="background:' + PEDIDO_DARK + '; color:#fff; font-weight:700; font-size:11px; letter-spacing:.04em; padding:4px 10px; margin-top:8px;">CLIENTE</div>';
    html += '<div style="background:#f6e3bd; padding:8px 10px 7px; margin-bottom:2px; font-size:12px;">' + pedidoInfoRowsHTML(p) + '</div>';
    html += tabla.html;
    html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-top:4px;">' +
      '<div style="font-size:11px;">Importante: Poner su nombre en Whatsapp</div>' +
      '<div style="font-size:12px; text-align:right;">' +
      '<div>SubTotal Productos: <strong>S/' + fmtMoney(tabla.subtotal) + '</strong></div>' +
      '<div>Delivery: <strong>S/' + fmtMoney(delivery) + '</strong></div>' +
      '<div style="font-size:14px; border-top:1px solid ' + PEDIDO_DARK + '; margin-top:3px; padding-top:3px;">TOTAL: <strong>S/' + fmtMoney(total) + '</strong></div>' +
      '</div></div>';
    // Foto del Yape/transferencia (si se subió una): así queda el pago 100% confirmado junto
    // con el resto del pedido, no solo el texto "PAGADO".
    if(p.comprobante){
      html += '<div style="margin-top:8px; text-align:center;">' +
        '<div style="font-size:10px; font-weight:700; color:#555; margin-bottom:3px;">COMPROBANTE DE PAGO</div>' +
        '<img src="' + p.comprobante + '" style="max-width:260px; max-height:260px; border:1px solid #ccc; border-radius:4px;">' +
        '</div>';
    }
    html += '<div style="text-align:center; color:#cc0000; font-weight:700; font-size:11px; margin-top:14px;">40 años... Tradición en Evolución, a tu servicio</div>';
    html += '<div style="text-align:center; color:#111; font-size:11px; margin-top:2px;">¡Gracias por tu compra!</div>';
    html += '</div>';
    return html;
  }
  function doPrintPedido(id){
    var p = (PEDIDOS || []).filter(function(x){ return x.id === id; })[0];
    if(!p) return;

  function doPrintPedidosDia(date){
    var list = (PEDIDOS || []).filter(function(p){
      return (p.items || []).some(function(it){ return it.fecha === date; });
    });
    if(list.length === 0){ showToast("No hay pedidos con entrega ese día."); return; }
    setPrintOrientation(false);
    var area = document.getElementById("printArea");
    area.innerHTML = list.map(function(p, i){
      var pageBreak = i < list.length - 1 ? "page-break-after:always;" : "";
      return '<div style="' + pageBreak + '">' + buildPedidoPrintCardHTML(p) + '</div>';
    }).join("");
    doWindowPrint("Pedidos " + (date || ""));

  // ---------- Reporte "Pedidos Orden de Tienda" / "Pedidos Delivery" ----------
  // Reemplaza los reportes que Jessica bajaba de Universalio y recortaba a mano en Excel
  // antes de mandarlos a su grupo: una lista clara, línea por producto, ordenada por hora
  // de entrega, separada por origen del pedido (Tienda o Whatsapp).
  function pedidoTipoEntregaLabel(p){
    if(p.canal === "masivo") return p.masivoModo === "delivery" ? "Delivery" : "Recojo";
    return p.canal === "tienda" ? "Recojo" : "Delivery";
  }
  function fmtHora12(hhmm){
    if(!hhmm) return "";
    var parts = hhmm.split(":");
    var h = parseInt(parts[0], 10);
    if(isNaN(h)) return hhmm;
    var m = parts[1] || "00";
    var suf = h >= 12 ? "p. m." : "a. m.";
    var h12 = h % 12; if(h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + suf;
  }
  function fmtFechaReporte(iso){
    if(!iso) return "";
    var d = new Date(iso + "T12:00:00");
    var dia = DIAS_LARGO[d.getDay()].toLowerCase();
    var mes = MESES_LARGO[d.getMonth()].toLowerCase();
    return dia + ", " + d.getDate() + " de " + mes + " de " + d.getFullYear();
  }
  function buildPedidosReporteRows(date, origen){
    var rows = [];
    (PEDIDOS || []).forEach(function(p){
      if((p.origen || "whatsapp") !== origen) return;
      (p.items || []).forEach(function(it){
        if(it.fecha !== date) return;
        if(!it.producto || !it.producto.trim() || !(num(it.cantidad) > 0)) return;
        rows.push({
          cliente: (p.cliente && p.cliente.nombre) || "",
          cantidad: num(it.cantidad),
          producto: it.producto,
          hora: p.hora || "",
          tipoEntrega: pedidoTipoEntregaLabel(p)
        });
      });
    });
    rows.sort(function(a, b){
      var ha = a.hora || "99:99";
      var hb = b.hora || "99:99";
      if(ha !== hb) return ha < hb ? -1 : 1;
      return a.cliente.localeCompare(b.cliente);
    });
    return rows;
  }
  function buildPedidosReporteHTML(date, origen){
    var rows = buildPedidosReporteRows(date, origen);
    var isTienda = origen === "tienda";
    var titulo = isTienda ? "PEDIDOS ORDEN DE TIENDA" : "PEDIDOS DELIVERY";
    var color = isTienda ? "#c2660c" : "#cc0000";
    var thStyle = "background:#4472c4; color:#fff; font-weight:700; padding:5px 8px; border:1px solid #ccc; text-align:left;";
    var tdStyle = "padding:4px 8px; border-bottom:1px solid #ddd;";
    var headCols = '<th style="' + thStyle + '">Cliente</th>' +
      '<th style="' + thStyle + 'text-align:center;">Cantidad</th>' +
      '<th style="' + thStyle + '">Producto</th>' +
      '<th style="' + thStyle + 'text-align:center;">Hora Entrega</th>' +
      (isTienda ? "" : '<th style="' + thStyle + 'text-align:center;">Tipo Entrega</th>');
    var body = "";
    if(rows.length === 0){
      body = '<tr><td colspan="' + (isTienda ? 4 : 5) + '" style="padding:12px; text-align:center; color:#777; font-style:italic;">No hay pedidos de este origen para esta fecha.</td></tr>';
    } else {
      rows.forEach(function(r){
        body += "<tr>" +
          '<td style="' + tdStyle + 'font-weight:700;">' + esc(r.cliente) + "</td>" +
          '<td style="' + tdStyle + 'text-align:center;">' + fmt(r.cantidad) + "</td>" +
          '<td style="' + tdStyle + '">' + esc(r.producto) + "</td>" +
          '<td style="' + tdStyle + 'text-align:center;">' + esc(fmtHora12(r.hora)) + "</td>" +
          (isTienda ? "" : '<td style="' + tdStyle + 'text-align:center;">' + esc(r.tipoEntrega) + "</td>") +
          "</tr>";
      });
    }
    var html = '<div style="font-family:Arial,Helvetica,sans-serif; max-width:900px; margin:0 auto 1.5rem; background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact;">';
    html += '<div style="display:flex; justify-content:space-between; align-items:center; padding:6px 4px; border-bottom:2px solid #ddd; flex-wrap:wrap; gap:.4rem;">';
    html += '<div style="font-size:18px; font-weight:800; color:' + color + ';">' + titulo + '</div>';
    html += '<div style="font-size:14px; font-weight:700; color:#111;">' + esc(fmtFechaReporte(date)) + '</div>';
    html += "</div>";
    html += '<table style="width:100%; border-collapse:collapse; font-size:12px; margin-top:6px;">';
    html += "<thead><tr>" + headCols + "</tr></thead><tbody>" + body + "</tbody></table></div>";
    return html;
  }
  function doPrintPedidosReporte(date, origen){
    setPrintOrientation(false);
    var area = document.getElementById("printArea");
    area.innerHTML = buildPedidosReporteHTML(date, origen);
    doWindowPrint((origen === "tienda" ? "Pedidos Tienda " : "Pedidos Delivery ") + (date || ""));
  }

  // ---------- Caja Cajeros (control de caja que llena cada cajero, mañana y tarde) ----------
  // Reemplaza la hoja de papel "HOJA RESUMEN AM" que llenaba a mano el cajero: anota los
  // billetes/monedas, los depósitos y los gastos, y la app suma sola -- así se evita el error
  // de suma a mano. El "Total del sistema" lo llena Jessica después, cuando lo descarga del
  // sistema de ventas, para comparar contra lo que reportó el cajero y detectar diferencias
  // (si falta o sobra dinero). Vive en su propia colección de Firestore ("cajaCajeros"),
  // separada de "arqueo/state" y de "pedidos", por la misma razón que los pedidos.
  var BILLETE_VALORES = [
    { key:"b200", label:"Billetes de 200", valor:200 },
    { key:"b100", label:"Billetes de 100", valor:100 },
    { key:"b50", label:"Billetes de 50", valor:50 },
    { key:"b20", label:"Billetes de 20", valor:20 },
    { key:"b10", label:"Billetes de 10", valor:10 }
  ];
  var TURNO_CAJERO_LABEL = { manana:"Mañana", tarde:"Tarde" };

  function newCajeroDraft(){
    return {
      fecha: currentDate,
      turno: "manana",
      cajero: "",
      caja: "CR1",
      billetes: { b200:0, b100:0, b50:0, b20:0, b10:0 },
      monedas: 0,
      dolarTipoCambio: 0,
      dolarMonto: 0,
      depositoA: 0,
      depositoC: 0,
      gastos: [ { desc:"", monto:0 } ],
      totalSistema: null,
      notas: ""
    };
  }

  // Estas funciones de cálculo trabajan igual con un borrador (mientras se llena el
  // formulario) que con un reporte ya guardado (documento de Firestore) -- misma forma.
  function cajeroBilletesTotal(r){
    var t = 0;
    BILLETE_VALORES.forEach(function(b){ t += num(r.billetes && r.billetes[b.key]) * b.valor; });
    return t;
  }
  function cajeroDolarConvertido(r){
    return num(r.dolarMonto) * num(r.dolarTipoCambio);
  }
  // Efectivo que entró en soles de verdad (billetes + monedas), sin contar lo que vino en
  // dólares -- separado de cajeroEfectivo() porque Jessica necesita mostrar esta parte sola
  // (para diferenciar cuánto entró en soles y cuánto entró convertido de dólares).
  function cajeroEfectivoSoles(r){
    return cajeroBilletesTotal(r) + num(r.monedas);
  }
  function cajeroEfectivo(r){
    return cajeroEfectivoSoles(r) + cajeroDolarConvertido(r);
  }
  function cajeroGastosTotal(r){
    return (r.gastos || []).reduce(function(s, g){ return s + num(g.monto); }, 0);
  }
  function cajeroTotalCalculado(r){
    return cajeroEfectivo(r) + num(r.depositoA) + num(r.depositoC) + cajeroGastosTotal(r);
  }
  // Diferencia = lo que reportó el cajero MENOS lo que dice el sistema -- así, si el cajero
  // cuenta más de lo que el sistema esperaba, la diferencia sale positiva ("sobra"), y si
  // cuenta menos, sale negativa ("falta"). (Antes estaba al revés: restaba calculado al
  // sistema, y por eso un sobrante de plata salía marcado como "falta" -- Jessica lo detectó
  // con un caso real: cajero reportó S/1553, sistema S/1500, y eso es plata de más, no falta).
  function cajeroDiferencia(r){
    if(r.totalSistema === null || r.totalSistema === undefined) return null;
    return cajeroTotalCalculado(r) - num(r.totalSistema);
  }

  function saveCajero(){
    var draft = cajeroDraft;
    if(!draft || readOnly || !db) return;
    if(!draft.cajero || !draft.cajero.trim()){ showToast("Falta el nombre del cajero."); return; }
    if(!draft.fecha){ showToast("Falta la fecha."); return; }
    if(cajerosSaving) return;
    cajerosSaving = true;
    renderPanel();
    var payload = {
      fecha: draft.fecha,
      turno: draft.turno,
      cajero: draft.cajero.trim(),
      caja: (draft.caja || "").trim(),
      billetes: {
        b200: num(draft.billetes.b200), b100: num(draft.billetes.b100), b50: num(draft.billetes.b50),
        b20: num(draft.billetes.b20), b10: num(draft.billetes.b10)
      },
      monedas: num(draft.monedas),
      dolarTipoCambio: num(draft.dolarTipoCambio),
      dolarMonto: num(draft.dolarMonto),
      depositoA: num(draft.depositoA),
      depositoC: num(draft.depositoC),
      gastos: (draft.gastos || []).filter(function(g){ return (g.desc && g.desc.trim()) || num(g.monto) > 0; }).map(function(g){
        return { desc: (g.desc || "").trim(), monto: num(g.monto) };
      }),
      totalSistema: numOrNull(draft.totalSistema),
      notas: draft.notas || "",
      updatedAt: Date.now()
    };
    var promise;
    if(cajeroEditingId){
      promise = db.collection("cajaCajeros").doc(cajeroEditingId).update(payload);
    } else {
      payload.createdAt = Date.now();
      promise = db.collection("cajaCajeros").add(payload);
    }
    promise.then(function(){
      cajerosSaving = false;
      cajeroEditingId = null;
      cajeroDraft = null;
      cajerosView = "historial";
      showToast("Reporte de caja guardado.");
      renderPanel();
    }).catch(function(){
      cajerosSaving = false;
      showToast("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
      renderPanel();
    });
  }

      fb.className = "shift-btn" + (cajerosFiltroCajero === pair[0] ? " active" : "");
      fb.textContent = pair[1];
      fb.addEventListener("click", function(){ cajerosFiltroCajero = pair[0]; renderPanel(); });
      cajeroFilterRow.appendChild(fb);
    });
    card.appendChild(cajeroFilterRow);

    var filtrados = (CAJACAJEROS || []).filter(function(r){
      if(cajerosFiltroDesde && r.fecha < cajerosFiltroDesde) return false;
      if(cajerosFiltroHasta && r.fecha > cajerosFiltroHasta) return false;
      if(cajerosFiltroCajero !== "todos" && r.cajero !== cajerosFiltroCajero) return false;
      return true;
    }).sort(function(a,b){ return (b.fecha||"").localeCompare(a.fecha||"") || (b.createdAt||0) - (a.createdAt||0); });

    exportBtn.disabled = filtrados.length === 0;
    exportBtn.addEventListener("click", function(){ doExportCajeros(filtrados); });

    if(filtrados.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = (CAJACAJEROS||[]).length === 0
        ? "Todavía no hay reportes de caja guardados."
        : "No hay reportes que coincidan con el filtro.";
      card.appendChild(empty);
      wrap.appendChild(card);
      return wrap;
    }

    var tableWrap = document.createElement("div");
    tableWrap.className = "table-wrap";
    var table = document.createElement("table");
    table.className = "data-table";
    table.innerHTML = "<thead><tr><th>Fecha</th><th>Turno</th><th>Cajero</th><th>Caja</th><th>Efectivo</th><th>Dep. A</th><th>Dep. C</th><th>Gastos</th><th>Total calc.</th><th>Total sistema</th><th>Diferencia</th><th></th><th></th><th></th></tr></thead><tbody></tbody>";
    var tbody = table.querySelector("tbody");
    filtrados.forEach(function(r){
      var tr = document.createElement("tr");
      var diff = cajeroDiferencia(r);
      var diffHtml = diff === null ? "—" : ('<span class="cajero-diff ' + (Math.abs(diff) < 0.005 ? "good" : "bad") + '">S/ ' + fmt(diff) + '</span>');
      tr.innerHTML =
        "<td>" + esc(fmtFechaCorta(r.fecha)) + "</td>" +
        "<td>" + esc(TURNO_CAJERO_LABEL[r.turno] || r.turno) + "</td>" +
        "<td>" + esc(r.cajero || "—") + "</td>" +
        "<td>" + esc(r.caja || "—") + "</td>" +
        "<td>S/ " + fmt(cajeroEfectivo(r)) + "</td>" +
        "<td>S/ " + fmt(r.depositoA) + "</td>" +
        "<td>S/ " + fmt(r.depositoC) + "</td>" +
        "<td>S/ " + fmt(cajeroGastosTotal(r)) + "</td>" +
        "<td>S/ " + fmt(cajeroTotalCalculado(r)) + "</td>" +
        "<td>" + (r.totalSistema === null || r.totalSistema === undefined ? "—" : "S/ " + fmt(r.totalSistema)) + "</td>" +
        "<td>" + diffHtml + "</td>" +
        "<td>" + (readOnly ? "" : "<button type='button' class='btn btn-sm cajero-editar' data-id='" + r.id + "'>Editar</button>") + "</td>" +
        "<td><button type='button' class='btn btn-sm cajero-pdf' data-id='" + r.id + "'>PDF</button></td>" +
        "<td>" + (readOnly ? "" : '<button type="button" class="btn-del cajero-del" data-id="' + r.id + '" title="Eliminar reporte">✕</button>') + "</td>";
      tbody.appendChild(tr);
    });
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    wrap.appendChild(card);

    tbody.querySelectorAll(".cajero-pdf").forEach(function(btn){
      btn.addEventListener("click", function(){ doPrintCajero(btn.getAttribute("data-id")); });
    });
    if(!readOnly){
      tbody.querySelectorAll(".cajero-editar").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var r = (CAJACAJEROS||[]).filter(function(x){ return x.id === id; })[0];
          if(r) startEditCajero(r);
        });
      });
      tbody.querySelectorAll(".cajero-del").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var r = (CAJACAJEROS||[]).filter(function(x){ return x.id === id; })[0];
          if(!r || !db) return;
          if(!confirm('¿Eliminar el reporte de caja de "' + (r.cajero || "este cajero") + '" (' + fmtFechaCorta(r.fecha) + ')? No se puede deshacer.')) return;
          db.collection("cajaCajeros").doc(id).delete().catch(function(){
            showToast("No se pudo eliminar. Intenta de nuevo.");
          });
        });
      });
    }

    return wrap;
  }

  function doExportCajeros(rows){
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    try{
      var ordenados = rows.slice().sort(function(a,b){ return (a.fecha||"").localeCompare(b.fecha||""); });

      // Hoja 1: un resumen por reporte de turno/cajero -- sin el texto largo de gastos (eso
      // va aparte, en su propia hoja, para que se pueda sumar/filtrar bien en Excel). El
      // efectivo se separa en soles y dólares convertidos, tal como lo pidió Jessica.
      var aoa = [[
        "Fecha","Turno","Cajero","Caja","Billetes 200","Billetes 100","Billetes 50","Billetes 20","Billetes 10",
        "Monedas","Efectivo en soles","Tipo de cambio","Dólares (USD)","Convertido de dólares","Efectivo total",
        "Depósito A","Depósito C","Total gastos","Total calculado","Total sistema","Diferencia","Notas"
      ]];
      ordenados.forEach(function(r){
        var diff = cajeroDiferencia(r);
        aoa.push([
          r.fecha || "", TURNO_CAJERO_LABEL[r.turno] || r.turno || "", r.cajero || "", r.caja || "",
          num(r.billetes && r.billetes.b200), num(r.billetes && r.billetes.b100), num(r.billetes && r.billetes.b50),
          num(r.billetes && r.billetes.b20), num(r.billetes && r.billetes.b10),
          round2(num(r.monedas)), round2(cajeroEfectivoSoles(r)),
          num(r.dolarTipoCambio), round2(num(r.dolarMonto)), round2(cajeroDolarConvertido(r)), round2(cajeroEfectivo(r)),
          round2(num(r.depositoA)), round2(num(r.depositoC)), round2(cajeroGastosTotal(r)),
          round2(cajeroTotalCalculado(r)), (r.totalSistema === null || r.totalSistema === undefined) ? "" : round2(num(r.totalSistema)),
          diff === null ? "" : round2(diff), r.notas || ""
        ]);
      });

      // Hoja 2: el detalle de gastos, una fila por cada línea de gasto de cada reporte --
      // así se puede sumar/filtrar por descripción (harina, movilidad, gas, etc.) en Excel.
      var aoaGastos = [["Fecha","Turno","Cajero","Caja","Descripción","Monto"]];
      ordenados.forEach(function(r){
        (r.gastos||[]).forEach(function(g){
          aoaGastos.push([
            r.fecha || "", TURNO_CAJERO_LABEL[r.turno] || r.turno || "", r.cajero || "", r.caja || "",
            g.desc || "", round2(num(g.monto))
          ]);
        });
      });

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Caja Cajeros");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaGastos), "Detalle de Gastos");
      XLSX.writeFile(wb, "caja-cajeros-historial.xlsx");
      showToast("Reporte descargado.");
    }catch(err){
      showToast("No se pudo generar el archivo. Intenta de nuevo.");
    }
  }

  function buildCajeroPrintCardHTML(r){
    var diff = cajeroDiferencia(r);
    var html = '<div style="font-family:Arial,Helvetica,sans-serif; color:#111; max-width:700px; margin:0 auto;">';
    html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">';
    html += '<div><img src="' + CARMELITAS_LOGO + '" style="height:70px; display:block; margin-bottom:6px;"></div>';
    html += '<div style="text-align:right;">' +
      '<div style="font-size:20px; font-weight:800; color:' + PEDIDO_DARK + ';">RESUMEN DE CAJA</div>' +
      '<div style="font-size:12px; color:#555; margin-top:4px;">' + esc(fmtFechaLarga(r.fecha)) + " · " + esc(TURNO_CAJERO_LABEL[r.turno] || r.turno) + '</div>' +
      '</div>';
    html += '</div>';
    html += '<div style="border-bottom:2px solid ' + PEDIDO_DARK + '; margin-top:8px;"></div>';
    html += '<table style="width:100%; border-collapse:collapse; margin-top:10px; font-size:12px;"><tr>' +
      '<td style="padding:2px 0;"><strong>Cajero:</strong> ' + esc(r.cajero || "—") + '</td>' +
      '<td style="padding:2px 0; text-align:right;"><strong>Caja:</strong> ' + esc(r.caja || "—") + '</td></tr></table>';

    function seccion(titulo){
      return '<div style="background:' + PEDIDO_DARK + '; color:#fff; font-weight:700; font-size:11px; letter-spacing:.04em; padding:4px 10px; margin-top:10px;">' + titulo + '</div>';
    }
    html += seccion("BILLETES Y MONEDAS");
    var billRows = "";
    BILLETE_VALORES.forEach(function(b){
      var cant = num(r.billetes && r.billetes[b.key]);
      billRows += '<tr><td style="border:1px solid #ccc; padding:3px 6px;">' + cant + " x " + b.label + '</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(cant*b.valor) + '</td></tr>';
    });
    billRows += '<tr><td style="border:1px solid #ccc; padding:3px 6px;">Monedas</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(r.monedas) + '</td></tr>';
    if(num(r.dolarMonto) > 0){
      billRows += '<tr><td style="border:1px solid #ccc; padding:3px 6px;">Dólares (USD ' + fmtMoney(r.dolarMonto) + ' x ' + fmt(r.dolarTipoCambio) + ')</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(cajeroDolarConvertido(r)) + '</td></tr>';
    }
    html += '<table style="width:100%; border-collapse:collapse; font-size:11px; margin-top:2px;">' + billRows + '</table>';
    html += '<div style="text-align:right; font-weight:700; margin-top:4px;">Efectivo total: S/ ' + fmtMoney(cajeroEfectivo(r)) + '</div>';

    // Algunas cajas (ej. "Caja 2") nunca manejan depósitos ni gastos -- esas cajas siempre las
    // llevan otras (ej. Caja 1 y Caja 3). En vez de adivinar por el nombre de la caja, se decide
    // por si hay datos de verdad: si no hay ni Depósito A ni Depósito C, no se imprime esa
    // sección; si no hay ninguna línea de gasto cargada, tampoco se imprime "Gastos" -- así no
    // sale una sección vacía o en S/0 que solo confunda.
    var tieneDepositos = num(r.depositoA) > 0 || num(r.depositoC) > 0;
    var gastosConDatos = (r.gastos||[]).filter(function(g){ return (g.desc && g.desc.trim()) || num(g.monto) > 0; });

    if(tieneDepositos){
      html += seccion("DEPÓSITOS");
      html += '<table style="width:100%; border-collapse:collapse; font-size:11px; margin-top:2px;">' +
        '<tr><td style="border:1px solid #ccc; padding:3px 6px;">Depósito A</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(r.depositoA) + '</td></tr>' +
        '<tr><td style="border:1px solid #ccc; padding:3px 6px;">Depósito C</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(r.depositoC) + '</td></tr></table>';
    }

    if(gastosConDatos.length > 0){
      html += seccion("GASTOS");
      var gastoRows = gastosConDatos.map(function(g){
        return '<tr><td style="border:1px solid #ccc; padding:3px 6px;">' + esc(g.desc || "") + '</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(g.monto) + '</td></tr>';
      }).join("");
      html += '<table style="width:100%; border-collapse:collapse; font-size:11px; margin-top:2px;">' + gastoRows + '</table>';
      html += '<div style="text-align:right; font-weight:700; margin-top:4px;">Total gastos: S/ ' + fmtMoney(cajeroGastosTotal(r)) + '</div>';
    }

    html += '<div style="border-top:2px solid ' + PEDIDO_DARK + '; margin-top:10px; padding-top:6px; font-size:13px;">';
    html += '<div style="display:flex; justify-content:space-between; font-weight:800;"><span>TOTAL CALCULADO</span><span>S/ ' + fmtMoney(cajeroTotalCalculado(r)) + '</span></div>';
    if(diff !== null){
      html += '<div style="display:flex; justify-content:space-between; margin-top:2px;"><span>Total del sistema</span><span>S/ ' + fmtMoney(r.totalSistema) + '</span></div>';
      html += '<div style="display:flex; justify-content:space-between; margin-top:2px; font-weight:700; color:' + (Math.abs(diff) < 0.005 ? "#1a7a3c" : "#cc0000") + ';"><span>Diferencia</span><span>S/ ' + fmtMoney(diff) + '</span></div>';
    }
    html += '</div>';
    if(r.notas && r.notas.trim()){
      html += '<div style="margin-top:10px; font-size:11px; color:#555;"><strong>Notas:</strong> ' + esc(r.notas) + '</div>';
    }
    html += '</div>';
    return html;
  }

  function doPrintCajero(id){
    var r = (CAJACAJEROS || []).filter(function(x){ return x.id === id; })[0];
    if(!r) return;
    setPrintOrientation(false);
    var area = document.getElementById("printArea");
    area.innerHTML = buildCajeroPrintCardHTML(r);
    doWindowPrint("Caja " + (r.cajero || "") + " " + (r.fecha || ""));
  }

  function attachCajerosSync(){
    db.collection("cajaCajeros").onSnapshot(function(snap){
      var list = [];
      snap.forEach(function(doc){
        var data = doc.data();
        data.id = doc.id;
        list.push(data);
      });
      CAJACAJEROS = list;

  // ---------- wiring ----------
  function wireStatic(){
    document.getElementById("datePicker").value = currentDate;
    document.getElementById("datePicker").addEventListener("change", function(ev){
      if(!STATE) return;
      currentDate = ev.target.value || todayISO();
      renderAll();
    });
    document.getElementById("saveBtn").addEventListener("click", function(){ if(STATE) doSave(); });
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(!STATE) return;
        currentTab = btn.getAttribute("data-tab"); renderAll();
      });
    });
  }

  function attachRemoteSync(onFirstLoad){
    var ref = db.collection("arqueo").doc("state");
    var firstLoadDone = false;
    ref.onSnapshot(function(snap){
      if(!snap.exists){
        // Primera vez que se usa esta base de datos: la sembramos con los datos que
        // ya tenía la app (incluido lo migrado del Excel de setiembre).
        ref.set(readEmbeddedSeed()).catch(function(){});
        return;
      }
      var data = normalizeState(snap.data());
      if(data.meta && data.meta.lastSavedAt && data.meta.lastSavedAt === lastSavedBySelf){
        // Es el eco de nuestro propio guardado — ya lo tenemos aplicado.
        if(!firstLoadDone){ firstLoadDone = true; onFirstLoad(data); }
        return;
      }
      if(!firstLoadDone){
        firstLoadDone = true;
        onFirstLoad(data);
        return;
      }
      if(dirty || saving){
        // Llegó un cambio de otro dispositivo mientras acá había algo sin guardar todavía.
        // Ya NO se bloquea el guardado ni hace falta actualizar a mano: se combinan los
        // cambios de ese otro dispositivo con lo que se está editando acá mismo, campo por
        // campo, para que no se pierda ni lo de uno ni lo del otro.
        STATE = mergeStateForSave(data, STATE, baseline);
        renderAll();
        // OJO: "baseline" tiene que quedar con SOLO lo confirmado en la base de datos
        // (relleno para que tenga la misma forma que STATE), nunca con lo que se está
        // editando acá mismo todavía sin guardar -- si se guardara con eso mezclado, la
        // próxima comparación ya no reconocería esos cambios como "cambios pendientes"
        // y se quedarían sin guardar nunca.
        baseline = backfillAllDays(deepClone(data));
        showToast("Se combinaron cambios de otro dispositivo.");
        scheduleAutosave();
        return;
      }
      STATE = data;
      renderAll();
      baseline = deepClone(STATE);
    }, function(){
      readOnly = true;
      showBanner("bad", "No se pudo conectar con la base de datos. Revisa tu conexión a internet y recarga la página.", []);
      setSaveStatus();
    });
  }

  function attachPedidosSync(){
    db.collection("pedidos").onSnapshot(function(snap){
      var list = [];
      snap.forEach(function(doc){
        var data = doc.data();
        data.id = doc.id;
        list.push(data);
      });
      list.sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
      PEDIDOS = list;
      // No repintamos si está en "Nuevo pedido": así no se pierde lo que está escribiendo
      // si otra persona (ej. quien toma pedidos por WhatsApp) guarda algo al mismo tiempo.
      if(currentTab === "pedidos" && pedidosView !== "nuevo") renderPanel();
    }, function(){
      // Si falla, dejamos PEDIDOS como esté (puede seguir null) y avisamos solo si
      // el usuario está mirando esa pestaña.
      if(currentTab === "pedidos" && PEDIDOS === null){
        showToast("No se pudo cargar los pedidos. Revisa tu conexión e intenta de nuevo.");
      }
    });
  }

  function attachClientesSync(){
    db.collection("clientes").onSnapshot(function(snap){
      var map = {};
      snap.forEach(function(doc){ map[doc.id] = doc.data(); });

  // ---------- lock screen (contraseña compartida del equipo) ----------
  var APP_PASSWORD = "Carmelitas2026";
  function isUnlocked(){
    try{ return sessionStorage.getItem("arqueo_unlocked") === "1"; }catch(e){ return false; }
  }
  function setUnlocked(){
    try{ sessionStorage.setItem("arqueo_unlocked", "1"); }catch(e){}
  }
  function showLock(){
    document.getElementById("lockScreen").hidden = false;
    document.getElementById("appRoot").hidden = true;
    var input = document.getElementById("lockInput");
    setTimeout(function(){ input.focus(); }, 30);
  }
  function hideLock(){
    document.getElementById("lockScreen").hidden = true;
    document.getElementById("appRoot").hidden = false;
  }
  function wireLock(){
    var form = document.getElementById("lockForm");
    var input = document.getElementById("lockInput");
    var err = document.getElementById("lockError");
    var toggle = document.getElementById("lockToggle");
    toggle.addEventListener("click", function(){
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      toggle.textContent = show ? "Ocultar" : "Mostrar";
      input.focus();
    });
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      // Recorta espacios de más al principio/final: en el celular es fácil que el
      // teclado agregue un espacio sin que se note, sobre todo escribiendo a mano
      // (con copiar y pegar eso no pasa, por eso ahí sí entraba).
      var typed = input.value.replace(/^\s+|\s+$/g, "");
      if(typed === APP_PASSWORD){
        setUnlocked();
        hideLock();
        init();
      } else {
        err.hidden = false;
        input.value = "";
        input.focus();
      }
    });
  }

  function boot(){
    wireLock();
    if(isUnlocked()){ hideLock(); init(); }
    else { showLock(); }
  }

  if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", boot); }
  else { boot(); }
})();
