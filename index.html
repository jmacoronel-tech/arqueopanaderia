  // ---------- Panel de Despacho: UNA sola cola operativa, todos los canales ----------
  // Corrección de Jessica (set-2026): "no quiero separar la cola de trabajo por canal... todos
  // los pedidos deben aparecer en una sola cola operativa, sin importar si vienen de WhatsApp,
  // Tienda, Delivery, Recojo o Masivo. Lo que debe determinar el orden es la hora en que el
  // pedido debe estar listo." Por eso las pastillas de abajo YA NO separan por canal ni por
  // estado -- solo acotan por prioridad (para ahora / programados) o por si ya se cerraron.
  // Cada tarjeta sigue mostrando de dónde vino (pedidoCanalBadgeTxt) para no perder esa info.
  var DESPACHO_FILTROS = [
    ["todos", "📋 Todos"],
    ["ahora", "🔴 Para ahora"],
    ["programados", "🟡 Programados"],
    ["entregados", "✅ Entregados"],
    ["cancelados", "⚪ Cancelados"]
  ];
  // Hora en que debe estar listo, EN EL CONTEXTO DE HOY -- para Delivery/Recojo es exactamente
  // pedidoHoraAtencionMs (su única fecha ya es hoy, porque pasó el filtro de día operativo). Para
  // Masivo, pedidoHoraAtencionMs usa la fecha de la PRIMERA línea del pedido completo, que puede
  // no ser hoy aunque el pedido sí tenga una línea de hoy -- por eso acá se recalcula forzando la
  // fecha a HOY (misma hora p.hora, mismas reglas de traslado). No toca pedidoHoraAtencionMs ni
  // la lógica ya usada en vista previa/impresión/detalle -- es una variante solo para Despacho.
  function despachoHoraAtencionMs(p){
    if(p.canal !== "masivo") return pedidoHoraAtencionMs(p);
    if(p.hora){
      try{
        var ms = new Date(todayISO() + "T" + p.hora + ":00-05:00").getTime();
        if(!isNaN(ms)){
          if(pedidoRequiereReparto(p)) ms -= pedidoTrasladoMinutos() * 60000;
          return ms;
        }
      }catch(e){}
    }
    return p.createdAt || 0;
  }
  function despachoEsInmediato(p){
    return despachoHoraAtencionMs(p) <= Date.now();
  }
  function pedidosDespachoLista(filtro){
    // Filtro principal: solo pedidos del DÍA OPERATIVO de hoy entran a la cola de Despacho (ver
    // pedidoEsDelDiaOperativo). Adentro de eso, se ordena por la hora en que deben estar listos.
    var todos = (PEDIDOS || []).filter(function(p){ return !!p.estado && pedidoEsDelDiaOperativo(p); });
    var activos = todos.filter(function(p){ return p.estado !== "ENTREGADO" && p.estado !== "CANCELADO"; });
    if(filtro === "entregados"){
      return todos.filter(function(p){ return p.estado === "ENTREGADO"; })
        .sort(function(a, b){ return (b.entregadoEn||b.createdAt||0) - (a.entregadoEn||a.createdAt||0); });
    }
    if(filtro === "cancelados"){
      return todos.filter(function(p){ return p.estado === "CANCELADO"; })
        .sort(function(a, b){ return (b.createdAt||0) - (a.createdAt||0); });
    }
    var lista = activos;
    if(filtro === "ahora") lista = activos.filter(despachoEsInmediato);
    else if(filtro === "programados") lista = activos.filter(function(p){ return !despachoEsInmediato(p); });
    // Una sola cola, ordenada por la hora en que cada pedido debe estar listo (los que ya están
    // "para ahora" caen naturalmente arriba, porque su hora ya pasó) -- así se ve mezclado por
    // canal pero en el orden real en que hay que atenderlos. Los vencidos (atrasado) quedan
    // arriba porque su hora ya pasó y el orden es ascendente por esa misma hora.
    lista.sort(function(a, b){ return despachoHoraAtencionMs(a) - despachoHoraAtencionMs(b); });
    return lista;
  }
  function pedidoTranscurridoTxt(ms){
    if(!ms) return "";
    var mins = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if(mins < 60) return "hace " + mins + " min";
    var h = Math.floor(mins / 60), m = mins % 60;
    return "hace " + h + "h " + m + "min";
  }
  // Texto de la hora objetivo de una tarjeta: "Para ahora" (sin hora programada, o ya pasó su
  // hora) vs "Programado para las HH:MM" (todavía no llega su momento).
  function pedidoHoraTxt(p){
    var fecha = pedidoFechaAtencion(p);
    // Para Delivery/Masivo-Delivery con hora, la hora ESCRITA (p.hora) es la de entrega al
    // cliente -- la de "listo" real es la que ya trae restado el traslado (pedidoHoraAtencionMs).
    // Se muestran ambas para que el equipo sepa a qué hora debe estar listo Y a qué hora sale.
    var esReparto = pedidoRequiereReparto(p) && fecha && p.hora;
    var horaListoTxt = esReparto ? fmtHoraCortaMillis(pedidoHoraAtencionMs(p)) : p.hora;
    var horaEntregaTxt = esReparto ? fmtHoraCortaMillis(pedidoHoraEntregaMs(p)) : p.hora;
    if(pedidoEsInmediato(p)){
      if(!p.hora) return "Para ahora";
      return esReparto
        ? ("Debía estar listo a las " + horaListoTxt + " para salir y llegar a las " + horaEntregaTxt)
        : ("Debía estar listo a las " + p.hora);
    }
    var fechaTxt = (fecha && fecha !== todayISO()) ? (fecha + " ") : "";
    return esReparto
      ? ("Debe estar listo a las " + fechaTxt + horaListoTxt + " para salir y llegar a las " + horaEntregaTxt)
      : ("Programado para las " + fechaTxt + p.hora);
  }

  function buildDespachoPanel(){
    var wrap = document.createElement("div");
    wrap.className = "desp-panel";

    var head = document.createElement("div");
    head.className = "desp-head";
    var h2 = document.createElement("h2");
    h2.innerHTML = "<span class='desp-live-dot'></span>Despacho <span class='desp-hoy-pill'>HOY</span>";
    head.appendChild(h2);
    var sub = document.createElement("div");
    sub.className = "desp-sub";
    sub.textContent = fmtFechaLarga(todayISO()) + " · cola única de todos los canales";
    head.appendChild(sub);
    wrap.appendChild(head);

    // Filtros: se mantienen exactamente los mismos 5 grupos de siempre (Todos / Para ahora /
    // Programados / Entregados / Cancelados) -- solo se le agrega el contador a cada uno,
    // calculado con la misma pedidosDespachoLista() de siempre, sin ninguna regla nueva.
    var filterRow = document.createElement("div");
    filterRow.className = "desp-filtros";
    var COLOR_POR_FILTRO = { ahora:"rojo", programados:"morado", entregados:"verde" };
    DESPACHO_FILTROS.forEach(function(pair){
      var b = document.createElement("button");
      b.type = "button";
      var colorCls = COLOR_POR_FILTRO[pair[0]] || "";
      b.className = "desp-filtro" + (colorCls ? " " + colorCls : "") + (pedidosDespachoFilter === pair[0] ? " active" : "");
      var count = pedidosDespachoLista(pair[0]).length;
      var label = pair[1].replace(/^\S+\s*/, ""); // el texto sin el emoji de la etiqueta original
      b.innerHTML = "<span class='n'>" + count + "</span><span class='t'>" + esc(label) + "</span>";
      b.addEventListener("click", function(){ pedidosDespachoFilter = pair[0]; renderPanel(); });
      filterRow.appendChild(b);
    });
    wrap.appendChild(filterRow);

    var lista = pedidosDespachoLista(pedidosDespachoFilter);
    if(lista.length === 0){
      var empty = document.createElement("div");
      empty.className = "desp-empty";
      empty.textContent = "No hay pedidos en este grupo.";
      wrap.appendChild(empty);
      return wrap;
    }
    var grid = document.createElement("div");
    grid.className = "desp-list";
    lista.forEach(function(p){ grid.appendChild(buildDespachoCard(p)); });
    wrap.appendChild(grid);
    return wrap;
  }

  // Mapea el estado real del pedido (sin inventar ningún estado nuevo) a los 6 colores fijos
  // que Jessica pidió para identificar de un vistazo: Nuevo/Confirmado (ámbar), En preparación
  // (azul), Listo/Salió de tienda/En ruta (verde), Programado (morado, cuando todavía falta
  // para su hora), Atrasado (rojo, cuando ya pasó su hora y sigue sin estar listo) y Entregado
  // (gris). "Programado" y "Atrasado" no son valores de p.estado -- son la misma comparación de
  // hora que ya usan pedidoEsInmediato()/pedidosDespachoLista(), solo que aquí deciden el color.
  function despachoTagInfo(p){
    if(p.estado === "ENTREGADO"){
      return { cls:"entregado", label:"Entregado" + (p.entregadoEn ? " " + fmtHoraCortaMillis(p.entregadoEn) : "") };
    }
    if(p.estado === "CANCELADO"){
      return { cls:"entregado", label:"Cancelado" };
    }
    if(p.estado === "LISTO_DESPACHO" || p.estado === "SALIO_TIENDA" || p.estado === "EN_RUTA"){
      return { cls:"listo", label: PEDIDO_ESTADO_LABEL[p.estado] || "Listo" };
    }
    var inmediato = despachoEsInmediato(p);
    var atrasado = inmediato && !!p.hora;
    var minAtraso = atrasado ? Math.max(0, Math.round((Date.now() - despachoHoraAtencionMs(p)) / 60000)) : 0;
    // En preparación: si ya se empezó a preparar, ese es el dato que manda (se ve azul aunque su
    // hora todavía no llegue) -- salvo que ya se haya pasado la hora sin estar listo, ahí sí pesa
    // más el atraso. El resto (Nuevo/Confirmado, que todavía no se tocan) sí se organiza por
    // tiempo: atrasado si ya tocaba, programado si falta, nuevo si es "para ahora" sin hora fija.
    if(p.estado === "EN_PREPARACION"){
      if(atrasado) return { cls:"atrasado", label:"Atrasado " + minAtraso + " min" };
      return { cls:"enprep", label:"En preparación" };
    }
    if(atrasado) return { cls:"atrasado", label:"Atrasado " + minAtraso + " min" };
    if(!inmediato) return { cls:"programado", label:"Programado" };
    return { cls:"nuevo", label: PEDIDO_ESTADO_LABEL[p.estado] || "Nuevo pedido" };
  }
  var DESP_CHIP_COLOR = { nuevo:"c-ambar", enprep:"c-azul", listo:"c-verde", programado:"c-morado", atrasado:"c-rojo" };

  function buildDespachoCard(p){
    var esTerminal = (p.estado === "ENTREGADO" || p.estado === "CANCELADO");
    var tagInfo = despachoTagInfo(p);

    var card = document.createElement("div");
    card.className = "desp-card" + (esTerminal ? " terminal" : "");

    var rowTop = document.createElement("div");
    rowTop.className = "desp-row-top";
    var tag = document.createElement("span");
    tag.className = "desp-tag " + tagInfo.cls;
    tag.innerHTML = "<span class='dot'></span>" + esc(tagInfo.label);
    rowTop.appendChild(tag);
    if(!esTerminal){
      var listoChip = document.createElement("span");
      listoChip.className = "desp-listo-chip " + (DESP_CHIP_COLOR[tagInfo.cls] || "c-ambar");
      var horaListoTxt = p.hora ? fmtHoraCortaMillis(despachoHoraAtencionMs(p)) : "Ahora";
      listoChip.innerHTML = "🕐 LISTO " + esc(horaListoTxt);
      rowTop.appendChild(listoChip);
    }
    card.appendChild(rowTop);

    var cliente = document.createElement("div");
    cliente.className = "desp-cliente";
    cliente.textContent = (p.cliente && p.cliente.nombre) || "—";
    card.appendChild(cliente);

    var meta = document.createElement("div");
    meta.className = "desp-meta";
    var iconoEntrega = p.canal === "masivo" ? "📦" : (pedidoRequiereReparto(p) ? "🚚" : "🏪");
    meta.textContent = iconoEntrega + " " + pedidoCanalBadgeTxt(p);
    card.appendChild(meta);

    // Para Masivo, la tarjeta de Despacho solo debe mostrar las líneas de HOY (un pedido
    // Masivo puede tener 15-30 líneas repartidas en varias fechas) -- pedidoLineasDeHoy() ya
    // filtra por eso; para los demás canales devuelve p.items tal cual (una sola fecha).
    var itemsHoy = pedidoLineasDeHoy(p);
    var prodRow = document.createElement("div");
    prodRow.className = "desp-prod-row";
    var productosHtml = itemsHoy.map(function(it){ return esc(it.cantidad) + " × <b>" + esc(it.producto) + "</b>"; }).join(", ");
    // p.deliveryMonto de un Masivo es el flete de TODO el pedido (una vez por cada fecha
    // distinta que tenga, ver masivoDeliveryCount) -- acá solo cuenta el de hoy: una vez, con
    // la misma tarifa (p.masivoDeliveryRate), si hoy tiene alguna línea. No toca p.deliveryMonto
    // ni pedidoDeliveryTotal (eso sigue igual en el detalle, PDF, etc.).
    var deliveryHoy = p.canal === "masivo"
      ? (p.masivoModo === "delivery" && itemsHoy.length ? num(p.masivoDeliveryRate) : 0)
      : num(p.deliveryMonto);
    var total = itemsHoy.reduce(function(s, it){ return s + num(it.cantidad) * num(it.precio); }, 0) + deliveryHoy;
    prodRow.innerHTML = "<span>" + productosHtml + "</span><span class='desp-total'>S/ " + fmt(total) + "</span>";
    card.appendChild(prodRow);

    if(!esTerminal){
      var creado = document.createElement("div");
      creado.className = "desp-creado";
      creado.textContent = "Creado: " + fmtHoraCortaMillis(p.createdAt);
      card.appendChild(creado);
    }

    var actions = document.createElement("div");
    actions.className = "desp-actions";
    if(!esTerminal && !readOnly){
      var siguiente = pedidoProximoEstado(p);
      if(siguiente){
        var mainBtn = document.createElement("button");
        mainBtn.type = "button";
        mainBtn.className = "desp-btn desp-btn-primary";
        mainBtn.textContent = pedidoAccionLabel(p) || "Avanzar";
        mainBtn.addEventListener("click", function(){ pedidoAvanzarEstado(p.id, siguiente); });
        actions.appendChild(mainBtn);
      }
    }
    var detalleBtn = document.createElement("button");
    detalleBtn.type = "button";
    detalleBtn.className = "desp-btn desp-btn-outline";
    detalleBtn.textContent = "Ver detalle";
    detalleBtn.addEventListener("click", function(){ showPedidoDespachoDetalle(p); });
    actions.appendChild(detalleBtn);

    card.appendChild(actions);
    return card;
  }

  // ---------- Detalle de un pedido (desde el panel de Despacho, cualquier canal) ----------
  function closePedidoDespachoDetalle(){
    var ov = document.getElementById("despachoDetalleOverlay");
    if(ov) ov.remove();
    document.removeEventListener("keydown", despachoDetalleEscHandler);
  }
  function despachoDetalleEscHandler(ev){
    if(ev.key === "Escape") closePedidoDespachoDetalle();
  }
  function showPedidoDespachoDetalle(p){
    closePedidoDespachoDetalle();
    var overlay = document.createElement("div");
    overlay.className = "pedido-preview-overlay";
    overlay.id = "despachoDetalleOverlay";
    overlay.addEventListener("click", function(ev){ if(ev.target === overlay) closePedidoDespachoDetalle(); });

    var box = document.createElement("div");
    box.className = "pedido-preview-box";

    var head = document.createElement("div");
    head.className = "pedido-preview-head";
    var headText = document.createElement("div");
    headText.innerHTML = "<strong>Pedido #" + esc(p.numero || "—") + "</strong>";
    head.appendChild(headText);
    var closeBtn = document.createElement("button");
    closeBtn.type = "button";
    closeBtn.className = "pedido-preview-close";
    closeBtn.textContent = "✕";
    closeBtn.title = "Cerrar";
    closeBtn.addEventListener("click", closePedidoDespachoDetalle);
    head.appendChild(closeBtn);
    box.appendChild(head);

    var body = document.createElement("div");
    body.className = "pedido-preview-body";

    var nombre = (p.cliente && p.cliente.nombre) || "—";
    var docId = (p.cliente && (p.cliente.dni || p.cliente.ruc)) || "";
    var direccion = (p.cliente && p.cliente.direccion) || "—";
    var referencia = (p.cliente && p.cliente.referencia) || "";
    var telefono = (p.cliente && p.cliente.telefono) || "—";
    var correo = (p.cliente && p.cliente.correo) || "";
    var productosHtml = (p.items || []).map(function(it){
      return "<div>" + esc(it.cantidad) + "x " + esc(it.producto) + " — S/ " + fmt(num(it.precio)) + " c/u" + (it.obs ? " (" + esc(it.obs) + ")" : "") + "</div>";
    }).join("");
    var subtotal = (p.items || []).reduce(function(s, it){ return s + num(it.cantidad) * num(it.precio); }, 0);
    var total = subtotal + num(p.deliveryMonto);

    var esTerminalDetalle = (p.estado === "ENTREGADO" || p.estado === "CANCELADO");
    var prioridadDetalleTxt = esTerminalDetalle ? "" : ((pedidoEsInmediato(p) ? " · 🔴 " : " · 🟡 ") + esc(pedidoHoraTxt(p)));
    var html = "";
    html += "<div style='margin-bottom:.4rem;'>" + (PEDIDO_ESTADO_EMOJI[p.estado] || "") + " <strong>" + esc(PEDIDO_ESTADO_LABEL[p.estado] || p.estado) + "</strong>" + prioridadDetalleTxt + "</div>";
    html += "<div style='margin-bottom:.8rem;'>" + esc(pedidoCanalBadgeTxt(p)) + "</div>";
    html += "<div><strong>Cliente:</strong> " + esc(nombre) + (docId ? " · " + esc(docId) : "") + "</div>";
    html += "<div><strong>Teléfono:</strong> " + esc(telefono) + "</div>";
    html += "<div><strong>Dirección:</strong> " + esc(direccion) + (referencia ? " (" + esc(referencia) + ")" : "") + "</div>";
    if(correo) html += "<div><strong>Correo:</strong> " + esc(correo) + "</div>";
    html += "<div style='margin-top:.6rem;'><strong>Productos:</strong></div>" + productosHtml;
    html += "<div style='margin-top:.4rem;'>Subtotal: S/ " + fmt(subtotal) + " · Delivery: S/ " + fmt(num(p.deliveryMonto)) + " · <strong>Total: S/ " + fmt(total) + "</strong></div>";
    html += "<div style='margin-top:.4rem;'><strong>Pago:</strong> " + esc(p.tipoPago || "—") + " · " + (p.pagado ? "Pagado" : "Pendiente") + "</div>";
    if(p.notas) html += "<div style='margin-top:.4rem;'><strong>Observaciones:</strong> " + esc(p.notas) + "</div>";
    if(p.atendidoPor) html += "<div><strong>Tomado por:</strong> " + esc(p.atendidoPor) + "</div>";

    html += "<hr style='margin:.8rem 0;border:none;border-top:1px solid #e2ddd2;'>";
    html += "<div><strong>Hora de ingreso:</strong> " + esc(fmtFechaHoraMillis(p.createdAt)) + "</div>";
    if(p.horaListoEn) html += "<div><strong>Listo para despacho:</strong> " + esc(fmtFechaHoraMillis(p.horaListoEn)) + "</div>";
    if(p.horaSalidaEn) html += "<div><strong>Salió de tienda:</strong> " + esc(fmtFechaHoraMillis(p.horaSalidaEn)) + "</div>";
    if(p.entregadoEn) html += "<div><strong>Entregado:</strong> " + esc(fmtFechaHoraMillis(p.entregadoEn)) + (p.entregadoPor ? " — " + esc(p.entregadoPor) : "") + "</div>";
    if(p.tiempoPreparacionMin != null) html += "<div><strong>Tiempo de preparación:</strong> " + p.tiempoPreparacionMin + " min</div>";
    if(p.tiempoDeliveryMin != null) html += "<div><strong>Tiempo de delivery:</strong> " + p.tiempoDeliveryMin + " min</div>";
    if(p.tiempoTotalMin != null) html += "<div><strong>Tiempo total:</strong> " + p.tiempoTotalMin + " min</div>";

    if((p.estadoHistorial || []).length){
      html += "<div style='margin-top:.6rem;'><strong>Historial:</strong></div>";
      p.estadoHistorial.forEach(function(h){
        html += "<div class='hint'>" + esc(fmtFechaHoraMillis(h.en)) + " — " + esc(PEDIDO_ESTADO_LABEL[h.estado] || h.estado) + (h.por ? " (" + esc(h.por) + ")" : "") + "</div>";
      });
    }
    body.innerHTML = html;

    // Repartidor: campo editable aparte, no frena el botón de avance de un solo toque.
    var repartidorWrap = document.createElement("div");
    repartidorWrap.style.marginTop = ".8rem";
    repartidorWrap.innerHTML = "<strong>Repartidor:</strong>";
    var repartidorRow = document.createElement("div");
    repartidorRow.style.display = "flex";
    repartidorRow.style.gap = ".5rem";
    repartidorRow.style.marginTop = ".3rem";
    var repartidorInput = document.createElement("input");
    repartidorInput.type = "text";
    repartidorInput.value = p.repartidor || "";
    repartidorInput.placeholder = "Nombre del repartidor";
    repartidorInput.style.flex = "1";
    repartidorInput.style.padding = ".4rem .6rem";
    repartidorInput.style.border = "1px solid var(--border)";
    repartidorInput.style.borderRadius = "8px";
    repartidorRow.appendChild(repartidorInput);
    if(!readOnly){
      var repartidorBtn = document.createElement("button");
      repartidorBtn.type = "button";
      repartidorBtn.className = "btn btn-sm";
      repartidorBtn.textContent = "Guardar";
      repartidorBtn.addEventListener("click", function(){
        pedidoAsignarRepartidor(p.id, repartidorInput.value);
        p.repartidor = repartidorInput.value.trim();
      });
      repartidorRow.appendChild(repartidorBtn);
    }
    repartidorWrap.appendChild(repartidorRow);
    body.appendChild(repartidorWrap);

    // Corrección manual de estado -- por si el planchero desordenó las comandas y hay que
    // corregir el orden real de los pasos, sin depender del botón de "siguiente".
    if(!readOnly){
      var estadoWrap = document.createElement("div");
      estadoWrap.style.marginTop = ".8rem";
      estadoWrap.innerHTML = "<strong>Corregir estado manualmente:</strong>";
      var estadoRow = document.createElement("div");
      estadoRow.style.display = "flex";
      estadoRow.style.gap = ".5rem";
      estadoRow.style.marginTop = ".3rem";
      estadoRow.style.flexWrap = "wrap";
      var estadoSelect = document.createElement("select");
      estadoSelect.style.padding = ".4rem .6rem";
      estadoSelect.style.border = "1px solid var(--border)";
      estadoSelect.style.borderRadius = "8px";
      PEDIDO_ESTADOS.forEach(function(e){
        var opt = document.createElement("option");
        opt.value = e;
        opt.textContent = (PEDIDO_ESTADO_EMOJI[e] || "") + " " + PEDIDO_ESTADO_LABEL[e];
        if(e === p.estado) opt.selected = true;
        estadoSelect.appendChild(opt);
      });
      estadoRow.appendChild(estadoSelect);
      var estadoBtn = document.createElement("button");
      estadoBtn.type = "button";
      estadoBtn.className = "btn btn-sm";
      estadoBtn.textContent = "Aplicar";
      estadoBtn.addEventListener("click", function(){
        var nuevo = estadoSelect.value;
        if(nuevo === p.estado) return;
        if(!confirm('¿Corregir manualmente el estado a "' + (PEDIDO_ESTADO_LABEL[nuevo] || nuevo) + '"?')) return;
        pedidoAvanzarEstado(p.id, nuevo);
        closePedidoDespachoDetalle();
      });
      estadoRow.appendChild(estadoBtn);
      estadoWrap.appendChild(estadoRow);
      body.appendChild(estadoWrap);
    }

    // Cancelar: Jessica (set-2026) pidió sacar este botón de la tarjeta principal de Despacho
    // porque no es parte del flujo normal -- se deja únicamente acá, dentro de "Ver detalle",
    // para que siga disponible ante una excepción pero no compita con la acción de todos los
    // días. pedidoCancelarPedido() ya pide confirmación antes de cancelar (sin cambios ahí).
    if(!esTerminalDetalle && !readOnly){
      var cancelarWrap = document.createElement("div");
      cancelarWrap.style.marginTop = "1rem";
      cancelarWrap.style.paddingTop = ".8rem";
      cancelarWrap.style.borderTop = "1px solid var(--border)";
      var cancelarBtn = document.createElement("button");
      cancelarBtn.type = "button";
      cancelarBtn.className = "btn btn-sm";
      cancelarBtn.style.color = "var(--bad)";
      cancelarBtn.style.borderColor = "var(--bad)";
      cancelarBtn.textContent = "Cancelar pedido";
      cancelarBtn.addEventListener("click", function(){
        pedidoCancelarPedido(p.id);
        closePedidoDespachoDetalle();
      });
      cancelarWrap.appendChild(cancelarBtn);
      body.appendChild(cancelarWrap);
    }

    box.appendChild(body);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    document.addEventListener("keydown", despachoDetalleEscHandler);
  }

  // Pedidos que ya quedaron fuera de los PEDIDOS_LIMITE_RECIENTES más nuevos (y ya no están
  // sin pagar, si no seguirían apareciendo arriba): esta tarjeta busca por rango de fechas, de
  // una sola vez, sin cargar todo el historial. Los resultados salen en su propia tabla, más
  // simple (solo ver y generar PDF) -- para editar, anular o marcar como pagado un pedido tan
  // viejo, hay que abrirlo primero (aparece en la lista de arriba en cuanto se le hace algún
  // cambio, porque queda "pagado: false" o porque vuelve a estar entre los más recientes).
  function buildPedidosBusquedaAntiguaCard(){
    var card = document.createElement("div");
    card.className = "card";
    var h2 = document.createElement("h2");
    h2.style.margin = "0 0 .4rem";
    h2.textContent = "Buscar pedidos antiguos";
    card.appendChild(h2);
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "La lista de arriba solo carga los " + PEDIDOS_LIMITE_RECIENTES + " pedidos más recientes (y las deudas sin pagar, sin importar la antigüedad) -- así la app no se pone lenta aunque pase el tiempo y crezca el negocio. Para encontrar uno más viejo y ya pagado, busca aquí por la fecha en que se tomó el pedido.";
    card.appendChild(hint);

    var filterRow = document.createElement("div");
    filterRow.className = "field-grid";
    var desdeField = document.createElement("div");
    desdeField.className = "field";
    var desdeLabel = document.createElement("label");
    desdeLabel.textContent = "Desde";
    desdeField.appendChild(desdeLabel);
    var desdeInput = document.createElement("input");
    desdeInput.type = "date";
    desdeInput.value = pedidosBusquedaDesde;
    desdeInput.addEventListener("change", function(){ pedidosBusquedaDesde = desdeInput.value; });
    desdeField.appendChild(desdeInput);
    filterRow.appendChild(desdeField);

    var hastaField = document.createElement("div");
    hastaField.className = "field";
    var hastaLabel = document.createElement("label");
    hastaLabel.textContent = "Hasta";
    hastaField.appendChild(hastaLabel);
    var hastaInput = document.createElement("input");
    hastaInput.type = "date";
    hastaInput.value = pedidosBusquedaHasta;
    hastaInput.addEventListener("change", function(){ pedidosBusquedaHasta = hastaInput.value; });
    hastaField.appendChild(hastaInput);
    filterRow.appendChild(hastaField);
    card.appendChild(filterRow);

    var buscarBtn = document.createElement("button");
    buscarBtn.type = "button";
    buscarBtn.className = "btn btn-sm";
    buscarBtn.style.margin = ".6rem 0 1rem";
    buscarBtn.textContent = pedidosBusquedaCargando ? "Buscando…" : "Buscar";
    buscarBtn.disabled = pedidosBusquedaCargando;
    buscarBtn.addEventListener("click", doBuscarPedidosAntiguos);
    card.appendChild(buscarBtn);

    if(pedidosBusquedaError){
      var errEl = document.createElement("div");
      errEl.className = "hint";
      errEl.style.color = "var(--bad)";
      errEl.textContent = "No se pudo buscar. Revisa tu conexión e intenta de nuevo.";
      card.appendChild(errEl);
    } else if(pedidosBusquedaResultados !== null){
      if(pedidosBusquedaResultados.length === 0){
        var empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "No se encontraron pedidos tomados en ese rango de fechas.";
        card.appendChild(empty);
      } else {
        var tableWrap = document.createElement("div");
        tableWrap.className = "table-wrap";
        var table = document.createElement("table");
        table.className = "data-table";
        table.innerHTML = "<thead><tr><th>N°</th><th>Fecha(s)</th><th>Cliente</th><th>Canal</th><th>Productos</th><th>Total</th><th>Pagado</th><th></th><th></th></tr></thead><tbody></tbody>";
        var tbody = table.querySelector("tbody");
        pedidosBusquedaResultados.forEach(function(p){
          var tr = document.createElement("tr");
          if(p.anulado) tr.style.background = "#fdecea";
          var seen = {};
          var fechas = [];
          (p.items||[]).forEach(function(it){ if(it.fecha && !seen[it.fecha]){ seen[it.fecha] = true; fechas.push(it.fecha); } });
          fechas.sort();
          var fechaLabel = fechas.length <= 1 ? (fechas[0] || "—") : (fechas[0] + " → " + fechas[fechas.length-1]);
          var productosLabel = (p.items||[]).map(function(it){ return it.cantidad + "x " + it.producto; }).join(", ");
          var subtotal = (p.items||[]).reduce(function(s,it){ return s + num(it.cantidad)*num(it.precio); }, 0) + num(p.deliveryMonto);
          var canalLabel = CANAL_LABEL[p.canal] || p.canal;
          var clienteCell = esc((p.cliente && p.cliente.nombre) || "—");
          if(p.anulado){ clienteCell += ' <span class="chip bad" title="' + esc(p.motivoAnulacion || "Sin motivo registrado") + '">ANULADO</span>'; }
          tr.innerHTML =
            "<td>" + esc(p.numero || "—") + "</td>" +
            "<td>" + esc(fechaLabel) + "</td>" +
            "<td>" + clienteCell + "</td>" +
            "<td>" + esc(canalLabel) + "</td>" +
            "<td class='pedido-productos-cell'>" + esc(productosLabel) + "</td>" +
            "<td>S/ " + fmt(subtotal) + "</td>" +
            "<td>" + (p.pagado ? "Pagado" : "Pendiente") + "</td>" +
            "<td><button type='button' class='btn btn-sm pedido-busqueda-pdf' data-id='" + esc(p.id) + "'>Generar PDF</button></td>" +
            "<td><button type='button' class='btn btn-sm pedido-busqueda-preview' data-id='" + esc(p.id) + "'>Vista previa</button></td>";
          tbody.appendChild(tr);
        });
        tableWrap.appendChild(table);
        card.appendChild(tableWrap);
        tbody.querySelectorAll(".pedido-busqueda-pdf").forEach(function(btn){
          btn.addEventListener("click", function(){
            var id = btn.getAttribute("data-id");
            var p = pedidosBusquedaResultados.filter(function(x){ return x.id === id; })[0];
            if(p) doPrintPedidoObj(p);
          });
        });
        tbody.querySelectorAll(".pedido-busqueda-preview").forEach(function(btn){
          btn.addEventListener("click", function(){
            var id = btn.getAttribute("data-id");
            var p = pedidosBusquedaResultados.filter(function(x){ return x.id === id; })[0];
            if(p) showPedidoVistaPrevia(p);
          });
        });
      }
    }

    return card;
  }

  // ---------- Cuentas por Cobrar (pedidos a crédito, 7 o 15 días) ----------
  // Jessica: "en la sección de pedidos trabajamos con algunos clientes a crédito 7 y 15 días".
  // Esta vista junta solo los pedidos de clientes a crédito que todavía no están pagados, con
  // su fecha de vencimiento (fecha de entrega + días de crédito del cliente), para saber de un
  // vistazo a quién cobrarle y qué ya se pasó de la fecha.
  function diasHasta(iso){
    var hoy = new Date(todayISO() + "T12:00:00");
    var d = new Date(iso + "T12:00:00");
    return Math.round((d - hoy) / 86400000);
  }
  function buildCuentasPorCobrarView(){
    var wrap = document.createElement("div");
    var card = document.createElement("div");
    card.className = "card";
    var h2 = document.createElement("h2");
    h2.style.margin = "0 0 .4rem";
    h2.textContent = "Cuentas por Cobrar";
    card.appendChild(h2);
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Pedidos de clientes a crédito (7 o 15 días) que todavía no están marcados como pagados, ordenados por fecha de vencimiento — primero los más urgentes.";
    card.appendChild(hint);

    var pendientes = (PEDIDOS || []).filter(function(p){
      return !p.pagado && !p.anulado && num(p.cliente && p.cliente.diasCredito) > 0;
    }).map(function(p){
      var venc = pedidoVencimiento(p);
      var total = (p.items||[]).reduce(function(s,it){ return s + num(it.cantidad)*num(it.precio); }, 0) + num(p.deliveryMonto);
      return { p: p, venc: venc, total: total, dias: venc ? diasHasta(venc) : null };
    });
    pendientes.sort(function(a, b){
      if(a.venc === b.venc) return 0;
      if(!a.venc) return 1;
      if(!b.venc) return -1;
      return a.venc < b.venc ? -1 : 1;
    });

    if(pendientes.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No hay pedidos a crédito pendientes de cobro.";
      card.appendChild(empty);
      wrap.appendChild(card);
      return wrap;
    }

    var totalDeuda = pendientes.reduce(function(s, r){ return s + r.total; }, 0);
    var totalVencido = pendientes.filter(function(r){ return r.dias !== null && r.dias < 0; }).reduce(function(s, r){ return s + r.total; }, 0);
    var resumen = document.createElement("div");
    resumen.style.margin = "0 0 1rem";
    resumen.style.fontSize = "0.95rem";
    resumen.innerHTML = "Total por cobrar: <strong>S/ " + fmt(totalDeuda) + "</strong>" +
      (totalVencido > 0 ? ' &nbsp;·&nbsp; <span style="color:#B34428; font-weight:700;">Vencido: S/ ' + fmt(totalVencido) + "</span>" : "");
    card.appendChild(resumen);

    var tableWrap = document.createElement("div");
    tableWrap.className = "table-wrap";
    var table = document.createElement("table");
    table.className = "data-table";
    table.innerHTML = "<thead><tr><th>Cliente</th><th>Teléfono</th><th>Fecha entrega</th><th>Días crédito</th><th>Vencimiento</th><th>Estado</th><th>Total</th><th></th></tr></thead><tbody></tbody>";
    var tbody = table.querySelector("tbody");
    pendientes.forEach(function(r){
      var p = r.p;
      var tr = document.createElement("tr");
      var estadoHtml;
      if(r.dias === null){ estadoHtml = '<span class="chip">Sin fecha de entrega</span>'; }
      else if(r.dias < 0){ estadoHtml = '<span class="chip bad">Vencido hace ' + Math.abs(r.dias) + (Math.abs(r.dias) === 1 ? " día" : " días") + '</span>'; }
      else if(r.dias <= 2){ estadoHtml = '<span class="chip" style="background:#fff3cd; color:#8a6300;">Vence en ' + r.dias + (r.dias === 1 ? " día" : " días") + '</span>'; }
      else { estadoHtml = '<span class="chip good">Vence en ' + r.dias + " días</span>"; }
      tr.innerHTML =
        "<td>" + esc((p.cliente && p.cliente.nombre) || "—") + "</td>" +
        "<td>" + esc((p.cliente && p.cliente.telefono) || "—") + "</td>" +
        "<td>" + esc(fmtFechaCorta(pedidoFechaBase(p))) + "</td>" +
        "<td style='text-align:center;'>" + num(p.cliente && p.cliente.diasCredito) + "</td>" +
        "<td>" + esc(r.venc ? fmtFechaCorta(r.venc) : "—") + "</td>" +
        "<td>" + estadoHtml + "</td>" +
        "<td>S/ " + fmt(r.total) + "</td>" +
        "<td><button type='button' class='btn btn-sm cobrar-editar' data-id='" + p.id + "'>Ver / Editar</button></td>";
      tbody.appendChild(tr);
    });
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    wrap.appendChild(card);

    tbody.querySelectorAll(".cobrar-editar").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-id");
        var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
        if(p) startEditPedido(p);
      });
    });

    return wrap;
  }

  // ---------- Caja Cajeros (control de caja que llena cada cajero, mañana y tarde) ----------
  // Reemplaza la hoja de papel "HOJA RESUMEN AM" que llenaba a mano el cajero: anota los
  // billetes/monedas, los depósitos y los gastos, y la app suma sola -- así se evita el error
  // de suma a mano. El "Total del sistema" lo llena Jessica después, cuando lo descarga del
  // sistema de ventas, para comparar contra lo que reportó el cajero y detectar diferencias
  // (si falta o sobra dinero). Vive en su propia colección de Firestore ("cajaCajeros"),
  // separada de "arqueo/state" y de "pedidos", por la misma razón que los pedidos.
  var BILLETE_VALORES = [
    { key:"b200", label:"Billetes de 200", valor:200 },
    { key:"b100", label:"Billetes de 100", valor:100 },
    { key:"b50", label:"Billetes de 50", valor:50 },
    { key:"b20", label:"Billetes de 20", valor:20 },
    { key:"b10", label:"Billetes de 10", valor:10 }
  ];
  var TURNO_CAJERO_LABEL = { manana:"Mañana", tarde:"Tarde" };
  // Denominaciones de billetes de dólar que se manejan normalmente (100, 50, 20, 10, 5, 1).
  var DOLAR_DENOMINACIONES = [100, 50, 20, 10, 5, 1];

  function newCajeroDraft(){
    return {
      fecha: currentDate,
      turno: "manana",
      cajero: "",
      caja: "CR1",
      billetes: { b200:0, b100:0, b50:0, b20:0, b10:0 },
      monedas: 0,
      dolarTipoCambio: 0,
      // Cada billete de dólar se anota por separado con su serie (el número impreso en el
      // billete), para poder identificar de cuál billete se trata si hace falta -- no se
      // mezcla con los soles, solo se convierte para saber el total en soles.
      dolares: [ { serie:"", monto:0 } ],
      // Dinero que el cliente transfirió directo al banco (se factura y por eso aparece en el
      // Total del sistema). El cajero nunca lo tiene físicamente en la caja, pero sí se suma al
      // Total calculado (ver cajeroTotalCalculado) para poder comparar contra el Total del
      // sistema y ver si cuadra.
      transferencias: 0,
      gastos: [ { desc:"", monto:0 } ],
      totalSistema: null,
      notas: ""
    };
  }

  // Estas funciones de cálculo trabajan igual con un borrador (mientras se llena el
  // formulario) que con un reporte ya guardado (documento de Firestore) -- misma forma.
  function cajeroBilletesTotal(r){
    var t = 0;
    BILLETE_VALORES.forEach(function(b){ t += num(r.billetes && r.billetes[b.key]) * b.valor; });
    return t;
  }
  // Devuelve la lista de billetes de dólar de un reporte -- si es un reporte guardado ANTES de
  // este cambio (que solo tenía un monto único "dolarMonto", sin lista de series), lo convierte
  // a la nueva forma (un billete sin serie) para que no se pierda ni un sol de lo ya guardado.
  function cajeroDolaresList(r){
    if(r.dolares && r.dolares.length) return r.dolares;
    if(num(r.dolarMonto) > 0) return [ { serie:"", monto: num(r.dolarMonto) } ];
    return [];
  }
  function cajeroDolaresTotalUSD(r){
    return cajeroDolaresList(r).reduce(function(s, d){ return s + num(d.monto); }, 0);
  }
  function cajeroDolarConvertido(r){
    return cajeroDolaresTotalUSD(r) * num(r.dolarTipoCambio);
  }
  // Efectivo que entró en soles de verdad (billetes + monedas), sin contar lo que vino en
  // dólares -- separado de cajeroEfectivo() porque Jessica necesita mostrar esta parte sola
  // (para diferenciar cuánto entró en soles y cuánto entró convertido de dólares).
  function cajeroEfectivoSoles(r){
    return cajeroBilletesTotal(r) + num(r.monedas);
  }
  function cajeroEfectivo(r){
    return cajeroEfectivoSoles(r) + cajeroDolarConvertido(r);
  }
  function cajeroGastosTotal(r){
    return (r.gastos || []).reduce(function(s, g){ return s + num(g.monto); }, 0);
  }
  // Compatibilidad con reportes guardados ANTES de este cambio, cuando este dinero se anotaba
  // como "Depósito A" / "Depósito C" -- para que no se pierda lo ya guardado al verlos o editarlos.
  function cajeroTransferenciasTotal(r){
    if(r.transferencias !== undefined && r.transferencias !== null) return num(r.transferencias);
    return num(r.depositoA) + num(r.depositoC);
  }
  // La transferencia bancaria SÍ se suma aquí: el cliente le transfiere directo al banco, se
  // factura esa venta y por eso aparece en el Total del sistema -- aunque esa plata nunca pasó
  // físicamente por la caja, hay que sumarla al total calculado para poder compararlo contra el
  // Total del sistema y ver si cuadra (si no se suma, siempre va a "faltar" exactamente el monto
  // de la transferencia, aunque en realidad esté todo correcto).
  function cajeroTotalCalculado(r){
    return cajeroEfectivo(r) + cajeroGastosTotal(r) + cajeroTransferenciasTotal(r);
  }
  // Diferencia = lo que reportó el cajero MENOS lo que dice el sistema -- así, si el cajero
  // cuenta más de lo que el sistema esperaba, la diferencia sale positiva ("sobra"), y si
  // cuenta menos, sale negativa ("falta"). (Antes estaba al revés: restaba calculado al
  // sistema, y por eso un sobrante de plata salía marcado como "falta" -- Jessica lo detectó
  // con un caso real: cajero reportó S/1553, sistema S/1500, y eso es plata de más, no falta).
  function cajeroDiferencia(r){
    if(r.totalSistema === null || r.totalSistema === undefined) return null;
    return cajeroTotalCalculado(r) - num(r.totalSistema);
  }

  // Lista de nombres de cajero ya usados, sin duplicados -- se arma sola a partir de los
  // reportes ya guardados en "cajaCajeros" (no hay que mantenerla a mano en ningún lado). Se
  // usa tanto para el desplegable de "Nombre del cajero" al crear/editar un reporte como para
  // los botones de filtro del Historial, así los dos lugares siempre muestran exactamente los
  // mismos nombres. La comparación es sin distinguir mayúsculas/minúsculas para que "EVA" y
  // "eva" cuenten como el mismo nombre (se queda con la primera forma en que se vio guardada);
  // esto es justo lo que Jessica pidió evitar -- que la misma cajera aparezca varias veces con
  // el nombre escrito distinto.
  function getCajeroNombresConocidos(){
    var vistos = {};
    var lista = [];
    (CAJACAJEROS || []).forEach(function(r){
      var n = (r.cajero || "").trim();
      if(!n) return;
      var key = n.toLowerCase();
      if(!vistos[key]){ vistos[key] = true; lista.push(n); }
    });
    lista.sort(function(a, b){ return a.localeCompare(b, "es"); });
    return lista;
  }

  // Todos los nombres de cajero EXACTAMENTE como están guardados (sin fusionar nada), con
  // cuántos reportes tiene cada uno -- a diferencia de getCajeroNombresConocidos, esta versión
  // no une mayúsculas/minúsculas porque la usa la herramienta de corrección de más abajo, que
  // necesita ver cada variante suelta tal cual está en Firestore para poder corregirla.
  function getCajeroNombresCrudos(){
    var conteo = {};
    (CAJACAJEROS || []).forEach(function(r){
      var n = (r.cajero || "").trim();
      if(!n) return;
      conteo[n] = (conteo[n] || 0) + 1;
    });
    return Object.keys(conteo).map(function(n){ return { nombre: n, cantidad: conteo[n] }; })
      .sort(function(a, b){ return a.nombre.localeCompare(b.nombre, "es"); });
  }
  // Mayúsculas y sin tildes, para comparar nombres sin que "Ñuñoa"/"NUNOA" o "José"/"JOSE"
  // cuenten como distintos.
  function normNombreCajero(s){
    return (s || "").toString().trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  }
  // Sugiere a cuál de los CAJERO_NOMBRES_REALES corresponde una variante ya guardada -- por
  // coincidencia exacta (sin mayúsculas/tildes) o porque la variante es solo el primer nombre
  // (ej. "eva" -> "Eva Tarazona", "keynner" -> "Keynner Luján"). Si no hay una sugerencia clara
  // devuelve "" y Jessica elige a mano cuál es -- nunca se adivina con poca certeza.
  function sugerirNombreReal(variante){
    var nv = normNombreCajero(variante);
    if(!nv) return "";
    var exacto = CAJERO_NOMBRES_REALES.filter(function(n){ return normNombreCajero(n) === nv; })[0];
    if(exacto) return exacto;
    var porPrimerNombre = CAJERO_NOMBRES_REALES.filter(function(n){
      return normNombreCajero(n).split(" ")[0] === nv;
    })[0];
    return porPrimerNombre || "";
  }
  // Tarjeta "Corregir nombres de cajero" del Historial: lista las variantes guardadas que NO
  // calzan exacto con ninguno de los 5 nombres reales del equipo, y deja elegir a cuál
  // corresponde cada una antes de aplicar. Devuelve null (no se dibuja nada) cuando ya no
  // queda ninguna variante por corregir -- así la tarjeta desaparece sola una vez que todo
  // está corregido, en vez de quedar ahí para siempre.
  function buildCajeroCorreccionCard(){
    var crudos = getCajeroNombresCrudos();
    var pendientes = crudos.filter(function(c){ return CAJERO_NOMBRES_REALES.indexOf(c.nombre) === -1; });
    if(pendientes.length === 0) return null;

    pendientes.forEach(function(c){
      if(!(c.nombre in cajeroCorreccionSeleccion)) cajeroCorreccionSeleccion[c.nombre] = sugerirNombreReal(c.nombre);
    });

    var card = document.createElement("div");
    card.className = "card";
    card.style.border = "1px solid #e0a458";
    card.style.background = "#fff8e1";
    card.style.marginBottom = "1rem";
    var h2 = document.createElement("h2");
    h2.style.margin = "0 0 .3rem";
    h2.textContent = "Corregir nombres de cajero";
    card.appendChild(h2);
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.style.margin = "0 0 .8rem";
    hint.textContent = "Estos nombres guardados no calzan exacto con tu equipo (" + CAJERO_NOMBRES_REALES.join(", ") + "). Elige a cuál corresponde cada uno y aplica -- se corrige el nombre en los reportes ya guardados, sin borrar ningún dato.";
    card.appendChild(hint);

    var rows = document.createElement("div");
    rows.style.display = "flex";
    rows.style.flexDirection = "column";
    rows.style.gap = ".6rem";
    pendientes.forEach(function(c){
      var row = document.createElement("div");
      row.style.display = "flex";
      row.style.alignItems = "center";
      row.style.gap = ".6rem";
      row.style.flexWrap = "wrap";
      var label = document.createElement("div");
      label.innerHTML = '<strong>"' + esc(c.nombre) + '"</strong> <span style="color:var(--ink-muted); font-size:.82rem;">(' + c.cantidad + " reporte" + (c.cantidad === 1 ? "" : "s") + ")</span>";
      label.style.minWidth = "220px";
      row.appendChild(label);
      var select = document.createElement("select");
      select.className = "cajero-correccion-select";
      select.setAttribute("data-raw", c.nombre);
      select.style.maxWidth = "260px";
      var optNone = document.createElement("option");
      optNone.value = "";
      optNone.textContent = "-- Dejar como está --";
      select.appendChild(optNone);
      CAJERO_NOMBRES_REALES.forEach(function(n){
        var opt = document.createElement("option");
        opt.value = n;
        opt.textContent = "→ " + n;
        if(cajeroCorreccionSeleccion[c.nombre] === n) opt.selected = true;
        select.appendChild(opt);
      });
      select.addEventListener("change", function(){ cajeroCorreccionSeleccion[c.nombre] = select.value; });
      row.appendChild(select);
      rows.appendChild(row);
    });
    card.appendChild(rows);

    var applyBtn = document.createElement("button");
    applyBtn.type = "button";
    applyBtn.className = "btn btn-primary cajero-correccion-aplicar";
    applyBtn.style.marginTop = ".9rem";
    applyBtn.textContent = cajeroCorrigiendo ? "Corrigiendo…" : "Aplicar correcciones";
    applyBtn.disabled = cajeroCorrigiendo;
    applyBtn.addEventListener("click", function(){ doAplicarCorreccionCajeros(pendientes); });
    card.appendChild(applyBtn);

    return card;
  }
  function doAplicarCorreccionCajeros(pendientes){
    if(!db || cajeroCorrigiendo) return;
    var cambios = pendientes.filter(function(c){ return cajeroCorreccionSeleccion[c.nombre]; });
    if(cambios.length === 0){ showToast("Elige a qué nombre corregir al menos uno."); return; }
    var resumen = cambios.map(function(c){
      return '"' + c.nombre + '" -> "' + cajeroCorreccionSeleccion[c.nombre] + '" (' + c.cantidad + " reporte" + (c.cantidad === 1 ? "" : "s") + ")";
    }).join("\n");
    if(!confirm("Se va a corregir el nombre en estos reportes ya guardados (no se borra nada):\n\n" + resumen + "\n\n¿Confirmas?")) return;
    cajeroCorrigiendo = true;
    renderPanel();
    var tareas = [];
    cambios.forEach(function(c){
      var destino = cajeroCorreccionSeleccion[c.nombre];
      (CAJACAJEROS || []).forEach(function(r){
        if((r.cajero || "").trim() === c.nombre){
          tareas.push(db.collection("cajaCajeros").doc(r.id).update({ cajero: destino }));
        }
      });
    });
    Promise.all(tareas).then(function(){
      cambios.forEach(function(c){ delete cajeroCorreccionSeleccion[c.nombre]; });
      cajeroCorrigiendo = false;
      showToast("Nombres corregidos.");
      renderPanel();
    }).catch(function(){
      cajeroCorrigiendo = false;
      showToast("Algo falló corrigiendo los nombres. Intenta de nuevo.");
      renderPanel();
    });
  }

  // Pantalla de clave de Caja Cajeros -- se muestra en vez de todo el contenido de la pestaña
  // mientras no se haya ingresado una clave válida. Cada cajera tiene su propia clave (ver
  // CAJERO_CLAVES); al escribirla, queda identificada y solo ve/edita su propio historial. La
  // clave de administradora (Jessica) sigue viendo y editando todo. Se vuelve a pedir cada vez
  // que se sale de la pestaña -- no queda guardado entre visitas.
  function buildCajerosLock(){
    var card = document.createElement("div");
    card.className = "card cajero-form-card";
    var h2 = document.createElement("h2");
    h2.style.margin = "0 0 .4rem";
    h2.textContent = "Caja Cajeros";
    card.appendChild(h2);
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.style.margin = "0 0 1rem";
    hint.textContent = "Esta sección maneja el dinero de caja -- ingresa tu clave personal para entrar.";
    card.appendChild(hint);

    var form = document.createElement("form");
    form.style.maxWidth = "320px";
    var field = document.createElement("div");
    field.className = "field";
    var label = document.createElement("label");
    label.textContent = "Tu clave";
    field.appendChild(label);
    var input = document.createElement("input");
    input.type = "password";
    input.autocomplete = "off";
    input.autocapitalize = "off";
    input.autocorrect = "off";
    input.spellcheck = false;
    field.appendChild(input);
    form.appendChild(field);

    if(cajerosLockError){
      var err = document.createElement("div");
      err.className = "lock-error";
      err.style.margin = ".6rem 0 0";
      err.textContent = "Clave incorrecta. Intenta de nuevo.";
      form.appendChild(err);
    }

    var submitBtn = document.createElement("button");
    submitBtn.type = "submit";
    submitBtn.className = "btn btn-primary";
    submitBtn.style.marginTop = ".8rem";
    submitBtn.textContent = "Entrar";
    form.appendChild(submitBtn);

    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      var typed = input.value.replace(/^\s+|\s+$/g, "");
      if(!typed){ cajerosLockError = true; renderPanel(); return; }
      if(typed === CAJEROS_PASS_ADMIN){
        cajeroLogueado = "ADMIN";
        // El filtro de cajero del Historial se reinicia a "todos" en cada inicio de sesión --
        // así la administradora nunca hereda por accidente el filtro que dejó puesto una
        // cajera en la sesión anterior (que quedaba fijo en su propio nombre).
        cajerosFiltroCajero = "todos";
        cajerosLockError = false;
        renderPanel();
        return;
      }
      var nombreEncontrado = Object.keys(CAJERO_CLAVES).filter(function(n){ return CAJERO_CLAVES[n] === typed; })[0];
      if(nombreEncontrado){
        cajeroLogueado = nombreEncontrado;
        cajerosFiltroCajero = "todos";
        cajerosLockError = false;
        renderPanel();
      } else {
        cajerosLockError = true;
        renderPanel();
      }
    });
    card.appendChild(form);
    setTimeout(function(){ input.focus(); }, 30);
    return card;
  }

  function buildCajerosPanel(){
    var wrap = document.createElement("div");
    if(!cajeroLogueado){
      wrap.appendChild(buildCajerosLock());
      return wrap;
    }
    var esAdminCajeros = cajeroLogueado === "ADMIN";
    var idBar = document.createElement("div");
    idBar.style.cssText = "display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; margin-bottom:.8rem; font-size:.85rem; color:var(--ink-muted);";
    var idLabel = document.createElement("span");
    idLabel.innerHTML = esAdminCajeros ? "Sesión: <strong>Administradora</strong> (ves todo)" : ("Sesión: <strong>" + esc(cajeroLogueado) + "</strong> (solo ves lo tuyo)");
    idBar.appendChild(idLabel);
    var logoutBtn = document.createElement("button");
    logoutBtn.type = "button";
    logoutBtn.className = "btn btn-sm";
    logoutBtn.textContent = "Cerrar sesión";
    logoutBtn.addEventListener("click", function(){ cajeroLogueado = null; cajerosLockError = false; renderPanel(); });
    idBar.appendChild(logoutBtn);
    wrap.appendChild(idBar);

    var viewToggle = document.createElement("div");
    viewToggle.className = "shift-toggle";
    viewToggle.style.marginBottom = "1rem";
    [["nuevo","Nuevo reporte"], ["historial","Historial"]].forEach(function(pair){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "shift-btn" + (cajerosView === pair[0] ? " active" : "");
      b.textContent = pair[1];
      b.addEventListener("click", function(){ cajerosView = pair[0]; renderPanel(); });
      viewToggle.appendChild(b);
    });
    wrap.appendChild(viewToggle);

    if(CAJACAJEROS === null){
      if(cajerosSyncError){
        var errorBox = document.createElement("div");
        errorBox.className = "empty-state";
        errorBox.innerHTML = "No se pudo conectar con el historial de caja de cajeros.<br>Revisa tu conexión a internet, o que las reglas de Firestore tengan el permiso de <code>cajaCajeros</code>, y prueba de nuevo.";
        wrap.appendChild(errorBox);
        var retryBtn = document.createElement("button");
        retryBtn.type = "button";
        retryBtn.className = "btn btn-sm";
        retryBtn.style.display = "block";
        retryBtn.style.margin = "0 auto";
        retryBtn.textContent = "Reintentar";
        retryBtn.addEventListener("click", function(){ attachCajerosSync(); renderPanel(); });
        wrap.appendChild(retryBtn);
      } else {
        var loading = document.createElement("div");
        loading.className = "empty-state";
        loading.textContent = "Cargando reportes de caja…";
        wrap.appendChild(loading);
      }
      return wrap;
    }

    if(cajerosView === "historial"){ wrap.appendChild(buildCajerosHistorial()); }
    else { wrap.appendChild(buildCajeroForm()); }
    return wrap;
  }

  // Campo "Nombre del cajero": desplegable con los nombres ya usados (ver
  // getCajeroNombresConocidos) más una opción "+ Nuevo cajero…" que revela una casilla de
  // texto. Al escribir un nombre nuevo, si ya existe uno igual (sin distinguir mayúsculas) se
  // usa la ortografía ya guardada en vez de crear una variante -- así se evita exactamente el
  // problema que reportó Jessica ("EVA" / "eva" / "Eva Tarazona" como si fueran personas
  // distintas). El cambio entre desplegable y casilla de texto se hace tocando el DOM
  // directamente (mostrar/ocultar), sin volver a dibujar todo el formulario -- así nunca se
  // pierde el foco ni se corre el riesgo de que un clic en "Guardar" se pierda a mitad de un
  // renderPanel().
  function buildCajeroNombreField(draft){
    var field = document.createElement("div");
    field.className = "field full";
    var label = document.createElement("label");
    label.textContent = "Nombre del cajero";
    field.appendChild(label);

    // Si no entró la administradora, el reporte queda fijo a nombre de quien entró -- no se
    // deja elegir otro nombre, para que cada cajera solo pueda guardar reportes propios.
    if(cajeroLogueado !== "ADMIN"){
      draft.cajero = cajeroLogueado;
      var fixed = document.createElement("div");
      fixed.style.cssText = "padding:.55rem .8rem; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); font-weight:700;";
      fixed.textContent = cajeroLogueado;
      field.appendChild(fixed);
      var hintFixed = document.createElement("div");
      hintFixed.className = "hint";
      hintFixed.textContent = "Entraste como " + cajeroLogueado + ", así que este reporte queda a tu nombre.";
      field.appendChild(hintFixed);
      return field;
    }

    var conocidos = getCajeroNombresConocidos();
    var actual = (draft.cajero || "").trim();
    var matchExacto = conocidos.some(function(n){ return n === actual; });
    // Empieza en modo "escribir" solo si todavía no hay ningún nombre guardado (primera vez
    // que se usa Caja Cajeros) o si el valor actual no calza con ninguno conocido -- en
    // cualquier otro caso, se ve el desplegable de una vez.
    var modoNuevo = conocidos.length === 0 || (!!actual && !matchExacto);

    var select = document.createElement("select");
    select.className = "cajero-nombre-select";
    select.style.display = modoNuevo ? "none" : "";
    var optPlaceholder = document.createElement("option");
    optPlaceholder.value = "";
    optPlaceholder.textContent = "Elige un cajero…";
    select.appendChild(optPlaceholder);
    conocidos.forEach(function(n){
      var opt = document.createElement("option");
      opt.value = n;
      opt.textContent = n;
      if(n === actual) opt.selected = true;
      select.appendChild(opt);
    });
    var optNuevo = document.createElement("option");
    optNuevo.value = "__nuevo__";
    optNuevo.textContent = "+ Nuevo cajero…";
    select.appendChild(optNuevo);
    if(readOnly) select.disabled = true;

    var nuevoInput = document.createElement("input");
    nuevoInput.type = "text";
    nuevoInput.className = "cajero-nombre-nuevo-input";
    nuevoInput.placeholder = "Escribe el nombre completo (ej. Eva Tarazona)…";
    nuevoInput.style.marginTop = ".4rem";
    nuevoInput.style.display = modoNuevo ? "" : "none";
    nuevoInput.value = modoNuevo ? actual : "";
    if(readOnly) nuevoInput.disabled = true;

    select.addEventListener("change", function(){
      if(select.value === "__nuevo__"){
        select.style.display = "none";
        nuevoInput.style.display = "";
        nuevoInput.value = "";
        draft.cajero = "";
        if(!readOnly) nuevoInput.focus();
      } else {
        draft.cajero = select.value;
      }
    });
    nuevoInput.addEventListener("input", function(){ draft.cajero = nuevoInput.value; });
    // Al salir de la casilla (blur), si lo escrito ya existe con otra ortografía, se corrige
    // solo a la versión ya guardada -- sin volver a dibujar el formulario entero (para no
    // arriesgar perder un clic en "Guardar" que haya disparado este mismo blur).
    nuevoInput.addEventListener("blur", function(){
      var typed = nuevoInput.value.trim();
      draft.cajero = typed;
      if(!typed) return;
      var existente = conocidos.filter(function(n){ return n.toLowerCase() === typed.toLowerCase(); })[0];
      if(existente && existente !== typed){
        draft.cajero = existente;
        nuevoInput.value = existente;
        showToast('Ya existe como "' + existente + '" — se usó ese nombre para no duplicarlo.');
      }
    });

    field.appendChild(select);
    field.appendChild(nuevoInput);
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Elige un nombre ya guardado, o \"+ Nuevo cajero\" si es la primera vez que se anota.";
    field.appendChild(hint);
    return field;
  }

  function saveCajero(){
    var draft = cajeroDraft;
    if(!draft || readOnly || !db) return;
    if(!draft.cajero || !draft.cajero.trim()){ showToast("Falta el nombre del cajero."); return; }
    if(!draft.fecha){ showToast("Falta la fecha."); return; }
    if(cajerosSaving) return;
    cajerosSaving = true;
    renderPanel();
    var payload = {
      fecha: draft.fecha,
      turno: draft.turno,
      cajero: draft.cajero.trim(),
      caja: (draft.caja || "").trim(),
      billetes: {
        b200: num(draft.billetes.b200), b100: num(draft.billetes.b100), b50: num(draft.billetes.b50),
        b20: num(draft.billetes.b20), b10: num(draft.billetes.b10)
      },
      monedas: num(draft.monedas),
      dolarTipoCambio: num(draft.dolarTipoCambio),
      dolares: (draft.dolares || []).filter(function(d){ return (d.serie && d.serie.trim()) || num(d.monto) > 0; }).map(function(d){
        return { serie: (d.serie || "").trim(), monto: num(d.monto) };
      }),
      transferencias: num(draft.transferencias),
      gastos: (draft.gastos || []).filter(function(g){ return (g.desc && g.desc.trim()) || num(g.monto) > 0; }).map(function(g){
        return { desc: (g.desc || "").trim(), monto: num(g.monto) };
      }),
      totalSistema: numOrNull(draft.totalSistema),
      notas: draft.notas || "",
      updatedAt: Date.now()
    };
    var promise;
    if(cajeroEditingId){
      promise = db.collection("cajaCajeros").doc(cajeroEditingId).update(payload);
    } else {
      payload.createdAt = Date.now();
      promise = db.collection("cajaCajeros").add(payload);
    }
    promise.then(function(){
      cajerosSaving = false;
      cajeroEditingId = null;
      cajeroDraft = null;
      cajerosView = "historial";
      showToast("Reporte de caja guardado.");
      renderPanel();
    }).catch(function(){
      cajerosSaving = false;
      showToast("No se pudo guardar. Revisa tu conexión e intenta de nuevo.");
      renderPanel();
    });
  }

  function startEditCajero(r){
    // Si no entró la administradora, no deja abrir para editar un reporte que no sea de quien
    // entró -- de todas formas el historial ya le oculta esas filas, esto es un refuerzo extra.
    if(cajeroLogueado !== "ADMIN" && (r.cajero || "").trim().toLowerCase() !== (cajeroLogueado || "").trim().toLowerCase()) return;
    cajeroDraft = {
      fecha: r.fecha || currentDate,
      turno: r.turno || "manana",
      cajero: r.cajero || "",
      caja: r.caja || "",
      billetes: {
        b200: num(r.billetes && r.billetes.b200), b100: num(r.billetes && r.billetes.b100),
        b50: num(r.billetes && r.billetes.b50), b20: num(r.billetes && r.billetes.b20), b10: num(r.billetes && r.billetes.b10)
      },
      monedas: num(r.monedas),
      dolarTipoCambio: num(r.dolarTipoCambio),
      dolares: cajeroDolaresList(r).length ? cajeroDolaresList(r).map(function(d){ return { serie: d.serie||"", monto: num(d.monto) }; }) : [ { serie:"", monto:0 } ],
      transferencias: cajeroTransferenciasTotal(r),
      gastos: (r.gastos && r.gastos.length) ? r.gastos.map(function(g){ return { desc: g.desc||"", monto: num(g.monto) }; }) : [ { desc:"", monto:0 } ],
      totalSistema: numOrNull(r.totalSistema),
      notas: r.notas || ""
    };
    cajeroEditingId = r.id;
    cajerosView = "nuevo";
    renderPanel();
  }

        var fb = document.createElement("button");

    var filtrados = (CAJACAJEROS || []).filter(function(r){
      if(cajerosFiltroDesde && r.fecha < cajerosFiltroDesde) return false;

      // Sin distinguir mayúsculas/minúsculas -- así elegir "Eva Tarazona" en el filtro también

    function diffCellHtml(diff){

      tbody.appendChild(tr);
    });

  }

  function doExportCajeros(rows){
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    try{
      var ordenados = rows.slice().sort(function(a,b){ return (a.fecha||"").localeCompare(b.fecha||""); });

      // Hoja 1: un resumen por reporte de turno/cajero -- sin el texto largo de gastos (eso
      // va aparte, en su propia hoja, para que se pueda sumar/filtrar bien en Excel). El
      // efectivo se separa en soles y dólares convertidos, tal como lo pidió Jessica.
      var aoa = [[
        "Fecha","Turno","Cajero","Caja","Billetes 200","Billetes 100","Billetes 50","Billetes 20","Billetes 10",
        "Monedas","Efectivo en soles","Tipo de cambio","Dólares (USD)","Convertido de dólares","Efectivo total",
        "Transferencias bancarias","Total gastos","Total calculado","Total sistema",
        "Diferencia","Notas"
      ]];
      ordenados.forEach(function(r){
        var diff = cajeroDiferencia(r);
        aoa.push([
          r.fecha || "", TURNO_CAJERO_LABEL[r.turno] || r.turno || "", r.cajero || "", r.caja || "",
          num(r.billetes && r.billetes.b200), num(r.billetes && r.billetes.b100), num(r.billetes && r.billetes.b50),
          num(r.billetes && r.billetes.b20), num(r.billetes && r.billetes.b10),
          round2(num(r.monedas)), round2(cajeroEfectivoSoles(r)),
          num(r.dolarTipoCambio), round2(cajeroDolaresTotalUSD(r)), round2(cajeroDolarConvertido(r)), round2(cajeroEfectivo(r)),
          round2(cajeroTransferenciasTotal(r)), round2(cajeroGastosTotal(r)),
          round2(cajeroTotalCalculado(r)), (r.totalSistema === null || r.totalSistema === undefined) ? "" : round2(num(r.totalSistema)),
          diff === null ? "" : round2(diff), r.notas || ""
        ]);
      });

      // Hoja 2: el detalle de gastos, una fila por cada línea de gasto de cada reporte --
      // así se puede sumar/filtrar por descripción (harina, movilidad, gas, etc.) en Excel.
      var aoaGastos = [["Fecha","Turno","Cajero","Caja","Descripción","Monto"]];
      ordenados.forEach(function(r){
        (r.gastos||[]).forEach(function(g){
          aoaGastos.push([
            r.fecha || "", TURNO_CAJERO_LABEL[r.turno] || r.turno || "", r.cajero || "", r.caja || "",
            g.desc || "", round2(num(g.monto))
          ]);
        });
      });

      // Hoja 3: el detalle de billetes de dólar, uno por fila con su serie -- para poder
      // identificar de cuál billete se trata si hace falta, sin mezclarlo con los soles.
      var aoaDolares = [["Fecha","Turno","Cajero","Caja","Serie","Monto USD"]];
      ordenados.forEach(function(r){
        cajeroDolaresList(r).forEach(function(d){
          if(num(d.monto) <= 0 && !d.serie) return;
          aoaDolares.push([
            r.fecha || "", TURNO_CAJERO_LABEL[r.turno] || r.turno || "", r.cajero || "", r.caja || "",
            d.serie || "", round2(num(d.monto))
          ]);
        });
      });

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Caja Cajeros");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaGastos), "Detalle de Gastos");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaDolares), "Detalle de Dólares");
      XLSX.writeFile(wb, "caja-cajeros-historial.xlsx");
      showToast("Reporte descargado.");
    }catch(err){
      showToast("No se pudo generar el archivo. Intenta de nuevo.");
    }
  }

    var dolaresList = cajeroDolaresList(r).filter(function(d){ return num(d.monto) > 0 || (d.serie && d.serie.trim()); });
    if(dolaresList.length > 0){

    html += '<div style="border-top:2px solid ' + PEDIDO_DARK + '; margin-top:10px; padding-top:6px; font-size:13px;">';
    html += '<div style="display:flex; justify-content:space-between; font-weight:800;"><span>TOTAL CALCULADO</span><span>S/ ' + fmtMoney(cajeroTotalCalculado(r)) + '</span></div>';
    if(diff !== null){
      html += '<div style="display:flex; justify-content:space-between; margin-top:2px;"><span>Total del sistema</span><span>S/ ' + fmtMoney(r.totalSistema) + '</span></div>';
      html += '<div style="display:flex; justify-content:space-between; margin-top:2px; font-weight:700; color:' + (Math.abs(diff) < 0.005 ? "#1a7a3c" : "#cc0000") + ';"><span>Diferencia</span><span>S/ ' + fmtMoney(diff) + '</span></div>';

    html += '</div>';
    return html;
