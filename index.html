  var toastTimer = null;
  // Guarda el resumen de la última importación de ventas por turno, para poder mostrarlo de
  // forma permanente en el panel (el toast desaparece solo a los pocos segundos y no alcanza
  // a leerse un mensaje largo como el de la resta mañana/tarde).
  var lastImportSummary = { am:null, pm:null };
  function showToast(msg, ms){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, ms || 3200);
  }

  function markDirty(){ dirty = true; editGen++; setSaveStatus(); }
  function setSaveStatus(){
    var el = document.getElementById("saveStatus");
    var btn = document.getElementById("saveBtn");
    if(readOnly){ el.textContent = "No se pudo guardar — revisa tu conexión"; el.className = "save-status bad"; btn.disabled = true; return; }
    btn.disabled = saving;
    if(saving){ el.textContent = "Guardando…"; el.className = "save-status"; return; }
    if(dirty){ el.textContent = "Cambios sin guardar"; el.className = "save-status warn"; return; }
    if(STATE.meta.lastSavedAt){
      var mins = Math.round((Date.now() - STATE.meta.lastSavedAt)/60000);
      el.textContent = mins < 1 ? "Guardado justo ahora" : "Guardado hace " + mins + " min";
    } else { el.textContent = "Sin cambios"; }
    el.className = "save-status";
  }

  function scheduleAutosave(){ clearTimeout(saveTimer); saveTimer = setTimeout(function(){ doSave(); }, 1500); }

  function deepClone(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); }

  // ---------- combinar cambios al guardar (para que dos dispositivos editando productos
  // distintos -- o hasta el mismo día -- al mismo tiempo no se pisen entre sí) ----------
  // "freshRemote": lo último que hay en Firestore justo antes de guardar.
  // "local": STATE tal como está en ESTE dispositivo ahora mismo.
  // "base": la última versión que este dispositivo sabe que coincidía con Firestore.
  // Se compara local contra base para saber exactamente qué se editó acá, y esos cambios
  // puntuales se aplican encima de freshRemote (que puede traer cosas nuevas de otro
  // dispositivo que acá todavía no se habían visto).
  function mergeFlatMap(mergedParent, key, localMap, baseMap){
    var remoteMap = mergedParent[key] || {};
    var out = Object.assign({}, remoteMap);
    Object.keys(localMap).forEach(function(k){
      if(localMap[k] !== baseMap[k]){ out[k] = localMap[k]; }
    });
    Object.keys(baseMap).forEach(function(k){
      if(!(k in localMap) && remoteMap[k] === baseMap[k]){ delete out[k]; }
    });
    mergedParent[key] = out;
  }
  function mergeSection(mergedSec, localSec, baseSec){
    ["am","pm"].forEach(function(shift){
      var localArr = (localSec && localSec[shift]) || [];
      var baseArr = (baseSec && baseSec[shift]) || [];
      if(!mergedSec[shift]) mergedSec[shift] = [];
      var fields = shift === "am" ? ["a","i1","i2","i3","m","f","vc"] : ["i1","i2","i3","m","f","vc"];
      for(var i = 0; i < localArr.length; i++){
        var localRow = localArr[i];
        var baseRow = baseArr[i];
        if(!mergedSec[shift][i]){ mergedSec[shift][i] = deepClone(localRow); continue; }
        fields.forEach(function(f){
          var baseVal = baseRow ? baseRow[f] : undefined;
          if(localRow[f] !== baseVal){ mergedSec[shift][i][f] = localRow[f]; }
        });
      }
    });
    mergeFlatMap(mergedSec, "agAm", (localSec && localSec.agAm) || {}, (baseSec && baseSec.agAm) || {});
    mergeFlatMap(mergedSec, "agPm", (localSec && localSec.agPm) || {}, (baseSec && baseSec.agPm) || {});
  }
  // Igual que mergeSection, pero para las filas de Metas (una fila por producto, con un
  // valor por subcolumna -- p.ej. jugos/batidos/frozen en Frutas -- en vez de a/i1/i2/i3/m/f/vc).
  function mergeMetasSection(mergedSec, localSec, baseSec, cat){
    var fields = cat.subcols.map(function(sc){ return sc.key; });
    ["am","pm"].forEach(function(shift){
      var localArr = (localSec && localSec[shift]) || [];
      var baseArr = (baseSec && baseSec[shift]) || [];
      if(!mergedSec[shift]) mergedSec[shift] = [];
      for(var i = 0; i < localArr.length; i++){
        var localRow = localArr[i];
        var baseRow = baseArr[i];
        if(!mergedSec[shift][i]){ mergedSec[shift][i] = deepClone(localRow); continue; }
        fields.forEach(function(f){
          var baseVal = baseRow ? baseRow[f] : undefined;
          if(localRow[f] !== baseVal){ mergedSec[shift][i][f] = localRow[f]; }
        });
      }
    });
  }
  // Movimientos (lista de salidas de Otros: producto + cantidad + nota, ver buildMovimientosPanel)
  // es una LISTA, no columnas fijas por posición -- así que se combina distinto a mergeSection:
  // cada entrada tiene su propio "id" que nunca cambia, y solo se agrega o se borra entera (nunca
  // se edita a la mitad). Dos dispositivos agregando entradas distintas al mismo tiempo se quedan
  // con las dos; si uno borra una entrada que el otro no tocó, se borra igual.
  function mergeMovimientosSection(mergedSec, localSec, baseSec){
    ["am","pm"].forEach(function(shift){
      var localArr = (localSec && localSec[shift]) || [];
      var baseArr = (baseSec && baseSec[shift]) || [];
      var remoteArr = mergedSec[shift] || [];
      var remoteMap = {}; remoteArr.forEach(function(e){ remoteMap[e.id] = e; });
      var baseMap = {}; baseArr.forEach(function(e){ baseMap[e.id] = e; });
      var out = Object.assign({}, remoteMap);
      localArr.forEach(function(e){
        if(!baseMap[e.id] || JSON.stringify(baseMap[e.id]) !== JSON.stringify(e)){ out[e.id] = e; }
      });
      Object.keys(baseMap).forEach(function(id){
        var stillLocal = localArr.some(function(e){ return e.id === id; });
        if(!stillLocal && remoteMap[id] && JSON.stringify(remoteMap[id]) === JSON.stringify(baseMap[id])){
          delete out[id];
        }
      });
      mergedSec[shift] = Object.keys(out).map(function(id){ return out[id]; })
        .sort(function(a, b){ return (a.hora || "").localeCompare(b.hora || "") || String(a.id).localeCompare(String(b.id)); });
    });
  }
  function mergeDay(mergedDay, localDay, baseDay){
    var turnoFields = ["respAM","respPM","eAM","sAM","ePM","sPM","obsAM","obsPM","notas"];
    if(!mergedDay.turno) mergedDay.turno = {};
    turnoFields.forEach(function(f){
      var baseVal = baseDay && baseDay.turno ? baseDay.turno[f] : undefined;
      var localVal = localDay.turno ? localDay.turno[f] : undefined;
      if(localVal !== undefined && localVal !== baseVal){ mergedDay.turno[f] = localVal; }
    });
    ["p","b","e","t","o"].forEach(function(key){
      if(!localDay[key]) return;
      if(!mergedDay[key]) mergedDay[key] = { am:[], pm:[], agAm:{}, agPm:{} };
      mergeSection(mergedDay[key], localDay[key], baseDay ? baseDay[key] : null);
    });
    if(localDay.movimientos){
      if(!mergedDay.movimientos) mergedDay.movimientos = { am:[], pm:[] };
      mergeMovimientosSection(mergedDay.movimientos, localDay.movimientos, baseDay ? baseDay.movimientos : null);
    }
    METAS_CATEGORIAS.forEach(function(cat){
      if(!localDay.metas || !localDay.metas[cat.key]) return;
      if(!mergedDay.metas) mergedDay.metas = {};
      if(!mergedDay.metas[cat.key]) mergedDay.metas[cat.key] = { am:[], pm:[] };
      mergeMetasSection(mergedDay.metas[cat.key], localDay.metas[cat.key], (baseDay && baseDay.metas) ? baseDay.metas[cat.key] : null, cat);
    });
  }
  // Metas de venta por día de la semana (STATE.metasObjetivos): igual patrón que mergeFlatMap,
  // comparando valor por valor (semana/categoría/turno/subcolumna) para que dos dispositivos
  // editando metas de días distintos de la semana no se pisen entre sí.
  function mergeMetasObjetivos(merged, local, base){
    if(!merged.metasObjetivos) merged.metasObjetivos = {};
    var localObj = local.metasObjetivos || {};
    var baseObj = base.metasObjetivos || {};
    METAS_WEEKDAY_KEYS.forEach(function(wk){
      if(!localObj[wk]) return;
      if(!merged.metasObjetivos[wk]) merged.metasObjetivos[wk] = metasObjetivoDefaultFor(wk);
      METAS_CATEGORIAS.forEach(function(cat){
        if(!cat.conMeta) return;
        var localCat = localObj[wk][cat.key];
        if(!localCat) return;
        var baseCat = (baseObj[wk] && baseObj[wk][cat.key]) || null;
        if(!merged.metasObjetivos[wk][cat.key]) merged.metasObjetivos[wk][cat.key] = { am:[], pm:[] };
        ["am","pm"].forEach(function(shift){
          var localArr = localCat[shift] || [];
          var baseArr = (baseCat && baseCat[shift]) || [];
          if(!merged.metasObjetivos[wk][cat.key][shift]) merged.metasObjetivos[wk][cat.key][shift] = localArr.slice();
          var out = merged.metasObjetivos[wk][cat.key][shift];
          for(var i = 0; i < localArr.length; i++){
            if(localArr[i] !== baseArr[i]){ out[i] = localArr[i]; }
          }
        });
      });
    });
  }
  function mergeStateForSave(freshRemote, local, base){
    var merged = deepClone(freshRemote);
    if(!merged.meta) merged.meta = { businessName:"", lastSavedAt:null, schema:2 };
    var baseBiz = base && base.meta ? base.meta.businessName : undefined;
    if(local.meta && local.meta.businessName !== baseBiz){ merged.meta.businessName = local.meta.businessName; }
    mergeFlatMap(merged, "precios", local.precios || {}, (base && base.precios) || {});
    mergeMetasObjetivos(merged, local, base || {});
    var baseCatalog = (base && base.customCatalog) || [];
    if(JSON.stringify(local.customCatalog || []) !== JSON.stringify(baseCatalog)){
      merged.customCatalog = deepClone(local.customCatalog || []);
    }
    if(!merged.days) merged.days = {};
    Object.keys(local.days || {}).forEach(function(date){
      var localDay = local.days[date];
      var baseDay = (base && base.days && base.days[date]) || null;
      if(!merged.days[date]){ merged.days[date] = deepClone(localDay); return; }
      mergeDay(merged.days[date], localDay, baseDay);
    });
    return merged;
  }
  // Rellena TODOS los días de un STATE suelto (uno que todavía no es el STATE en uso)
  // con el mismo relleno que backfillDay ya hace normalmente -- para poder usarlo como
  // "baseline" (punto de comparación) sin que le falten filas que STATE sí tiene, lo
  // cual haría que la próxima comparación piense que todo cambió acá y pise por encima
  // lo de otro dispositivo por error.
  function backfillAllDays(state){
    Object.keys(state.days || {}).forEach(function(date){
      backfillDay(state.days[date], date);
    });
    return state;
  }

  function doSave(){
    if(readOnly || saving || !db || !dirty) { setSaveStatus(); return; }
    clearTimeout(saveTimer);
    saving = true;
    setSaveStatus();
    stashBackup();
    var genAtStart = editGen;
    var localSnapshot = deepClone(STATE);
    var baseSnapshot = deepClone(baseline) || {};
    var ref = db.collection("arqueo").doc("state");
    var remoteChangedElsewhere = false;
    // Se usa una TRANSACCIÓN de Firestore (no un simple get()+set()) porque dos
    // dispositivos pueden estar guardando casi al mismo instante: sin transacción,
    // el segundo guardado podía leer la base de datos ANTES de que el primero
    // terminara de escribir, calcular su combinación con esa foto vieja, y luego
    // pisar por completo el guardado del primero. La transacción hace que Firestore
    // detecte ese choque y reintente automáticamente con el dato más reciente, así
    // que ningún guardado de otro dispositivo se puede perder de esta forma.
    db.runTransaction(function(transaction){
      return transaction.get(ref).then(function(snap){
        var freshRemote = normalizeState(snap.exists ? snap.data() : {});
        remoteChangedElsewhere = JSON.stringify(freshRemote) !== JSON.stringify(baseSnapshot);
        var merged = mergeStateForSave(freshRemote, localSnapshot, baseSnapshot);
        merged.meta.lastSavedAt = Date.now();
        lastSavedBySelf = merged.meta.lastSavedAt;
        transaction.set(ref, merged);
        return merged;
      });
    }).then(function(merged){
      saving = false;
      var stateBeforeMerge = STATE;
      baseline = deepClone(merged);
      if(editGen === genAtStart){
        STATE = merged;
        dirty = false;
      } else {
        // Se siguió editando acá mismo mientras esto se guardaba. OJO: STATE no queda
        // igual a "merged" automáticamente -- "merged" puede traer cambios de OTRO
        // dispositivo que este equipo todavía no tiene aplicados en pantalla. Por eso
        // se recombina "merged" (ya confirmado por el servidor) con lo que este equipo
        // tenía justo antes de este guardado, para no perder ni lo de este dispositivo
        // ni lo que otro dispositivo ya guardó mientras tanto.
        STATE = mergeStateForSave(merged, stateBeforeMerge, localSnapshot);
        dirty = true;
        scheduleAutosave();
      }
      clearBackup();
      // Se guardó bien: se acaba cualquier reintento pendiente y se quita el aviso grande
      // de "no se pudo guardar" si estaba puesto.
      saveRetryCount = 0;
      clearTimeout(saveRetryTimer);
      hideBanner("savefail");
      setSaveStatus();
      if(remoteChangedElsewhere) renderAll();
      // Si mientras esta transacción estaba en camino llegó (y quedó en cola) una
      // actualización de otro dispositivo, hay que revisar si de verdad es MÁS NUEVA que
      // lo que este guardado acaba de confirmar -- la transacción ya leyó lo más fresco
      // de la base al momento de escribir, así que cualquier cosa en cola de ANTES de eso
      // ya quedó superada por "merged" y aplicarla a ciegas borraría este guardado que
      // recién se confirmó. Solo se aplica si su lastSavedAt es posterior al de "merged"
      // (o sea, un guardado de otro dispositivo que sí llegó DESPUÉS del nuestro).
      if(pendingRemoteSnapshot){
        var pendingIsNewer = pendingRemoteSnapshot.meta && merged.meta &&
          pendingRemoteSnapshot.meta.lastSavedAt && merged.meta.lastSavedAt &&
          pendingRemoteSnapshot.meta.lastSavedAt > merged.meta.lastSavedAt;
        if(pendingIsNewer){ flushPendingRemoteSnapshot(); }
        else { pendingRemoteSnapshot = null; }
      }
    }).catch(function(err){
      saving = false;
      setSaveStatus();
      handleSaveError(err);
      // Acá sí se aplica tal cual: este guardado no se confirmó, así que no hay "merged"
      // propio más fresco contra el cual comparar -- lo que haya en cola sigue siendo la
      // mejor información que se tiene de la base de datos.
      flushPendingRemoteSnapshot();
    });
  }

  // Si mientras esta transacción estaba en camino llegó una actualización de otro
  // dispositivo (guardada en pendingRemoteSnapshot por attachRemoteSync porque saving
  // estaba en true), se procesa recién ahora -- con STATE/baseline ya en su estado final
  // de este guardado, para no chocar con lo que doSave() acaba de escribir.
  function flushPendingRemoteSnapshot(){
    if(!pendingRemoteSnapshot) return;
    var data = pendingRemoteSnapshot;
    pendingRemoteSnapshot = null;
    applyRemoteSnapshot(data);
  }

  function handleSaveError(err){
    var code = err && err.code;
    clearTimeout(saveRetryTimer);
    if(code === "permission-denied"){
      // Reintentar no sirve de nada acá -- es un problema de permisos, no de conexión --
      // así que no se programa un reintento automático, solo se avisa.
      showBanner("bad", "No se pudo guardar: sin permiso de escritura en la base de datos. Avísale al dueño del arqueo.", []);
      setSaveStatus();
      return;
    }
    saveRetryCount++;
    // Espera creciente entre reintentos (3s, 6s, 9s... hasta un máximo de 20s) para no
    // insistir sin parar si la conexión sigue caída -- pero SIN dejar de reintentar nunca
    // mientras queden cambios sin guardar (dirty se queda en true todo este tiempo, así que
    // los datos en memoria no se pierden -- lo único en riesgo es que alguien cierre o
    // recargue la página antes de que se logre guardar, por eso el aviso de abajo se queda
    // fijo en pantalla y no desaparece solo).
    var espera = Math.min(3000 * saveRetryCount, 20000);
    showBanner("savefail",
      "No se pudieron guardar tus últimos cambios (revisa tu conexión a internet). Reintentando automáticamente… (intento " + saveRetryCount + ") — NO cierres ni recargues esta página todavía.",
      [{ label:"Reintentar ahora", action:function(){
          clearTimeout(saveRetryTimer);
          if(dirty && !saving) doSave();
        }}]);
    saveRetryTimer = setTimeout(function(){
      if(dirty && !saving) doSave();
    }, espera);
  }

  // ---------- import (reporte de ventas del sistema) ----------
  // Nombres que el sistema exporta distinto al catálogo del arqueo (mismo producto,
  // solo cambia la forma de escribirlo: abreviaturas, singular/plural, una letra de más o menos).
  var IMPORT_ALIASES = {
    "MANT LAIVE 180 GR": "Mantequilla Laive 180g",
    "MANT LAIVE 90 GR": "Mantequilla Laive 90g",
    "CROISANT DE MANJAR": "Croissant De Manjar",
    "OREJAS": "Oreja",
    "MASA MADRE CON FRUTOS ENTERO": "Masa Madre con Frutos",
    "ACEITUNA ENTERA POR KILO": "Aceituna",
    "ACEITUNA ENTERA X KG": "Aceituna",
    "CIABATTA POR KILO": "Ciabatta",
    "LECHE LIGTH CAJA LT - SEMI": "Leche Light Caja LT - Semi",
    "MIEL FRASCO 200 GR": "Miel Frasco 200g",
    "MIEL FRASCO 250 GR": "Miel Frasco 250g",
    "MIEL FRASCO 500 GR": "Miel Frasco 500g",
    "QUESO MOZARELLA": "Queso Mozzarella",
    "TOSTADA AL AJO X 0 130G": "Tostada Ciabatta al Ajo",
    "TOSTADAS MASA MADRE X 0 120GR": "Tostada Masa Madre"
  };
  // Triples: el sistema de ventas registra cada sabor de dos formas — "UND T. X" (unidad suelta)
  // y "TIRA DE X" (la tira entera sin cortar, que son 3 unidades). Como el arqueo se lleva en
  // unidades, cada línea "TIRA DE X" del reporte cuenta triple (mult:3) y se suma a la misma fila
  // que "UND T. X" (mult:1). Pavo y Glaseado Piña no aparecieron en los reportes que revisamos —
  // están puestos siguiendo el mismo patrón, pero avísame si no calzan cuando los vendan.
  var TRIPLE_IMPORT_MAP = {
    "UND T CLASICO": { name: "Triples Clásicos", mult: 1 },
    "TIRA DE CLASICOS": { name: "Triples Clásicos", mult: 3 },
    "UND T ACEITUNA": { name: "Triple de Aceituna", mult: 1 },
    "TIRA DE ACEITUNA": { name: "Triple de Aceituna", mult: 3 },
    "UND T ASADO": { name: "Triple de Asado", mult: 1 },
    "TIRA DE ASADO": { name: "Triple de Asado", mult: 3 },
    "UND T POLLO DURAZNO": { name: "Triple de Pollo Durazno", mult: 1 },
    "TIRA DE POLLO DURAZNO": { name: "Triple de Pollo Durazno", mult: 3 },
    "UND T PAVO": { name: "Triple de Pavo", mult: 1 },
    "TIRA DE PAVO": { name: "Triple de Pavo", mult: 3 },
    "UND T GLASEADO PINA": { name: "Triple Glaseado Piña", mult: 1 },
    "TIRA DE GLASEADO PINA": { name: "Triple Glaseado Piña", mult: 3 },
    "UND T CHAMPINON Y TOCINO": { name: "Triple Champiñón y Tocino", mult: 1 },
    "TIRA DE CHAMPINON Y TOCINO": { name: "Triple Champiñón y Tocino", mult: 3 },
    "UND T POLLO CON JAMON Y QUESO": { name: "Triple Pollo Jamón y Queso", mult: 1 },
    "TIRA DE POLLO CON JAMON Y QUESO": { name: "Triple Pollo Jamón y Queso", mult: 3 }
  };
  // Mismo patrón que TRIPLE_IMPORT_MAP de arriba (nombre del reporte -> nombre real del
  // catálogo + multiplicador), pero para productos donde el reporte de ventas vende por CAJA
  // y el arqueo se cuenta por UNIDAD suelta. Por ahora solo Huevos de Corral: Jessica cuenta
  // el stock físico en unidades sueltas, pero la caja que se vende trae 8 -- cada "1" vendido
  // en el reporte son 8 unidades físicas que salieron. Nombre exacto y código (3020)
  // verificados contra su Excel real (FORMATO DE VENTAS, hojas Lunes y Jueves, ambas con el
  // mismo código y el mismo texto).
  var IMPORT_MULT_MAP = {
    "HUEVOS DE CORRAL CAJA": { name: "Huevos de Corral (Unid)", mult: 8 }
  };
  function normName(s){
    s = String(s || "").trim().toUpperCase();
    if(s.normalize) s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    s = s.replace(/[.()]/g, " ");
    s = s.replace(/[^A-Z0-9 ]/g, " ");
    s = s.replace(/\s+/g, " ").trim();
    return s;
  }
  function buildCatalogIndex(){
    var idx = {};
    PRODUCT_TABS.forEach(function(tabKey){
      catalogFor(tabKey).forEach(function(name, i){
        idx[normName(name)] = { tab: tabKey, idx: i, name: name };
      });
    });
    return idx;
  }
  function resolveCatalogEntry(catIndex, posName){
    var n = normName(posName);
    if(catIndex[n]) return { hit: catIndex[n], mult: 1 };
    var tri = TRIPLE_IMPORT_MAP[n];
    if(tri){
      var tn = normName(tri.name);
      if(catIndex[tn]) return { hit: catIndex[tn], mult: tri.mult };
    }
    var mm = IMPORT_MULT_MAP[n];
    if(mm){
      var mn = normName(mm.name);
      if(catIndex[mn]) return { hit: catIndex[mn], mult: mm.mult };
    }
    var alias = IMPORT_ALIASES[n];
    if(alias){
      var an = normName(alias);
      if(catIndex[an]) return { hit: catIndex[an], mult: 1 };
    }
    return null;
  }
  // El sistema de ventas exporta a veces un reporte "simple" (Código, Nombre, Cantidad Vendida
  // en las primeras 3 columnas) y a veces uno "detallado por familia" (con Stock, Precio, etc.
  // de por medio, donde Cantidad Vendida cae en otra columna). Por eso buscamos el encabezado
  // real ("CDARTICULO" / "DSARTICULO" / "Cantidad Vendida") y detectamos en qué columna cae
  // cada uno, en vez de asumir siempre las primeras tres columnas.
  function findSalesColumns(aoa){
    for(var r = 0; r < Math.min((aoa || []).length, 40); r++){
      var row = aoa[r] || [];
      var codeCol = -1, nameCol = -1, qtyCol = -1;
      for(var c = 0; c < row.length; c++){
        var cell = String(row[c] == null ? "" : row[c]).trim().toUpperCase();
        if(cell === "CDARTICULO") codeCol = c;
        else if(cell === "DSARTICULO") nameCol = c;
        else if(cell.indexOf("CANTIDAD VENDIDA") === 0) qtyCol = c;
      }
      if(codeCol !== -1 && nameCol !== -1 && qtyCol !== -1) return { code: codeCol, name: nameCol, qty: qtyCol };
    }
    return null;
  }
  // Detecta filas de producto por patrón (código numérico, nombre de texto, cantidad numérica) en
  // vez de depender de encabezados exactos para cada fila — así ignora títulos, "Familia :",
  // subtotales y el total general. Las columnas en sí se ubican con findSalesColumns() arriba.
  function parseSalesAOA(aoa){
    var items = [];
    var cols = findSalesColumns(aoa) || { code: 0, name: 1, qty: 2 };
    (aoa || []).forEach(function(row){
      if(!row || row.length <= Math.max(cols.code, cols.name, cols.qty)) return;
      var code = row[cols.code], name = row[cols.name], qtyRaw = row[cols.qty];
      var codeNum = (typeof code === "number") ? code : parseFloat(String(code == null ? "" : code).replace(",", "."));
      var qtyNum = (typeof qtyRaw === "number") ? qtyRaw : parseFloat(String(qtyRaw == null ? "" : qtyRaw).replace(",", "."));
      if(!isFinite(codeNum) || codeNum <= 0) return;
      if(typeof name !== "string" || !name.trim()) return;
      if(!isFinite(qtyNum)) return;
      items.push({ code: codeNum, name: String(name).trim(), qty: qtyNum });
    });
    return items;
  }
  function applyImport(items, date, shift){
    var catIndex = buildCatalogIndex();
    var day = ensureDay(date);
    var updated = { panes:0, bebidas:0, embutidos:0, triples:0, otros:0 };
    var skipped = [];
    // Varias líneas del reporte pueden apuntar al mismo producto del catálogo (p.ej. Triples:
    // "unidad suelta" + "tira"), así que primero sumamos todo por producto y recién al final
    // escribimos una vez por fila — así no se pisan entre sí ni se duplican si se reimporta.
    var sums = {};
    var hits = {};
    items.forEach(function(item){
      var resolved = resolveCatalogEntry(catIndex, item.name);
      if(!resolved){ skipped.push(item.name); return; }
      var key = resolved.hit.tab + ":" + resolved.hit.idx;
      if(!(key in sums)){ sums[key] = 0; hits[key] = resolved.hit; }
      sums[key] += item.qty * resolved.mult;
    });
    // El reporte de cierre de la tarde (10pm) trae el total del día completo (mañana + tarde
    // juntas, según confirmó Jessica), no solo lo de la tarde — así que al importarlo en el
    // turno "pm" hay que restarle, producto por producto, lo que ya está en "Ventas Caja
    // Mañana" para quedarnos con la venta real de la tarde sola.
    var sinMananaCount = 0;
    var totalGeneralPm = 0;
    var totalRestadoPm = 0;
    Object.keys(sums).forEach(function(key){
      var hit = hits[key];
      var section = SECTIONS[hit.tab];
      var sec = day[section.key];
      var row = shift === "am" ? sec.am[hit.idx] : sec.pm[hit.idx];
      if(shift === "pm"){
        var amRow = sec.am[hit.idx];
        var amVc = (amRow && amRow.vc !== null) ? amRow.vc : 0;
        if(!amRow || amRow.vc === null) sinMananaCount++;
        var general = sums[key];
        var soloTarde = general - amVc;
        row.vc = soloTarde;
        totalGeneralPm += general;
        totalRestadoPm += soloTarde;
      } else {
        row.vc = sums[key];
      }
      updated[hit.tab]++;
    });
    return {
      updated: updated, skipped: skipped,
      totalUpdated: updated.panes + updated.bebidas + updated.embutidos + updated.triples + updated.otros,
      sinMananaCount: sinMananaCount,
      totalGeneralPm: shift === "pm" ? totalGeneralPm : null,
      totalRestadoPm: shift === "pm" ? totalRestadoPm : null
    };
  }
  // Llena Metas a partir del mismo reporte de ventas que ya se importa para Panes/Bebidas/
  // Embutidos/Triples -- usa METAS_ITEM_LINKS (ver más arriba) para saber, de cada producto de
  // Metas, si toca buscarlo por código en el reporte ("cod") o copiar el dato que ya se calculó
  // en el catálogo de Panes ("cat"). Se llama SIEMPRE después de applyImport, con la misma
  // fecha/turno, sobre el mismo día -- así lo de "cat" ya encuentra el dato de Panes fresco.
  // Nunca escribe en Panes/Bebidas/Embutidos/Triples, solo lee de ahí.
  function applyImportToMetas(items, date, shift){
    var day = ensureDay(date);
    var codeSums = {};
    items.forEach(function(item){
      if(!(item.code in codeSums)) codeSums[item.code] = 0;
      codeSums[item.code] += item.qty;
    });
    var catIndex = buildCatalogIndex();
    var updatedMetas = 0;
    METAS_CATEGORIAS.forEach(function(cat){
      var linkMap = METAS_ITEM_LINKS[cat.key];
      if(!linkMap) return;
      var sec = day.metas[cat.key];
      if(!sec) return;
      cat.items.forEach(function(itemName, idx){
        var link = linkMap[itemName];
        if(!link) return;
        if(!sec.am[idx]) sec.am[idx] = {};
        if(!sec.pm[idx]) sec.pm[idx] = {};
        if(link.src === "cod"){
          cat.subcols.forEach(function(sc, si){
            var code = link.codes[si];
            if(code === null || code === undefined) return;
            if(!(code in codeSums)) return;
            var general = codeSums[code];
            if(shift === "pm"){
              var amVal = (sec.am[idx][sc.key] != null) ? sec.am[idx][sc.key] : 0;
              sec.pm[idx][sc.key] = general - amVal;
            } else {
              sec.am[idx][sc.key] = general;
            }
            updatedMetas++;
          });
        } else if(link.src === "cat"){
          var hit = catIndex[normName(link.name)];
          if(!hit) return; // no debería pasar, pero por seguridad no se rompe nada si el nombre cambia
          var panSec = day[SECTIONS[hit.tab].key];
          var amRow = panSec.am[hit.idx];
          var prow = shift === "am" ? amRow : panSec.pm[hit.idx];
          var venta = shift === "am" ? ventasAm(prow) : ventasPm(prow, amRow);
          // Si todavía no se puede calcular la venta (falta el conteo físico "Saldo Final"),
          // no se toca la casilla de Metas -- se queda como estaba hasta que sí se pueda.
          if(venta === null) return;
          var subKey = cat.subcols[0].key;
          sec[shift][idx][subKey] = venta;
          updatedMetas++;
        }
      });
    });
    return { updatedMetas: updatedMetas };
  }
  function handleImportFile(file, date, shift, statusEl){
    if(readOnly){ showToast("Vista de solo lectura: no puedes importar aquí."); return; }
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type:"array" });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:"", raw:true });
        var items = parseSalesAOA(aoa);
        if(items.length === 0){
          showToast("No se reconocieron filas de productos en ese archivo. ¿Es el reporte de ventas del sistema?");
          return;
        }
        var result = applyImport(items, date, shift);
        result.updatedMetas = applyImportToMetas(items, date, shift).updatedMetas;
        markDirty();
        scheduleAutosave();
        // Guardamos el resumen ANTES de repintar el panel, para que el bloque "Última
        // importación" ya salga completo la primera vez (si no, renderPanel() reconstruye
        // el control de importar con el resumen anterior, o vacío, y hay que esperar a un
        // segundo repintado para verlo).
        showImportSummary(result, date, shift, statusEl);
        renderTabs();
        if(currentTab === "turno") renderPanel();
      }catch(err){
        showToast("No se pudo leer ese archivo. Revisa que sea el reporte de ventas exportado del sistema (.xls, .xlsx o .csv).");
      }
    };
    reader.onerror = function(){ showToast("No se pudo leer el archivo."); };
    reader.readAsArrayBuffer(file);
  }
  // Arma el bloque "Última importación" a partir de lastImportSummary[shift] — se llama tanto
  // al construir el panel (para que sobreviva un renderPanel()) como justo después de importar.
  function renderImportStatus(statusEl, shift){
    if(!statusEl) return;
    statusEl.innerHTML = "";
    var saved = lastImportSummary[shift];
    if(!saved) return;
    var p = document.createElement("div");
    p.className = "hint";
    p.style.margin = ".5rem 0 0";
    p.textContent = "Última importación (" + SHIFT_LABEL[shift] + ", " + fmtDateLabel(saved.date) + "): " + saved.msg;
    statusEl.appendChild(p);
    if(saved.skipped && saved.skipped.length){
      var det = document.createElement("details");
      det.style.fontSize = ".76rem";
      det.style.color = "var(--ink-muted)";
      det.style.marginTop = ".3rem";
      var sum = document.createElement("summary");
      sum.style.cursor = "pointer";
      sum.textContent = "Ver productos del archivo que no se reconocieron";
      det.appendChild(sum);
      var listDiv = document.createElement("div");
      listDiv.style.marginTop = ".3rem";
      listDiv.textContent = saved.skipped.slice(0, 60).join(", ") + (saved.skipped.length > 60 ? "…" : "");
      det.appendChild(listDiv);
      statusEl.appendChild(det);
    }
  }
  function showImportSummary(result, date, shift, statusEl){
    var n = result.totalUpdated;
    var s = result.skipped.length;
    var msg = n + " producto" + (n===1?"":"s") + " actualizado" + (n===1?"":"s") +
      " (Panes " + result.updated.panes + " · Bebidas " + result.updated.bebidas + " · Embutidos " + result.updated.embutidos +
      " · Triples " + result.updated.triples + " · Otros " + result.updated.otros + ")" +
      (result.updatedMetas ? " · Metas " + result.updatedMetas + " casilla" + (result.updatedMetas===1?"":"s") : "") +
      (s ? " — " + s + " fila" + (s===1?"":"s") + " del archivo no está" + (s===1?"":"n") + " en tu arqueo." : "");
    if(shift === "pm" && result.totalGeneralPm !== null){
      msg += " — Total del reporte (día completo): " + fmt(result.totalGeneralPm) +
        ", ya restando lo de la mañana → Ventas Caja Tarde: " + fmt(result.totalRestadoPm) + ".";
      if(result.sinMananaCount > 0){
        msg += " Ojo: " + result.sinMananaCount + " producto" + (result.sinMananaCount===1?"":"s") +
          " no tenía" + (result.sinMananaCount===1?"":"n") + " ventas de mañana registradas todavía, así que para " +
          (result.sinMananaCount===1?"ese producto":"esos productos") + " se tomó el total del reporte tal cual.";
      }
    }
    // Mensaje largo (sobre todo el de la tarde, con la resta) — le damos más tiempo en
    // pantalla que al toast normal, y además queda guardado de forma permanente abajo del
    // botón (renderImportStatus), porque el toast igual se cierra solo.
    showToast(msg, 7000);
    lastImportSummary[shift] = { msg: msg, skipped: result.skipped, date: date };
    renderImportStatus(statusEl, shift);
  }
  function buildImportControl(shift){
    var wrap = document.createElement("div");
    wrap.style.marginTop = ".5rem";
    var label = document.createElement("label");
    label.className = "btn btn-sm";
    label.style.display = "inline-flex";
    label.style.cursor = "pointer";
    label.textContent = "Importar reporte de ventas (" + SHIFT_LABEL[shift] + ")";
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".xls,.xlsx,.csv";
    input.className = "visually-hidden";
    if(readOnly) input.disabled = true;
    var statusEl = document.createElement("div");
    renderImportStatus(statusEl, shift);
    input.addEventListener("change", function(){
      var f = input.files && input.files[0];
      input.value = "";
      if(!f) return;
      handleImportFile(f, currentDate, shift, statusEl);
    });
    label.appendChild(input);
    wrap.appendChild(label);
    wrap.appendChild(statusEl);
    return wrap;
  }

  // ---------- print report ----------
  function printableRows(tabKey, shift, day){
    var section = SECTIONS[tabKey];
    var amRows = day[section.key].am;
    var pmRows = day[section.key].pm;
    var out = [];
    catalogFor(tabKey).forEach(function(name, idx){
      var amRow = amRows[idx];
      var row = shift === "am" ? amRow : pmRows[idx];
      var saldoAnt = shift === "am" ? row.a : amRow.f;
      // "Saldo Final" pendiente de contar (null) no cuenta como "se movió" — antes sí generaba
      // un falso movimiento porque null nunca es igual al saldo anterior.
      var fChanged = row.f !== null && row.f !== saldoAnt;
      var moved = row.i1 || row.i2 || row.i3 || row.m || fChanged || row.vc !== null;
      if(!moved) return;
      var v = ventasOf(row, shift, amRow);
      var c = cuadreOf(row, v);
      var otros = tabKey === "otros" ? 0 : otrosSumFor(tabKey, idx, shift, day);
      out.push({
        name: name, saldoAnt: saldoAnt, ing: row.i1 + row.i2 + row.i3, otros: otros, m: mermaRealFor(row, otros), f: row.f,
        v: v, vc: row.vc, c: c, flagged: isFlagged(row, shift, amRow)
      });
    });
    return out;
  }
  function buildPrintHTML(date){
    var day = getDay(date);
    var t = day.turno;
    var alerts = dayAlerts(day);
    var html = "";
    html += "<h1>" + esc(STATE.meta.businessName || "Arqueo Diario") + "</h1>";
    html += '<div class="print-sub">Arqueo del ' + esc(fmtDateLabel(date)) + "</div>";
    html += '<div class="meta-line"><strong>Turno mañana:</strong> ' + esc(t.respAM || "—") +
      " (" + esc(t.eAM || "—") + " a " + esc(t.sAM || "—") + ")" + (t.obsAM ? " — " + esc(t.obsAM) : "") + "</div>";
    html += '<div class="meta-line"><strong>Turno tarde:</strong> ' + esc(t.respPM || "—") +
      " (" + esc(t.ePM || "—") + " a " + esc(t.sPM || "—") + ")" + (t.obsPM ? " — " + esc(t.obsPM) : "") + "</div>";
    if(t.notas) html += '<div class="meta-line"><strong>Notas:</strong> ' + esc(t.notas) + "</div>";
    html += '<p class="print-summary">' + (alerts.total === 0
      ? "Todo cuadra."
      : alerts.total + " producto" + (alerts.total===1?"":"s") + " por revisar (Panes " + alerts.panes + " · Bebidas " + alerts.bebidas + " · Embutidos " + alerts.embutidos + " · Triples " + alerts.triples + " · Otros " + alerts.otros + ").") + "</p>";

    PRODUCT_TABS.forEach(function(tabKey){
      if(tabKey === "otros") return; // Otros se imprime aparte más abajo, como bitácora de salidas.
      var section = SECTIONS[tabKey];
      ["am","pm"].forEach(function(shift){
        var rows = printableRows(tabKey, shift, day);
        html += "<h2>" + esc(section.label) + " — " + SHIFT_LABEL[shift] + "</h2>";
        if(rows.length === 0){ html += '<p class="print-empty">Sin movimientos registrados.</p>'; return; }
        html += "<table><thead><tr><th>Producto</th><th>Saldo ant.</th><th>Ingresos</th><th>Otros</th><th>Merma</th>" +
          "<th>Saldo final</th><th>Ventas físicas</th><th>Ventas caja</th><th>Cuadre</th></tr></thead><tbody>";
        rows.forEach(function(r){
          html += '<tr class="' + (r.flagged ? "flagged" : "") + '"><td>' + esc(r.name) + "</td><td>" + (r.saldoAnt === null ? "—" : fmt(r.saldoAnt)) +
            "</td><td>" + fmt(r.ing) + "</td><td>" + (r.otros ? fmt(r.otros) : "—") + "</td><td>" + fmt(r.m) + "</td><td>" + (r.f === null ? "—" : fmt(r.f)) + "</td><td>" + (r.v === null ? "—" : fmt(r.v)) +
            "</td><td>" + (r.vc === null ? "—" : fmt(r.vc)) + "</td><td>" + (r.c === null ? "—" : fmt(r.c)) + "</td></tr>";
        });
        html += "</tbody></table>";
      });
    });
    var movEntradas = printableMovimientosRows(day);
    html += "<h2>Otros — salidas del día</h2>";
    if(movEntradas.length === 0){
      html += '<p class="print-empty">Sin movimientos registrados.</p>';
    } else {
      html += "<table><thead><tr><th>Hora</th><th>Turno</th><th>Producto</th><th>Cantidad</th><th>Nota</th></tr></thead><tbody>";
      movEntradas.forEach(function(item){
        var e = item.e;
        html += "<tr><td>" + esc(e.hora || "—") + "</td><td>" + SHIFT_LABEL[item.shift] + "</td><td>" + esc(e.producto) +
          "</td><td>" + fmt(e.cantidad) + "</td><td>" + esc(e.nota || "—") + "</td></tr>";
      });
      html += "</tbody></table>";
    }
    html += '<div class="print-footer">Generado ' + esc(new Date().toLocaleString("es-PE",{ timeZone:"America/Lima" })) + "</div>";
    return html;
  }
  // Si la persona aprieta Control+P (o usa el menú del navegador) directamente, SIN pasar
  // por ninguno de los botones de "Imprimir...", igual queremos que salga algo -- lo mismo
  // que se está viendo en pantalla ahora mismo, no una hoja en blanco (porque el resto de la
  // app se oculta al imprimir; solo se ve lo que haya adentro de #printArea). "explicitPrint"
  // se pone en true justo antes de que un botón de imprimir arme su propio contenido, para
  // que este armado automático no lo pise.
  var explicitPrint = false;
  // Tamaño de hoja dinámico: las vistas del arqueo con muchas columnas necesitan hoja
  // horizontal, pero las pre-órdenes de pedido y los reportes de pedidos son angostos y se
  // ven mejor -- en su tamaño de hoja de siempre -- en vertical. En vez de un solo @page fijo
  // para toda la app (que hacía que TODO saliera horizontal, incluida la pre-orden), esta
  // función arma/actualiza un <style> aparte justo antes de cada impresión, según lo que
  // corresponda a esa impresión en particular.
  function setPrintOrientation(landscape){
    // Jessica: "SIEMPRE TODAS IMPRESION ES EN A4 VERTICAL NO QUIERO HORIZONTAL" -- se
    // ignora a propósito el parámetro "landscape" que piden los distintos llamados de
    // impresión (antes algunas vistas anchas pedían A4 horizontal); ahora TODO sale
    // siempre en A4 vertical. El <style id="printPageSize"> se deja vacío para que caiga
    // en el @page{ size:A4; } por defecto (vertical) definido más abajo.
    var el = document.getElementById("printPageSize");
    if(!el){
      el = document.createElement("style");
      el.id = "printPageSize";
      (document.head || document.documentElement).appendChild(el);
    }
    el.textContent = "";
  }
  // Se actualiza en CADA render (no solo al momento de imprimir) porque en algunos
  // navegadores/dispositivos apretar Control+P varias veces seguidas no siempre vuelve a
  // avisar justo antes de imprimir -- así, #printArea ya viene lista de antemano con lo
  // mismo que se está viendo en pantalla en ese momento, y no hace falta depender de que
  // ese aviso llegue a tiempo.
  function syncPrintAreaToCurrentView(){
    if(explicitPrint) return;
    if(!STATE) return;
    var area = document.getElementById("printArea");
    if(!area) return;
    // Las dos vistas que arma esta función (categoría/turno actual, o el reporte completo)
    // siempre necesitan hoja horizontal.
    setPrintOrientation(true);
    if(PRODUCT_TABS.indexOf(currentTab) !== -1){
      area.innerHTML = buildPrintCurrentViewHTML(currentTab, shiftView[currentTab], currentDate);
    } else {
      area.innerHTML = buildPrintHTML(currentDate);
    }
  }
  window.addEventListener("beforeprint", syncPrintAreaToCurrentView);
  function doWindowPrint(tempTitle){
    // Cambiamos el título de la página mientras se imprime para que el navegador
    // no muestre "Arqueo Diario" en el encabezado del PDF/impresión.
    explicitPrint = true;
    var oldTitle = document.title;
    document.title = tempTitle;
    var restored = false;
    function restore(){
      if(restored) return;
      restored = true;
      explicitPrint = false;
      document.title = oldTitle;
      window.removeEventListener("afterprint", restore);
    }
    window.addEventListener("afterprint", restore);
    setTimeout(function(){
      window.print();
      setTimeout(restore, 1500);
    }, 30);
  }
  function doPrint(date){
    setPrintOrientation(true);
    var area = document.getElementById("printArea");
    area.innerHTML = buildPrintHTML(date);
    doWindowPrint("Arqueo " + (date || ""));
  }

  // ---------- resumen simple para imprimir (una sola tabla por categoría, mañana y tarde
  // juntas en la misma fila, sin Ventas Físicas / Ventas Caja / Cuadre / Se agotó -- solo lo
  // básico que Jessica pidió: Saldo Anterior, Ingreso AM, Ingreso PM, Merma y Saldo Final). ----
  function printableRowsSimple(tabKey, day){
    var section = SECTIONS[tabKey];
    var amRows = day[section.key].am;
    var pmRows = day[section.key].pm;
    var out = [];
    catalogFor(tabKey).forEach(function(name, idx){
      var amRow = amRows[idx];
      var pmRow = pmRows[idx];
      var saldoAnt = amRow.a;
      var ingAm = amRow.i1 + amRow.i2 + amRow.i3;
      var ingPm = pmRow.i1 + pmRow.i2 + pmRow.i3;
      var otrosAm = tabKey === "otros" ? 0 : otrosSumFor(tabKey, idx, "am", day);
      var otrosPm = tabKey === "otros" ? 0 : otrosSumFor(tabKey, idx, "pm", day);
      var otros = round2(otrosAm + otrosPm);
      var merma = round2(mermaRealFor(amRow, otrosAm) + mermaRealFor(pmRow, otrosPm));
      // Saldo Final = el cierre real del día: el de la tarde si ya se contó, y si no,
      // el de la mañana (por ejemplo, un producto que no tuvo movimiento en la tarde).
      var saldoFinal = pmRow.f !== null ? pmRow.f : amRow.f;
      var amFChanged = amRow.f !== null && amRow.f !== saldoAnt;
      var pmFChanged = pmRow.f !== null && pmRow.f !== amRow.f;
      var moved = ingAm || ingPm || amRow.m || pmRow.m || amFChanged || pmFChanged || amRow.vc !== null || pmRow.vc !== null;
      if(!moved) return;
      out.push({ name: name, saldoAnt: saldoAnt, ingAm: ingAm, ingPm: ingPm, otros: otros, merma: merma, saldoFinal: saldoFinal });
    });
    return out;
  }
  function buildPrintSimpleHTML(date){
    var day = getDay(date);
    var html = "";
    html += "<h1>" + esc(STATE.meta.businessName || "Arqueo Diario") + "</h1>";
    html += '<div class="print-sub">Resumen del ' + esc(fmtDateLabel(date)) + "</div>";
    // Jessica: "cada categoria salga en 1 hoja excepto el de panes que tiene mas texto" -- cada
    // categoría empieza en una hoja nueva (no comparte página con la anterior), así nunca se
    // mezclan dos categorías en la misma hoja. Panes es la primera, así que ya arranca en la
    // hoja 1 sin necesitar el salto -- y como tiene más productos, es la única a la que se le
    // permite (sin forzarlo) ocupar más de una hoja para ella sola.
    var firstSection = true;
    PRODUCT_TABS.forEach(function(tabKey){
      if(tabKey === "otros") return; // Otros se imprime aparte más abajo, como bitácora de salidas.
      var section = SECTIONS[tabKey];
      var rows = printableRowsSimple(tabKey, day);
      html += '<div style="' + (firstSection ? "" : "page-break-before:always;") + '">';
      firstSection = false;
      html += "<h2>" + esc(section.label) + "</h2>";
      if(rows.length === 0){
        html += '<p class="print-empty">Sin movimientos registrados.</p>';
      } else {
        html += "<table><thead><tr><th>Producto</th><th>Saldo ant.</th><th>Ingreso AM</th><th>Ingreso PM</th><th>Otros</th>" +
          "<th>Merma</th><th>Saldo final</th></tr></thead><tbody>";
        rows.forEach(function(r){
          html += "<tr><td>" + esc(r.name) + "</td><td>" + (r.saldoAnt === null ? "—" : fmt(r.saldoAnt)) +
            "</td><td>" + fmt(r.ingAm) + "</td><td>" + fmt(r.ingPm) + "</td><td>" + (r.otros ? fmt(r.otros) : "—") + "</td><td>" + fmt(r.merma) +
            "</td><td>" + (r.saldoFinal === null ? "—" : fmt(r.saldoFinal)) + "</td></tr>";
        });
        html += "</tbody></table>";
      }
      html += "</div>";
    });
    var movEntradasR = printableMovimientosRows(day);
    html += '<div style="page-break-before:always;">';
    html += "<h2>Otros — salidas del día</h2>";
    if(movEntradasR.length === 0){
      html += '<p class="print-empty">Sin movimientos registrados.</p>';
    } else {
      html += "<table><thead><tr><th>Hora</th><th>Turno</th><th>Producto</th><th>Cantidad</th><th>Nota</th></tr></thead><tbody>";
      movEntradasR.forEach(function(item){
        var e = item.e;
        html += "<tr><td>" + esc(e.hora || "—") + "</td><td>" + SHIFT_LABEL[item.shift] + "</td><td>" + esc(e.producto) +
          "</td><td>" + fmt(e.cantidad) + "</td><td>" + esc(e.nota || "—") + "</td></tr>";
      });
      html += "</tbody></table>";
    }
    html += "</div>";
    html += '<div class="print-footer">Generado ' + esc(new Date().toLocaleString("es-PE",{ timeZone:"America/Lima" })) + "</div>";
    return html;
  }
  function doPrintSimple(date){
    setPrintOrientation(false);
    var area = document.getElementById("printArea");
    area.innerHTML = buildPrintSimpleHTML(date);
    doWindowPrint("Resumen " + (date || ""));
  }

  // ---------- imprimir la vista tal como se ve en pantalla (una sola tabla, con las mismas
  // columnas y el mismo orden que la tabla de la categoría/turno que se está viendo, incluido
  // "Se agotó") -- para que no haga falta recortar una captura de pantalla y pegarla en Word. ----
  function printableRowsCurrent(tabKey, shift, day){
    var section = SECTIONS[tabKey];
    var amRows = day[section.key].am;
    var pmRows = day[section.key].pm;
    var agMap = shift === "am" ? day[section.key].agAm : day[section.key].agPm;
    var closeTime = shift === "am" ? day.turno.sAM : day.turno.sPM;
    var out = [];
    catalogFor(tabKey).forEach(function(name, idx){
      if(isDescontinuado(tabKey, name)) return;
      var amRow = amRows[idx];
      var row = shift === "am" ? amRow : pmRows[idx];
      var saldoAnt = shift === "am" ? row.a : amRow.f;
      var v = ventasOf(row, shift, amRow);
      var c = cuadreOf(row, v);
      var agTime = agMap[idx];
      var dur = fmtDuration(minutesBetween(agTime, closeTime));
      var otros = tabKey === "otros" ? 0 : otrosSumFor(tabKey, idx, shift, day);
      out.push({
        name: name, saldoAnt: saldoAnt, ing: row.i1 + row.i2 + row.i3, otros: otros, m: mermaRealFor(row, otros), f: row.f,
        agLabel: agTime ? (agTime + (dur ? " — " + dur : "")) : "—",
        v: v, vc: row.vc, c: c, flagged: isFlagged(row, shift, amRow)
      });
    });
    return out;
  }
  function buildPrintCurrentViewHTML(tab, shift, date){
    var day = getDay(date);
    var section = SECTIONS[tab];
    var rows = printableRowsCurrent(tab, shift, day);
    var html = "";
    html += "<h1>" + esc(STATE.meta.businessName || "Arqueo Diario") + "</h1>";
    html += '<div class="print-sub">' + esc(section.label) + " — " + esc(SHIFT_LABEL[shift]) + " · " + esc(fmtDateLabel(date)) + "</div>";
    if(rows.length === 0){
      html += '<p class="print-empty">Sin productos registrados en esta categoría.</p>';
    } else {
      html += "<table><thead><tr><th>Producto</th><th>Saldo ant.</th><th>Ingresos</th><th>Otros</th><th>Merma</th>" +
        "<th>Saldo final</th><th>Se agotó</th><th>Ventas físicas</th><th>Ventas caja</th><th>Cuadre</th></tr></thead><tbody>";
      rows.forEach(function(r){
        html += '<tr class="' + (r.flagged ? "flagged" : "") + '"><td>' + esc(r.name) + "</td><td>" + (r.saldoAnt === null ? "—" : fmt(r.saldoAnt)) +
          "</td><td>" + fmt(r.ing) + "</td><td>" + (r.otros ? fmt(r.otros) : "—") + "</td><td>" + fmt(r.m) + "</td><td>" + (r.f === null ? "—" : fmt(r.f)) +
          "</td><td>" + esc(r.agLabel) + "</td><td>" + (r.v === null ? "—" : fmt(r.v)) +
          "</td><td>" + (r.vc === null ? "—" : fmt(r.vc)) + "</td><td>" + (r.c === null ? "—" : fmt(r.c)) + "</td></tr>";
      });
      html += "</tbody></table>";
    }
    html += '<div class="print-footer">Generado ' + esc(new Date().toLocaleString("es-PE",{ timeZone:"America/Lima" })) + "</div>";
    return html;
  }
  function doPrintCurrentView(tab, shift, date){
    setPrintOrientation(true);
    var area = document.getElementById("printArea");
    area.innerHTML = buildPrintCurrentViewHTML(tab, shift, date);
    doWindowPrint("Arqueo " + SECTIONS[tab].label + " " + SHIFT_LABEL[shift] + " " + (date || ""));
  }

  // ---------- imprimir la vista de Otros (lista de movimientos/salidas) tal como se ve en
  // pantalla -- separado de printableRowsCurrent porque Otros ya no es una tabla de productos
  // con Saldo/Ingreso/Merma, es una bitácora de salidas (Hora/Turno/Producto/Cantidad/Nota). ----
  function printableMovimientosRows(day){
    var entradas = (day.movimientos.am || []).map(function(e){ return { e:e, shift:"am" }; })
      .concat((day.movimientos.pm || []).map(function(e){ return { e:e, shift:"pm" }; }));
    entradas.sort(function(a, b){ return (a.e.hora||"").localeCompare(b.e.hora||""); });
    return entradas;
  }
  function buildPrintMovimientosHTML(date){
    var day = getDay(date);
    backfillDay(day, date);
    var entradas = printableMovimientosRows(day);
    var html = "";
    html += "<h1>" + esc(STATE.meta.businessName || "Arqueo Diario") + "</h1>";
    html += '<div class="print-sub">Otros (salidas) · ' + esc(fmtDateLabel(date)) + "</div>";
    if(entradas.length === 0){
      html += '<p class="print-empty">Todavía no se anotó ninguna salida este día.</p>';
    } else {
      html += "<table><thead><tr><th>Hora</th><th>Turno</th><th>Producto</th><th>Cantidad</th><th>Nota</th></tr></thead><tbody>";
      var totalCant = 0;
      entradas.forEach(function(item){
        var e = item.e;
        totalCant += num(e.cantidad);
        html += "<tr><td>" + esc(e.hora || "—") + "</td><td>" + SHIFT_LABEL[item.shift] + "</td><td>" + esc(e.producto) +
          "</td><td>" + fmt(e.cantidad) + "</td><td>" + esc(e.nota || "—") + "</td></tr>";
      });
      html += "</tbody></table>";
      html += '<p class="print-summary">Total de unidades: ' + fmt(totalCant) + "</p>";
    }
    html += '<div class="print-footer">Generado ' + esc(new Date().toLocaleString("es-PE",{ timeZone:"America/Lima" })) + "</div>";
    return html;
  }
  function doPrintMovimientos(date){
    setPrintOrientation(false);
    var area = document.getElementById("printArea");
    area.innerHTML = buildPrintMovimientosHTML(date);
    doWindowPrint("Arqueo Otros " + (date || ""));
  }

  // ---------- imprimir la vista de Metas tal como se ve en pantalla (una tabla por
  // categoría, con TOTAL/META/PORCENTAJE cuando esa categoría tiene meta, igual que
  // buildMetasCategoryCard pero como HTML de impresión). ----
  function buildPrintMetasHTML(date, shift){
    var day = getDay(date);
    backfillMetasDay(day);
    var weekdayKey = weekdayKeyFor(date);
    var html = "";
    html += "<h1>" + esc(STATE.meta.businessName || "Arqueo Diario") + "</h1>";
    html += '<div class="print-sub">Metas — ' + esc(SHIFT_LABEL[shift]) + " · " + esc(fmtDateLabel(date)) + "</div>";
    METAS_CATEGORIAS.forEach(function(cat){
      var sec = day.metas[cat.key];
      var objetivos = cat.conMeta ? (STATE.metasObjetivos[weekdayKey] && STATE.metasObjetivos[weekdayKey][cat.key]) : null;
      var metaArr = objetivos ? (objetivos[shift] || []) : [];
      html += "<h2>" + esc(cat.label) + "</h2>";
      html += '<table class="metas-print-table"><thead><tr><th>Producto</th>';
      cat.subcols.forEach(function(sc){ html += "<th>" + esc(sc.label) + "</th>"; });
      html += "</tr></thead><tbody>";
      cat.items.forEach(function(name, idx){
        var row = (sec[shift] || [])[idx] || {};
        html += "<tr><td>" + esc(name) + "</td>";
        cat.subcols.forEach(function(sc){
          var v = row[sc.key];
          html += "<td>" + (v ? fmt(v) : "—") + "</td>";
        });
        html += "</tr>";
      });
      html += "</tbody><tfoot>";
      html += '<tr class="metas-total-row"><td>TOTAL</td>';
      cat.subcols.forEach(function(sc){ html += "<td>" + fmt(metasSubcolTotal(sec, shift, sc.key)) + "</td>"; });
      html += "</tr>";
      if(cat.conMeta){
        html += '<tr class="metas-meta-row"><td>META</td>';
        cat.subcols.forEach(function(sc, si){
          var mv = metaArr[si];
          html += "<td>" + (mv ? fmt(mv) : "—") + "</td>";
        });
        html += "</tr>";
        html += '<tr class="metas-pct-row"><td>PORCENTAJE</td>';
        cat.subcols.forEach(function(sc, si){
          var total = metasSubcolTotal(sec, shift, sc.key);
          var meta = num(metaArr[si]);
          var pct = meta > 0 ? Math.round((total/meta)*100) : null;
          html += '<td class="' + (pct !== null && pct >= 100 ? "good" : "") + '">' + (pct !== null ? pct + "%" : "—") + "</td>";
        });
        html += "</tr>";
        html += '<tr class="metas-falta-row"><td>FALTA PARA LA META</td>';
        cat.subcols.forEach(function(sc, si){
          var total = metasSubcolTotal(sec, shift, sc.key);
          var meta = num(metaArr[si]);
          var falta = meta - total;
          html += falta <= 0
            ? '<td class="good">¡Meta lograda!</td>'
            : "<td>" + fmt(falta) + "</td>";
        });
        html += "</tr>";
      }
      html += "</tfoot></table>";
    });
    html += '<div class="print-footer">Generado ' + esc(new Date().toLocaleString("es-PE",{ timeZone:"America/Lima" })) + "</div>";
    return html;
  }
  function doPrintMetas(date, shift){
    setPrintOrientation(true);
    var area = document.getElementById("printArea");
    area.innerHTML = buildPrintMetasHTML(date, shift);
    doWindowPrint("Metas " + SHIFT_LABEL[shift] + " " + (date || ""));
  }

  // ---------- Excel export (una hoja por categoría, un día opcionalmente) ----------
  // Una fila por producto por día, con Mañana y Tarde lado a lado (como en el reporte de
  // papel que mandan a la dueña), en vez de dos filas separadas por turno.
  var REPORT_HEADER = ["Fecha","Producto",
    "Saldo Anterior","Ingreso AM","Otros AM","Merma AM","Saldo Final AM","Ventas AM","Ventas Caja AM","Cuadre AM",
    "Ingreso PM","Otros PM","Merma PM","Saldo Final PM","Ventas PM","Ventas Caja PM","Cuadre PM",
    "Responsable AM","Hora Cierre AM","Responsable PM","Hora Cierre PM"];
  function buildReportRowsByCategory(dateFilter){
    var byTab = {};
    PRODUCT_TABS.forEach(function(tabKey){ byTab[tabKey] = [REPORT_HEADER.slice()]; });
    var dates = Object.keys(STATE.days).sort();
    if(dateFilter) dates = dates.filter(function(d){ return d === dateFilter; });
    dates.forEach(function(d){
      var day = STATE.days[d];
      backfillDay(day, d);
      var t = day.turno;
      PRODUCT_TABS.forEach(function(tabKey){
        var section = SECTIONS[tabKey];
        var sec = day[section.key];
        catalogFor(tabKey).forEach(function(name, idx){
          var amRow = sec.am[idx];
          var pmRow = sec.pm[idx];
          var vAm = ventasOf(amRow, "am", null);
          var cAm = cuadreOf(amRow, vAm);
          var vPm = ventasOf(pmRow, "pm", amRow);
          var cPm = cuadreOf(pmRow, vPm);
          var ingresoAm = amRow.i1 + amRow.i2 + amRow.i3;
          var ingresoPm = pmRow.i1 + pmRow.i2 + pmRow.i3;
          var otrosAm = tabKey === "otros" ? 0 : otrosSumFor(tabKey, idx, "am", day);
          var otrosPm = tabKey === "otros" ? 0 : otrosSumFor(tabKey, idx, "pm", day);
          byTab[tabKey].push([
            d, name,
            amRow.a===null ? "" : fmt(amRow.a), fmt(ingresoAm), otrosAm ? fmt(otrosAm) : "", fmt(mermaRealFor(amRow, otrosAm)), amRow.f===null ? "" : fmt(amRow.f), vAm===null ? "" : fmt(vAm),
            amRow.vc===null ? "" : fmt(amRow.vc), cAm===null ? "" : fmt(cAm),
            fmt(ingresoPm), otrosPm ? fmt(otrosPm) : "", fmt(mermaRealFor(pmRow, otrosPm)), pmRow.f===null ? "" : fmt(pmRow.f), vPm===null ? "" : fmt(vPm),
            pmRow.vc===null ? "" : fmt(pmRow.vc), cPm===null ? "" : fmt(cPm),
            t.respAM || "", t.sAM || "", t.respPM || "", t.sPM || ""
          ]);
        });
      });
    });
    return byTab;
  }
  // ---------- Reporte simple (Panes / Embutidos / Triples) ----------
  // Jessica pidió un reporte más liviano para estas 3 categorías —el de arriba (REPORT_HEADER)
  // le sale con demasiadas columnas (mañana + tarde repetido por cada cosa). Este otro es una
  // sola fila por producto, con lo que necesita del cierre de la tarde nada más: parecido al
  // Excel que ella misma armó a mano como ejemplo. Bebidas y Otros, por ahora, se quedan con el
  // reporte de siempre (no lo pidió para esas dos todavía).
  var SIMPLE_REPORT_TABS = ["panes","embutidos","triples"];
  var SIMPLE_REPORT_HEADER = ["Fecha","Producto","Saldo Anterior","Ingreso AM","Ingreso PM","Otros PM","Merma PM","Saldo Final PM","Ventas Caja PM","Cuadre PM"];
  var SIMPLE_REPORT_TITLES = { panes:"ARQUEO DE PANES", embutidos:"ARQUEO DE EMBUTIDOS", triples:"ARQUEO DE TRIPLES" };
  function buildSimpleReportRowsByCategory(dateFilter){
    var byTab = {};
    SIMPLE_REPORT_TABS.forEach(function(tabKey){ byTab[tabKey] = []; });
    var dates = Object.keys(STATE.days).sort();
    if(dateFilter) dates = dates.filter(function(d){ return d === dateFilter; });
    dates.forEach(function(d){
      var day = STATE.days[d];
      backfillDay(day, d);
      SIMPLE_REPORT_TABS.forEach(function(tabKey){
        var section = SECTIONS[tabKey];
        var sec = day[section.key];
        catalogFor(tabKey).forEach(function(name, idx){
          var amRow = sec.am[idx];
          var pmRow = sec.pm[idx];
          var vPm = ventasOf(pmRow, "pm", amRow);
          var cPm = cuadreOf(pmRow, vPm);
          var ingresoAm = amRow.i1 + amRow.i2 + amRow.i3;
          var ingresoPm = pmRow.i1 + pmRow.i2 + pmRow.i3;
          var otrosPm = tabKey === "otros" ? 0 : otrosSumFor(tabKey, idx, "pm", day);
          byTab[tabKey].push([
            d, name, amRow.a===null ? "" : fmt(amRow.a), fmt(ingresoAm), fmt(ingresoPm), otrosPm ? fmt(otrosPm) : "", fmt(mermaRealFor(pmRow, otrosPm)), pmRow.f===null ? "" : fmt(pmRow.f),
            pmRow.vc===null ? "" : fmt(pmRow.vc), cPm===null ? "" : fmt(cPm)
          ]);
        });
      });
    });
    return byTab;
  }
  function buildSimpleReportSheet(tabKey, rows){
    var numCols = SIMPLE_REPORT_HEADER.length;
    var titleRow = [];
    for(var i=0;i<numCols;i++) titleRow.push("");
    titleRow[0] = SIMPLE_REPORT_TITLES[tabKey];
    var aoa = [titleRow, SIMPLE_REPORT_HEADER.slice()].concat(rows);
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!merges"] = [{ s:{r:0,c:0}, e:{r:0,c:numCols-1} }];
    ws["!cols"] = [{wch:12},{wch:26},{wch:14},{wch:12},{wch:12},{wch:10},{wch:10},{wch:14},{wch:14},{wch:10}];
    // Negrita y color para el título y el encabezado — si el lector de Excel de quien lo abre
    // no llega a pintar el color, igual queda bien: el contenido y el orden de columnas es lo
    // que más importa.
    try{
      var titleRef = XLSX.utils.encode_cell({r:0,c:0});
      if(ws[titleRef]) ws[titleRef].s = { font:{ bold:true, underline:true, sz:14, color:{rgb:"C2660C"} }, alignment:{ horizontal:"center" } };
      for(var c=0;c<numCols;c++){
        var ref = XLSX.utils.encode_cell({r:1,c:c});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, color:{rgb:"FFFFFF"} }, fill:{ fgColor:{rgb:"4472C4"} }, alignment:{ horizontal:"center" } };
      }
    }catch(e){}
    return ws;
  }
  // ---------- Reporte de Otros para Excel (a partir de day.movimientos -- el catálogo viejo
  // de "Otros" como tabla de productos ya no se usa, quedó reemplazado por esta bitácora de
  // salidas; este reporte reemplaza el que antes salía siempre vacío). Diseño aprobado por
  // Jessica (vista previa en scratch_otros/): título + tabla Fecha/Turno/Hora/Producto/
  // Cantidad/Nota + total de unidades + resumen por producto, para cuadrar contra la Merma. ----
  function buildMovimientosReportRows(dateFilter){
    var out = [];
    var dates = Object.keys(STATE.days).sort();
    if(dateFilter) dates = dates.filter(function(d){ return d === dateFilter; });
    dates.forEach(function(d){
      var day = STATE.days[d];
      backfillDay(day, d);
      ["am","pm"].forEach(function(shift){
        (day.movimientos[shift] || []).forEach(function(e){
          out.push({ fecha: d, turno: SHIFT_LABEL[shift], hora: e.hora || "", producto: e.producto, cantidad: num(e.cantidad), nota: e.nota || "" });
        });
      });
    });
    out.sort(function(a, b){
      if(a.fecha !== b.fecha) return a.fecha < b.fecha ? -1 : 1;
      return (a.hora || "").localeCompare(b.hora || "");
    });
    return out;
  }
  function buildMovimientosReportSheet(rows, dateFilter){
    var DARK = "5A3A22", ORANGE = "C2660C", BLUE = "4472C4", LIGHT = "F6E3BD";
    var headers = ["Fecha","Turno","Hora","Producto","Cantidad","Nota"];
    var aoa = [];
    aoa.push(["PANADERÍA CARMELITAS — MOVIMIENTOS (OTROS)","","","","",""]);
    aoa.push(["Salidas que no son venta normal: regalos, bonificaciones, consumo del personal, envíos a otro local, etc.","","","","",""]);
    aoa.push([dateFilter ? fmtDateLabel(dateFilter) : "Historial completo (todas las fechas guardadas)","","","","",""]);
    aoa.push(["","","","","",""]);
    var headerRowIdx = aoa.length;
    aoa.push(headers.slice());
    var firstDataIdx = aoa.length;
    rows.forEach(function(r){ aoa.push([r.fecha, r.turno, r.hora, r.producto, r.cantidad, r.nota]); });
    var lastDataIdx = aoa.length - 1;

    var totalRowIdx = -1, resumenTitleIdx = -1, resumenHeaderIdx = -1, resumenFirstIdx = -1, seen = [];
    if(rows.length === 0){
      aoa.push(["Todavía no hay salidas anotadas" + (dateFilter ? " para este día." : "."), "", "", "", "", ""]);
    } else {
      var totalUnidades = rows.reduce(function(s, r){ return s + num(r.cantidad); }, 0);
      aoa.push(["","","","","",""]);
      totalRowIdx = aoa.length;
      aoa.push([dateFilter ? "TOTAL UNIDADES DEL DÍA" : "TOTAL UNIDADES DEL PERIODO","","","",round2(totalUnidades),""]);
      aoa.push(["","","","","",""]);
      resumenTitleIdx = aoa.length;
      aoa.push(["RESUMEN POR PRODUCTO (para cuadrar contra la Merma)","","","","",""]);
      resumenHeaderIdx = aoa.length;
      aoa.push(["Producto","","","","Cantidad total",""]);
      var totalsByProduct = {};
      rows.forEach(function(r){
        if(totalsByProduct[r.producto] === undefined){ totalsByProduct[r.producto] = 0; seen.push(r.producto); }
        totalsByProduct[r.producto] += num(r.cantidad);
      });
      resumenFirstIdx = aoa.length;
      // El nombre del producto va en A:D (igual de ancho que la columna Producto de la tabla de
      // arriba, más el resto) para que no se corte "Empanada de Carne", "Café Americano Chico",
      // etc. -- antes iba solo en la columna A (angosta, pensada para "Fecha") y se cortaba.
      seen.forEach(function(p){ aoa.push([p, "", "", "", round2(totalsByProduct[p]), ""]); });
    }

    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"] = [{wch:13},{wch:10},{wch:8},{wch:28},{wch:12},{wch:38}];
    var merges = [
      { s:{r:0,c:0}, e:{r:0,c:5} },
      { s:{r:1,c:0}, e:{r:1,c:5} },
      { s:{r:2,c:0}, e:{r:2,c:5} }
    ];
    if(totalRowIdx !== -1){
      merges.push({ s:{r:totalRowIdx,c:0}, e:{r:totalRowIdx,c:3} });
      merges.push({ s:{r:resumenTitleIdx,c:0}, e:{r:resumenTitleIdx,c:5} });
      merges.push({ s:{r:resumenHeaderIdx,c:0}, e:{r:resumenHeaderIdx,c:3} });
      merges.push({ s:{r:resumenHeaderIdx,c:4}, e:{r:resumenHeaderIdx,c:5} });
      seen.forEach(function(p, i){ merges.push({ s:{r:resumenFirstIdx+i,c:0}, e:{r:resumenFirstIdx+i,c:3} }); });
    }
    ws["!merges"] = merges;

    try{
      var ref;
      ref = XLSX.utils.encode_cell({r:0,c:0});
      if(ws[ref]) ws[ref].s = { font:{ bold:true, underline:true, sz:14, color:{rgb:ORANGE} }, alignment:{ horizontal:"center" } };
      ref = XLSX.utils.encode_cell({r:1,c:0});
      if(ws[ref]) ws[ref].s = { font:{ italic:true, sz:10, color:{rgb:"666666"} }, alignment:{ horizontal:"center" } };
      ref = XLSX.utils.encode_cell({r:2,c:0});
      if(ws[ref]) ws[ref].s = { font:{ bold:true, sz:11, color:{rgb:DARK} }, alignment:{ horizontal:"center" } };
      for(var hc=0; hc<headers.length; hc++){
        ref = XLSX.utils.encode_cell({r:headerRowIdx, c:hc});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, color:{rgb:"FFFFFF"} }, fill:{ fgColor:{rgb:BLUE} }, alignment:{ horizontal:"center" } };
      }
      for(var ri=firstDataIdx; ri<=lastDataIdx; ri++){
        for(var ci=0; ci<headers.length; ci++){
          ref = XLSX.utils.encode_cell({r:ri, c:ci});
          if(!ws[ref]) continue;
          var st = { font:{ sz:10 } };
          if(ci === 4) st.alignment = { horizontal:"center" };
          if((ri - firstDataIdx) % 2 === 1) st.fill = { fgColor:{rgb:"FBF7F0"} };
          ws[ref].s = st;
        }
      }
      if(totalRowIdx !== -1){
        ref = XLSX.utils.encode_cell({r:totalRowIdx, c:0});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, color:{rgb:DARK} }, alignment:{ horizontal:"right" } };
        ref = XLSX.utils.encode_cell({r:totalRowIdx, c:4});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, color:{rgb:DARK} }, alignment:{ horizontal:"center" }, fill:{ fgColor:{rgb:LIGHT} } };
        ref = XLSX.utils.encode_cell({r:resumenTitleIdx, c:0});
        if(ws[ref]) ws[ref].s = { font:{ bold:true, sz:11, color:{rgb:ORANGE} } };
        [0, 4].forEach(function(rc){
          var href = XLSX.utils.encode_cell({r:resumenHeaderIdx, c:rc});
          if(ws[href]) ws[href].s = { font:{ bold:true, color:{rgb:"FFFFFF"} }, fill:{ fgColor:{rgb:BLUE} }, alignment:{ horizontal:"center" } };
        });
        seen.forEach(function(p, i){
          var rref = XLSX.utils.encode_cell({r:resumenFirstIdx+i, c:0});
          if(ws[rref]) ws[rref].s = { font:{ sz:10 } };
          var cref = XLSX.utils.encode_cell({r:resumenFirstIdx+i, c:4});
          if(ws[cref]) ws[cref].s = { font:{ sz:10 }, alignment:{ horizontal:"center" } };
        });
      }
    }catch(e){}
    return ws;
  }
  function buildTurnoRows(dateFilter){
    var rows = [["Fecha","Responsable AM","Hora Entrada AM","Hora Cierre AM","Observaciones AM",
      "Responsable PM","Hora Entrada PM","Hora Cierre PM","Observaciones PM","Notas del día"]];
    var dates = Object.keys(STATE.days).sort();
    if(dateFilter) dates = dates.filter(function(d){ return d === dateFilter; });
    dates.forEach(function(d){
      var t = STATE.days[d].turno;
      rows.push([d, t.respAM||"", t.eAM||"", t.sAM||"", t.obsAM||"", t.respPM||"", t.ePM||"", t.sPM||"", t.obsPM||"", t.notas||""]);
    });
    return rows;
  }
  // dateFilter: si se pasa una fecha (YYYY-MM-DD), exporta solo ese día; si no, todo el historial.
  function doExport(dateFilter){
    if(Object.keys(STATE.days).length === 0){ showToast("Todavía no hay días guardados para exportar."); return; }
    if(dateFilter && !STATE.days[dateFilter]){ showToast("No hay datos guardados para ese día."); return; }
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    try{
      var byTab = buildReportRowsByCategory(dateFilter);
      var simpleByTab = buildSimpleReportRowsByCategory(dateFilter);
      var wb = XLSX.utils.book_new();
      var SHEET_NAMES = { panes:"Panes", bebidas:"Bebidas", embutidos:"Embutidos", triples:"Triples", otros:"Otros" };
      PRODUCT_TABS.forEach(function(tabKey){
        var ws;
        if(tabKey === "otros"){
          ws = buildMovimientosReportSheet(buildMovimientosReportRows(dateFilter), dateFilter);
        } else {
          ws = SIMPLE_REPORT_TABS.indexOf(tabKey) !== -1
            ? buildSimpleReportSheet(tabKey, simpleByTab[tabKey])
            : XLSX.utils.aoa_to_sheet(byTab[tabKey]);
        }
        XLSX.utils.book_append_sheet(wb, ws, SHEET_NAMES[tabKey]);
      });
      var wsTurno = XLSX.utils.aoa_to_sheet(buildTurnoRows(dateFilter));
      XLSX.utils.book_append_sheet(wb, wsTurno, "Turno");
      var filename = dateFilter ? ("arqueo-" + dateFilter + ".xlsx") : "arqueo-historial.xlsx";
      XLSX.writeFile(wb, filename);
      showToast("Reporte descargado.");
    }catch(err){
      showToast("No se pudo generar el archivo. Intenta de nuevo.");
    }
  }

  // ---------- rendering ----------
  function renderAll(){
    document.getElementById("brandSub").textContent =
      (STATE.meta.businessName ? STATE.meta.businessName + " · " : "") + fmtDateLabel(currentDate);
    renderTabs();
    renderPanel();
    setSaveStatus();
    syncPrintAreaToCurrentView();

  function renderTabs(){
    var day = getDay(currentDate);
    var alerts = dayAlerts(day);
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      var tab = btn.getAttribute("data-tab");
      btn.classList.toggle("active", tab === currentTab);
      var n = alerts[tab];
      var countHtml = n ? '<span class="count">' + n + "</span>" : "";
      var label = SECTIONS[tab] ? SECTIONS[tab].label + countHtml
        : (tab === "turno" ? "Turno" : (tab === "historial" ? "Historial" : (tab === "pedidos" ? "Pedidos" : (tab === "cajeros" ? "Caja Cajeros" : (tab === "metas" ? "Metas" : "")))));
      btn.innerHTML = label;
    });
  }

  function renderPanel(){
    var panel = document.getElementById("panel");
    panel.innerHTML = "";
    if(currentTab === "turno"){ panel.appendChild(buildTurnoPanel()); }
    else if(currentTab === "historial"){ panel.appendChild(buildHistorialPanel()); }
    else if(currentTab === "pedidos"){ panel.appendChild(buildPedidosPanel()); }
    else if(currentTab === "cajeros"){ panel.appendChild(buildCajerosPanel()); }
    else if(currentTab === "metas"){ panel.appendChild(buildMetasPanel()); }
    else if(currentTab === "otros"){ panel.appendChild(buildMovimientosPanel()); }
    else { panel.appendChild(buildProductPanel(currentTab)); }
  }

        "<th>Se agotó</th><th>Ventas físicas</th><th>Ventas caja</th><th>Cuadre</th>" +
      "</tr></thead><tbody></tbody>";

  function handleCellInput(ev, tab, section, tbody){
    var t = ev.target;
    var idx = t.getAttribute("data-idx");
    if(idx === null) return;
    idx = parseInt(idx, 10);
    var shift = shiftView[tab];
    var day = ensureDay(currentDate);
    var sec = day[section.key];
    var row = shift === "am" ? sec.am[idx] : sec.pm[idx];
    var changed = true;

    if(t.classList.contains("field-input")){
      var field = t.getAttribute("data-field");
      if(field === "vc" || field === "f" || field === "a"){
        var newVal = numOrNull(t.value);
        changed = row[field] !== newVal;
        row[field] = newVal;
      }
      else if(field === "m"){
        // Lo que se ve/edita en pantalla es la Merma real (sin Otros) -- al guardar se le
        // vuelve a sumar Otros, para que row.m (Merma real + Otros) quede igual que siempre
        // y Ventas/Cuadre no cambien por esto.
        var otrosNow = tab === "otros" ? 0 : otrosSumFor(tab, idx, shift, day);
        var newM = round2(num(t.value) + otrosNow);
        changed = row.m !== newM;
        row.m = newM;
      }
      else {
        var newOther = num(t.value);
        changed = row[field] !== newOther;
        row[field] = newOther;
      }
    } else if(t.classList.contains("ag-input")){
      var map = shift === "am" ? sec.agAm : sec.agPm;
      var beforeAg = map[idx];
      if(t.value){ map[idx] = t.value; } else { delete map[idx]; }
      changed = beforeAg !== map[idx];
    } else {
      return;
    }

    // Reconstruir la tabla (por un guardado que termina, o por un cambio que llega de otro
    // dispositivo) mientras alguien tiene el foco puesto en una casilla puede hacer que el
    // navegador dispare un evento "change" FANTASMA sobre esa misma casilla (por perder el
    // foco cuando su <input> se vuelve a crear de cero), aunque la persona no haya escrito
    // nada nuevo. Si eso se tratara como una edición real (markDirty), un guardado que
    // termina justo en ese instante podía "olvidar" que un campo ya había quedado bien
    // guardado y, más adelante, volver a mandarlo con su valor viejo -- borrando por error
    // un cambio que otro dispositivo ya había guardado bien. Por eso: si el valor es
    // EXACTAMENTE el mismo que ya estaba, no cuenta como cambio de verdad.
    if(!changed){ updateComputedRow(tab, section, tbody, idx, shift, day); return; }

    markDirty();
    scheduleAutosave();
    updateComputedRow(tab, section, tbody, idx, shift, day);
    renderTabs();
  }

  function updateComputedRow(tab, section, tbody, idx, shift, day){
    var sec = day[section.key];
    var amRow = sec.am[idx];
    var row = shift === "am" ? amRow : sec.pm[idx];
    var v = ventasOf(row, shift, amRow);
    var c = cuadreOf(row, v);
    var flagged = isFlagged(row, shift, amRow);

    var vCell = tbody.querySelector('.ventas-cell[data-ridx="'+idx+'"]');
    if(vCell){
      if(v === null){ vCell.textContent = "—"; vCell.className = "ventas-cell pending"; }
      else {
        vCell.textContent = fmt(v);
        vCell.className = "ventas-cell " + (v < -0.004 ? "bad" : (v === 0 && row.vc===null ? "neutral" : "good"));
      }
    }
    var cCell = tbody.querySelector('.cuadre-cell[data-ridx="'+idx+'"]');
    if(cCell){
      if(c === null){ cCell.textContent = "—"; cCell.className = "cuadre-cell pending"; }
      else { cCell.textContent = fmt(c); cCell.className = "cuadre-cell " + (Math.abs(c) > 0.004 ? "bad" : "good"); }
    }
    var pendingData = shift === "am" ? row.a === null : amRow.f === null;
    var tr = tbody.querySelector('tr[data-ridx="'+idx+'"]');
    if(tr){
      tr.classList.toggle("flag", flagged);
      tr.classList.toggle("pending-data", pendingData);
    }

    if(shift === "pm"){
      var derived = tbody.querySelector('.derived[data-ridx="'+idx+'"]');
      if(derived){
        derived.textContent = amRow.f === null ? "—" : fmt(amRow.f);
        derived.classList.toggle("pending-warn", amRow.f === null);
      }
    } else {
      var aInput = tbody.querySelector('.field-input[data-idx="'+idx+'"][data-field="a"]');
      if(aInput) aInput.classList.toggle("pending-warn", row.a === null);
    }

    var agNote = tbody.querySelector('.ag-note[data-ridx="'+idx+'"]');
    if(agNote){
      var t = day.turno;
      var agTime = (shift === "am" ? sec.agAm : sec.agPm)[idx];
      var closeTime = shift === "am" ? t.sAM : t.sPM;
      var mins = minutesBetween(agTime, closeTime);
      agNote.textContent = fmtDuration(mins);
    }
  }

  function renderTableBody(tab, tbody, rowCountEl){
    var section = SECTIONS[tab];
    var shift = shiftView[tab];
    var day = getDay(currentDate);
    var sec = day[section.key];
    var t = day.turno;
    var closeTime = shift === "am" ? t.sAM : t.sPM;
    var q = filters[tab].trim().toLowerCase();
    tbody.innerHTML = "";
    var shown = 0;
    var catalog = catalogFor(tab);
    var visibleCount = 0;
    catalog.forEach(function(name, idx){
      if(isDescontinuado(tab, name)) return;
      visibleCount++;
      if(q && name.toLowerCase().indexOf(q) === -1) return;
      shown++;
      var amRow = sec.am[idx];
      var row = shift === "am" ? amRow : sec.pm[idx];
      var v = ventasOf(row, shift, amRow);
      var c = cuadreOf(row, v);
      var flagged = isFlagged(row, shift, amRow);
      var agMap = shift === "am" ? sec.agAm : sec.agPm;
      var agTime = agMap[idx] || "";
      var mins = minutesBetween(agTime, closeTime);

      // "Sin dato anterior": todavía no hay un número real de dónde partir (nadie lo contó
      // el día/turno anterior) — se avisa con un borde ámbar en la fila, distinto del rojo
      // de descuadre, para que se sepa que hay que contarlo, no que algo está mal.
      var pendingData = shift === "am" ? row.a === null : amRow.f === null;

      var tr = document.createElement("tr");
      tr.setAttribute("data-ridx", idx);
      if(flagged) tr.classList.add("flag");
      if(pendingData) tr.classList.add("pending-data");

      var saldoAntCell = shift === "am"
        ? '<input class="num-input field-input' + (row.a===null?" pending-warn":"") + '" type="number" step="any" min="0" data-idx="'+idx+'" data-field="a" value="'+(row.a===null?"":row.a)+'" placeholder="—">'
        : '<span class="derived' + (amRow.f===null?" pending-warn":"") + '" data-ridx="'+idx+'">'+(amRow.f===null?"—":fmt(amRow.f))+'</span>';

      var nameCell = tab === "otros"
        ? '<td class="name-cell">' + esc(name) +
          (readOnly ? "" : '<button type="button" class="btn-del" data-idx="'+idx+'" title="Eliminar de Otros">✕</button>') +
          '</td>'
        : "<td>" + esc(name) + "</td>";

      var otros = tab === "otros" ? 0 : otrosSumFor(tab, idx, shift, day);
