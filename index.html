    h2.style.margin = "0";
    h2.textContent = "Historial de caja de cajeros";
    headRow.appendChild(h2);
    var exportBtn = document.createElement("button");
    exportBtn.type = "button";
    exportBtn.className = "btn btn-sm";
    exportBtn.textContent = "Exportar historial (Excel)";
    exportBtn.title = "Descarga en un archivo de Excel todo lo que se ve en esta lista (según el filtro de fechas y cajero)";
    headRow.appendChild(exportBtn);
    card.appendChild(headRow);

    var filterRow = document.createElement("div");
    filterRow.className = "field-grid";
    filterRow.style.marginBottom = "1rem";
    filterRow.appendChild(buildField("Desde", "date", cajerosFiltroDesde, function(v){ cajerosFiltroDesde = v; renderPanel(); }));
    filterRow.appendChild(buildField("Hasta", "date", cajerosFiltroHasta, function(v){ cajerosFiltroHasta = v; renderPanel(); }));
    card.appendChild(filterRow);

    var cajeroNombres = [];
    (CAJACAJEROS || []).forEach(function(r){
      if(r.cajero && cajeroNombres.indexOf(r.cajero) === -1) cajeroNombres.push(r.cajero);
    });
    cajeroNombres.sort();
    var cajeroFilterRow = document.createElement("div");
    cajeroFilterRow.className = "shift-toggle";
    cajeroFilterRow.style.marginBottom = "1rem";
    cajeroFilterRow.style.flexWrap = "wrap";
    [["todos","Todos los cajeros"]].concat(cajeroNombres.map(function(n){ return [n, n]; })).forEach(function(pair){
      var fb = document.createElement("button");
      fb.type = "button";
      fb.className = "shift-btn" + (cajerosFiltroCajero === pair[0] ? " active" : "");
      fb.textContent = pair[1];
      fb.addEventListener("click", function(){ cajerosFiltroCajero = pair[0]; renderPanel(); });
      cajeroFilterRow.appendChild(fb);
    });
    card.appendChild(cajeroFilterRow);

    var filtrados = (CAJACAJEROS || []).filter(function(r){
      if(cajerosFiltroDesde && r.fecha < cajerosFiltroDesde) return false;
      if(cajerosFiltroHasta && r.fecha > cajerosFiltroHasta) return false;
      if(cajerosFiltroCajero !== "todos" && r.cajero !== cajerosFiltroCajero) return false;
      return true;
    }).sort(function(a,b){ return (b.fecha||"").localeCompare(a.fecha||"") || (b.createdAt||0) - (a.createdAt||0); });

    exportBtn.disabled = filtrados.length === 0;
    exportBtn.addEventListener("click", function(){ doExportCajeros(filtrados); });

    if(filtrados.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = (CAJACAJEROS||[]).length === 0
        ? "Todavía no hay reportes de caja guardados."
        : "No hay reportes que coincidan con el filtro.";
      card.appendChild(empty);
      wrap.appendChild(card);
      return wrap;
    }

    var tableWrap = document.createElement("div");
    tableWrap.className = "table-wrap";
    var table = document.createElement("table");
    table.className = "data-table";
    table.innerHTML = "<thead><tr><th>Fecha</th><th>Turno</th><th>Cajero</th><th>Caja</th><th>Efectivo</th><th>Transferencias</th><th>Gastos</th><th>Total calc.</th><th>Total sistema</th><th>Diferencia</th><th></th><th></th><th></th></tr></thead><tbody></tbody>";
    var tbody = table.querySelector("tbody");
    function diffCellHtml(diff){
      return diff === null ? "—" : ('<span class="cajero-diff ' + (Math.abs(diff) < 0.005 ? "good" : "bad") + '">S/ ' + fmt(diff) + '</span>');
    }
    filtrados.forEach(function(r){
      var tr = document.createElement("tr");
      var diff = cajeroDiferencia(r);
      tr.innerHTML =
        "<td>" + esc(fmtFechaCorta(r.fecha)) + "</td>" +
        "<td>" + esc(TURNO_CAJERO_LABEL[r.turno] || r.turno) + "</td>" +
        "<td>" + esc(r.cajero || "—") + "</td>" +
        "<td>" + esc(r.caja || "—") + "</td>" +
        "<td>S/ " + fmt(cajeroEfectivo(r)) + "</td>" +
        "<td>S/ " + fmt(cajeroTransferenciasTotal(r)) + "</td>" +
        "<td>S/ " + fmt(cajeroGastosTotal(r)) + "</td>" +
        "<td>S/ " + fmt(cajeroTotalCalculado(r)) + "</td>" +
        "<td>" + (r.totalSistema === null || r.totalSistema === undefined ? "—" : "S/ " + fmt(r.totalSistema)) + "</td>" +
        "<td>" + diffCellHtml(diff) + "</td>" +
        "<td>" + (readOnly ? "" : "<button type='button' class='btn btn-sm cajero-editar' data-id='" + r.id + "'>Editar</button>") + "</td>" +
        "<td><button type='button' class='btn btn-sm cajero-pdf' data-id='" + r.id + "'>PDF</button></td>" +
        "<td>" + (readOnly ? "" : '<button type="button" class="btn-del cajero-del" data-id="' + r.id + '" title="Eliminar reporte">✕</button>') + "</td>";
      tbody.appendChild(tr);
    });
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    wrap.appendChild(card);

    tbody.querySelectorAll(".cajero-pdf").forEach(function(btn){
      btn.addEventListener("click", function(){ doPrintCajero(btn.getAttribute("data-id")); });
    });
    if(!readOnly){
      tbody.querySelectorAll(".cajero-editar").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var r = (CAJACAJEROS||[]).filter(function(x){ return x.id === id; })[0];
          if(r) startEditCajero(r);
        });
      });
      tbody.querySelectorAll(".cajero-del").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var r = (CAJACAJEROS||[]).filter(function(x){ return x.id === id; })[0];
          if(!r || !db) return;
          if(!confirm('¿Eliminar el reporte de caja de "' + (r.cajero || "este cajero") + '" (' + fmtFechaCorta(r.fecha) + ')? No se puede deshacer.')) return;
          db.collection("cajaCajeros").doc(id).delete().catch(function(){
            showToast("No se pudo eliminar. Intenta de nuevo.");
          });
        });
      });
    }

    return wrap;
  }

  function doExportCajeros(rows){
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    try{
      var ordenados = rows.slice().sort(function(a,b){ return (a.fecha||"").localeCompare(b.fecha||""); });

      // Hoja 1: un resumen por reporte de turno/cajero -- sin el texto largo de gastos (eso
      // va aparte, en su propia hoja, para que se pueda sumar/filtrar bien en Excel). El
      // efectivo se separa en soles y dólares convertidos, tal como lo pidió Jessica.
      var aoa = [[
        "Fecha","Turno","Cajero","Caja","Billetes 200","Billetes 100","Billetes 50","Billetes 20","Billetes 10",
        "Monedas","Efectivo en soles","Tipo de cambio","Dólares (USD)","Convertido de dólares","Efectivo total",
        "Transferencias bancarias","Total gastos","Total calculado","Total sistema",
        "Diferencia","Notas"
      ]];
      ordenados.forEach(function(r){
        var diff = cajeroDiferencia(r);
        aoa.push([
          r.fecha || "", TURNO_CAJERO_LABEL[r.turno] || r.turno || "", r.cajero || "", r.caja || "",
          num(r.billetes && r.billetes.b200), num(r.billetes && r.billetes.b100), num(r.billetes && r.billetes.b50),
          num(r.billetes && r.billetes.b20), num(r.billetes && r.billetes.b10),
          round2(num(r.monedas)), round2(cajeroEfectivoSoles(r)),
          num(r.dolarTipoCambio), round2(cajeroDolaresTotalUSD(r)), round2(cajeroDolarConvertido(r)), round2(cajeroEfectivo(r)),
          round2(cajeroTransferenciasTotal(r)), round2(cajeroGastosTotal(r)),
          round2(cajeroTotalCalculado(r)), (r.totalSistema === null || r.totalSistema === undefined) ? "" : round2(num(r.totalSistema)),
          diff === null ? "" : round2(diff), r.notas || ""
        ]);
      });

      // Hoja 2: el detalle de gastos, una fila por cada línea de gasto de cada reporte --
      // así se puede sumar/filtrar por descripción (harina, movilidad, gas, etc.) en Excel.
      var aoaGastos = [["Fecha","Turno","Cajero","Caja","Descripción","Monto"]];
      ordenados.forEach(function(r){
        (r.gastos||[]).forEach(function(g){
          aoaGastos.push([
            r.fecha || "", TURNO_CAJERO_LABEL[r.turno] || r.turno || "", r.cajero || "", r.caja || "",
            g.desc || "", round2(num(g.monto))
          ]);
        });
      });

      // Hoja 3: el detalle de billetes de dólar, uno por fila con su serie -- para poder
      // identificar de cuál billete se trata si hace falta, sin mezclarlo con los soles.
      var aoaDolares = [["Fecha","Turno","Cajero","Caja","Serie","Monto USD"]];
      ordenados.forEach(function(r){
        cajeroDolaresList(r).forEach(function(d){
          if(num(d.monto) <= 0 && !d.serie) return;
          aoaDolares.push([
            r.fecha || "", TURNO_CAJERO_LABEL[r.turno] || r.turno || "", r.cajero || "", r.caja || "",
            d.serie || "", round2(num(d.monto))
          ]);
        });
      });

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), "Caja Cajeros");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaGastos), "Detalle de Gastos");
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaDolares), "Detalle de Dólares");
      XLSX.writeFile(wb, "caja-cajeros-historial.xlsx");
      showToast("Reporte descargado.");
    }catch(err){
      showToast("No se pudo generar el archivo. Intenta de nuevo.");
    }
  }

  function buildCajeroPrintCardHTML(r){
    var diff = cajeroDiferencia(r);
    var html = '<div style="font-family:Arial,Helvetica,sans-serif; color:#111; max-width:700px; margin:0 auto;">';
    html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">';
    html += '<div><img src="' + CARMELITAS_LOGO + '" style="height:70px; display:block; margin-bottom:6px;"></div>';
    html += '<div style="text-align:right;">' +
      '<div style="font-size:20px; font-weight:800; color:' + PEDIDO_DARK + ';">RESUMEN DE CAJA</div>' +
      '<div style="font-size:12px; color:#555; margin-top:4px;">' + esc(fmtFechaLarga(r.fecha)) + " · " + esc(TURNO_CAJERO_LABEL[r.turno] || r.turno) + '</div>' +
      '</div>';
    html += '</div>';
    html += '<div style="border-bottom:2px solid ' + PEDIDO_DARK + '; margin-top:8px;"></div>';
    html += '<table style="width:100%; border-collapse:collapse; margin-top:10px; font-size:12px;"><tr>' +
      '<td style="padding:2px 0;"><strong>Cajero:</strong> ' + esc(r.cajero || "—") + '</td>' +
      '<td style="padding:2px 0; text-align:right;"><strong>Caja:</strong> ' + esc(r.caja || "—") + '</td></tr></table>';

    function seccion(titulo){
      return '<div style="background:' + PEDIDO_DARK + '; color:#fff; font-weight:700; font-size:11px; letter-spacing:.04em; padding:4px 10px; margin-top:10px;">' + titulo + '</div>';
    }
    html += seccion("BILLETES SOLES Y MONEDAS");
    var billRows = "";
    BILLETE_VALORES.forEach(function(b){
      var cant = num(r.billetes && r.billetes[b.key]);
      billRows += '<tr><td style="border:1px solid #ccc; padding:3px 6px;">' + cant + " x " + b.label + '</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(cant*b.valor) + '</td></tr>';
    });
    billRows += '<tr><td style="border:1px solid #ccc; padding:3px 6px;">Monedas</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(r.monedas) + '</td></tr>';
    html += '<table style="width:100%; border-collapse:collapse; font-size:11px; margin-top:2px;">' + billRows + '</table>';
    html += '<div style="text-align:right; font-weight:700; margin-top:4px;">Efectivo en soles: S/ ' + fmtMoney(cajeroEfectivoSoles(r)) + '</div>';

    // Los dólares se muestran aparte, billete por billete con su serie -- para poder identificar
    // de quién es el billete si hace falta -- sin mezclarse con los soles. Solo se usa la
    // conversión para saber cuánto suman en soles dentro del total general.
    var dolaresList = cajeroDolaresList(r).filter(function(d){ return num(d.monto) > 0 || (d.serie && d.serie.trim()); });
    if(dolaresList.length > 0){
      html += seccion("BILLETES DÓLARES");
      var dolarRows = dolaresList.map(function(d){
        return '<tr><td style="border:1px solid #ccc; padding:3px 6px;">Serie: ' + esc(d.serie && d.serie.trim() ? d.serie : "—") + '</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">USD ' + fmtMoney(d.monto) + '</td></tr>';
      }).join("");
      html += '<table style="width:100%; border-collapse:collapse; font-size:11px; margin-top:2px;">' + dolarRows + '</table>';
      html += '<div style="text-align:right; font-size:11px; margin-top:4px;">Total USD: ' + fmtMoney(cajeroDolaresTotalUSD(r)) + ' &nbsp;·&nbsp; Tipo de cambio: ' + fmt(r.dolarTipoCambio) + '</div>';
      html += '<div style="text-align:right; font-weight:700; margin-top:2px;">Convertido a soles: S/ ' + fmtMoney(cajeroDolarConvertido(r)) + '</div>';
    }

    html += '<div style="text-align:right; font-weight:800; margin-top:6px; font-size:13px;">Efectivo total: S/ ' + fmtMoney(cajeroEfectivo(r)) + '</div>';

    // Algunas cajas (ej. "Caja 2") nunca manejan transferencias ni gastos -- esas cajas siempre
    // las llevan otras (ej. Caja 1 y Caja 3). En vez de adivinar por el nombre de la caja, se
    // decide por si hay datos de verdad: si no hay transferencias, no se imprime esa sección; si
    // no hay ninguna línea de gasto cargada, tampoco se imprime "Gastos" -- así no sale una
    // sección vacía o en S/0 que solo confunda.
    var transferenciasTotal = cajeroTransferenciasTotal(r);
    var gastosConDatos = (r.gastos||[]).filter(function(g){ return (g.desc && g.desc.trim()) || num(g.monto) > 0; });

    if(transferenciasTotal > 0){
      html += seccion("TRANSFERENCIAS BANCARIAS");
      html += '<table style="width:100%; border-collapse:collapse; font-size:11px; margin-top:2px;">' +
        '<tr><td style="border:1px solid #ccc; padding:3px 6px;">Transferido directo por el cliente (no es efectivo)</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(transferenciasTotal) + '</td></tr></table>';
      html += '<div style="text-align:right; font-size:10px; color:#777; margin-top:2px;">Se suma al total calculado (aunque no la tenga en mano el cajero) para comparar contra el Total del sistema.</div>';
    }

    if(gastosConDatos.length > 0){
      html += seccion("GASTOS");
      var gastoRows = gastosConDatos.map(function(g){
        return '<tr><td style="border:1px solid #ccc; padding:3px 6px;">' + esc(g.desc || "") + '</td><td style="border:1px solid #ccc; padding:3px 6px; text-align:right;">S/ ' + fmtMoney(g.monto) + '</td></tr>';
      }).join("");
      html += '<table style="width:100%; border-collapse:collapse; font-size:11px; margin-top:2px;">' + gastoRows + '</table>';
      html += '<div style="text-align:right; font-weight:700; margin-top:4px;">Total gastos: S/ ' + fmtMoney(cajeroGastosTotal(r)) + '</div>';
    }

    html += '<div style="border-top:2px solid ' + PEDIDO_DARK + '; margin-top:10px; padding-top:6px; font-size:13px;">';
    html += '<div style="display:flex; justify-content:space-between; font-weight:800;"><span>TOTAL CALCULADO</span><span>S/ ' + fmtMoney(cajeroTotalCalculado(r)) + '</span></div>';
    if(diff !== null){
      html += '<div style="display:flex; justify-content:space-between; margin-top:2px;"><span>Total del sistema</span><span>S/ ' + fmtMoney(r.totalSistema) + '</span></div>';
      html += '<div style="display:flex; justify-content:space-between; margin-top:2px; font-weight:700; color:' + (Math.abs(diff) < 0.005 ? "#1a7a3c" : "#cc0000") + ';"><span>Diferencia</span><span>S/ ' + fmtMoney(diff) + '</span></div>';
    }
    html += '</div>';
    if(r.notas && r.notas.trim()){
      html += '<div style="margin-top:10px; font-size:11px; color:#555;"><strong>Notas:</strong> ' + esc(r.notas) + '</div>';
    }
    html += '</div>';
    return html;
  }

  function doPrintCajero(id){
    var r = (CAJACAJEROS || []).filter(function(x){ return x.id === id; })[0];
    if(!r) return;
    setPrintOrientation(false);
    var area = document.getElementById("printArea");
    area.innerHTML = buildCajeroPrintCardHTML(r);
    doWindowPrint("Caja " + (r.cajero || "") + " " + (r.fecha || ""));
  }

  function attachCajerosSync(){
    cajerosSyncError = false;
    db.collection("cajaCajeros").onSnapshot(function(snap){
      cajerosSyncError = false;
      var list = [];
      snap.forEach(function(doc){
        var data = doc.data();
        data.id = doc.id;
        list.push(data);
      });
      CAJACAJEROS = list;
      if(currentTab === "cajeros" && cajerosView !== "nuevo") renderPanel();
    }, function(){
      cajerosSyncError = true;
      if(currentTab === "cajeros" && CAJACAJEROS === null){
        showToast("No se pudo cargar el historial de caja de cajeros.");
        renderPanel();
      }
    });
  }

  // ---------- wiring ----------
  function wireStatic(){
    document.getElementById("datePicker").value = currentDate;
    document.getElementById("datePicker").addEventListener("change", function(ev){
      if(!STATE) return;
      currentDate = ev.target.value || todayISO();
      renderAll();
    });
    document.getElementById("saveBtn").addEventListener("click", function(){ if(STATE) doSave(); });
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(!STATE) return;
        var destino = btn.getAttribute("data-tab");
        // Al salir de Caja Cajeros hacia cualquier otra pestaña, se vuelve a pedir la clave la
        // próxima vez que se entre -- así no queda abierto a la vista de todos aunque el
        // navegador nunca se cierre.
        if(currentTab === "cajeros" && destino !== "cajeros"){
          cajerosDesbloqueado = false;
          cajerosLockError = false;
        }
        currentTab = destino; renderAll();
      });
    });
  }

  function attachRemoteSync(onFirstLoad){
    var ref = db.collection("arqueo").doc("state");
    var firstLoadDone = false;
    ref.onSnapshot(function(snap){
      if(!snap.exists){
        // Primera vez que se usa esta base de datos: la sembramos con los datos que
        // ya tenía la app (incluido lo migrado del Excel de setiembre).
        ref.set(readEmbeddedSeed()).catch(function(){});
        return;
      }
      var data = normalizeState(snap.data());
      if(data.meta && data.meta.lastSavedAt && data.meta.lastSavedAt === lastSavedBySelf){
        // Es el eco de nuestro propio guardado — ya lo tenemos aplicado.
        if(!firstLoadDone){ firstLoadDone = true; onFirstLoad(data); }
        return;
      }
      if(!firstLoadDone){
        firstLoadDone = true;
        onFirstLoad(data);
        return;
      }
      if(dirty || saving){
        // Llegó un cambio de otro dispositivo mientras acá había algo sin guardar todavía.
        // Ya NO se bloquea el guardado ni hace falta actualizar a mano: se combinan los
        // cambios de ese otro dispositivo con lo que se está editando acá mismo, campo por
        // campo, para que no se pierda ni lo de uno ni lo del otro.
        STATE = mergeStateForSave(data, STATE, baseline);
        renderAll();
        // OJO: "baseline" tiene que quedar con SOLO lo confirmado en la base de datos
        // (relleno para que tenga la misma forma que STATE), nunca con lo que se está
        // editando acá mismo todavía sin guardar -- si se guardara con eso mezclado, la
        // próxima comparación ya no reconocería esos cambios como "cambios pendientes"
        // y se quedarían sin guardar nunca.
        baseline = backfillAllDays(deepClone(data));
        showToast("Se combinaron cambios de otro dispositivo.");
        scheduleAutosave();
        return;
      }
      STATE = data;
      renderAll();
      baseline = deepClone(STATE);
    }, function(){
      readOnly = true;
      showBanner("bad", "No se pudo conectar con la base de datos. Revisa tu conexión a internet y recarga la página.", []);
      setSaveStatus();
    });
  }

  function attachPedidosSync(){
    db.collection("pedidos").onSnapshot(function(snap){
      var list = [];
      snap.forEach(function(doc){
        var data = doc.data();
        data.id = doc.id;
        list.push(data);
      });
      list.sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
      PEDIDOS = list;
      // No repintamos si está en "Nuevo pedido": así no se pierde lo que está escribiendo
      // si otra persona (ej. quien toma pedidos por WhatsApp) guarda algo al mismo tiempo.
      if(currentTab === "pedidos" && pedidosView !== "nuevo") renderPanel();
    }, function(){
      // Si falla, dejamos PEDIDOS como esté (puede seguir null) y avisamos solo si
      // el usuario está mirando esa pestaña.
      if(currentTab === "pedidos" && PEDIDOS === null){
        showToast("No se pudo cargar los pedidos. Revisa tu conexión e intenta de nuevo.");
      }
    });
  }

  function attachClientesSync(){
    db.collection("clientes").onSnapshot(function(snap){
      var map = {};
      snap.forEach(function(doc){ map[doc.id] = doc.data(); });
      CLIENTES = map;
      if(currentTab === "pedidos" && pedidosView !== "nuevo") renderPanel();
    }, function(){
      if(currentTab === "pedidos" && CLIENTES === null){
        showToast("No se pudo cargar los clientes guardados.");
      }
    });
  }

    wireStatic();

  // ---------- lock screen (contraseña compartida del equipo) ----------
  var APP_PASSWORD = "Carmelitas2026";
  function isUnlocked(){
    try{ return sessionStorage.getItem("arqueo_unlocked") === "1"; }catch(e){ return false; }
  }
  function setUnlocked(){
    try{ sessionStorage.setItem("arqueo_unlocked", "1"); }catch(e){}
  }
  function showLock(){
    document.getElementById("lockScreen").hidden = false;
    document.getElementById("appRoot").hidden = true;
    var input = document.getElementById("lockInput");
    setTimeout(function(){ input.focus(); }, 30);
  }
  function hideLock(){
    document.getElementById("lockScreen").hidden = true;
    document.getElementById("appRoot").hidden = false;
  }
  function wireLock(){
    var form = document.getElementById("lockForm");
    var input = document.getElementById("lockInput");
    var err = document.getElementById("lockError");
    var toggle = document.getElementById("lockToggle");
    toggle.addEventListener("click", function(){
      var show = input.type === "password";
      input.type = show ? "text" : "password";
      toggle.textContent = show ? "Ocultar" : "Mostrar";
      input.focus();
    });
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      // Recorta espacios de más al principio/final: en el celular es fácil que el
      // teclado agregue un espacio sin que se note, sobre todo escribiendo a mano
      // (con copiar y pegar eso no pasa, por eso ahí sí entraba).
      var typed = input.value.replace(/^\s+|\s+$/g, "");
      if(typed === APP_PASSWORD){
        setUnlocked();
        hideLock();
        init();
      } else {
        err.hidden = false;
        input.value = "";
        input.focus();
      }
    });
  }

  function boot(){
    wireLock();
    if(isUnlocked()){ hideLock(); init(); }
    else { showLock(); }
  }

  if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", boot); }
  else { boot(); }
})();
