<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<title>Arqueo Diario</title>
<style>
  :root{
    --bg:#F5F3EE;
    --surface:#FFFFFF;
    --surface-2:#ECE5D6;
    --border:#DDD3BE;
    --ink:#241C13;
    --ink-soft:#6C5F49;
    --ink-muted:#96896E;
    --accent:#1F5B6E;
    --accent-ink:#FFFFFF;
    --accent-soft:#DEEAEC;
    --good:#3D7A57;
    --good-soft:#E3F0E7;
    --bad:#B34428;
    --bad-soft:#FAE6DF;
    --warn:#A6631B;
    --warn-soft:#F5E8D2;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(36,28,19,.06), 0 10px 28px -14px rgba(36,28,19,.22);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18140E; --surface:#221C14; --surface-2:#2C2519; --border:#3C3222;
      --ink:#F2ECDE; --ink-soft:#C3B79E; --ink-muted:#8C8069;
      --accent:#72B8CB; --accent-ink:#0E2A31; --accent-soft:#213A3F;
      --good:#71BE93; --good-soft:#1F3627; --bad:#E28369; --bad-soft:#3D2419;
      --warn:#D9A75E; --warn-soft:#3A2C16;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#18140E; --surface:#221C14; --surface-2:#2C2519; --border:#3C3222;
    --ink:#F2ECDE; --ink-soft:#C3B79E; --ink-muted:#8C8069;
    --accent:#72B8CB; --accent-ink:#0E2A31; --accent-soft:#213A3F;
    --good:#71BE93; --good-soft:#1F3627; --bad:#E28369; --bad-soft:#3D2419;
    --warn:#D9A75E; --warn-soft:#3A2C16;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; padding:0; margin:-1px; }
  button, input, textarea{ font-family:inherit; color:inherit; }
  input:focus-visible, textarea:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .app{ max-width:1120px; margin:0 auto; padding-bottom:4rem; }

  .topbar{ position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); padding:.9rem 1.1rem 0; }
  .topbar-inner{ display:flex; flex-wrap:wrap; gap:.9rem 1.4rem; align-items:flex-end; justify-content:space-between; padding-bottom:.8rem; }
  .brand-title{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.55rem; letter-spacing:-.01em; margin:0; text-wrap:balance; }
  .brand-sub{ font-size:.82rem; color:var(--ink-soft); margin-top:.15rem; }
  .topbar-controls{ display:flex; align-items:flex-end; gap:1rem; flex-wrap:wrap; }
  .date-field input[type="date"]{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.5rem .65rem; font-size:.92rem; color:var(--ink); }
  .save-area{ display:flex; flex-direction:column; align-items:flex-end; gap:.3rem; }
  .save-status{ font-size:.78rem; color:var(--ink-muted); white-space:nowrap; }
  .save-status.warn{ color:var(--warn); }
  .save-status.bad{ color:var(--bad); }
  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--radius-sm); padding:.55rem 1rem; font-size:.88rem; font-weight:600; cursor:pointer; transition:filter .12s ease; }
  .btn:hover{ filter:brightness(0.97); }
  @media (prefers-color-scheme:dark){ .btn:hover{ filter:brightness(1.12); } }
  :root[data-theme="dark"] .btn:hover{ filter:brightness(1.12); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-sm{ padding:.35rem .65rem; font-size:.78rem; }

  .tabs{ display:flex; gap:.4rem; overflow-x:auto; padding-bottom:.7rem; -ms-overflow-style:none; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ border:1px solid transparent; background:transparent; color:var(--ink-soft); padding:.5rem .85rem; border-radius:999px; font-size:.86rem; font-weight:600; white-space:nowrap; cursor:pointer; }
  .tab-btn .count{ display:inline-block; margin-left:.4rem; font-size:.72rem; font-weight:700; background:var(--bad-soft); color:var(--bad); border-radius:999px; padding:.05rem .4rem; }
  .tab-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .tab-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft); }
  :root[data-theme="dark"] .tab-btn.active{ color:var(--ink); }
  @media (prefers-color-scheme:dark){ .tab-btn.active{ color:var(--ink); } }

  #banners{ padding:0 1.1rem; }
  .banner{ margin-top:.9rem; border-radius:var(--radius-sm); padding:.7rem .9rem; font-size:.86rem; display:flex; gap:.7rem; align-items:flex-start; justify-content:space-between; }
  .banner.warn{ background:var(--warn-soft); color:var(--warn); }
  .banner.bad{ background:var(--bad-soft); color:var(--bad); }
  .banner.info{ background:var(--accent-soft); color:var(--accent); }
  .banner-actions{ display:flex; gap:.5rem; flex-shrink:0; }
  .banner button{ border:1px solid currentColor; background:transparent; color:inherit; border-radius:6px; padding:.25rem .6rem; font-size:.78rem; font-weight:600; cursor:pointer; }

  .main{ padding:1.1rem; }
  .strip{ display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; align-items:baseline; color:var(--ink-soft); font-size:.85rem; margin-bottom:1rem; }
  .strip strong{ color:var(--ink); font-weight:700; }
  .strip .ok{ color:var(--good); font-weight:600; }
  .strip .alert{ color:var(--bad); font-weight:600; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.1rem 1.2rem; margin-bottom:1rem; }
  .card h2{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.1rem; margin:0 0 .9rem; }
  .card h3{ font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin:1.1rem 0 .5rem; }
  .card h3:first-child{ margin-top:0; }
  .card .hint{ font-size:.78rem; color:var(--ink-muted); margin:-.5rem 0 .8rem; }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.9rem 1.1rem; }
  @media (max-width:620px){ .field-grid{ grid-template-columns:1fr; } }
  .field{ display:flex; flex-direction:column; gap:.32rem; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:.78rem; color:var(--ink-soft); font-weight:600; }
  .field input, .field textarea{ background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.55rem .65rem; font-size:.92rem; color:var(--ink); width:100%; }
  .field textarea{ min-height:4.2rem; resize:vertical; font-family:inherit; }

  .shift-toggle{ display:inline-flex; background:var(--surface-2); border-radius:999px; padding:.2rem; gap:.15rem; }
  .shift-btn{ border:none; background:transparent; color:var(--ink-soft); padding:.4rem .95rem; border-radius:999px; font-size:.84rem; font-weight:700; cursor:pointer; }
  .shift-btn.active{ background:var(--accent); color:var(--accent-ink); }

  .name-cell{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
  .btn-del{ flex:none; width:1.5rem; height:1.5rem; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--bad); font-size:.75rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .btn-del:hover{ background:var(--bad); color:#fff; border-color:var(--bad); }
  .add-row{ display:flex; gap:.6rem; align-items:center; margin-bottom:.8rem; flex-wrap:wrap; }
  .add-row input[type="text"]{ flex:1; min-width:220px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.5rem .7rem; font-size:.88rem; color:var(--ink); }
  .search-row{ display:flex; gap:.6rem; align-items:center; margin-bottom:.8rem; flex-wrap:wrap; justify-content:space-between; }
  .search-row .search-left{ display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; flex:1; }
  .search-row input[type="search"]{ flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.5rem .7rem; font-size:.88rem; color:var(--ink); }
  .legend{ display:flex; gap:.9rem; font-size:.76rem; color:var(--ink-muted); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:.35rem; }
  .dot{ width:.5rem; height:.5rem; border-radius:50%; display:inline-block; }
  .dot.good{ background:var(--good); }
  .dot.bad{ background:var(--bad); }
  .dot.neutral{ background:var(--ink-muted); }

  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
  table.data-table{ border-collapse:collapse; width:100%; min-width:920px; font-variant-numeric:tabular-nums; }
  table.data-table thead th{ position:sticky; top:0; background:var(--surface-2); color:var(--ink-soft); font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; font-weight:700; text-align:right; padding:.55rem .55rem; border-bottom:1px solid var(--border); white-space:nowrap; z-index:2; }
  table.data-table thead th:first-child{ text-align:left; left:0; z-index:3; }
  table.data-table tbody td{ padding:.35rem .5rem; border-bottom:1px solid var(--border); text-align:right; background:var(--surface); vertical-align:middle; }
  table.data-table tbody tr:last-child td{ border-bottom:none; }
  table.data-table tbody tr:nth-child(even) td{ background:var(--bg); }
  table.data-table tbody td:first-child{ text-align:left; font-weight:600; color:var(--ink); position:sticky; left:0; z-index:1; }
  table.data-table tbody tr.flag td:first-child{ box-shadow:inset 3px 0 0 var(--bad); }
  .ing-group{ display:inline-flex; gap:.2rem; }
  .num-input{ width:4.1rem; text-align:right; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:.3rem .35rem; font-size:.85rem; color:var(--ink); font-variant-numeric:tabular-nums; }
  .num-input.mini{ width:2.15rem; padding:.3rem .2rem; text-align:center; }
  .num-input.vc{ width:4.4rem; }
  .time-input{ width:5.7rem; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:.28rem .35rem; font-size:.8rem; color:var(--ink); }
  .ag-note{ font-size:.68rem; color:var(--bad); margin-top:.15rem; text-align:right; }
  .derived{ color:var(--ink-muted); font-size:.85rem; font-style:italic; }
  .ventas-cell{ font-weight:700; min-width:3.6rem; }
  .ventas-cell.good{ color:var(--good); }
  .ventas-cell.bad{ color:var(--bad); }
  .ventas-cell.neutral{ color:var(--ink-muted); font-weight:600; }
  .cuadre-cell{ font-weight:700; min-width:3.6rem; }
  .cuadre-cell.good{ color:var(--good); }
  .cuadre-cell.bad{ color:var(--bad); }
  .cuadre-cell.pending{ color:var(--ink-muted); font-weight:500; }
  .row-count{ font-size:.78rem; color:var(--ink-muted); margin-top:.6rem; }

  .history-list{ display:flex; flex-direction:column; gap:.7rem; }
  .history-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.85rem 1rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; cursor:pointer; text-align:left; width:100%; box-shadow:var(--shadow); }
  .history-card:hover{ border-color:var(--accent); }
  .history-date{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.02rem; text-transform:capitalize; }
  .history-meta{ font-size:.8rem; color:var(--ink-soft); margin-top:.2rem; }
  .history-badges{ display:flex; gap:.4rem; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .history-export-btn{ font-size:.72rem; padding:.3rem .55rem; }
  .chip{ font-size:.74rem; font-weight:700; border-radius:999px; padding:.2rem .6rem; white-space:nowrap; }
  .chip.good{ background:var(--good-soft); color:var(--good); }
  .chip.bad{ background:var(--bad-soft); color:var(--bad); }
  .chip.pedido-pagado-toggle{ border:none; cursor:pointer; font-family:inherit; }
  .pedido-totals{ margin-top:1rem; padding-top:.8rem; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:.25rem; font-size:.92rem; }
  .pedido-checkbox-label{ display:flex; align-items:center; gap:.5rem; font-size:.9rem; font-weight:600; cursor:pointer; }
  .pedido-checkbox-label input{ width:auto; }
  .pedido-productos-cell{ max-width:320px; white-space:normal; }
  .empty-state{ color:var(--ink-soft); font-size:.9rem; padding:1.4rem 0; text-align:center; }

  .toast{ position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:.6rem 1rem; border-radius:999px; font-size:.84rem; box-shadow:var(--shadow); z-index:40; max-width:90vw; text-align:center; }
  @media (prefers-color-scheme:dark){ .toast{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border); } }
  :root[data-theme="dark"] .toast{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border); }

  .lock-screen{ position:fixed; inset:0; z-index:100; background:var(--bg); align-items:center; justify-content:center; padding:1.2rem; }
  .lock-screen:not([hidden]){ display:flex; }
  .lock-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.6rem 1.6rem 1.8rem; max-width:340px; width:100%; text-align:center; }
  .lock-title{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.4rem; margin:0 0 .3rem; }
  .lock-sub{ font-size:.85rem; color:var(--ink-soft); margin:0 0 1.1rem; }
  .lock-input{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.65rem .8rem; font-size:1rem; color:var(--ink); text-align:center; margin-bottom:.8rem; }
  .lock-btn{ width:100%; }
  .lock-error{ color:var(--bad); font-size:.82rem; margin:.8rem 0 0; }

  #printArea{ display:none; }
  @media print{
    .app, .toast, #banners{ display:none !important; }
    #printArea{
      display:block !important; background:#fff; color:#111; padding:0; margin:0;
      font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif; font-size:11px;
    }
    #printArea h1{ font-family:"Fraunces", Georgia, serif; font-size:20px; margin:0 0 .1em; }
    #printArea .print-sub{ font-size:13px; color:#333; margin:0 0 .8em; }
    #printArea .print-summary{ font-weight:700; margin:.6em 0; }
    #printArea .meta-line{ margin:.15em 0; }
    #printArea h2{ font-size:13px; margin:1.1em 0 .3em; page-break-after:avoid; }
    #printArea table{ width:100%; border-collapse:collapse; margin-bottom:.6em; font-variant-numeric:tabular-nums; }
    #printArea th, #printArea td{ border:1px solid #999; padding:2px 5px; text-align:right; }
    #printArea th:first-child, #printArea td:first-child{ text-align:left; }
    #printArea thead{ background:#eee; }
    #printArea tr{ page-break-inside:avoid; }
    #printArea tr.flagged td{ background:#fbdcd4; font-weight:700; }
    #printArea .print-empty{ color:#555; font-style:italic; margin:0 0 .8em; }
    #printArea .print-footer{ margin-top:1.2em; font-size:9px; color:#777; }
    @page{ margin:14mm; }
  }
</style>

<div id="lockScreen" class="lock-screen" hidden>
  <form id="lockForm" class="lock-card">
    <h1 class="lock-title">Arqueo Diario</h1>
    <p class="lock-sub">Ingresa la contraseña del equipo para continuar.</p>
    <input id="lockInput" class="lock-input" type="password" inputmode="text" autocomplete="off" placeholder="Contraseña" />
    <button class="btn btn-primary lock-btn" type="submit">Entrar</button>
    <p id="lockError" class="lock-error" hidden>Contraseña incorrecta. Intenta de nuevo.</p>
  </form>
</div>

<div class="app" id="appRoot" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 class="brand-title">Arqueo Diario</h1>
        <div class="brand-sub" id="brandSub">Registro diario</div>
      </div>
      <div class="topbar-controls">
        <label class="date-field">
          <span class="visually-hidden">Fecha</span>
          <input type="date" id="datePicker" />
        </label>
        <div class="save-area">
          <span class="save-status" id="saveStatus">Cargando…</span>
          <button class="btn btn-primary" id="saveBtn" type="button">Guardar</button>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn" data-tab="panes" type="button">Panes</button>
      <button class="tab-btn" data-tab="bebidas" type="button">Bebidas</button>
      <button class="tab-btn" data-tab="embutidos" type="button">Embutidos</button>
      <button class="tab-btn" data-tab="triples" type="button">Triples</button>
      <button class="tab-btn" data-tab="otros" type="button">Otros</button>
      <button class="tab-btn" data-tab="pedidos" type="button">Pedidos</button>
      <button class="tab-btn" data-tab="turno" type="button">Turno</button>
      <button class="tab-btn" data-tab="historial" type="button">Historial</button>
    </nav>
  </header>

  <div id="banners"></div>
  <main class="main" id="panel"></main>
</div>
<div class="toast" id="toast" hidden></div>

      sec.pm.forEach(function(row, i){ if(isFlagged(row, "pm", sec.am[i])) counts[tab]++; });
    });
    counts.total = counts.panes + counts.bebidas + counts.embutidos + counts.triples + counts.otros;
    return counts;
  }

  // ---------- migration (old single-shift schema -> shift schema) ----------
  function migrateOldSection(catalog, oldArr){
    var am = [], pm = [];
    catalog.forEach(function(_, i){
      var old = (oldArr && oldArr[i]) || [0,0,0,0];
      var a = old[0]||0, ing = old[1]||0, m = old[2]||0, f = old[3]||0;
      am.push({ a:a, i1:ing, i2:0, i3:0, m:m, f:f, vc:null });
      pm.push({ i1:0, i2:0, i3:0, m:0, f:f, vc:null });
    });
    return { am:am, pm:pm, agAm:{}, agPm:{} };
  }
  function migrateStateObj(s){
    if(s.meta.schema === 2) return;
    Object.keys(s.days).forEach(function(d){
      var day = s.days[d];
      if(day.p && !day.p.am){ day.p = migrateOldSection(PANES, day.p); }
      if(day.b && !day.b.am){ day.b = migrateOldSection(BEBIDAS, day.b); }
      if(day.e && !day.e.am){ day.e = migrateOldSection(EMBUTIDOS, day.e); }
    });
    s.meta.schema = 2;
  }

  // ---------- persistence (Firebase Firestore) ----------
  function normalizeState(parsed){
    parsed = parsed || {};
    if(!parsed.meta) parsed.meta = { businessName:"", lastSavedAt:null, schema:2 };
    if(!parsed.days) parsed.days = {};
    if(!parsed.customCatalog) parsed.customCatalog = [];
    if(!parsed.precios) parsed.precios = {};
    migrateStateObj(parsed);
    return parsed;
  }
  function readEmbeddedSeed(){
    var el = document.getElementById("state-data");
    var parsed = {};
    try{ parsed = JSON.parse(el.textContent || "{}"); }catch(e){ parsed = {}; }
    return normalizeState(parsed);
  }

  function stashBackup(){
    try{
      sessionStorage.setItem("arqueo_backup", JSON.stringify({
        date: currentDate, ts: Date.now(), day: STATE.days[currentDate] || null
      }));
    }catch(e){}
  }
  function clearBackup(){ try{ sessionStorage.removeItem("arqueo_backup"); }catch(e){} }

  function restoreBackupBanner(){
    var raw;
    try{ raw = sessionStorage.getItem("arqueo_backup"); }catch(e){ raw = null; }
    if(!raw) return;
    var backup;
    try{ backup = JSON.parse(raw); }catch(e){ return; }
    if(!backup || !backup.day) return;
    if(Date.now() - backup.ts > 30*60*1000){ clearBackup(); return; }
    var current = STATE.days[backup.date];
    var same = current && JSON.stringify(current) === JSON.stringify(backup.day);
    if(same){ clearBackup(); return; }
    showBanner("info", "Tenías cambios sin guardar de tu última sesión (" + fmtDateLabel(backup.date) + ").",
      [{ label:"Recuperar", action:function(){
          STATE.days[backup.date] = backup.day;
          clearBackup();
          markDirty();
          currentDate = backup.date;
          document.getElementById("datePicker").value = currentDate;
          renderAll();
          scheduleAutosave();
        }},
       { label:"Descartar", action:function(){ clearBackup(); renderBanners(); }}]);
  }

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, 3200);
  }

  function markDirty(){ dirty = true; setSaveStatus(); }
  function setSaveStatus(){
    var el = document.getElementById("saveStatus");
    var btn = document.getElementById("saveBtn");
    if(readOnly){ el.textContent = "No se pudo guardar — revisa tu conexión"; el.className = "save-status bad"; btn.disabled = true; return; }
    btn.disabled = saving;
    if(saving){ el.textContent = "Guardando…"; el.className = "save-status"; return; }
    if(dirty){ el.textContent = "Cambios sin guardar"; el.className = "save-status warn"; return; }
    if(STATE.meta.lastSavedAt){
      var mins = Math.round((Date.now() - STATE.meta.lastSavedAt)/60000);
      el.textContent = mins < 1 ? "Guardado justo ahora" : "Guardado hace " + mins + " min";
    } else { el.textContent = "Sin cambios"; }
    el.className = "save-status";
  }

  function scheduleAutosave(){ clearTimeout(saveTimer); saveTimer = setTimeout(function(){ doSave(); }, 1500); }

  function doSave(){
    if(readOnly || saving || !db) { setSaveStatus(); return; }
    clearTimeout(saveTimer);
    saving = true;
    setSaveStatus();
    stashBackup();
    STATE.meta.lastSavedAt = Date.now();
    lastSavedBySelf = STATE.meta.lastSavedAt;
    db.collection("arqueo").doc("state").set(STATE)
      .then(function(){ saving = false; dirty = false; clearBackup(); setSaveStatus(); })
      .catch(function(err){ saving = false; handleSaveError(err); });
  }

  function handleSaveError(err){
    var code = err && err.code;
    if(code === "permission-denied"){
      showBanner("bad", "No se pudo guardar: sin permiso de escritura en la base de datos. Avísale al dueño del arqueo.", []);
      setSaveStatus();
      return;
    }
    showToast("No se pudo guardar (revisa tu conexión a internet). Vuelve a intentar en unos segundos.");
    setSaveStatus();
  }

  // ---------- import (reporte de ventas del sistema) ----------
  // Nombres que el sistema exporta distinto al catálogo del arqueo (mismo producto,
  // solo cambia la forma de escribirlo: abreviaturas, singular/plural, una letra de más o menos).
  var IMPORT_ALIASES = {
    "MANT LAIVE 180 GR": "Mantequilla Laive 180g",
    "MANT LAIVE 90 GR": "Mantequilla Laive 90g",
    "CROISANT DE MANJAR": "Croissant De Manjar",
    "OREJAS": "Oreja",
    "MASA MADRE CON FRUTOS ENTERO": "Masa Madre con Frutos",
    "ACEITUNA ENTERA POR KILO": "Aceituna",
    "ACEITUNA ENTERA X KG": "Aceituna",
    "LECHE LIGTH CAJA LT - SEMI": "Leche Light Caja LT - Semi",
    "MIEL FRASCO 200 GR": "Miel Frasco 200g",
    "MIEL FRASCO 250 GR": "Miel Frasco 250g",
    "MIEL FRASCO 500 GR": "Miel Frasco 500g",
    "QUESO MOZARELLA": "Queso Mozzarella",
    "TOSTADA AL AJO X 0 130G": "Tostada Ciabatta al Ajo",
    "TOSTADAS MASA MADRE X 0 120GR": "Tostada Masa Madre"
  };
  // Triples: el sistema de ventas registra cada sabor de dos formas — "UND T. X" (unidad suelta)
  // y "TIRA DE X" (la tira entera sin cortar, que son 3 unidades). Como el arqueo se lleva en
  // unidades, cada línea "TIRA DE X" del reporte cuenta triple (mult:3) y se suma a la misma fila
  // que "UND T. X" (mult:1). Pavo y Glaseado Piña no aparecieron en los reportes que revisamos —
  // están puestos siguiendo el mismo patrón, pero avísame si no calzan cuando los vendan.
  var TRIPLE_IMPORT_MAP = {
    "UND T CLASICO": { name: "Triples Clásicos", mult: 1 },
    "TIRA DE CLASICOS": { name: "Triples Clásicos", mult: 3 },
    "UND T ACEITUNA": { name: "Triple de Aceituna", mult: 1 },
    "TIRA DE ACEITUNA": { name: "Triple de Aceituna", mult: 3 },
    "UND T ASADO": { name: "Triple de Asado", mult: 1 },
    "TIRA DE ASADO": { name: "Triple de Asado", mult: 3 },
    "UND T POLLO DURAZNO": { name: "Triple de Pollo Durazno", mult: 1 },
    "TIRA DE POLLO DURAZNO": { name: "Triple de Pollo Durazno", mult: 3 },
    "UND T PAVO": { name: "Triple de Pavo", mult: 1 },
    "TIRA DE PAVO": { name: "Triple de Pavo", mult: 3 },
    "UND T GLASEADO PINA": { name: "Triple Glaseado Piña", mult: 1 },
    "TIRA DE GLASEADO PINA": { name: "Triple Glaseado Piña", mult: 3 },
    "UND T CHAMPINON Y TOCINO": { name: "Triple Champiñón y Tocino", mult: 1 },
    "TIRA DE CHAMPINON Y TOCINO": { name: "Triple Champiñón y Tocino", mult: 3 },
    "UND T POLLO CON JAMON Y QUESO": { name: "Triple Pollo Jamón y Queso", mult: 1 },
    "TIRA DE POLLO CON JAMON Y QUESO": { name: "Triple Pollo Jamón y Queso", mult: 3 }
  };
  function normName(s){
    s = String(s || "").trim().toUpperCase();
    if(s.normalize) s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    s = s.replace(/[.()]/g, " ");
    s = s.replace(/[^A-Z0-9 ]/g, " ");
    s = s.replace(/\s+/g, " ").trim();
    return s;
  }
  function buildCatalogIndex(){
    var idx = {};
    PRODUCT_TABS.forEach(function(tabKey){
      catalogFor(tabKey).forEach(function(name, i){
        idx[normName(name)] = { tab: tabKey, idx: i, name: name };
      });
    });
    return idx;
  }
  function resolveCatalogEntry(catIndex, posName){
    var n = normName(posName);
    if(catIndex[n]) return { hit: catIndex[n], mult: 1 };
    var tri = TRIPLE_IMPORT_MAP[n];
    if(tri){
      var tn = normName(tri.name);
      if(catIndex[tn]) return { hit: catIndex[tn], mult: tri.mult };
    }
    var alias = IMPORT_ALIASES[n];
    if(alias){
      var an = normName(alias);
      if(catIndex[an]) return { hit: catIndex[an], mult: 1 };
    }
    return null;
  }
  // El sistema de ventas exporta a veces un reporte "simple" (Código, Nombre, Cantidad Vendida
  // en las primeras 3 columnas) y a veces uno "detallado por familia" (con Stock, Precio, etc.
  // de por medio, donde Cantidad Vendida cae en otra columna). Por eso buscamos el encabezado
  // real ("CDARTICULO" / "DSARTICULO" / "Cantidad Vendida") y detectamos en qué columna cae
  // cada uno, en vez de asumir siempre las primeras tres columnas.
  function findSalesColumns(aoa){
    for(var r = 0; r < Math.min((aoa || []).length, 40); r++){
      var row = aoa[r] || [];
      var codeCol = -1, nameCol = -1, qtyCol = -1;
      for(var c = 0; c < row.length; c++){
        var cell = String(row[c] == null ? "" : row[c]).trim().toUpperCase();
        if(cell === "CDARTICULO") codeCol = c;
        else if(cell === "DSARTICULO") nameCol = c;
        else if(cell.indexOf("CANTIDAD VENDIDA") === 0) qtyCol = c;
      }
      if(codeCol !== -1 && nameCol !== -1 && qtyCol !== -1) return { code: codeCol, name: nameCol, qty: qtyCol };
    }
    return null;
  }
  // Detecta filas de producto por patrón (código numérico, nombre de texto, cantidad numérica) en
  // vez de depender de encabezados exactos para cada fila — así ignora títulos, "Familia :",
  // subtotales y el total general. Las columnas en sí se ubican con findSalesColumns() arriba.
  function parseSalesAOA(aoa){
    var items = [];
    var cols = findSalesColumns(aoa) || { code: 0, name: 1, qty: 2 };
    (aoa || []).forEach(function(row){
      if(!row || row.length <= Math.max(cols.code, cols.name, cols.qty)) return;
      var code = row[cols.code], name = row[cols.name], qtyRaw = row[cols.qty];
      var codeNum = (typeof code === "number") ? code : parseFloat(String(code == null ? "" : code).replace(",", "."));
      var qtyNum = (typeof qtyRaw === "number") ? qtyRaw : parseFloat(String(qtyRaw == null ? "" : qtyRaw).replace(",", "."));
      if(!isFinite(codeNum) || codeNum <= 0) return;
      if(typeof name !== "string" || !name.trim()) return;
      if(!isFinite(qtyNum)) return;
      items.push({ code: codeNum, name: String(name).trim(), qty: qtyNum });
    });
    return items;
  }
  function applyImport(items, date, shift){
    var catIndex = buildCatalogIndex();
    var day = ensureDay(date);
    var updated = { panes:0, bebidas:0, embutidos:0, triples:0, otros:0 };
    var skipped = [];
    // Varias líneas del reporte pueden apuntar al mismo producto del catálogo (p.ej. Triples:
    // "unidad suelta" + "tira"), así que primero sumamos todo por producto y recién al final
    // escribimos una vez por fila — así no se pisan entre sí ni se duplican si se reimporta.
    var sums = {};
    var hits = {};
    items.forEach(function(item){
      var resolved = resolveCatalogEntry(catIndex, item.name);
      if(!resolved){ skipped.push(item.name); return; }
      var key = resolved.hit.tab + ":" + resolved.hit.idx;
      if(!(key in sums)){ sums[key] = 0; hits[key] = resolved.hit; }
      sums[key] += item.qty * resolved.mult;
    });
    Object.keys(sums).forEach(function(key){
      var hit = hits[key];
      var section = SECTIONS[hit.tab];
      var sec = day[section.key];
      var row = shift === "am" ? sec.am[hit.idx] : sec.pm[hit.idx];
      row.vc = sums[key];
      updated[hit.tab]++;
    });
    return { updated: updated, skipped: skipped, totalUpdated: updated.panes + updated.bebidas + updated.embutidos + updated.triples + updated.otros };
  }
  function handleImportFile(file, date, shift, statusEl){
    if(readOnly){ showToast("Vista de solo lectura: no puedes importar aquí."); return; }
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type:"array" });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:"", raw:true });
        var items = parseSalesAOA(aoa);
        if(items.length === 0){
          showToast("No se reconocieron filas de productos en ese archivo. ¿Es el reporte de ventas del sistema?");
          return;
        }
        var result = applyImport(items, date, shift);
        markDirty();
        scheduleAutosave();
        renderTabs();
        if(currentTab === "turno") renderPanel();
        showImportSummary(result, date, shift, statusEl);
      }catch(err){
        showToast("No se pudo leer ese archivo. Revisa que sea el reporte de ventas exportado del sistema (.xls, .xlsx o .csv).");
      }
    };
    reader.onerror = function(){ showToast("No se pudo leer el archivo."); };
    reader.readAsArrayBuffer(file);
  }
  function showImportSummary(result, date, shift, statusEl){
    var n = result.totalUpdated;
    var s = result.skipped.length;
    var msg = n + " producto" + (n===1?"":"s") + " actualizado" + (n===1?"":"s") +
      " (Panes " + result.updated.panes + " · Bebidas " + result.updated.bebidas + " · Embutidos " + result.updated.embutidos +
      " · Triples " + result.updated.triples + " · Otros " + result.updated.otros + ")" +
      (s ? " — " + s + " fila" + (s===1?"":"s") + " del archivo no está" + (s===1?"":"n") + " en tu arqueo." : "");
    showToast(msg);
    if(!statusEl) return;
    statusEl.innerHTML = "";
    var p = document.createElement("div");
    p.className = "hint";
    p.style.margin = ".5rem 0 0";
    p.textContent = "Última importación (" + SHIFT_LABEL[shift] + ", " + fmtDateLabel(date) + "): " + msg;
    statusEl.appendChild(p);
    if(s){
      var det = document.createElement("details");
      det.style.fontSize = ".76rem";
      det.style.color = "var(--ink-muted)";
      det.style.marginTop = ".3rem";
      var sum = document.createElement("summary");
      sum.style.cursor = "pointer";
      sum.textContent = "Ver productos del archivo que no se reconocieron";
      det.appendChild(sum);
      var listDiv = document.createElement("div");
      listDiv.style.marginTop = ".3rem";
      listDiv.textContent = result.skipped.slice(0, 60).join(", ") + (result.skipped.length > 60 ? "…" : "");
      det.appendChild(listDiv);
      statusEl.appendChild(det);
    }
  }
  function buildImportControl(shift){
    var wrap = document.createElement("div");
    wrap.style.marginTop = ".5rem";
    var label = document.createElement("label");
    label.className = "btn btn-sm";
    label.style.display = "inline-flex";
    label.style.cursor = "pointer";
    label.textContent = "Importar reporte de ventas (" + SHIFT_LABEL[shift] + ")";
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".xls,.xlsx,.csv";
    input.className = "visually-hidden";
    if(readOnly) input.disabled = true;
    var statusEl = document.createElement("div");
    input.addEventListener("change", function(){
      var f = input.files && input.files[0];
      input.value = "";
      if(!f) return;
      handleImportFile(f, currentDate, shift, statusEl);
    });
    label.appendChild(input);
    wrap.appendChild(label);
    wrap.appendChild(statusEl);
    return wrap;
  }

  // ---------- print report ----------
  function printableRows(tabKey, shift, day){
    var section = SECTIONS[tabKey];
    var amRows = day[section.key].am;
    var pmRows = day[section.key].pm;
    var out = [];
    catalogFor(tabKey).forEach(function(name, idx){
      var amRow = amRows[idx];
      var row = shift === "am" ? amRow : pmRows[idx];
      var saldoAnt = shift === "am" ? row.a : amRow.f;
      var moved = row.i1 || row.i2 || row.i3 || row.m || row.f !== saldoAnt || row.vc !== null;
      if(!moved) return;
      var v = ventasOf(row, shift, amRow);
      var c = cuadreOf(row, v);
      out.push({
        name: name, saldoAnt: saldoAnt, ing: row.i1 + row.i2 + row.i3, m: row.m, f: row.f,
        v: v, vc: row.vc, c: c, flagged: isFlagged(row, shift, amRow)
      });
    });
    return out;
  }
  function buildPrintHTML(date){
    var day = getDay(date);
    var t = day.turno;
    var alerts = dayAlerts(day);
    var html = "";
    html += "<h1>" + esc(STATE.meta.businessName || "Arqueo Diario") + "</h1>";
    html += '<div class="print-sub">Arqueo del ' + esc(fmtDateLabel(date)) + "</div>";
    html += '<div class="meta-line"><strong>Turno mañana:</strong> ' + esc(t.respAM || "—") +
      " (" + esc(t.eAM || "—") + " a " + esc(t.sAM || "—") + ")" + (t.obsAM ? " — " + esc(t.obsAM) : "") + "</div>";
    html += '<div class="meta-line"><strong>Turno tarde:</strong> ' + esc(t.respPM || "—") +
      " (" + esc(t.ePM || "—") + " a " + esc(t.sPM || "—") + ")" + (t.obsPM ? " — " + esc(t.obsPM) : "") + "</div>";
    if(t.notas) html += '<div class="meta-line"><strong>Notas:</strong> ' + esc(t.notas) + "</div>";
    html += '<p class="print-summary">' + (alerts.total === 0
      ? "Todo cuadra."
      : alerts.total + " producto" + (alerts.total===1?"":"s") + " por revisar (Panes " + alerts.panes + " · Bebidas " + alerts.bebidas + " · Embutidos " + alerts.embutidos + " · Triples " + alerts.triples + " · Otros " + alerts.otros + ").") + "</p>";

    PRODUCT_TABS.forEach(function(tabKey){
      var section = SECTIONS[tabKey];
      if(tabKey === "otros" && catalogFor(tabKey).length === 0) return;
      ["am","pm"].forEach(function(shift){
        var rows = printableRows(tabKey, shift, day);
        html += "<h2>" + esc(section.label) + " — " + SHIFT_LABEL[shift] + "</h2>";
        if(rows.length === 0){ html += '<p class="print-empty">Sin movimientos registrados.</p>'; return; }
        html += "<table><thead><tr><th>Producto</th><th>Saldo ant.</th><th>Ingresos</th><th>Merma</th>" +
          "<th>Saldo final</th><th>Ventas físicas</th><th>Ventas caja</th><th>Cuadre</th></tr></thead><tbody>";
        rows.forEach(function(r){
          html += '<tr class="' + (r.flagged ? "flagged" : "") + '"><td>' + esc(r.name) + "</td><td>" + fmt(r.saldoAnt) +
            "</td><td>" + fmt(r.ing) + "</td><td>" + fmt(r.m) + "</td><td>" + fmt(r.f) + "</td><td>" + fmt(r.v) +
            "</td><td>" + (r.vc === null ? "—" : fmt(r.vc)) + "</td><td>" + (r.c === null ? "—" : fmt(r.c)) + "</td></tr>";
        });
        html += "</tbody></table>";
      });
    });
    html += '<div class="print-footer">Generado ' + esc(new Date().toLocaleString("es-PE",{ timeZone:"America/Lima" })) + "</div>";
    return html;
  }
  function doPrint(date){
    var area = document.getElementById("printArea");
    area.innerHTML = buildPrintHTML(date);
    setTimeout(function(){ window.print(); }, 30);
  }

  // ---------- Excel export (una hoja por categoría, un día opcionalmente) ----------
  // Una fila por producto por día, con Mañana y Tarde lado a lado (como en el reporte de
  // papel que mandan a la dueña), en vez de dos filas separadas por turno.
  var REPORT_HEADER = ["Fecha","Producto",
    "Saldo Anterior","Ingreso AM","Merma AM","Saldo Final AM","Ventas AM","Ventas Caja AM","Cuadre AM",
    "Ingreso PM","Merma PM","Saldo Final PM","Ventas PM","Ventas Caja PM","Cuadre PM",
    "Responsable AM","Hora Cierre AM","Responsable PM","Hora Cierre PM"];
  function buildReportRowsByCategory(dateFilter){
    var byTab = {};
    PRODUCT_TABS.forEach(function(tabKey){ byTab[tabKey] = [REPORT_HEADER.slice()]; });
    var dates = Object.keys(STATE.days).sort();
    if(dateFilter) dates = dates.filter(function(d){ return d === dateFilter; });
    dates.forEach(function(d){
      var day = STATE.days[d];
      backfillDay(day, d);
      var t = day.turno;
      PRODUCT_TABS.forEach(function(tabKey){
        var section = SECTIONS[tabKey];
        var sec = day[section.key];
        catalogFor(tabKey).forEach(function(name, idx){
          var amRow = sec.am[idx];
          var pmRow = sec.pm[idx];
          var vAm = ventasOf(amRow, "am", null);
          var cAm = cuadreOf(amRow, vAm);
          var vPm = ventasOf(pmRow, "pm", amRow);
          var cPm = cuadreOf(pmRow, vPm);
          var ingresoAm = amRow.i1 + amRow.i2 + amRow.i3;
          var ingresoPm = pmRow.i1 + pmRow.i2 + pmRow.i3;
          byTab[tabKey].push([
            d, name,
            fmt(amRow.a), fmt(ingresoAm), fmt(amRow.m), fmt(amRow.f), fmt(vAm),
            amRow.vc===null ? "" : fmt(amRow.vc), cAm===null ? "" : fmt(cAm),
            fmt(ingresoPm), fmt(pmRow.m), fmt(pmRow.f), fmt(vPm),
            pmRow.vc===null ? "" : fmt(pmRow.vc), cPm===null ? "" : fmt(cPm),
            t.respAM || "", t.sAM || "", t.respPM || "", t.sPM || ""
          ]);
        });
      });
    });
    return byTab;
  }
  function buildTurnoRows(dateFilter){
    var rows = [["Fecha","Responsable AM","Hora Entrada AM","Hora Cierre AM","Observaciones AM",
      "Responsable PM","Hora Entrada PM","Hora Cierre PM","Observaciones PM","Notas del día"]];
    var dates = Object.keys(STATE.days).sort();
    if(dateFilter) dates = dates.filter(function(d){ return d === dateFilter; });
    dates.forEach(function(d){
      var t = STATE.days[d].turno;
      rows.push([d, t.respAM||"", t.eAM||"", t.sAM||"", t.obsAM||"", t.respPM||"", t.ePM||"", t.sPM||"", t.obsPM||"", t.notas||""]);
    });
    return rows;
  }
  // dateFilter: si se pasa una fecha (YYYY-MM-DD), exporta solo ese día; si no, todo el historial.
  function doExport(dateFilter){
    if(Object.keys(STATE.days).length === 0){ showToast("Todavía no hay días guardados para exportar."); return; }
    if(dateFilter && !STATE.days[dateFilter]){ showToast("No hay datos guardados para ese día."); return; }
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    try{
      var byTab = buildReportRowsByCategory(dateFilter);
      var wb = XLSX.utils.book_new();
      var SHEET_NAMES = { panes:"Panes", bebidas:"Bebidas", embutidos:"Embutidos", triples:"Triples", otros:"Otros" };
      PRODUCT_TABS.forEach(function(tabKey){
        var ws = XLSX.utils.aoa_to_sheet(byTab[tabKey]);
        XLSX.utils.book_append_sheet(wb, ws, SHEET_NAMES[tabKey]);
      });
      var wsTurno = XLSX.utils.aoa_to_sheet(buildTurnoRows(dateFilter));
      XLSX.utils.book_append_sheet(wb, wsTurno, "Turno");
      var filename = dateFilter ? ("arqueo-" + dateFilter + ".xlsx") : "arqueo-historial.xlsx";
      XLSX.writeFile(wb, filename);
      showToast("Reporte descargado.");
    }catch(err){
      showToast("No se pudo generar el archivo. Intenta de nuevo.");
    }
  }

  function renderTabs(){

  function renderPanel(){

  function handleCellInput(ev, tab, section, tbody){
    var t = ev.target;
    var idx = t.getAttribute("data-idx");
    if(idx === null) return;
    idx = parseInt(idx, 10);
    var shift = shiftView[tab];
    var day = ensureDay(currentDate);
    var sec = day[section.key];
    var row = shift === "am" ? sec.am[idx] : sec.pm[idx];

    if(t.classList.contains("field-input")){
      var field = t.getAttribute("data-field");
      if(field === "vc"){ row.vc = numOrNull(t.value); }
      else { row[field] = num(t.value); }
    } else if(t.classList.contains("ag-input")){
      var map = shift === "am" ? sec.agAm : sec.agPm;
      if(t.value){ map[idx] = t.value; } else { delete map[idx]; }
    } else {
      return;
    }

    markDirty();
    scheduleAutosave();
    updateComputedRow(tab, section, tbody, idx, shift, day);
    renderTabs();
  }

  function updateComputedRow(tab, section, tbody, idx, shift, day){
    var sec = day[section.key];
    var amRow = sec.am[idx];
    var row = shift === "am" ? amRow : sec.pm[idx];
    var v = ventasOf(row, shift, amRow);
    var c = cuadreOf(row, v);
    var flagged = isFlagged(row, shift, amRow);

    var vCell = tbody.querySelector('.ventas-cell[data-ridx="'+idx+'"]');
    if(vCell){
      vCell.textContent = fmt(v);
      vCell.className = "ventas-cell " + (v < -0.004 ? "bad" : (v === 0 && row.vc===null ? "neutral" : "good"));
    }
    var cCell = tbody.querySelector('.cuadre-cell[data-ridx="'+idx+'"]');
    if(cCell){
      if(c === null){ cCell.textContent = "—"; cCell.className = "cuadre-cell pending"; }
      else { cCell.textContent = fmt(c); cCell.className = "cuadre-cell " + (Math.abs(c) > 0.004 ? "bad" : "good"); }
    }
    var tr = tbody.querySelector('tr[data-ridx="'+idx+'"]');
    if(tr) tr.classList.toggle("flag", flagged);

    if(shift === "pm"){
      var derived = tbody.querySelector('.derived[data-ridx="'+idx+'"]');
      if(derived) derived.textContent = fmt(amRow.f);
    }

    var agNote = tbody.querySelector('.ag-note[data-ridx="'+idx+'"]');
    if(agNote){
      var t = day.turno;
      var agTime = (shift === "am" ? sec.agAm : sec.agPm)[idx];
      var closeTime = shift === "am" ? t.sAM : t.sPM;
      var mins = minutesBetween(agTime, closeTime);
      agNote.textContent = fmtDuration(mins);
    }
  }

  function renderTableBody(tab, tbody, rowCountEl){
    var section = SECTIONS[tab];
    var shift = shiftView[tab];
    var day = getDay(currentDate);
    var sec = day[section.key];
    var t = day.turno;
    var closeTime = shift === "am" ? t.sAM : t.sPM;
    var q = filters[tab].trim().toLowerCase();
    tbody.innerHTML = "";
    var shown = 0;
    var catalog = catalogFor(tab);
    catalog.forEach(function(name, idx){
      if(q && name.toLowerCase().indexOf(q) === -1) return;
      shown++;
      var amRow = sec.am[idx];
      var row = shift === "am" ? amRow : sec.pm[idx];
      var v = ventasOf(row, shift, amRow);
      var c = cuadreOf(row, v);
      var flagged = isFlagged(row, shift, amRow);
      var agMap = shift === "am" ? sec.agAm : sec.agPm;
      var agTime = agMap[idx] || "";
      var mins = minutesBetween(agTime, closeTime);

      var tr = document.createElement("tr");
      tr.setAttribute("data-ridx", idx);
      if(flagged) tr.classList.add("flag");

      var saldoAntCell = shift === "am"
        ? '<input class="num-input field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="a" value="'+row.a+'">'
        : '<span class="derived" data-ridx="'+idx+'">'+fmt(amRow.f)+'</span>';

      var nameCell = tab === "otros"
        ? '<td class="name-cell">' + esc(name) +
          (readOnly ? "" : '<button type="button" class="btn-del" data-idx="'+idx+'" title="Eliminar de Otros">✕</button>') +
          '</td>'
        : "<td>" + esc(name) + "</td>";

      tr.innerHTML =
        nameCell +
        "<td>" + saldoAntCell + "</td>" +
        '<td><span class="ing-group">' +
          '<input class="num-input mini field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="i1" value="'+row.i1+'" title="Ingreso 1">' +
          '<input class="num-input mini field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="i2" value="'+row.i2+'" title="Ingreso 2">' +
          '<input class="num-input mini field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="i3" value="'+row.i3+'" title="Ingreso 3">' +
        '</span></td>' +
        '<td><input class="num-input field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="m" value="'+row.m+'"></td>' +
        '<td><input class="num-input field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="f" value="'+row.f+'"></td>' +
        '<td><input class="time-input ag-input" type="time" data-idx="'+idx+'" value="'+esc(agTime)+'">' +
          '<div class="ag-note" data-ridx="'+idx+'">' + esc(fmtDuration(mins)) + '</div></td>' +
        '<td class="ventas-cell ' + (v<-0.004?"bad":(v===0&&row.vc===null?"neutral":"good")) + '" data-ridx="'+idx+'">' + fmt(v) + "</td>" +
        '<td><input class="num-input vc field-input" type="number" step="any" min="0" data-idx="'+idx+'" data-field="vc" value="'+(row.vc===null?"":row.vc)+'" placeholder="—"></td>' +
        '<td class="cuadre-cell ' + (c===null?"pending":(Math.abs(c)>0.004?"bad":"good")) + '" data-ridx="'+idx+'">' + (c===null?"—":fmt(c)) + "</td>";
      tbody.appendChild(tr);
    });
    if(readOnly){ tbody.querySelectorAll("input").forEach(function(i){ i.disabled = true; }); }
    if(rowCountEl){
      if(tab === "otros" && catalog.length === 0){
        rowCountEl.textContent = "Todavía no registraste nada en Otros. Usa el campo de arriba cuando haya un regalo, bonificación u otra situación.";
      } else {
        rowCountEl.textContent = shown + " de " + catalog.length + " productos" + (q ? " (filtrados)" : "");
      }
    }
  }

  function buildField(labelText, type, value, onChange, full){
    var field = document.createElement("div");

    field.appendChild(label);

  // se escribe en un pedido, y de ahí en adelante se autocompleta solo al elegir ese producto
  // de nuevo. Vive dentro del documento principal del arqueo (no en su propia colección) porque
  // es una lista chica y acotada (un precio por producto), no algo que crezca sin límite.
  function normalizePrecioKey(s){
    return (s || "").trim().toLowerCase().replace(/\s+/g, " ");
  }
  function getPrecioFor(producto){
    var key = normalizePrecioKey(producto);
    if(!key) return null;
    var map = STATE.precios || {};
    return map.hasOwnProperty(key) ? map[key] : null;
  }
  function setPrecioFor(producto, precio){
    var key = normalizePrecioKey(producto);
    if(!key || !(precio > 0)) return;
    if(!STATE.precios) STATE.precios = {};
    if(STATE.precios[key] !== precio){
      STATE.precios[key] = precio;
      markDirty();
      scheduleAutosave();
    }
  }

  function findClienteByNombre(nombre){
    var target = normalizeClienteName(nombre);
    if(!target) return null;
    var map = CLIENTES || {};
    var found = null;
    Object.keys(map).forEach(function(id){
      if(found) return;
      if(normalizeClienteName(map[id].nombre) === target){ found = { id: id, data: map[id] }; }
    });
    return found;
  }

  function buildClienteNameList(){
    var map = CLIENTES || {};
    var names = [];
    Object.keys(map).forEach(function(id){ if(map[id].nombre) names.push(map[id].nombre); });
    names.sort();
    return names;
  }

  function upsertCliente(cliente){
    if(!db || !cliente || !cliente.nombre || !cliente.nombre.trim()) return;
    var match = findClienteByNombre(cliente.nombre);
    var payload = {
      nombre: cliente.nombre.trim(),
      ruc: cliente.ruc || "",
      direccion: cliente.direccion || "",
      referencia: cliente.referencia || "",
      telefono: cliente.telefono || "",
      correo: cliente.correo || "",
      updatedAt: Date.now()
    };
    if(match){
      db.collection("clientes").doc(match.id).update(payload).catch(function(){});
    } else {
      db.collection("clientes").add(payload).catch(function(){});
    }
  }

  function buildPedidosPanel(){
    var wrap = document.createElement("div");

    var viewToggle = document.createElement("div");
    viewToggle.className = "shift-toggle";
    viewToggle.style.marginBottom = "1rem";
    [["nuevo","Nuevo pedido"], ["produccion","Producción por día"], ["lista","Todos los pedidos"]].forEach(function(pair){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "shift-btn" + (pedidosView === pair[0] ? " active" : "");
      b.textContent = pair[1];
      b.addEventListener("click", function(){ pedidosView = pair[0]; renderPanel(); });
      viewToggle.appendChild(b);
    });
    wrap.appendChild(viewToggle);

    if(PEDIDOS === null){
      var loading = document.createElement("div");
      loading.className = "empty-state";
      loading.textContent = "Cargando pedidos…";
      wrap.appendChild(loading);
      return wrap;
    }

    if(pedidosView === "produccion"){ wrap.appendChild(buildProduccionView()); }
    else if(pedidosView === "lista"){ wrap.appendChild(buildPedidosLista()); }
    else { wrap.appendChild(buildPedidoForm()); }

    return wrap;
  }

    grid.appendChild(direccionField);

    var referenciaField = buildField("Referencia", "text", draft.cliente.referencia, function(v){ draft.cliente.referencia = v; });
    var referenciaInput = referenciaField.querySelector("input");
    grid.appendChild(referenciaField);

    var telefonoField = buildField("Teléfono", "text", draft.cliente.telefono, function(v){ draft.cliente.telefono = v; });
    var telefonoInput = telefonoField.querySelector("input");
    grid.appendChild(telefonoField);

    var correoField = buildField("Correo", "text", draft.cliente.correo, function(v){ draft.cliente.correo = v; });
    var correoInput = correoField.querySelector("input");

        draft.cliente.telefono = c.telefono || "";
        draft.cliente.correo = c.correo || "";

        direccionInput.value = draft.cliente.direccion;
        referenciaInput.value = draft.cliente.referencia;
        telefonoInput.value = draft.cliente.telefono;

      : "<th>Producto</th><th>Cantidad</th><th>Precio</th><th>Total</th><th></th>";

    payRow.style.margin = "1.1rem 0 0";

    saveBtn2.disabled = pedidosSaving || readOnly;

    clienteDatalist.id = "pedidoClienteList";

  function renderPedidoItems(tbody, totalsRow){
    var draft = pedidoDraft;
    var isMasivo = draft.canal === "masivo";
    tbody.innerHTML = "";
    draft.items.forEach(function(item, idx){
      var tr = document.createElement("tr");
      var fechaCell = isMasivo
        ? '<td><input type="date" class="pedido-item-fecha" data-idx="'+idx+'" value="'+esc(item.fecha)+'"></td>'
        : "";
      tr.innerHTML =
        fechaCell +
        '<td><input type="text" list="pedidoProductList" class="pedido-item-producto" data-idx="'+idx+'" value="'+esc(item.producto)+'" placeholder="Buscar producto…"></td>' +
        '<td><input type="number" step="any" min="0" class="pedido-item-cantidad num-input mini" data-idx="'+idx+'" value="'+item.cantidad+'"></td>' +
        '<td><input type="number" step="any" min="0" class="pedido-item-precio num-input mini" data-idx="'+idx+'" value="'+item.precio+'"></td>' +
        '<td class="pedido-item-total" data-idx="'+idx+'">S/ ' + fmt(item.cantidad*item.precio) + '</td>' +
        '<td>' + (draft.items.length > 1 ? '<button type="button" class="btn-del pedido-item-del" data-idx="'+idx+'" title="Quitar línea">✕</button>' : '') + '</td>';
      tbody.appendChild(tr);
    });
    if(readOnly){
      tbody.querySelectorAll("input, button").forEach(function(el){ el.disabled = true; });
      return;
    }
    tbody.querySelectorAll(".pedido-item-fecha").forEach(function(input){
      input.addEventListener("change", function(){
        draft.items[+input.getAttribute("data-idx")].fecha = input.value || draft.fechaDefault;
      });
    });
    tbody.querySelectorAll(".pedido-item-producto").forEach(function(input){
      input.addEventListener("input", function(){
        var idx = +input.getAttribute("data-idx");
        draft.items[idx].producto = input.value;
        var savedPrecio = getPrecioFor(input.value);
        if(savedPrecio !== null && !(num(draft.items[idx].precio) > 0)){
          draft.items[idx].precio = savedPrecio;
          var precioInput = tbody.querySelector('.pedido-item-precio[data-idx="'+idx+'"]');
          if(precioInput) precioInput.value = savedPrecio;
          var cell = tbody.querySelector('.pedido-item-total[data-idx="'+idx+'"]');
          if(cell) cell.textContent = "S/ " + fmt(draft.items[idx].cantidad * draft.items[idx].precio);
          updatePedidoTotals(totalsRow);
        }
      });
    });
    function wireQtyPrice(cls, field){
      tbody.querySelectorAll(cls).forEach(function(input){
        input.addEventListener("input", function(){
          var idx = +input.getAttribute("data-idx");
          draft.items[idx][field] = num(input.value);
          var cell = tbody.querySelector('.pedido-item-total[data-idx="'+idx+'"]');
          if(cell) cell.textContent = "S/ " + fmt(draft.items[idx].cantidad * draft.items[idx].precio);
          updatePedidoTotals(totalsRow);
          if(field === "precio"){ setPrecioFor(draft.items[idx].producto, draft.items[idx].precio); }
        });
      });
    }
    wireQtyPrice(".pedido-item-cantidad", "cantidad");
    wireQtyPrice(".pedido-item-precio", "precio");
    tbody.querySelectorAll(".pedido-item-del").forEach(function(btn){
      btn.addEventListener("click", function(){
        draft.items.splice(+btn.getAttribute("data-idx"), 1);
        renderPedidoItems(tbody, totalsRow);
        updatePedidoTotals(totalsRow);
      });
    });
  }

  function pedidoSubtotal(draft){
    return draft.items.reduce(function(sum, it){ return sum + (num(it.cantidad) * num(it.precio)); }, 0);
  }
  function updatePedidoTotals(totalsRow){
    var draft = pedidoDraft;
    var subtotal = pedidoSubtotal(draft);
    var delivery = draft.canal === "delivery" ? num(draft.deliveryMonto) : 0;
    var total = subtotal + delivery;
    var html = "<div>Subtotal productos: <strong>S/ " + fmt(subtotal) + "</strong></div>";
    if(draft.canal === "delivery") html += "<div>Delivery: <strong>S/ " + fmt(delivery) + "</strong></div>";
    html += "<div>Total: <strong>S/ " + fmt(total) + "</strong></div>";
    totalsRow.innerHTML = html;
  }

  function savePedido(){
    var draft = pedidoDraft;
    if(!draft || readOnly || !db) return;
    var validItems = draft.items.filter(function(it){ return it.producto && it.producto.trim() && num(it.cantidad) > 0; });
    if(!draft.cliente.nombre || !draft.cliente.nombre.trim()){ showToast("Falta el nombre del cliente."); return; }
    if(validItems.length === 0){ showToast("Agrega al menos un producto con cantidad."); return; }
    if(pedidosSaving) return;
    pedidosSaving = true;
    renderPanel();
    var payload = {
      canal: draft.canal,
      cliente: draft.cliente,
      tipoPago: draft.tipoPago || "",
      pagado: !!draft.pagado,
      deliveryMonto: draft.canal === "delivery" ? num(draft.deliveryMonto) : 0,
      notas: draft.notas || "",
      items: validItems.map(function(it){
        return { producto: it.producto.trim(), cantidad: num(it.cantidad), precio: num(it.precio), fecha: it.fecha || draft.fechaDefault };
      }),
      createdAt: Date.now()
    };
    db.collection("pedidos").add(payload).then(function(){
      pedidosSaving = false;
      upsertCliente(payload.cliente);
      pedidoDraft = newPedidoDraft(payload.canal);
      showToast("Pedido guardado.");
      renderPanel();
    }).catch(function(){
      pedidosSaving = false;
      showToast("No se pudo guardar el pedido. Revisa tu conexión e intenta de nuevo.");
      renderPanel();
    });
  }

  function buildProduccionView(){
    var wrap = document.createElement("div");
    var card = document.createElement("div");
    card.className = "card";
    var h2 = document.createElement("h2");
    h2.style.margin = "0 0 .4rem";
    h2.textContent = "Producción por día";
    card.appendChild(h2);
    var hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Elige una fecha y suma, por producto, lo comprometido entre delivery, recojo en tienda y pedidos masivos que entreguen ese día.";
    card.appendChild(hint);

    var dateRow = document.createElement("div");
    dateRow.className = "field";
    dateRow.style.maxWidth = "220px";
    dateRow.style.margin = "1rem 0";
    var dl = document.createElement("label");
    dl.textContent = "Fecha";
    dateRow.appendChild(dl);
    var dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.value = pedidosProduccionDate || currentDate;
    dateInput.addEventListener("change", function(){
      pedidosProduccionDate = dateInput.value || currentDate;
      renderPanel();
    });
    dateRow.appendChild(dateInput);
    card.appendChild(dateRow);

    var targetDate = pedidosProduccionDate || currentDate;
    var totals = {};
    PEDIDOS.forEach(function(p){
      (p.items || []).forEach(function(it){
        if(it.fecha !== targetDate) return;
        if(!totals[it.producto]) totals[it.producto] = { delivery:0, tienda:0, masivo:0 };
        totals[it.producto][p.canal] = (totals[it.producto][p.canal] || 0) + num(it.cantidad);
      });
    });
    var names = Object.keys(totals).sort();
    if(names.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No hay pedidos con entrega para ese día.";
      card.appendChild(empty);
    } else {
      var tableWrap = document.createElement("div");
      tableWrap.className = "table-wrap";
      var table = document.createElement("table");
      table.className = "data-table";
      var rows = "<thead><tr><th>Producto</th><th>Delivery</th><th>Tienda</th><th>Masivo</th><th>Total</th></tr></thead><tbody>";
      var grand = { delivery:0, tienda:0, masivo:0 };
      names.forEach(function(name){
        var t = totals[name];
        var rowTotal = (t.delivery||0) + (t.tienda||0) + (t.masivo||0);
        grand.delivery += t.delivery||0; grand.tienda += t.tienda||0; grand.masivo += t.masivo||0;
        rows += "<tr><td>" + esc(name) + "</td><td>" + (t.delivery ? fmt(t.delivery) : "—") + "</td><td>" +
          (t.tienda ? fmt(t.tienda) : "—") + "</td><td>" + (t.masivo ? fmt(t.masivo) : "—") + "</td><td><strong>" + fmt(rowTotal) + "</strong></td></tr>";
      });
      var grandTotal = grand.delivery + grand.tienda + grand.masivo;
      rows += "<tr><td><strong>Total</strong></td><td><strong>" + fmt(grand.delivery) + "</strong></td><td><strong>" +
        fmt(grand.tienda) + "</strong></td><td><strong>" + fmt(grand.masivo) + "</strong></td><td><strong>" + fmt(grandTotal) + "</strong></td></tr>";
      rows += "</tbody>";
      table.innerHTML = rows;
      tableWrap.appendChild(table);
      card.appendChild(tableWrap);
    }
    wrap.appendChild(card);
    return wrap;
  }

  function buildPedidosLista(){
    var wrap = document.createElement("div");
    var card = document.createElement("div");
    card.className = "card";
    var h2 = document.createElement("h2");
    h2.style.margin = "0 0 .8rem";
    h2.textContent = "Todos los pedidos";
    card.appendChild(h2);

    if(PEDIDOS.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "Todavía no hay pedidos registrados.";
      card.appendChild(empty);
      wrap.appendChild(card);
      return wrap;
    }

    var tableWrap = document.createElement("div");
    tableWrap.className = "table-wrap";
    var table = document.createElement("table");
    table.className = "data-table";
    table.innerHTML = "<thead><tr><th>Fecha(s)</th><th>Cliente</th><th>Canal</th><th>Productos</th><th>Total</th><th>Pagado</th><th></th></tr></thead><tbody></tbody>";
    var tbody = table.querySelector("tbody");
    PEDIDOS.forEach(function(p){
      var tr = document.createElement("tr");
      var seen = {};
      var fechas = [];
      (p.items||[]).forEach(function(it){
        if(it.fecha && !seen[it.fecha]){ seen[it.fecha] = true; fechas.push(it.fecha); }
      });
      fechas.sort();
      var fechaLabel = fechas.length <= 1 ? (fechas[0] || "—") : (fechas[0] + " → " + fechas[fechas.length-1]);
      var productosLabel = (p.items||[]).map(function(it){ return it.cantidad + "x " + it.producto; }).join(", ");
      var subtotal = (p.items||[]).reduce(function(s,it){ return s + num(it.cantidad)*num(it.precio); }, 0) + num(p.deliveryMonto);
      var pagadoClass = "chip pedido-pagado-toggle " + (p.pagado ? "good" : "bad");
      tr.innerHTML =
        "<td>" + esc(fechaLabel) + "</td>" +
        "<td>" + esc((p.cliente && p.cliente.nombre) || "—") + "</td>" +
        "<td>" + esc(CANAL_LABEL[p.canal] || p.canal) + "</td>" +
        "<td class='pedido-productos-cell'>" + esc(productosLabel) + "</td>" +
        "<td>S/ " + fmt(subtotal) + "</td>" +
        "<td><button type='button' class='" + pagadoClass + "' data-id='" + p.id + "'>" + (p.pagado ? "Pagado" : "Pendiente") + "</button></td>" +
        "<td>" + (readOnly ? "" : '<button type="button" class="btn-del pedido-del" data-id="' + p.id + '" title="Eliminar pedido">✕</button>') + "</td>";
      tbody.appendChild(tr);
    });
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    wrap.appendChild(card);

    if(!readOnly){
      tbody.querySelectorAll(".pedido-pagado-toggle").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
          if(!p || !db) return;
          db.collection("pedidos").doc(id).update({ pagado: !p.pagado }).catch(function(){
            showToast("No se pudo actualizar. Intenta de nuevo.");
          });
        });
      });
      tbody.querySelectorAll(".pedido-del").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-id");
          var p = PEDIDOS.filter(function(x){ return x.id === id; })[0];
          if(!p || !db) return;
          if(!confirm('¿Eliminar el pedido de "' + ((p.cliente && p.cliente.nombre) || "este cliente") + '"? No se puede deshacer.')) return;
          db.collection("pedidos").doc(id).delete().catch(function(){
            showToast("No se pudo eliminar. Intenta de nuevo.");
          });
        });
      });
    }

    return wrap;
  }

  // ---------- wiring ----------
  function wireStatic(){
    document.getElementById("datePicker").value = currentDate;
    document.getElementById("datePicker").addEventListener("change", function(ev){
      if(!STATE) return;
      currentDate = ev.target.value || todayISO();
      renderAll();
    });
    document.getElementById("saveBtn").addEventListener("click", function(){ if(STATE) doSave(); });
    document.querySelectorAll(".tab-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        if(!STATE) return;
        currentTab = btn.getAttribute("data-tab"); renderAll();
      });
    });
  }

  function attachRemoteSync(onFirstLoad){
    var ref = db.collection("arqueo").doc("state");
    var firstLoadDone = false;
    ref.onSnapshot(function(snap){
      if(!snap.exists){
        // Primera vez que se usa esta base de datos: la sembramos con los datos que
        // ya tenía la app (incluido lo migrado del Excel de setiembre).
        ref.set(readEmbeddedSeed()).catch(function(){});
        return;
      }
      var data = normalizeState(snap.data());
      if(data.meta && data.meta.lastSavedAt && data.meta.lastSavedAt === lastSavedBySelf){
        // Es el eco de nuestro propio guardado — ya lo tenemos aplicado.
        if(!firstLoadDone){ firstLoadDone = true; onFirstLoad(data); }
        return;
      }
      if(!firstLoadDone){
        firstLoadDone = true;
        onFirstLoad(data);
        return;
      }
      if(dirty || saving){
        showBanner("info", "Otro dispositivo guardó cambios nuevos. Si sigues editando podrías perderlos.",
          [{ label:"Actualizar ahora", action:function(){
              STATE = data; dirty = false; clearBackup(); renderAll();
            }}]);
        return;
      }
      STATE = data;
      renderAll();
    }, function(){
      readOnly = true;
      showBanner("bad", "No se pudo conectar con la base de datos. Revisa tu conexión a internet y recarga la página.", []);
      setSaveStatus();
    });
  }

  function attachPedidosSync(){
    db.collection("pedidos").onSnapshot(function(snap){
      var list = [];
      snap.forEach(function(doc){
        var data = doc.data();
        data.id = doc.id;
        list.push(data);
      });
      list.sort(function(a, b){ return (b.createdAt || 0) - (a.createdAt || 0); });
      PEDIDOS = list;
      // No repintamos si está en "Nuevo pedido": así no se pierde lo que está escribiendo
      // si otra persona (ej. quien toma pedidos por WhatsApp) guarda algo al mismo tiempo.
      if(currentTab === "pedidos" && pedidosView !== "nuevo") renderPanel();
    }, function(){
      // Si falla, dejamos PEDIDOS como esté (puede seguir null) y avisamos solo si
      // el usuario está mirando esa pestaña.
      if(currentTab === "pedidos" && PEDIDOS === null){
        showToast("No se pudo cargar los pedidos. Revisa tu conexión e intenta de nuevo.");
      }
    });
  }

  function attachClientesSync(){
    db.collection("clientes").onSnapshot(function(snap){
      var map = {};
      snap.forEach(function(doc){ map[doc.id] = doc.data(); });
      CLIENTES = map;
      if(currentTab === "pedidos" && pedidosView !== "nuevo") renderPanel();
    }, function(){
      if(currentTab === "pedidos" && CLIENTES === null){
        showToast("No se pudo cargar los clientes guardados.");
      }
    });
  }

  function initFirebase(){
    var firebaseConfig = {
      apiKey: "AIzaSyApjo00nK0Vc_5cESnAPvjEg1-hIuv2zCE",
      authDomain: "arqueo-panaderia-carmeli-9a193.firebaseapp.com",
      projectId: "arqueo-panaderia-carmeli-9a193",
      storageBucket: "arqueo-panaderia-carmeli-9a193.firebasestorage.app",
      messagingSenderId: "176026150204",
      appId: "1:176026150204:web:c2059275bb0b8b8298aa39"
    };
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  }

  function init(){
    initFirebase();
    wireStatic();
    document.getElementById("panel").innerHTML = '<div class="empty-state">Cargando datos…</div>';
    attachRemoteSync(function(data){
      STATE = data;
      renderAll();
      restoreBackupBanner();
    });
    attachPedidosSync();
    attachClientesSync();
  }

  // ---------- lock screen (contraseña compartida del equipo) ----------
  var APP_PASSWORD = "Carmelitas2026";
  function isUnlocked(){
    try{ return sessionStorage.getItem("arqueo_unlocked") === "1"; }catch(e){ return false; }
  }
  function setUnlocked(){
    try{ sessionStorage.setItem("arqueo_unlocked", "1"); }catch(e){}
  }
  function showLock(){
    document.getElementById("lockScreen").hidden = false;
    document.getElementById("appRoot").hidden = true;
    var input = document.getElementById("lockInput");
    setTimeout(function(){ input.focus(); }, 30);
  }
  function hideLock(){
    document.getElementById("lockScreen").hidden = true;
    document.getElementById("appRoot").hidden = false;
  }
  function wireLock(){
    var form = document.getElementById("lockForm");
    var input = document.getElementById("lockInput");
    var err = document.getElementById("lockError");
    form.addEventListener("submit", function(ev){
      ev.preventDefault();
      if(input.value === APP_PASSWORD){
        setUnlocked();
        hideLock();
        init();
      } else {
        err.hidden = false;
        input.value = "";
        input.focus();
      }
    });
  }

  function boot(){
    wireLock();
    if(isUnlocked()){ hideLock(); init(); }
    else { showLock(); }
  }

  if(document.readyState === "loading"){ document.addEventListener("DOMContentLoaded", boot); }
  else { boot(); }
})();
</script>
