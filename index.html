  // ---------- Otros, como lista de movimientos (salidas que no son venta normal) ----------
  // Jessica: "productos que tenemos en la tienda que los enviamos para otro destino" -- en vez
  // de llenar Saldo Anterior/Ingresos/Merma/Saldo Final por producto (como el resto del Arqueo),
  // acá se busca el producto (donde sea que viva: Panes, Bebidas, Embutidos, Triples, o algo
  // nuevo que no está en ningún catálogo), se pone la cantidad y, si quieres, una nota de a
  // dónde fue -- y se agrega a una lista del día. Se puede agregar el mismo producto varias
  // veces (ej. Francés 15 para desayuno, Francés 10 para lonche, por separado).
  //
  // Cuando el producto SÍ existe en Panes/Bebidas/Embutidos/Triples (o en el Otros de antes),
  // la cantidad se resta sola de la Merma de esa fila real, ese turno -- así el Saldo Final de
  // ese producto sigue exacto sin anotarlo dos veces. Si el producto no existe en NINGÚN
  // catálogo (ej. "Sandwich de Chicharrón"), queda solo como registro en esta lista, sin
  // afectar ningún Saldo (no se crea un producto nuevo solo).
  function horaAhora(){
    var d = new Date();
    var h = (d.getHours() < 10 ? "0" : "") + d.getHours();
    var m = (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
    return h + ":" + m;
  }
  function buildMovimientoProductList(){
    var out = PANES.concat(BEBIDAS, EMBUTIDOS, TRIPLES, STATE.customCatalog || []);
    var seen = {}, list = [];
    out.forEach(function(n){
      var k = n.toLowerCase();
      if(seen[k]) return;
      seen[k] = true;
      list.push(n);
    });
    return list.sort();
  }
  function doAgregarMovimiento(date, shift, productoInput, cantidadInput, notaInput){
    var nombre = productoInput.value.trim();
    var cantidad = num(cantidadInput.value);
    if(!nombre){ showToast("Escribe o elige un producto."); return; }
    if(!(cantidad > 0)){ showToast("Escribe una cantidad mayor a 0."); return; }
    // ensureDay (no getDay): si hoy todavía no tiene ningún dato guardado, getDay() devuelve
    // un borrador nuevo cada vez que se llama y cualquier cambio ahí se perdería solo -- hay
    // que "afirmar" el día en STATE.days antes de tocarlo, como hace el resto del Arqueo.
    var day = ensureDay(date);
    var catIndex = buildCatalogIndex();
    var resolved = resolveCatalogEntry(catIndex, nombre);
    var entry = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      producto: resolved ? resolved.hit.name : nombre,
      tab: resolved ? resolved.hit.tab : null,
      idx: resolved ? resolved.hit.idx : null,
      cantidad: cantidad,
      nota: notaInput.value.trim(),
      hora: horaAhora()
    };
    day.movimientos[shift].push(entry);
    if(resolved){
      var key = SECTIONS[resolved.hit.tab].key;
      var row = day[key][shift][resolved.hit.idx];
      row.m = round2(num(row.m) + cantidad);
    }
    markDirty();
    scheduleAutosave();
    productoInput.value = "";
    cantidadInput.value = "";
    notaInput.value = "";
    showToast('"' + entry.producto + '" agregado' + (resolved ? " — se descontó de " + SECTIONS[resolved.hit.tab].label + "." : ", como registro nuevo (no está en ningún catálogo)."));
    productoInput.focus();
    renderPanel();
  }
  function doQuitarMovimiento(date, shift, id){
    var day = ensureDay(date);
    var idx = -1;
    day.movimientos[shift].forEach(function(e, i){ if(e.id === id) idx = i; });
    if(idx === -1) return;
    var entry = day.movimientos[shift][idx];
    var destino = entry.tab ? (" Esto también le devuelve " + fmt(entry.cantidad) + " a la Merma de \"" + entry.producto + "\" en " + SECTIONS[entry.tab].label + ".") : "";
    if(!confirm('¿Quitar "' + entry.producto + '" (' + fmt(entry.cantidad) + ') de la lista?' + destino)) return;
    if(entry.tab){
      var key = SECTIONS[entry.tab].key;
      var row = day[key] && day[key][shift] && day[key][shift][entry.idx];
      if(row){ row.m = round2(Math.max(0, num(row.m) - entry.cantidad)); }
    }
    day.movimientos[shift].splice(idx, 1);
    markDirty();
    scheduleAutosave();
    renderPanel();
  }

          var falta = meta - total;

          } else {
            faltaCell.textContent = fmt(falta);
            faltaCell.className = "metas-falta";
          }
        }
      }
    });
  }

  // ---------- Reporte de Metas por día de la semana ----------
  // Para comparar, por ejemplo, "cómo fue la venta varios domingos": junta todos los días
  // guardados que caigan en el día de la semana elegido (dentro del rango de fechas) y compara,
  // categoría por categoría, lo vendido contra la meta de ese día de la semana.
  function metasReporteShifts(turno){
    return turno === "ambos" ? ["am","pm"] : [turno];
  }
  function computeMetasReporteRows(weekdayKey, desde, hasta, turno){
    var shifts = metasReporteShifts(turno);
    var dates = Object.keys(STATE.days).filter(function(d){
      if(weekdayKeyFor(d) !== weekdayKey) return false;
      if(desde && d < desde) return false;
      if(hasta && d > hasta) return false;
      return true;
    }).sort();
    return dates.map(function(d){
      var day = getDay(d);
      var row = { fecha: d, cats: {} };
      METAS_CATEGORIAS.forEach(function(cat){
        var sec = day.metas[cat.key];
        var total = 0;
        shifts.forEach(function(shift){
          cat.subcols.forEach(function(sc){ total += metasSubcolTotal(sec, shift, sc.key); });
        });
        var entry = { total: total };
        if(cat.conMeta){
          var meta = 0;
          shifts.forEach(function(shift){
            var arr = (STATE.metasObjetivos[weekdayKey] && STATE.metasObjetivos[weekdayKey][cat.key] && STATE.metasObjetivos[weekdayKey][cat.key][shift]) || [];
            arr.forEach(function(v){ meta += num(v); });
          });
          entry.meta = meta;
          entry.pct = meta > 0 ? Math.round((total / meta) * 100) : null;
        }
        row.cats[cat.key] = entry;
      });
      return row;
    });
  }

    METAS_CATEGORIAS.forEach(function(cat){ theadHtml += "<th>" + esc(cat.label) + "</th>"; });
    theadHtml += "</tr></thead>";
    var tbodyHtml = "<tbody>";
    rows.forEach(function(row){
      tbodyHtml += "<tr><td>" + esc(fmtDateLabel(row.fecha)) + "</td>";
      METAS_CATEGORIAS.forEach(function(cat){
        var entry = row.cats[cat.key];
        if(cat.conMeta){
          var pctTxt = entry.pct === null ? "—" : entry.pct + "%";
          var cls = entry.pct !== null && entry.pct >= 100 ? "good" : "";
          tbodyHtml += '<td>' + fmt(entry.total) + " / " + fmt(entry.meta) + ' <span class="metas-pct ' + cls + '">(' + pctTxt + ")</span></td>";
        } else {
          tbodyHtml += "<td>" + fmt(entry.total) + "</td>";
        }
      });
      tbodyHtml += "</tr>";
    });
    tbodyHtml += "</tbody>";
    // Fila de promedio, para ver la tendencia general de esas fechas de un vistazo.
    var tfootHtml = "<tfoot><tr><td>PROMEDIO</td>";
    METAS_CATEGORIAS.forEach(function(cat){
      if(!cat.conMeta){ tfootHtml += "<td></td>"; return; }
      var pcts = rows.map(function(r){ return r.cats[cat.key].pct; }).filter(function(p){ return p !== null; });
      if(pcts.length === 0){ tfootHtml += "<td>—</td>"; return; }
      var avg = Math.round(pcts.reduce(function(a,b){ return a + b; }, 0) / pcts.length);
      tfootHtml += '<td class="' + (avg >= 100 ? "good" : "") + '">' + avg + "%</td>";
    });
    tfootHtml += "</tr></tfoot>";

    table.innerHTML = theadHtml + tbodyHtml + tfootHtml;
    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    return card;
  }
  function doExportMetasReporte(rows, weekdayKey, turno){
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    if(!rows.length){ showToast("No hay datos para exportar con este filtro."); return; }
    try{
      var header = ["Fecha"];
      METAS_CATEGORIAS.forEach(function(cat){
        if(cat.conMeta){ header.push(cat.label + " - Vendido", cat.label + " - Meta", cat.label + " - %"); }
        else { header.push(cat.label + " - Vendido"); }
      });
      var aoa = [header];
      rows.forEach(function(row){
        var line = [row.fecha];
        METAS_CATEGORIAS.forEach(function(cat){
          var entry = row.cats[cat.key];
          if(cat.conMeta){ line.push(round2(entry.total), round2(entry.meta), entry.pct === null ? "" : entry.pct); }
          else { line.push(round2(entry.total)); }
        });
        aoa.push(line);
      });
      var ws = XLSX.utils.aoa_to_sheet(aoa);
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Reporte " + METAS_WEEKDAY_LABEL[weekdayKey]);
      var filename = "metas-" + weekdayKey + "-" + turno + ".xlsx";
      XLSX.writeFile(wb, filename);
      showToast("Reporte descargado.");
    }catch(err){
      showToast("No se pudo generar el archivo. Intenta de nuevo.");
    }
  }

  function handleMetasInput(ev, panelEl, day, shift, weekdayKey){
    var t = ev.target;
    var kind = t.getAttribute("data-kind");
    if(!kind) return;
    var catKey = t.getAttribute("data-cat");
    var cat = METAS_CATEGORIAS.filter(function(c){ return c.key === catKey; })[0];
    if(!cat) return;

    if(kind === "item"){
      var idx = parseInt(t.getAttribute("data-idx"), 10);
      var sub = t.getAttribute("data-sub");
      day.metas[cat.key][shift][idx][sub] = num(t.value);
    } else if(kind === "meta"){
      var subidx = parseInt(t.getAttribute("data-subidx"), 10);
      if(!STATE.metasObjetivos[weekdayKey]) STATE.metasObjetivos[weekdayKey] = metasObjetivoDefaultFor(weekdayKey);
      if(!STATE.metasObjetivos[weekdayKey][cat.key]) STATE.metasObjetivos[weekdayKey][cat.key] = { am:[], pm:[] };
      if(!STATE.metasObjetivos[weekdayKey][cat.key][shift]) STATE.metasObjetivos[weekdayKey][cat.key][shift] = [];
      STATE.metasObjetivos[weekdayKey][cat.key][shift][subidx] = num(t.value);
    } else {
      return;
    }

    markDirty();
    scheduleAutosave();
    updateMetasCategoryComputed(panelEl, cat, day, shift, weekdayKey);
  }

  var respaldoDescargando = false;
  // Respaldo completo (Jessica, 14/09/2026: "mi gran miedo es que se pierda la información"):
  // a diferencia de "Exportar historial (Excel)" -- que solo exporta el Arqueo -- esto baja UN
  // archivo con absolutamente todo: el Arqueo (STATE, ya cargado), y además Pedidos, Caja
  // Cajeros y Clientes leídos frescos y COMPLETOS directo de Firestore (no desde la memoria de
  // la app, porque Pedidos en memoria solo trae los últimos 1500 + las deudas sin pagar --
  // ver PEDIDOS_LIMITE_RECIENTES -- y un respaldo tiene que traer TODO, sin ese límite). Es un
  // .json (no Excel) a propósito: así se puede volver a subir a Firestore tal cual si algún día
  // hiciera falta restaurar, sin perder ni un dato por el camino. Nunca toca las colecciones
  // "carmelitasPan_*" del otro proyecto que comparte este mismo Firebase.
  function doDescargarRespaldoCompleto(btn){
    if(!db || respaldoDescargando) return;
    respaldoDescargando = true;
    if(btn){ btn.disabled = true; btn.textContent = "Preparando respaldo…"; }
    showToast("Preparando el respaldo completo… puede tardar unos segundos.");
    Promise.all([
      db.collection("pedidos").get(),
      db.collection("cajaCajeros").get(),
      db.collection("clientes").get(),
      db.collection("contadores").get()
    ]).then(function(results){
      function snapToArray(snap){
        var arr = [];
        snap.forEach(function(doc){ var d = doc.data(); d.id = doc.id; arr.push(d); });
        return arr;
      }
      var respaldo = {
        negocio: "Panadería Carmelitas - Arqueo Diario",
        generadoEl: new Date().toISOString(),
        arqueoState: STATE,
        pedidos: snapToArray(results[0]),
        cajaCajeros: snapToArray(results[1]),
        clientes: snapToArray(results[2]),
        contadores: snapToArray(results[3])
      };
      var blob = new Blob([JSON.stringify(respaldo, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "respaldo-arqueo-carmelitas-" + todayISO() + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      respaldoDescargando = false;
      if(btn){ btn.disabled = false; btn.textContent = "Descargar respaldo completo"; }
      showToast("Respaldo descargado. Guárdalo en tu Drive, correo o donde tú quieras.");
    }).catch(function(){
      respaldoDescargando = false;
      if(btn){ btn.disabled = false; btn.textContent = "Descargar respaldo completo"; }
      showToast("No se pudo generar el respaldo. Revisa tu conexión e intenta de nuevo.");
    });
  }

  // Origen del pedido: de dónde vino (Whatsapp o Tienda física), independiente del canal de

  // Empezó como "solo Delivery" pero Jessica pidió corregirlo: esta cadena de estados aplica a
  // TODO pedido guardado en el sistema, sin importar el canal (WhatsApp, Tienda, Delivery,
  // Masivo) -- lo que importa para producción es UNA sola cola, ordenada por la hora en que
  // cada pedido debe estar listo, no por de dónde vino. El canal/origen se sigue guardando tal
  // cual (nunca se pierde) y se muestra como una etiqueta en cada tarjeta, pero NO separa la
  // cola en vistas distintas -- ver pedidosDespachoLista().
  var PEDIDO_ESTADOS = ["NUEVO","CONFIRMADO","EN_PREPARACION","LISTO_DESPACHO","SALIO_TIENDA","EN_RUTA","ENTREGADO","CANCELADO"];

    LISTO_DESPACHO:"Listo", SALIO_TIENDA:"Salió de tienda", EN_RUTA:"En ruta",

  };

    NUEVO:"🟡", CONFIRMADO:"🟠", EN_PREPARACION:"🔵", LISTO_DESPACHO:"🟢",
    SALIO_TIENDA:"🚚", EN_RUTA:"🚚", ENTREGADO:"✅", CANCELADO:"⚪"

  // Próximo estado al que salta el botón grande de cada tarjeta (un solo toque, sin escribir
  // nada) -- Jessica: "la app debe registrar automáticamente la hora exacta cuando se presione
  // cada botón". "Salió de tienda"/"En ruta" solo tienen sentido cuando de verdad hay reparto
  // (Delivery, o Masivo en modo Delivery) -- ver pedidoRequiereReparto(). Para Tienda, WhatsApp
  // recogido en tienda o Masivo-Recojo, de "Listo" se salta directo a "Entregado" (al cliente o
  // a su propio motorizado).
  var PEDIDO_ESTADO_SIGUIENTE = {
    NUEVO:"CONFIRMADO", CONFIRMADO:"EN_PREPARACION", EN_PREPARACION:"LISTO_DESPACHO",
    LISTO_DESPACHO:"SALIO_TIENDA", SALIO_TIENDA:"EN_RUTA", EN_RUTA:"ENTREGADO"
  };

    NUEVO:"Confirmar pedido", CONFIRMADO:"Iniciar preparación", EN_PREPARACION:"Marcar listo",
    LISTO_DESPACHO:"Salió de tienda", SALIO_TIENDA:"Marcar en ruta", EN_RUTA:"Marcar entregado"
  };
  // ¿Este pedido de verdad sale a reparto (alguien de la panadería lo lleva)? Si no, el cliente
  // o su propio motorizado lo recoge en tienda y no tiene sentido "Salió de tienda"/"En ruta".
  function pedidoRequiereReparto(p){
    return p.canal === "delivery" || (p.canal === "masivo" && p.masivoModo === "delivery");
  }
  function pedidoProximoEstado(p){
    if(p.estado === "LISTO_DESPACHO" && !pedidoRequiereReparto(p)) return "ENTREGADO";
    return PEDIDO_ESTADO_SIGUIENTE[p.estado];
  }
  function pedidoAccionLabel(p){
    if(p.estado === "LISTO_DESPACHO" && !pedidoRequiereReparto(p)) return "Marcar entregado";
    return PEDIDO_ESTADO_ACCION_LABEL[p.estado];
  }
  // ---------- Prioridad: PARA AHORA vs PROGRAMADO ----------
  // Jessica: "lo que debe determinar el orden es la hora en que el pedido debe estar listo...
  // todo pedido que necesite ser preparado AHORA genera alerta, todo pedido para más tarde
  // queda en cola y se activa en el momento correspondiente." Se calcula solo, en base a la
  // fecha/hora que ya existían en el formulario ("Hora en que debe estar listo") -- nadie tiene
  // que marcar nada a mano, y se recalcula cada vez que se revisa (ver revisarAlertasCola), así
  // que un pedido programado pasa a "para ahora" apenas llega su hora, aunque nadie lo toque.
  function pedidoFechaAtencion(p){
    return (p.items && p.items[0] && p.items[0].fecha) || null;
  }
  // Jessica: "si el pedido de delivery dice 18:00pm debe estar listo 17:30 para llegar a la
  // hora." Para Delivery (y Masivo-Delivery) la hora que se escribe en el pedido es la hora en
  // que el CLIENTE debe recibirlo, no la hora en que debe estar listo en panadería -- por eso
  // se le resta un tiempo de traslado fijo (configurable en Turno > Panadería, 30 min por
  // defecto) antes de usarla para ordenar la cola y disparar la alerta. Para los demás canales
  // (Tienda/Recojo, WhatsApp, Masivo-Recojo) la hora escrita YA es la hora en que debe estar
  // listo, así que no se le resta nada -- se sigue comportando exactamente igual que antes.
  function pedidoTrasladoMinutos(){
    var v = (STATE && STATE.meta && STATE.meta.deliveryTrasladoMin != null) ? num(STATE.meta.deliveryTrasladoMin) : 30;
    return v > 0 ? v : 30;
  }
  // Hora que la persona escribió tal cual en el pedido (fecha + hora, sin ningún ajuste) --
  // para Delivery es la hora de entrega al cliente; para los demás canales ya es la hora lista.
  function pedidoHoraEntregaMs(p){
    var fecha = pedidoFechaAtencion(p);
    if(fecha && p.hora){
      try{
        var ms = new Date(fecha + "T" + p.hora + ":00-05:00").getTime();
        if(!isNaN(ms)) return ms;
      }catch(e){}
    }
    return null;
  }
  function pedidoHoraAtencionMs(p){
    var ms = pedidoHoraEntregaMs(p);
    if(ms != null){
      if(pedidoRequiereReparto(p)) ms -= pedidoTrasladoMinutos() * 60000;
      return ms;
    }

    return p.createdAt || 0;

  // igual y se sigue usando para historial/trazabilidad (p.ej. "Pedidos tomados") -- solo se

  var pedidoPrecioSeedMap = null;

  // Los Triples viven en el catálogo del Arqueo con un nombre genérico por sabor
  // ("Triples Clásicos", "Triple de Aceituna", ...), que es justo el nombre que aparece
  // para elegir en un Pedido. Pero en la lista oficial de precios (PEDIDO_PRECIO_SEED,
  // subida del Excel) cada sabor figura con dos precios distintos según cómo se vende:

  // normalmente se cuenta por unidad (cantidad = número de triples), el nombre genérico
  // del catálogo se enlaza aquí al precio por UNIDAD, para que nunca se quede sin precio
  // oficial ni caiga en un precio antiguo guardado por error.
  var TRIPLE_PRECIO_ALIAS = [
    { catalogo:"Triples Clásicos", seed:"UND T. CLÁSICO" },

  // Lista de precios (STATE.precios): el precio oficial de la lista subida (PEDIDO_PRECIO_SEED)
  // manda siempre para cualquier producto que ya esté ahí — así escribir "pan", "empanada" o
  // lo que sea, siempre trae el precio real, sin importar qué se haya escrito antes por error
  // en un pedido. STATE.precios solo sirve para "aprender" el precio de productos que todavía

  // se quede en cero — pero nunca pisa ni cambia un precio que ya viene de la lista oficial.
  // Vive dentro del documento principal del arqueo (no en su propia colección) porque es una
  // lista chica y acotada (un precio por producto), no algo que crezca sin límite.
  function normalizePrecioKey(s){
    return (s || "").trim().toLowerCase().replace(/\s+/g, " ");
  }
  function getPrecioFor(producto){
    var key = normalizePrecioKey(producto);
    if(!key) return null;
    var seedMap = getPedidoPrecioSeedMap();
    if(seedMap.hasOwnProperty(key)) return seedMap[key];
    var aliasMap = getPedidoPrecioAliasMap();
    if(aliasMap.hasOwnProperty(key) && seedMap.hasOwnProperty(aliasMap[key])){
      return seedMap[aliasMap[key]];

    var map = STATE.precios || {};
    return map.hasOwnProperty(key) ? map[key] : null;
  }

  // Un producto que todavía no está en la lista oficial (algo nuevo, o "Otros") sigue siendo
  // editable a mano, igual que antes.
  function esPrecioOficialProducto(producto){
    var key = normalizePrecioKey(producto);
    if(!key) return false;
    var seedMap = getPedidoPrecioSeedMap();
    if(seedMap.hasOwnProperty(key)) return true;
    var aliasMap = getPedidoPrecioAliasMap();
    return !!(aliasMap.hasOwnProperty(key) && seedMap.hasOwnProperty(aliasMap[key]));

  function setPrecioFor(producto, precio){

    var seedMap = getPedidoPrecioSeedMap();
    if(seedMap.hasOwnProperty(key)) return; // el precio de la lista oficial no se pisa
    var aliasMap = getPedidoPrecioAliasMap();
    if(aliasMap.hasOwnProperty(key) && seedMap.hasOwnProperty(aliasMap[key])) return; // ídem, vía alias de Triples
    if(!STATE.precios) STATE.precios = {};
    if(STATE.precios[key] !== precio){

      scheduleAutosave();
    }
  }

  function findClienteByNombre(nombre){
    var target = normalizeClienteName(nombre);
    if(!target) return null;
    var map = CLIENTES || {};

    Object.keys(map).forEach(function(id){
      if(found) return;
      if(normalizeClienteName(map[id].nombre) === target){ found = { id: id, data: map[id] }; }
    });

  }

  // direccionesNuevas (opcional): direcciones que se marcaron "guardar para futuros pedidos"
  // en el asistente de Nuevo Pedido MIENTRAS el cliente todavía no existía en Firestore (recién
  // se estaba creando en este mismo pedido) -- ver pedidoWizGuardarDireccionParaCliente(). Es
  // aditivo: nunca pisa direcciones que el cliente ya tuviera guardadas de antes.
  function upsertCliente(cliente, direccionesNuevas){
    if(!db || !cliente || !cliente.nombre || !cliente.nombre.trim()) return;
    var match = findClienteByNombre(cliente.nombre);
    var payload = {
      nombre: cliente.nombre.trim(),
      dni: cliente.dni || "",
      ruc: cliente.ruc || "",
      direccion: cliente.direccion || "",
      referencia: cliente.referencia || "",
      telefono: cliente.telefono || "",
      correo: cliente.correo || "",
      diasCredito: num(cliente.diasCredito),
      updatedAt: Date.now()
    };
    if(direccionesNuevas && direccionesNuevas.length){
      var previas = (match && match.data && match.data.direcciones) || [];
      var combinadas = previas.slice();
      direccionesNuevas.forEach(function(d){
        if(!d || !d.texto || !d.texto.trim()) return;
        var yaExiste = combinadas.some(function(x){ return (x.texto || "").trim() === d.texto.trim(); });
        if(!yaExiste) combinadas.push({ id:"d" + Date.now() + Math.floor(Math.random() * 1000), texto:d.texto.trim(), referencia:(d.referencia || "").trim() });
      });
      payload.direcciones = combinadas;
    }
    if(match){
      db.collection("clientes").doc(match.id).update(payload).catch(function(){});
    } else {
      db.collection("clientes").add(payload).catch(function(){});
    }
  }

  // Comprime la foto del comprobante (Yape/transferencia) antes de guardarla: cada Pedido vive
  // en su propio documento de Firestore (límite de 1 MB), así que se reduce el tamaño de la
  // imagen y se prueba con menos calidad hasta que quede liviana y quepa sin problema.
  function compressImageFile(file, done){
    var maxDim = 1000, maxBytes = 550000;
    var reader = new FileReader();
    reader.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxDim / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement("canvas");
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, cw, ch);
        function tryQuality(q){
          var dataUrl = canvas.toDataURL("image/jpeg", q);
          var approxBytes = Math.round(dataUrl.length * 0.75);
          if(approxBytes > maxBytes && q > 0.3){
            tryQuality(q - 0.12);
          } else {
            done(dataUrl);
          }
        }
        tryQuality(0.72);
      };
      img.onerror = function(){ done(null); };
      img.src = ev.target.result;
    };
    reader.onerror = function(){ done(null); };
    reader.readAsDataURL(file);
  }

    sortPedidoItemsPorFecha();
    renderPedidoItems(tbody, totalsRow);
    updatePedidoTotals(totalsRow);

    if(pedidoEditingId){
      card.addEventListener("input", function(){ schedulePedidoAutosave(); });
      card.addEventListener("change", function(){ schedulePedidoAutosave(); });
    }

    return card;
  }

  // =========================================================================================
  // ASISTENTE DE PEDIDO (paso a paso) -- SOLO para "Nuevo pedido" (Jessica, set-2026:
  // "quedamos en este" formato). "Editar pedido" NO usa esto -- sigue siendo el formulario
  // rápido de una sola pantalla de siempre (buildPedidoForm), sin cambios.
  //
  // Reglas de esta sección:
  //  - NUNCA se reimplementa savePedido(), la detección de duplicados, el cálculo de hora de
  //    listo, el precio congelado de la lista oficial, el comprobante, la numeración ni nada
  //    de lo que ya existe -- este asistente solo arma pedidoDraft (el MISMO objeto que ya usa
  //    el resto de Pedidos) paso a paso, y al final llama a savePedido() tal cual.
  //  - Los clientes pueden tener VARIAS direcciones guardadas (cliente.direcciones, campo
  //    nuevo y aditivo) -- pero pedidoDraft.cliente.direccion/referencia siguen siendo los
  //    mismos campos de siempre, así que Despacho, PDF, vista previa, etc seguen funcionando
  //    sin tocarlos.
  // =========================================================================================
  var PEDIDO_WIZ_KEYS = ["origen","tipo","entrega","cliente","direccion","productos","fechahora","pago","resumen"];
  var PEDIDO_WIZ_LABELS = ["Origen","Tipo","Entrega","Cliente","Dirección","Productos","Fecha y hora","Pago","Resumen"];
  var pedidoWizStep = 1;
  var pedidoWizTipo = null; // "normal" | "masivo" -- solo mientras se decide el canal (pasos 2-3)
  var pedidoWizClienteId = null; // id de Firestore del cliente elegido/encontrado, o null si es nuevo
  var pedidoWizClienteBuscar = "";
  var pedidoWizClienteNuevoModo = false;
  var pedidoWizProductoBuscar = "";
  var pedidoWizDireccionNuevaAbierta = false;
  var pedidoWizDireccionNuevaTexto = "";
  var pedidoWizDireccionNuevaRef = "";
  var pedidoWizDireccionGuardar = null; // true | false | null
  var pedidoWizDatePanelOpen = false;
  var pedidoWizCalYear = null;
  var pedidoWizCalMonth = null;
  var pedidoWizTimePanelOpen = false;
  var pedidoWizTimePanelAdvanced = false;
  var pedidoWizTp = { h12:6, m:0, ampm:"PM" };
  var pedidoWizPagoOtroModo = false;

  function pedidoWizReset(){
    pedidoWizStep = 1;
    pedidoWizTipo = null;
    pedidoWizClienteId = null;
    pedidoWizClienteBuscar = "";
    pedidoWizClienteNuevoModo = false;
    pedidoWizProductoBuscar = "";
    pedidoWizDireccionNuevaAbierta = false;
    pedidoWizDireccionNuevaTexto = "";
    pedidoWizDireccionNuevaRef = "";
    pedidoWizDireccionGuardar = null;
    pedidoWizDatePanelOpen = false;
    pedidoWizTimePanelOpen = false;
    pedidoWizTimePanelAdvanced = false;
    pedidoWizPagoOtroModo = false;
  }

  function pedidoWizTipoActual(){
    if(pedidoWizTipo) return pedidoWizTipo;
    return pedidoDraft && pedidoDraft.canal === "masivo" ? "masivo" : "normal";
  }
  function pedidoWizEntregaActual(){
    var draft = pedidoDraft;
    if(!draft) return null;
    if(draft.canal === "masivo") return draft.masivoModo === "delivery" ? "delivery" : (draft.masivoModo === "recojo" ? "recojo" : null);
    if(draft.canal === "delivery") return "delivery";
    if(draft.canal === "tienda") return "recojo";
    return null;
  }

  function pedidoWizGoStep(n){
    pedidoWizStep = Math.max(1, Math.min(PEDIDO_WIZ_KEYS.length, n));
    renderPanel();
    try{
      var panel = document.getElementById("pedidoWizPanel");
      if(panel) panel.scrollIntoView({ block:"start", behavior:"smooth" });
    }catch(e){}
  }
  function pedidoWizNext(){ if(pedidoWizStep < PEDIDO_WIZ_KEYS.length) pedidoWizGoStep(pedidoWizStep + 1); }
  function pedidoWizPrev(){ if(pedidoWizStep > 1) pedidoWizGoStep(pedidoWizStep - 1); }

  function pedidoWizPuedeAvanzar(){
    var draft = pedidoDraft;
    switch(PEDIDO_WIZ_KEYS[pedidoWizStep - 1]){
      case "origen": return !!draft.origen;
      case "tipo": return !!pedidoWizTipo || !!draft.canal;
      case "entrega": return !!pedidoWizEntregaActual();
      case "cliente": return !!(draft.cliente && draft.cliente.nombre && draft.cliente.nombre.trim());
      case "direccion":
        if(!pedidoRequiereReparto(draft)) return true;
        return !!(draft.cliente && draft.cliente.direccion && draft.cliente.direccion.trim());
      case "productos": return draft.items.some(function(it){ return it.producto && it.producto.trim() && num(it.cantidad) > 0; });
      case "fechahora": return !!draft.hora;
      case "pago": return !!draft.tipoPago;
      default: return true;
    }
  }

  // ---------- Direcciones guardadas por cliente (nuevo, aditivo: no toca direccion/referencia) ----------
  function pedidoWizDireccionesDe(clienteId){
    var c = clienteId && CLIENTES ? CLIENTES[clienteId] : null;
    var guardadas = (c && c.direcciones) || [];
    var lista = guardadas.slice();
    // Corrección (set-2026): la dirección antigua (el campo único de siempre, cliente.direccion
    // / referencia) debe seguir apareciendo SIEMPRE para elegirla, aunque el cliente ya tenga
    // direcciones nuevas guardadas en el array "direcciones" -- antes solo se mostraba cuando
    // "direcciones" estaba completamente vacío, así que desaparecía de la lista apenas se
    // agregaba la primera dirección nueva (bug reportado: "la migración de direcciones
    // antiguas"). Nunca se sobrescribe ni se borra acá -- solo se evita duplicarla si ya quedó
    // copiada dentro de "direcciones" con el mismo texto.
    if(c && c.direccion && c.direccion.trim() && c.direccion.trim() !== "Recojo en tienda"){
      var yaEstaEnGuardadas = lista.some(function(d){ return (d.texto||"").trim() === c.direccion.trim(); });
      if(!yaEstaEnGuardadas) lista.unshift({ id:"legacy", texto:c.direccion, referencia:c.referencia || "" });
    }
    return lista;
  }
  function pedidoWizGuardarDireccionParaCliente(clienteId, direccion){
    if(!direccion || !direccion.texto || !direccion.texto.trim()) return;
    if(clienteId && db){
      var actuales = pedidoWizDireccionesDe(clienteId).filter(function(d){ return d.id !== "legacy"; });
      var yaExiste = actuales.some(function(d){ return (d.texto||"").trim() === direccion.texto.trim(); });
      if(!yaExiste){
        actuales.push({ id:"d" + Date.now(), texto:direccion.texto.trim(), referencia:(direccion.referencia||"").trim() });
        db.collection("clientes").doc(clienteId).update({ direcciones: actuales }).catch(function(){});
      }
    } else {
      // Cliente todavía no existe en Firestore (recién se está creando en este mismo pedido) --
      // se guarda junto al pedidoDraft y upsertCliente() lo escribe cuando el pedido se guarda.
      pedidoDraft.cliente._direccionesNuevas = pedidoDraft.cliente._direccionesNuevas || [];
      pedidoDraft.cliente._direccionesNuevas.push({ texto:direccion.texto.trim(), referencia:(direccion.referencia||"").trim() });
    }
  }

  function iniciarPedidoAsistente(){
    pedidoDraft = newPedidoDraft("delivery");
    pedidoDraft.canal = null; // recién se define en los pasos 2-3
    pedidoWizReset();
  }

  function buildPedidoAsistente(){
    if(!pedidoDraft || pedidoDraft.canal === undefined){ iniciarPedidoAsistente(); }
    if(!pedidoDraft.canal){ /* sigue en pasos 1-3, todavía sin canal definido */ }
    var draft = pedidoDraft;

    var wrap = document.createElement("div");
    wrap.className = "card pw-wrap";
    wrap.id = "pedidoWizPanel";

    var headRow = document.createElement("div");
    headRow.className = "pw-head-row";
    var h2 = document.createElement("h2");
    h2.style.margin = "0";
    h2.textContent = "Nuevo pedido";
    headRow.appendChild(h2);
    var cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "pw-cancel-link";
    cancelBtn.textContent = "✕ Empezar de nuevo";
    cancelBtn.addEventListener("click", function(){
      if(!confirm("¿Descartar este pedido a medias y empezar de nuevo?")) return;
      iniciarPedidoAsistente();
      renderPanel();
    });
    headRow.appendChild(cancelBtn);
    wrap.appendChild(headRow);

    var breadcrumb = document.createElement("div");
    breadcrumb.className = "pw-breadcrumb";
    wrap.appendChild(breadcrumb);

    var progress = document.createElement("div");
    progress.className = "pw-progress";
    wrap.appendChild(progress);

    var body = document.createElement("div");
    body.className = "pw-body";
    body.id = "pedidoWizBody";
    wrap.appendChild(body);

    var footer = document.createElement("div");
    footer.className = "pw-footer";
    wrap.appendChild(footer);

    pedidoWizRenderBreadcrumb(breadcrumb);
    pedidoWizRenderProgress(progress);
    pedidoWizRenderStep(body);
    pedidoWizRenderFooter(footer);

    return wrap;
  }

  function pedidoWizRenderProgress(el){
    var total = PEDIDO_WIZ_KEYS.length;
    var dots = "";
    for(var i = 1; i <= total; i++){
      var cls = i < pedidoWizStep ? "done" : (i === pedidoWizStep ? "now" : "");
      dots += '<span class="pw-dot ' + cls + '"></span>';
    }
    el.innerHTML = '<div class="pw-progress-dots">' + dots + '</div>' +
      '<div class="pw-progress-txt">Paso ' + pedidoWizStep + ' de ' + total + ' · ' + PEDIDO_WIZ_LABELS[pedidoWizStep - 1] + '</div>';
  }

  function pedidoWizRenderBreadcrumb(el){
    var draft = pedidoDraft;
    var pills = [];
    if(draft.origen) pills.push([ORIGEN_LABEL[draft.origen], 1]);
    if(pedidoWizStep > 2 || draft.canal) pills.push([pedidoWizTipoActual() === "masivo" ? "Pedido masivo" : "Normal", 2]);
    var entrega = pedidoWizEntregaActual();
    if(entrega) pills.push([entrega === "delivery" ? "Delivery" : "Recojo en tienda", 3]);
    if(draft.cliente && draft.cliente.nombre) pills.push([draft.cliente.nombre, 4]);
    if(pedidoRequiereReparto(draft) && draft.cliente && draft.cliente.direccion) pills.push([draft.cliente.direccion.split(",")[0], 5]);
    var validItems = draft.items.filter(function(it){ return it.producto && it.producto.trim() && num(it.cantidad) > 0; });
    if(validItems.length) pills.push([validItems.length + " producto" + (validItems.length === 1 ? "" : "s"), 6]);
    if(draft.hora) pills.push([fmtHora12(draft.hora), 7]);
    if(draft.tipoPago) pills.push([draft.tipoPago, 8]);
    el.innerHTML = pills.map(function(p){
      return '<span class="pw-bc-pill" data-step="' + p[1] + '"><span class="pw-ck">✓</span>' + esc(p[0]) + '</span>';
    }).join("");
    el.querySelectorAll(".pw-bc-pill").forEach(function(pill){
      pill.addEventListener("click", function(){ pedidoWizGoStep(+pill.getAttribute("data-step")); });
    });
  }

  function pedidoWizRenderFooter(el){
    var draft = pedidoDraft;
    var validItems = draft.items.filter(function(it){ return it.producto && it.producto.trim() && num(it.cantidad) > 0; });
    var totalHtml = validItems.length ? ("Total<b>S/ " + fmt(pedidoSubtotal({items:validItems}) + pedidoDeliveryTotal(draft)) + "</b>") : "&nbsp;";
    var actionsHtml = "";
    if(pedidoWizStep > 1) actionsHtml += '<button type="button" class="btn pw-atras-btn">← Atrás</button>';
    if(pedidoWizStep < PEDIDO_WIZ_KEYS.length){
      actionsHtml += '<button type="button" class="btn btn-primary pw-continuar-btn"' + (pedidoWizPuedeAvanzar() ? "" : " disabled") + '>Continuar →</button>';
    } else {
      actionsHtml += '<button type="button" class="btn btn-primary pw-confirmar-btn"' + (pedidosSaving ? " disabled" : "") + '>' + (pedidosSaving ? "Guardando…" : "✓ Confirmar y guardar pedido") + '</button>';
    }
    el.innerHTML = '<div class="pw-footer-total">' + totalHtml + '</div><div class="pw-footer-actions">' + actionsHtml + '</div>';
    var atras = el.querySelector(".pw-atras-btn");
    if(atras) atras.addEventListener("click", pedidoWizPrev);
    var continuar = el.querySelector(".pw-continuar-btn");
    if(continuar) continuar.addEventListener("click", pedidoWizNext);
    var confirmar = el.querySelector(".pw-confirmar-btn");
    if(confirmar) confirmar.addEventListener("click", function(){ savePedido(); });
  }

  // Reconstruye SOLO el cuerpo del paso actual (sin tocar breadcrumb/progreso/footer del todo) --
  // usado para búsquedas en vivo (cliente/producto) donde SÍ hace falta no perder el foco del
  // input mientras se escribe. Para cualquier cambio estructural (cambiar de paso, elegir una
  // tile, agregar/quitar una línea) se sigue usando renderPanel(), igual que el resto de Pedidos.
  function pedidoWizRenderStepOnly(){
    var body = document.getElementById("pedidoWizBody");
    if(!body) return renderPanel();
    var active = document.activeElement;
    var activeCls = active && active.className;
    var selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
    pedidoWizRenderStep(body);
    var footer = document.querySelector("#pedidoWizPanel .pw-footer");
    if(footer) pedidoWizRenderFooter(footer);
    var breadcrumb = document.querySelector("#pedidoWizPanel .pw-breadcrumb");
    if(breadcrumb) pedidoWizRenderBreadcrumb(breadcrumb);
    if(activeCls){
      var again = body.querySelector("." + String(activeCls).trim().split(/\s+/).join("."));
      if(again){ again.focus(); if(selStart != null){ try{ again.setSelectionRange(selStart, selStart); }catch(e){} } }
    }
  }

  function pedidoWizRenderStep(body){
    var fn = PEDIDO_WIZ_STEP_RENDERERS[PEDIDO_WIZ_KEYS[pedidoWizStep - 1]];
    body.innerHTML = fn ? fn() : "";
    var wireFn = PEDIDO_WIZ_STEP_WIRE[PEDIDO_WIZ_KEYS[pedidoWizStep - 1]];
    if(wireFn) wireFn(body);
  }

  function pwTile(active, extraCls){
    return "pw-tile" + (active ? " active" : "") + (extraCls ? " " + extraCls : "");
  }

  var PEDIDO_WIZ_STEP_RENDERERS = {
    origen: function(){
      var draft = pedidoDraft;
      return '<div class="pw-q">¿De dónde vino el pedido?</div>' +
        '<div class="pw-sub">Elige una opción para continuar</div>' +

          '<button type="button" class="' + pwTile(draft.origen === "whatsapp") + '" data-origen="whatsapp"><span class="pw-tile-icon">💬</span><span class="pw-tile-label">WhatsApp</span><span class="pw-tile-sub">Pedido recibido por chat</span></button>' +

        '</div>';

    tipo: function(){
      var tipo = pedidoWizTipoActual();
      return '<div class="pw-q">¿Qué tipo de pedido es?</div>' +

          '<button type="button" class="' + pwTile(pedidoDraft.canal && tipo === "normal") + '" data-tipo="normal"><span class="pw-tile-icon">🧺</span><span class="pw-tile-label">Pedido normal</span><span class="pw-tile-sub">Un cliente, un pedido</span></button>' +
          '<button type="button" class="' + pwTile(tipo === "masivo" && pedidoDraft.canal === "masivo") + '" data-tipo="masivo"><span class="pw-tile-icon">🏢</span><span class="pw-tile-label">Pedido masivo</span><span class="pw-tile-sub">RUC, crédito, varias fechas</span></button>' +
        '</div>';
    },
    entrega: function(){
      var entrega = pedidoWizEntregaActual();
      return '<div class="pw-q">¿Cómo se entrega?</div>' +

        '<div class="pw-tile-group">' +
          '<button type="button" class="' + pwTile(entrega === "delivery") + '" data-entrega="delivery"><span class="pw-tile-icon">🚚</span><span class="pw-tile-label">Delivery</span><span class="pw-tile-sub">Se lleva al cliente</span></button>' +
          '<button type="button" class="' + pwTile(entrega === "recojo") + '" data-entrega="recojo"><span class="pw-tile-icon">🏪</span><span class="pw-tile-label">Recojo en tienda</span><span class="pw-tile-sub">El cliente pasa a recoger</span></button>' +
        '</div>';
    },
    cliente: function(){ return pedidoWizClienteNuevoModo ? pedidoWizRenderClienteNuevo() : pedidoWizRenderClienteBuscar(); },
    direccion: function(){ return pedidoWizRenderDireccion(); },
    productos: function(){ return pedidoWizRenderProductos(); },
    fechahora: function(){ return pedidoWizRenderFechaHora(); },
    pago: function(){ return pedidoWizRenderPago(); },
    resumen: function(){ return pedidoWizRenderResumen(); }
  };

  function pedidoWizElegirTipoEntrega(){
    // Recalcula draft.canal/masivoModo cada vez que tipo o entrega cambian -- se llama desde los
    // pasos 2 y 3. Antes de tener AMBOS datos, canal queda null (no se puede avanzar más allá).
    var tipo = pedidoWizTipo;
    var entrega = pedidoWizEntregaActual();
    if(!tipo) return;
    var draft = pedidoDraft;
    if(tipo === "masivo"){
      draft.canal = "masivo";
      if(entrega) draft.masivoModo = entrega;
    } else if(entrega){
      draft.canal = entrega === "delivery" ? "delivery" : "tienda";
      if(draft.canal === "tienda" && !draft.cliente.direccion) draft.cliente.direccion = "Recojo en tienda";
    }
  }

  // ---------- Paso: Cliente ----------
  function pedidoWizBuscarClientes(q){
    q = normalizeClienteName(q);
    var map = CLIENTES || {};
    var qTel = q.replace(/\s/g, "");
    var out = [];
    Object.keys(map).forEach(function(id){
      var c = map[id];
      var nombre = (c.nombre || "").toLowerCase();
      var tel = (c.telefono || "").replace(/\s/g, "");
      if(nombre.indexOf(q) > -1 || (qTel && tel.indexOf(qTel) > -1) || (c.ruc || "").indexOf(q) > -1 || (c.dni || "").indexOf(q) > -1){
        out.push({ id:id, data:c });
      }
    });
    out.sort(function(a, b){ return (a.data.nombre || "").localeCompare(b.data.nombre || ""); });
    return out.slice(0, 25);
  }
  function pedidoWizRenderClienteBuscar(){
    var draft = pedidoDraft;
    if(draft.cliente && draft.cliente.nombre && draft.cliente.nombre.trim() && !pedidoWizClienteNuevoModo){
      var c = draft.cliente;
      var html = '<div class="pw-q">Cliente</div>' +
        '<div class="pw-sub">Datos completados automáticamente desde la base de clientes</div>' +
        '<div class="pw-client-chosen"><div><div class="pw-client-nombre">' + esc(c.nombre) + '</div>' +
        '<div class="pw-client-meta">' + esc(c.telefono || "") + (c.ruc ? " · RUC " + esc(c.ruc) : "") + (c.dni ? " · DNI " + esc(c.dni) : "") + '</div></div>' +
        '<button type="button" class="pw-link-btn pw-cambiar-cliente">Cambiar</button></div>';
      html += '<div class="field-grid" style="margin-top:.9rem;">' +
        pwFieldHtml("DNI", "pwClDni", c.dni, "dni") +
        pwFieldHtml("RUC", "pwClRuc", c.ruc, "ruc") +
        pwFieldHtml("Teléfono", "pwClTel", c.telefono, "telefono") +
        pwFieldHtml("Correo", "pwClCorreo", c.correo, "correo") +
        '</div>' +
        pwCreditoHtml();
      return html;
    }
    var q = pedidoWizClienteBuscar;
    var results = q.trim() ? pedidoWizBuscarClientes(q) : [];
    var html = '<div class="pw-q">¿Quién es el cliente?</div>' +
      '<div class="pw-sub">Busca por nombre, razón social, RUC, DNI o teléfono</div>' +
      '<div class="pw-search-box"><input type="text" class="pw-cliente-buscar-input" placeholder="Ej: mam…" value="' + esc(q) + '"></div>';
    if(q.trim()){
      if(results.length){
        html += '<div class="pw-search-results">' + results.map(function(r){
          var dirCount = pedidoWizDireccionesDe(r.id).length;
          return '<div class="pw-result-card" data-id="' + esc(r.id) + '"><div><div class="pw-result-nombre">' + esc(r.data.nombre) + '</div>' +
            '<div class="pw-result-meta">' + esc(r.data.telefono || "") + (r.data.ruc ? " · RUC " + esc(r.data.ruc) : "") + ' · ' + dirCount + ' dirección(es) guardada(s)</div></div>' +
            '<span class="pw-result-go">Usar →</span></div>';
        }).join("") + '</div>';
      } else {
        html += '<div class="pw-empty-hint">Sin coincidencias para "' + esc(q) + '". Puedes crear un cliente nuevo abajo.</div>';
      }
    }
    html += '<div class="pw-divider-or">o</div>' +
      '<button type="button" class="btn btn-sm pw-crear-cliente-btn" style="width:100%;">+ Registrar cliente nuevo</button>';
    return html;
  }
  function pwFieldHtml(label, cls, value, campo){
    return '<div class="field"><label>' + label + '</label><input type="text" class="' + cls + '" data-campo="' + campo + '" value="' + esc(value || "") + '"></div>';
  }
  function pwCreditoHtml(){
    var draft = pedidoDraft;
    var cur = num(draft.cliente.diasCredito);
    return '<div class="field" style="margin-top:.9rem;"><label>Crédito</label><div class="shift-toggle">' +
      [[0,"Contado"],[7,"7 días"],[15,"15 días"]].map(function(p){
        return '<button type="button" class="shift-btn' + (cur === p[0] ? " active" : "") + ' pw-credito-btn" data-dias="' + p[0] + '">' + p[1] + '</button>';
      }).join("") + '</div></div>';
  }
  function pedidoWizRenderClienteNuevo(){
    var draft = pedidoDraft;
    var c = draft.cliente;
    var dup = null;
    if(c.telefono && c.telefono.replace(/\s/g, "").length >= 6){
      var tel = c.telefono.replace(/\s/g, "");
      Object.keys(CLIENTES || {}).forEach(function(id){
        if(dup) return;
        var x = CLIENTES[id];
        if(x.telefono && x.telefono.replace(/\s/g, "") === tel) dup = { id:id, data:x };
      });
    }
    if(!dup && c.ruc && c.ruc.length >= 8){
      Object.keys(CLIENTES || {}).forEach(function(id){ if(!dup && CLIENTES[id].ruc === c.ruc) dup = { id:id, data:CLIENTES[id] }; });
    }
    if(!dup && c.dni && c.dni.length >= 8){
      Object.keys(CLIENTES || {}).forEach(function(id){ if(!dup && CLIENTES[id].dni === c.dni) dup = { id:id, data:CLIENTES[id] }; });
    }
    var html = '<div class="pw-q">Cliente nuevo</div>' +
      '<div class="pw-sub">Se guardará para no volver a digitarlo la próxima vez</div>' +

      '<div class="field-grid" style="margin-top:.7rem;">' +
      pwFieldHtml("Teléfono", "pwCnTel", c.telefono, "telefono") +
      pwFieldHtml("DNI", "pwCnDni", c.dni, "dni") +
      pwFieldHtml("RUC", "pwCnRuc", c.ruc, "ruc") +
      pwFieldHtml("Correo", "pwCnCorreo", c.correo, "correo") +
      '</div>' + pwCreditoHtml();
    if(dup){
      html += '<div class="pw-dup-warning">⚠️ Ya existe un cliente con estos datos: <b>' + esc(dup.data.nombre) + '</b> (' + esc(dup.data.telefono || "") + ').' +
        '<div style="margin-top:.5rem;"><button type="button" class="btn btn-primary pw-usar-existente-btn" data-id="' + esc(dup.id) + '">Usar este cliente existente</button></div></div>';
    }
    html += '<div class="pw-divider-or">o</div><button type="button" class="btn btn-sm pw-buscar-existente-btn" style="width:100%;">← Buscar un cliente existente</button>';
    return html;
  }
  var PEDIDO_WIZ_STEP_WIRE = {

      // Nombre, teléfono, DNI y RUC recalculan el aviso de "cliente ya existe" al toque (ver
      // pedidoWizRenderClienteNuevo) -- por eso, a diferencia de un campo suelto, sí necesitan
      // volver a pintar el paso en cada tecla (pedidoWizRenderStepOnly conserva el foco). Correo
      // no participa del aviso de duplicado, así que solo actualiza el draft sin repintar.
      body.querySelectorAll("[data-campo]").forEach(function(input){
        var campo = input.getAttribute("data-campo");

  // ---------- Paso: Dirección ----------

        '<div class="field" style="margin-top:.6rem;"><label>Referencia</label><input type="text" class="pw-dir-ref-input" value="' + esc(pedidoWizDireccionNuevaRef) + '" placeholder="Edificio, piso, entre calles…"></div>' +
        '<div class="field" style="margin-top:.7rem;"><label>¿Guardar esta dirección para futuros pedidos?</label><div class="shift-toggle">' +
          '<button type="button" class="shift-btn' + (pedidoWizDireccionGuardar === true ? " active" : "") + ' pw-dir-guardar-si">Sí, guardar</button>' +
          '<button type="button" class="shift-btn' + (pedidoWizDireccionGuardar === false ? " active" : "") + ' pw-dir-guardar-no">No, solo este pedido</button>' +
        '</div></div>' +
        '<div style="display:flex; gap:.5rem; margin-top:.8rem;">' +
          '<button type="button" class="btn btn-sm pw-dir-cancelar-btn">Cancelar</button>' +
          '<button type="button" class="btn btn-primary btn-sm pw-dir-usar-btn">Usar esta dirección</button>' +

    } else {

  function pedidoWizWireDireccion(body){
    var draft = pedidoDraft;
    body.querySelectorAll(".pw-addr-opt").forEach(function(opt){
      opt.addEventListener("click", function(){
        draft.cliente.direccion = opt.getAttribute("data-texto");
        draft.cliente.referencia = opt.getAttribute("data-ref");
        pedidoWizDireccionNuevaAbierta = false;
        renderPanel();
      });
    });
    var nuevaBtn = body.querySelector(".pw-nueva-direccion-btn");
    if(nuevaBtn) nuevaBtn.addEventListener("click", function(){
      pedidoWizDireccionNuevaAbierta = true;
      pedidoWizDireccionNuevaTexto = ""; pedidoWizDireccionNuevaRef = ""; pedidoWizDireccionGuardar = null;
      renderPanel();
    });
    var textoInput = body.querySelector(".pw-dir-texto-input");
    if(textoInput) textoInput.addEventListener("input", function(){ pedidoWizDireccionNuevaTexto = textoInput.value; });
    var refInput = body.querySelector(".pw-dir-ref-input");
    if(refInput) refInput.addEventListener("input", function(){ pedidoWizDireccionNuevaRef = refInput.value; });
    var siBtn = body.querySelector(".pw-dir-guardar-si");
    if(siBtn) siBtn.addEventListener("click", function(){ pedidoWizDireccionGuardar = true; renderPanel(); });
    var noBtn = body.querySelector(".pw-dir-guardar-no");

    var usarBtn = body.querySelector(".pw-dir-usar-btn");
    if(usarBtn) usarBtn.addEventListener("click", function(){
      if(!pedidoWizDireccionNuevaTexto.trim()){ showToast("Escribe la dirección antes de continuar."); return; }
      draft.cliente.direccion = pedidoWizDireccionNuevaTexto.trim();
      draft.cliente.referencia = pedidoWizDireccionNuevaRef.trim();
      if(pedidoWizDireccionGuardar){
        pedidoWizGuardarDireccionParaCliente(pedidoWizClienteId, { texto: draft.cliente.direccion, referencia: draft.cliente.referencia });
      }
