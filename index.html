<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<title>Arqueo Diario</title>
<style>
  :root{
    --bg:#F5F3EE;
    --surface:#FFFFFF;
    --surface-2:#ECE5D6;
    --border:#DDD3BE;
    --ink:#241C13;
    --ink-soft:#6C5F49;
    --ink-muted:#96896E;
    --accent:#1F5B6E;
    --accent-ink:#FFFFFF;
    --accent-soft:#DEEAEC;
    --good:#3D7A57;
    --good-soft:#E3F0E7;
    --bad:#B34428;
    --bad-soft:#FAE6DF;
    --warn:#A6631B;
    --warn-soft:#F5E8D2;
    --radius:12px;
    --radius-sm:8px;
    --shadow:0 1px 2px rgba(36,28,19,.06), 0 10px 28px -14px rgba(36,28,19,.22);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18140E; --surface:#221C14; --surface-2:#2C2519; --border:#3C3222;
      --ink:#F2ECDE; --ink-soft:#C3B79E; --ink-muted:#8C8069;
      --accent:#72B8CB; --accent-ink:#0E2A31; --accent-soft:#213A3F;
      --good:#71BE93; --good-soft:#1F3627; --bad:#E28369; --bad-soft:#3D2419;
      --warn:#D9A75E; --warn-soft:#3A2C16;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#18140E; --surface:#221C14; --surface-2:#2C2519; --border:#3C3222;
    --ink:#F2ECDE; --ink-soft:#C3B79E; --ink-muted:#8C8069;
    --accent:#72B8CB; --accent-ink:#0E2A31; --accent-soft:#213A3F;
    --good:#71BE93; --good-soft:#1F3627; --bad:#E28369; --bad-soft:#3D2419;
    --warn:#D9A75E; --warn-soft:#3A2C16;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif;
    font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; padding:0; margin:-1px; }
  button, input, textarea{ font-family:inherit; color:inherit; }
  input:focus-visible, textarea:focus-visible, button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .app{ max-width:1120px; margin:0 auto; padding-bottom:4rem; }

  .topbar{ position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--border); padding:.9rem 1.1rem 0; }
  .topbar-inner{ display:flex; flex-wrap:wrap; gap:.9rem 1.4rem; align-items:flex-end; justify-content:space-between; padding-bottom:.8rem; }
  .brand-title{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.55rem; letter-spacing:-.01em; margin:0; text-wrap:balance; }
  .brand-sub{ font-size:.82rem; color:var(--ink-soft); margin-top:.15rem; }
  .topbar-controls{ display:flex; align-items:flex-end; gap:1rem; flex-wrap:wrap; }
  .date-field input[type="date"]{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.5rem .65rem; font-size:.92rem; color:var(--ink); }
  .save-area{ display:flex; flex-direction:column; align-items:flex-end; gap:.3rem; }
  .save-status{ font-size:.78rem; color:var(--ink-muted); white-space:nowrap; }
  .save-status.warn{ color:var(--warn); }
  .save-status.bad{ color:var(--bad); }
  .btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:var(--radius-sm); padding:.55rem 1rem; font-size:.88rem; font-weight:600; cursor:pointer; transition:filter .12s ease; }
  .btn:hover{ filter:brightness(0.97); }
  @media (prefers-color-scheme:dark){ .btn:hover{ filter:brightness(1.12); } }
  :root[data-theme="dark"] .btn:hover{ filter:brightness(1.12); }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-sm{ padding:.35rem .65rem; font-size:.78rem; }

  .tabs{ display:flex; gap:.4rem; overflow-x:auto; padding-bottom:.7rem; -ms-overflow-style:none; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ border:1px solid transparent; background:transparent; color:var(--ink-soft); padding:.5rem .85rem; border-radius:999px; font-size:.86rem; font-weight:600; white-space:nowrap; cursor:pointer; }
  .tab-btn .count{ display:inline-block; margin-left:.4rem; font-size:.72rem; font-weight:700; background:var(--bad-soft); color:var(--bad); border-radius:999px; padding:.05rem .4rem; }
  .tab-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .tab-btn.active{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft); }
  :root[data-theme="dark"] .tab-btn.active{ color:var(--ink); }
  @media (prefers-color-scheme:dark){ .tab-btn.active{ color:var(--ink); } }

  #banners{ padding:0 1.1rem; }
  .banner{ margin-top:.9rem; border-radius:var(--radius-sm); padding:.7rem .9rem; font-size:.86rem; display:flex; gap:.7rem; align-items:flex-start; justify-content:space-between; }
  .banner.warn{ background:var(--warn-soft); color:var(--warn); }
  .banner.bad{ background:var(--bad-soft); color:var(--bad); }
  .banner.info{ background:var(--accent-soft); color:var(--accent); }
  .banner-actions{ display:flex; gap:.5rem; flex-shrink:0; }
  .banner button{ border:1px solid currentColor; background:transparent; color:inherit; border-radius:6px; padding:.25rem .6rem; font-size:.78rem; font-weight:600; cursor:pointer; }

  .main{ padding:1.1rem; }
  .strip{ display:flex; flex-wrap:wrap; gap:.5rem 1.2rem; align-items:baseline; color:var(--ink-soft); font-size:.85rem; margin-bottom:1rem; }
  .strip strong{ color:var(--ink); font-weight:700; }
  .strip .ok{ color:var(--good); font-weight:600; }
  .strip .alert{ color:var(--bad); font-weight:600; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.1rem 1.2rem; margin-bottom:1rem; }
  .card h2{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.1rem; margin:0 0 .9rem; }
  .card h3{ font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-muted); margin:1.1rem 0 .5rem; }
  .card h3:first-child{ margin-top:0; }
  .card .hint{ font-size:.78rem; color:var(--ink-muted); margin:-.5rem 0 .8rem; }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.9rem 1.1rem; }
  @media (max-width:620px){ .field-grid{ grid-template-columns:1fr; } }
  .billete-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:.7rem 1rem; }
  .cajero-diff.good{ color:var(--good); font-weight:700; }
  .cajero-diff.bad{ color:var(--bad); font-weight:700; }
  /* Letra un poco más grande solo dentro de Caja Cajeros (no toca Arqueo ni Pedidos). */
  .cajero-form-card .field label{ font-size:.86rem; }
  .cajero-form-card .field input, .cajero-form-card .field textarea{ font-size:1.05rem; }
  .cajero-form-card .num-input{ font-size:1rem; width:4.6rem; padding:.35rem .4rem; }
  .cajero-form-card select.cajero-dolar-monto{ font-size:1rem; padding:.35rem .4rem; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--ink); width:100%; }
  .cajero-form-card input.cajero-dolar-serie, .cajero-form-card input.cajero-gasto-desc, .cajero-form-card input.cajero-gasto-monto{ font-size:1rem; }
  .cajero-form-card .pedido-totals{ font-size:1rem; }
  .cajero-form-card table.data-table th{ font-size:.74rem; }
  .cajero-form-card table.data-table td{ font-size:.98rem; }
  .cajero-historial-card table.data-table th{ font-size:.72rem; }
  .cajero-historial-card table.data-table td{ font-size:.95rem; }
  .field{ display:flex; flex-direction:column; gap:.32rem; }
  .field.full{ grid-column:1 / -1; }
  .field label{ font-size:.78rem; color:var(--ink-soft); font-weight:600; }
  .field input, .field textarea{ background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.55rem .65rem; font-size:.92rem; color:var(--ink); width:100%; }
  .field textarea{ min-height:4.2rem; resize:vertical; font-family:inherit; }

  .shift-toggle{ display:inline-flex; background:var(--surface-2); border-radius:999px; padding:.2rem; gap:.15rem; }
  .shift-btn{ border:none; background:transparent; color:var(--ink-soft); padding:.4rem .95rem; border-radius:999px; font-size:.84rem; font-weight:700; cursor:pointer; }
  .shift-btn.active{ background:var(--accent); color:var(--accent-ink); }

  .name-cell{ display:flex; align-items:center; justify-content:space-between; gap:.5rem; }
  .btn-del{ flex:none; width:1.5rem; height:1.5rem; border-radius:50%; border:1px solid var(--border); background:var(--surface); color:var(--bad); font-size:.75rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .btn-del:hover{ background:var(--bad); color:#fff; border-color:var(--bad); }
  .add-row{ display:flex; gap:.6rem; align-items:center; margin-bottom:.8rem; flex-wrap:wrap; }
  .add-row input[type="text"]{ flex:1; min-width:220px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.5rem .7rem; font-size:.88rem; color:var(--ink); }
  .search-row{ display:flex; gap:.6rem; align-items:center; margin-bottom:.8rem; flex-wrap:wrap; justify-content:space-between; }
  .search-row .search-left{ display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; flex:1; }
  .search-row input[type="search"]{ flex:1; min-width:180px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.5rem .7rem; font-size:.88rem; color:var(--ink); }
  .legend{ display:flex; gap:.9rem; font-size:.76rem; color:var(--ink-muted); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:.35rem; }
  .dot{ width:.5rem; height:.5rem; border-radius:50%; display:inline-block; }
  .dot.good{ background:var(--good); }
  .dot.bad{ background:var(--bad); }
  .dot.neutral{ background:var(--ink-muted); }
  .dot.warn{ background:var(--warn); }

  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); }
  table.data-table{ border-collapse:collapse; width:100%; min-width:920px; font-variant-numeric:tabular-nums; }
  table.data-table thead th{ position:sticky; top:0; background:var(--surface-2); color:var(--ink-soft); font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; font-weight:700; text-align:right; padding:.55rem .55rem; border-bottom:1px solid var(--border); white-space:nowrap; z-index:2; }
  table.data-table thead th:first-child{ text-align:left; left:0; z-index:3; }
  table.data-table tbody td{ padding:.35rem .5rem; border-bottom:1px solid var(--border); text-align:right; background:var(--surface); vertical-align:middle; }
  table.data-table tbody tr:last-child td{ border-bottom:none; }
  table.data-table tbody tr:nth-child(even) td{ background:var(--bg); }
  table.data-table tbody td:first-child{ text-align:left; font-weight:600; color:var(--ink); position:sticky; left:0; z-index:1; }
  table.data-table tbody tr.flag td:first-child{ box-shadow:inset 3px 0 0 var(--bad); }
  table.data-table tbody tr.pending-data:not(.flag) td:first-child{ box-shadow:inset 3px 0 0 var(--warn); }
  .num-input.pending-warn{ border-color:var(--warn); }
  .derived.pending-warn{ color:var(--warn); font-weight:700; }
  .ing-group{ display:inline-flex; gap:.25rem; }
  .num-input{ width:4.1rem; text-align:right; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:.3rem .35rem; font-size:.85rem; color:var(--ink); font-variant-numeric:tabular-nums; }
  .num-input.mini{ width:2.15rem; padding:.3rem .2rem; text-align:center; }
  .num-input.vc{ width:4.4rem; }
  /* Los 3 recuadros de "Ingresos" del Arqueo (Ingreso 1/2/3) más grandes: antes eran tan
     chicos que no se alcanzaba a ver el gramaje completo ni el resto de lo que se anotaba ahí. */
  .ing-group .num-input.mini{ width:3.5rem; padding:.4rem .3rem; font-size:.95rem; }
  /* Cantidad y precio de cada línea de un Pedido: recuadros más grandes y fáciles de leer/tocar. */
  .num-input.mini.pedido-item-cantidad, .num-input.mini.pedido-item-precio{
    width:4.6rem; padding:.5rem .4rem; font-size:1.05rem; font-weight:700; text-align:center;
  }
  .time-input{ width:5.7rem; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:.28rem .35rem; font-size:.8rem; color:var(--ink); }
  .ag-note{ font-size:.68rem; color:var(--bad); margin-top:.15rem; text-align:right; }
  .derived{ color:var(--ink-muted); font-size:.85rem; font-style:italic; }
  .ventas-cell{ font-weight:700; min-width:3.6rem; }
  .ventas-cell.good{ color:var(--good); }
  .ventas-cell.bad{ color:var(--bad); }
  .ventas-cell.neutral{ color:var(--ink-muted); font-weight:600; }
  .cuadre-cell{ font-weight:700; min-width:3.6rem; }
  .cuadre-cell.good{ color:var(--good); }
  .cuadre-cell.bad{ color:var(--bad); }
  .ventas-cell.pending, .cuadre-cell.pending{ color:var(--ink-muted); font-weight:600; }
  .cuadre-cell.pending{ color:var(--ink-muted); font-weight:500; }
  .row-count{ font-size:.78rem; color:var(--ink-muted); margin-top:.6rem; }

  /* Metas (objetivo de venta del día) */
  .metas-cats{ display:grid; grid-template-columns:repeat(auto-fit, minmax(360px, 1fr)); gap:1rem; margin-top:1rem; }
  table.metas-table{ min-width:0; width:100%; }
  .metas-cats table.metas-table{ table-layout:fixed; }
  table.metas-reporte-table{ min-width:640px; }
  table.metas-table th:first-child, table.metas-table td:first-child{ width:auto; }
  table.metas-table tfoot td{ padding:.35rem .5rem; border-top:1px solid var(--border); border-bottom:none; text-align:right; background:var(--surface-2); font-weight:700; }
  table.metas-table tfoot td:first-child{ text-align:left; font-size:.68rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); }
  table.metas-table .meta-input{ background:var(--accent-soft); }
  table.metas-table .metas-pct.good{ color:var(--good); }
  table.metas-table .metas-falta{ color:var(--bad); }
  table.metas-table .metas-falta.good{ color:var(--good); font-size:.78rem; }
  table.metas-table tfoot td.good{ color:var(--good); }
  .metas-num-input{ width:3.1rem; padding:.28rem .2rem; text-align:center; }

  .history-list{ display:flex; flex-direction:column; gap:.7rem; }
  .history-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.85rem 1rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; cursor:pointer; text-align:left; width:100%; box-shadow:var(--shadow); }
  .history-card:hover{ border-color:var(--accent); }
  .history-date{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.02rem; text-transform:capitalize; }
  .history-meta{ font-size:.8rem; color:var(--ink-soft); margin-top:.2rem; }
  .history-badges{ display:flex; gap:.4rem; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .history-export-btn{ font-size:.72rem; padding:.3rem .55rem; }
  .chip{ font-size:.74rem; font-weight:700; border-radius:999px; padding:.2rem .6rem; white-space:nowrap; }
  .chip.good{ background:var(--good-soft); color:var(--good); }
  .chip.bad{ background:var(--bad-soft); color:var(--bad); }
  .chip.pedido-pagado-toggle{ border:none; cursor:pointer; font-family:inherit; }
  .pedido-totals{ margin-top:1rem; padding-top:.8rem; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:.25rem; font-size:.92rem; }
  .pedido-checkbox-label{ display:flex; align-items:center; gap:.5rem; font-size:.9rem; font-weight:600; cursor:pointer; }
  .pedido-checkbox-label input{ width:auto; }
  .pedido-productos-cell{ max-width:320px; white-space:normal; }
  .empty-state{ color:var(--ink-soft); font-size:.9rem; padding:1.4rem 0; text-align:center; }

  .toast{ position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:.6rem 1rem; border-radius:999px; font-size:.84rem; box-shadow:var(--shadow); z-index:40; max-width:90vw; text-align:center; }
  @media (prefers-color-scheme:dark){ .toast{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border); } }
  :root[data-theme="dark"] .toast{ background:var(--surface-2); color:var(--ink); border:1px solid var(--border); }

  .lock-screen{ position:fixed; inset:0; z-index:100; background:var(--bg); align-items:center; justify-content:center; padding:1.2rem; }
  .lock-screen:not([hidden]){ display:flex; }
  .lock-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:1.6rem 1.6rem 1.8rem; max-width:340px; width:100%; text-align:center; }
  .lock-title{ font-family:"Fraunces", Georgia, serif; font-weight:600; font-size:1.4rem; margin:0 0 .3rem; }
  .lock-sub{ font-size:.85rem; color:var(--ink-soft); margin:0 0 1.1rem; }
  .lock-input-wrap{ position:relative; margin-bottom:.8rem; }
  .lock-input{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-sm); padding:.65rem 4.4rem .65rem .8rem; font-size:1rem; color:var(--ink); text-align:center; margin-bottom:0; }
  .lock-toggle{ position:absolute; right:.35rem; top:50%; transform:translateY(-50%); border:none; background:transparent; color:var(--accent); font-size:.78rem; font-weight:700; padding:.3rem .5rem; cursor:pointer; }
  .lock-btn{ width:100%; }
  .lock-error{ color:var(--bad); font-size:.82rem; margin:.8rem 0 0; }

  #printArea{ display:none; }
  @media print{
    .app, .toast, #banners{ display:none !important; }
    #printArea{
      display:block !important; background:#fff; color:#111; padding:0; margin:0;
      font-family:"Public Sans", ui-sans-serif, system-ui, sans-serif; font-size:11px;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact;
    }
    #printArea h1{ font-family:"Fraunces", Georgia, serif; font-size:20px; margin:0 0 .1em; }
    #printArea .print-sub{ font-size:13px; color:#333; margin:0 0 .8em; }
    #printArea .print-summary{ font-weight:700; margin:.6em 0; }
    #printArea .meta-line{ margin:.15em 0; }
    #printArea h2{ font-size:13px; margin:1.1em 0 .3em; page-break-after:avoid; }
    #printArea table{ width:100%; border-collapse:collapse; margin-bottom:.6em; font-variant-numeric:tabular-nums; }
    #printArea th, #printArea td{ border:1px solid #999; padding:2px 5px; text-align:right; }
    #printArea th:first-child, #printArea td:first-child{ text-align:left; }
    #printArea thead{ background:#eee; }
    #printArea tr{ page-break-inside:avoid; }
    #printArea tr.flagged td{ background:#fbdcd4; font-weight:700; }
    #printArea .print-empty{ color:#555; font-style:italic; margin:0 0 .8em; }
    #printArea .print-footer{ margin-top:1.2em; font-size:9px; color:#777; }
    /* Tamaño de hoja por defecto: A4 vertical (Jessica: "siempre usamos hoja A4" -- se fija el
       tamaño de página explícito, en vez de dejar que dependa de lo que cada computadora/
       impresora tenga configurado por su cuenta). Las vistas del arqueo con muchas columnas
       (hasta 9, con "Se agotó") cambian a horizontal justo antes de imprimir, vía
       setPrintOrientation() -- así cada impresión sale en el tamaño que le queda bien, sin
       afectar a las demás. */
    @page{ size:A4; margin:10mm; }
  }
</style>

<div id="lockScreen" class="lock-screen" hidden>
  <form id="lockForm" class="lock-card">
    <h1 class="lock-title">Arqueo Diario</h1>
    <p class="lock-sub">Ingresa la contraseña del equipo para continuar.</p>
    <div class="lock-input-wrap">
      <input id="lockInput" class="lock-input" type="password" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Contraseña" />
      <button class="lock-toggle" id="lockToggle" type="button" aria-label="Mostrar contraseña">Mostrar</button>
    </div>
    <button class="btn btn-primary lock-btn" type="submit">Entrar</button>
    <p id="lockError" class="lock-error" hidden>Contraseña incorrecta. Intenta de nuevo.</p>
  </form>
</div>

<div class="app" id="appRoot" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1 class="brand-title">Arqueo Diario</h1>
        <div class="brand-sub" id="brandSub">Registro diario</div>
      </div>
      <div class="topbar-controls">
        <label class="date-field">
          <span class="visually-hidden">Fecha</span>
          <input type="date" id="datePicker" />
        </label>
        <div class="save-area">
          <span class="save-status" id="saveStatus">Cargando…</span>
          <button class="btn btn-primary" id="saveBtn" type="button">Guardar</button>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn" data-tab="panes" type="button">Panes</button>

    if(!day.metas) day.metas = {};

  var filters = { panes:"", bebidas:"", embutidos:"", triples:"", otros:"" };
  var shiftView = { panes:"am", bebidas:"am", embutidos:"am", triples:"am", otros:"am", metas:"am" };
  // Reporte de Metas por día de la semana (ej. "cómo fue la venta varios domingos"): compara,
  // fecha por fecha, el total vendido contra la meta de cada categoría. Se queda en null hasta
  // el primer dibujo de la pestaña Metas, ahí se le pone por defecto el día de la semana que se
  // está viendo (currentDate), y desde ese momento la persona puede cambiarlo con los botones.
  var metasReporteWeekday = null;
  var metasReporteDesde = "";
  var metasReporteHasta = "";
  var metasReporteTurno = "ambos"; // "am" | "pm" | "ambos" (mañana + tarde sumadas)

  // ---------- helpers ----------
  function todayISO(){
    try{ return new Date().toLocaleDateString("en-CA",{ timeZone:"America/Lima" }); }
    catch(e){ return new Date().toISOString().slice(0,10); }
  }
  function fmt(n){
    if(!isFinite(n)) return "0";
    var r = Math.round(n*100)/100;
    return Number.isInteger(r) ? String(r) : r.toFixed(2);
  }
  // Solo para montos en soles del PDF de Pedidos (precios, totales de línea, subtotal, delivery,
  // total): siempre con dos decimales ("108.00", no "108"), a diferencia de fmt() de arriba, que
  // se usa en el Arqueo y ahí no se toca.
  function fmtMoney(n){
    if(!isFinite(n)) return "0.00";
    return (Math.round(n*100)/100).toFixed(2);
  }
  function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
  // Redondea a 2 decimales pero devolviendo un número (no texto) -- para celdas de Excel, donde
  // interesa que sume y ordene bien, no solo que se vea bien (a diferencia de fmt()/fmtMoney()).
  function round2(n){ return isFinite(n) ? Math.round(n*100)/100 : 0; }
  function numOrNull(v){
    if(v === "" || v === null || typeof v === "undefined") return null;
    var n = parseFloat(v);
    return isFinite(n) ? n : null;
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function capitalize(s){ return s.length? s.charAt(0).toUpperCase()+s.slice(1) : s; }
  function fmtDateLabel(iso){
    var d = new Date(iso+"T12:00:00");
    var s = d.toLocaleDateString("es-PE",{ weekday:"short", day:"numeric", month:"short", year:"numeric" });
    return capitalize(s);
  }
  function minutesBetween(t1, t2){
    // t2 - t1, both "HH:MM", same day. Returns null if either missing/invalid.
    if(!t1 || !t2) return null;
    var a = t1.split(":"), b = t2.split(":");
    if(a.length<2 || b.length<2) return null;
    var m1 = (+a[0])*60 + (+a[1]);
    var m2 = (+b[0])*60 + (+b[1]);
    if(!isFinite(m1) || !isFinite(m2)) return null;
    return m2 - m1;
  }
  function fmtDuration(mins){
    if(mins === null) return "";
    if(mins <= 0) return "";
    var h = Math.floor(mins/60), m = mins%60;
    if(h>0) return h + "h " + m + "m sin stock antes del cierre";
    return m + "m sin stock antes del cierre";
  }

  function emptyTurno(){
    return { respAM:"", respPM:"", eAM:"", sAM:"", ePM:"", sPM:"", obsAM:"", obsPM:"", notas:"" };
  }
  // "Saldo Final" (f) arranca en blanco (null) tanto en la mañana como en la tarde: es el
  // número que alguien tiene que escribir después de contar físicamente, no algo que el
  // sistema deba adivinar. "Saldo Anterior" (a) también arranca en blanco (null) cuando no
  // hay un cierre anterior REAL de dónde traerlo — no se inventa un 0, porque un 0 puesto por
  // el sistema (sin dato real) se ve idéntico a un 0 que alguien contó a propósito (por
  // ejemplo, en un producto que solo se hace a pedido), y eso es justo lo que generaba
  // confusión. Un 0 solo aparece si alguien lo confirmó de verdad, contando o escribiéndolo.
  function emptyAmRow(prevFinal){ return { a:prevFinal, i1:0, i2:0, i3:0, m:0, f:null, vc:null }; }
  function emptyPmRow(carry){ return { i1:0, i2:0, i3:0, m:0, f:null, vc:null }; }

  function latestDayBefore(date){
    var keys = Object.keys(STATE.days).filter(function(d){ return d < date; }).sort();
    return keys.length ? keys[keys.length-1] : null;
  }
  // Saldo con el que abre un producto: lo que quedó contado (Saldo Final) en la tarde del
  // día anterior. Si ese día no existe, o existe pero ese "Saldo Final" nunca se llegó a
  // contar (sigue en null), no hay dato real de dónde partir — se devuelve null (pendiente),
  // nunca un 0 inventado.
  function getPrevFinal(prevDay, key, i){
    if(prevDay && prevDay[key] && prevDay[key].pm && prevDay[key].pm[i]){
      var f = prevDay[key].pm[i].f;
      return (f === null || f === undefined) ? null : f;
    }
    return null;
  }
  function makeSection(catalog, prevDay, key){
    return {
      am: catalog.map(function(_, i){ return emptyAmRow(getPrevFinal(prevDay, key, i)); }),
      pm: catalog.map(function(_, i){ return emptyPmRow(getPrevFinal(prevDay, key, i)); }),
      agAm: {}, agPm: {}
    };
  }
  function draftDay(date){
    var prevDate = latestDayBefore(date);
    var prevDay = prevDate ? STATE.days[prevDate] : null;
    return {
      turno: emptyTurno(),
      p: makeSection(PANES, prevDay, "p"),
      b: makeSection(BEBIDAS, prevDay, "b"),
      e: makeSection(EMBUTIDOS, prevDay, "e"),
      t: makeSection(TRIPLES, prevDay, "t"),
      o: makeSection(STATE.customCatalog, prevDay, "o"),
      metas: makeMetasDay(),
      movimientos: { am: [], pm: [] }
    };
  }
  // Otros crece con el tiempo: cuando se agrega un producto nuevo, los días ya guardados
  // (incluso de fechas pasadas) no tienen esa fila todavía. La completamos al vuelo, igual
  // que se calculó originalmente (saldo inicial = saldo final del día anterior si existe).
  function backfillSection(day, key, catalog, prevDay){
    var sec = day[key];
    if(!sec){ day[key] = { am:[], pm:[], agAm:{}, agPm:{} }; sec = day[key]; }
    for(var i = sec.am.length; i < catalog.length; i++){
      var prevFinal = getPrevFinal(prevDay, key, i);
      sec.am.push(emptyAmRow(prevFinal));
      sec.pm.push(emptyPmRow(prevFinal));
    }
  }
  function backfillDay(day, date){
    var prevDate = latestDayBefore(date);
    var prevDay = prevDate ? STATE.days[prevDate] : null;
    // Genérico para las 5 categorías: si un catálogo creció (se agregó un producto nuevo),
    // completamos la fila que falta en cualquier día ya guardado, no solo en Otros.
    PRODUCT_TABS.forEach(function(tab){
      var section = SECTIONS[tab];
      backfillSection(day, section.key, catalogFor(tab), prevDay);
    });
    backfillMetasDay(day);
    // Días guardados antes de que existiera "Movimientos" (Otros como lista de salidas) no
    // tienen este campo todavía -- se completa vacío, nunca se inventa nada.
    if(!day.movimientos) day.movimientos = { am: [], pm: [] };
    if(!day.movimientos.am) day.movimientos.am = [];
    if(!day.movimientos.pm) day.movimientos.pm = [];
    // OJO: aquí ANTES se llamaba a cleanupSaldoFinalMigrado(day) en cada render para
    // corregir un patrón puntual que venía de la migración del Excel de setiembre. Se quitó
    // por completo: esa "corrección" asumía que, en una fila sin ningún otro movimiento
    // (sin ingresos, sin merma, sin venta de caja) con Saldo Anterior en 0, cualquier Saldo
    // Final que se ingresara ahí era en realidad un error de digitación (que la persona quiso
    // escribir en Saldo Anterior) — y lo movía solo, en silencio, de Saldo Final a Saldo
    // Anterior, dejando Saldo Final vacío otra vez. Eso es EXACTAMENTE lo que Jessica reportó
    // como "Saldo Final no guarda": bastaba con escribir un Saldo Final en un producto que
    // partió el día en cero (algo normal y frecuente) para que la app lo borrara solo, sin
    // avisar, cada vez que la pantalla se volvía a dibujar (que pasa todo el tiempo). Como
    // esa limpieza histórica del Excel ya se aplicó hace tiempo, no hace falta que siga
    // corriendo para siempre sobre datos nuevos y legítimos.
  }
  // Quitar un producto de Otros: hay que correr el índice en todos los días ya guardados
  // (el arreglo de filas está indexado por posición), incluyendo los mapas de "se agotó".
  function reindexAgMap(map, deletedIdx){
    var out = {};
    Object.keys(map || {}).forEach(function(k){
      var i = parseInt(k, 10);
      if(i === deletedIdx) return;
      out[i > deletedIdx ? i - 1 : i] = map[k];
    });
    return out;
  }
  function deleteCustomProduct(idx){
    var name = STATE.customCatalog[idx];
    if(name === undefined) return;
    if(!confirm('¿Eliminar "' + name + '" de Otros? Esto borra su registro de todos los días guardados y no se puede deshacer.')) return;
    STATE.customCatalog.splice(idx, 1);
    Object.keys(STATE.days).forEach(function(d){
      var day = STATE.days[d];
      if(day.o){
        if(day.o.am) day.o.am.splice(idx, 1);
        if(day.o.pm) day.o.pm.splice(idx, 1);
        day.o.agAm = reindexAgMap(day.o.agAm, idx);
        day.o.agPm = reindexAgMap(day.o.agPm, idx);
      }
    });
    markDirty();
    scheduleAutosave();
    showToast('"' + name + '" eliminado de Otros.');
    renderTabs();
    renderPanel();
  }

  function getDay(date){
    if(STATE.days[date]){ backfillDay(STATE.days[date], date); return STATE.days[date]; }
    return draftDay(date);
  }
  function ensureDay(date){
    if(!STATE.days[date]) STATE.days[date] = draftDay(date);
    else backfillDay(STATE.days[date], date);
    // Si "baseline" (el punto de comparación para combinar cambios de otros dispositivos
    // al guardar) todavía no conoce este día -- por ejemplo, la primera vez que se toca
    // un día que antes solo se veía como borrador -- lo dejamos con una copia de cómo
    // está el día RECIÉN AHORA, antes de aplicar la edición que sigue después de esto.
    // Si no se hiciera esto, más adelante el sistema pensaría que TODOS los campos de
    // este día se editaron acá (porque no tendría con qué compararlos) y podría pisar
    // por encima datos que otro dispositivo ya guardó en campos que acá nunca se tocaron.
    if(baseline){
      if(!baseline.days) baseline.days = {};
      if(!baseline.days[date]) baseline.days[date] = deepClone(STATE.days[date]);
    }
    return STATE.days[date];
  }

  // Si todavía no se contó el "Saldo Final" (f === null, pendiente), no se puede calcular
  // "Ventas físicas" — no es que sea cero, es que todavía no se sabe. Lo mismo si, en la
  // tarde, lo que falta contar es el cierre de la mañana (amRow.f).
  function ventasAm(row){
    return (row.a === null || row.f === null) ? null : row.a + row.i1 + row.i2 + row.i3 - row.m - row.f;
  }
  function ventasPm(row, amRow){
    if(row.f === null || amRow.f === null) return null;
    return amRow.f + row.i1 + row.i2 + row.i3 - row.m - row.f;
  }
  function ventasOf(row, shift, amRow){ return shift === "am" ? ventasAm(row) : ventasPm(row, amRow); }
  function cuadreOf(row, ventasFisicas){
    // Cuadre = Ventas Caja − Ventas Físicas. Positivo = hay más plata en caja de la que
    // se debería (sobrante, para revisar). Negativo = falta plata en caja respecto a lo
    // que se vendió físicamente (faltante, lo más urgente de revisar).
    if(ventasFisicas === null) return null;
    if(row.vc === null){
      // No se registró venta de caja para esta fila. Si tampoco hubo movimiento físico
      // (ventasFisicas === 0), no hay nada que cuadrar todavía -> queda "—" (neutral).
      // Pero si SÍ hubo una venta física real y no hay caja registrada, eso es justo lo
      // que hay que revisar: se trata como si la caja fuera 0, así que el cuadre sale en
      // negativo -- falta esa plata (por ejemplo, se vendió 1 y no figura en caja -> Cuadre = -1).
      return ventasFisicas === 0 ? null : -ventasFisicas;
    }
    return row.vc - ventasFisicas;
  }
  function isFlagged(row, shift, amRow){
    var v = ventasOf(row, shift, amRow);
    if(v === null) return false;
    if(v < -0.004) return true;
    var c = cuadreOf(row, v);
    if(c !== null && Math.abs(c) > 0.004) return true;
    return false;
  }

  function dayAlerts(day){
    var counts = { panes:0, bebidas:0, embutidos:0, triples:0, otros:0 };
    PRODUCT_TABS.forEach(function(tab){
      var key = SECTIONS[tab].key;
      var sec = day[key];
      if(!sec) return;
      var catalog = catalogFor(tab);
      sec.am.forEach(function(row, i){ if(!isDescontinuado(tab, catalog[i]) && isFlagged(row, "am", null)) counts[tab]++; });
      sec.pm.forEach(function(row, i){ if(!isDescontinuado(tab, catalog[i]) && isFlagged(row, "pm", sec.am[i])) counts[tab]++; });
    });
    counts.total = counts.panes + counts.bebidas + counts.embutidos + counts.triples + counts.otros;
    return counts;
  }

  // ---------- migration (old single-shift schema -> shift schema) ----------
  function migrateOldSection(catalog, oldArr){
    var am = [], pm = [];
    catalog.forEach(function(_, i){
      var old = (oldArr && oldArr[i]) || [0,0,0,0];
      var a = old[0]||0, ing = old[1]||0, m = old[2]||0, f = old[3]||0;
      am.push({ a:a, i1:ing, i2:0, i3:0, m:m, f:f, vc:null });
      pm.push({ i1:0, i2:0, i3:0, m:0, f:f, vc:null });
    });
    return { am:am, pm:pm, agAm:{}, agPm:{} };
  }
  function migrateStateObj(s){
    if(s.meta.schema === 2) return;
    Object.keys(s.days).forEach(function(d){
      var day = s.days[d];
      if(day.p && !day.p.am){ day.p = migrateOldSection(PANES, day.p); }
      if(day.b && !day.b.am){ day.b = migrateOldSection(BEBIDAS, day.b); }
      if(day.e && !day.e.am){ day.e = migrateOldSection(EMBUTIDOS, day.e); }
    });
    s.meta.schema = 2;
  }

  // ---------- persistence (Firebase Firestore) ----------
  function normalizeState(parsed){
    parsed = parsed || {};
    if(!parsed.meta) parsed.meta = { businessName:"", lastSavedAt:null, schema:2 };
    if(!parsed.days) parsed.days = {};
    if(!parsed.customCatalog) parsed.customCatalog = [];
    if(!parsed.precios) parsed.precios = {};
    parsed.metasObjetivos = normalizeMetasObjetivos(parsed.metasObjetivos);
    migrateStateObj(parsed);
    return parsed;
  }
  function readEmbeddedSeed(){
    var el = document.getElementById("state-data");
    var parsed = {};
    try{ parsed = JSON.parse(el.textContent || "{}"); }catch(e){ parsed = {}; }
    return normalizeState(parsed);
  }

  function stashBackup(){
    try{
      sessionStorage.setItem("arqueo_backup", JSON.stringify({
        date: currentDate, ts: Date.now(), day: STATE.days[currentDate] || null
      }));
    }catch(e){}
  }
  function clearBackup(){ try{ sessionStorage.removeItem("arqueo_backup"); }catch(e){} }

  function restoreBackupBanner(){
    var raw;
    try{ raw = sessionStorage.getItem("arqueo_backup"); }catch(e){ raw = null; }
    if(!raw) return;
    var backup;
    try{ backup = JSON.parse(raw); }catch(e){ return; }
    if(!backup || !backup.day) return;
    if(Date.now() - backup.ts > 30*60*1000){ clearBackup(); return; }
    var current = STATE.days[backup.date];
    var same = current && JSON.stringify(current) === JSON.stringify(backup.day);
    if(same){ clearBackup(); return; }
    showBanner("info", "Tenías cambios sin guardar de tu última sesión (" + fmtDateLabel(backup.date) + ").",
      [{ label:"Recuperar", action:function(){
          // Igual que en ensureDay(): si "baseline" no conoce este día todavía, lo
          // dejamos con el valor que tenía ANTES de recuperar el respaldo, para que el
          // guardado sepa distinguir bien lo recuperado de lo que ya había guardado.
          if(baseline){
            if(!baseline.days) baseline.days = {};
            if(!baseline.days[backup.date] && current) baseline.days[backup.date] = deepClone(current);
          }
          STATE.days[backup.date] = backup.day;
          clearBackup();
          markDirty();
          currentDate = backup.date;
          document.getElementById("datePicker").value = currentDate;
          renderAll();
          scheduleAutosave();
        }},
       { label:"Descartar", action:function(){ clearBackup(); renderBanners(); }}]);
  }

  var banners = [];
  function showBanner(kind, text, actions){
    banners = banners.filter(function(b){ return b.kind !== kind; });
    banners.push({ kind:kind, text:text, actions:actions||[] });
    renderBanners();
  }
  function renderBanners(){
    var host = document.getElementById("banners");
    host.innerHTML = "";
    banners.forEach(function(b){
      var div = document.createElement("div");
      div.className = "banner " + (b.kind === "info" ? "info" : b.kind === "warn" ? "warn" : "bad");
      var span = document.createElement("span");
      span.textContent = b.text;
      div.appendChild(span);
      var actWrap = document.createElement("div");
      actWrap.className = "banner-actions";
      b.actions.forEach(function(a){
        var btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = a.label;
        btn.addEventListener("click", a.action);
        actWrap.appendChild(btn);
      });
      div.appendChild(actWrap);
      host.appendChild(div);
    });

  var toastTimer = null;
  // Guarda el resumen de la última importación de ventas por turno, para poder mostrarlo de
  // forma permanente en el panel (el toast desaparece solo a los pocos segundos y no alcanza
  // a leerse un mensaje largo como el de la resta mañana/tarde).
  var lastImportSummary = { am:null, pm:null };
  function showToast(msg, ms){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, ms || 3200);
  }

  function markDirty(){ dirty = true; editGen++; setSaveStatus(); }
  function setSaveStatus(){
    var el = document.getElementById("saveStatus");
    var btn = document.getElementById("saveBtn");
    if(readOnly){ el.textContent = "No se pudo guardar — revisa tu conexión"; el.className = "save-status bad"; btn.disabled = true; return; }
    btn.disabled = saving;
    if(saving){ el.textContent = "Guardando…"; el.className = "save-status"; return; }
    if(dirty){ el.textContent = "Cambios sin guardar"; el.className = "save-status warn"; return; }
    if(STATE.meta.lastSavedAt){
      var mins = Math.round((Date.now() - STATE.meta.lastSavedAt)/60000);
      el.textContent = mins < 1 ? "Guardado justo ahora" : "Guardado hace " + mins + " min";
    } else { el.textContent = "Sin cambios"; }
    el.className = "save-status";
  }

  function scheduleAutosave(){ clearTimeout(saveTimer); saveTimer = setTimeout(function(){ doSave(); }, 1500); }

  function deepClone(o){ return o == null ? o : JSON.parse(JSON.stringify(o)); }

  // ---------- combinar cambios al guardar (para que dos dispositivos editando productos
  // distintos -- o hasta el mismo día -- al mismo tiempo no se pisen entre sí) ----------
  // "freshRemote": lo último que hay en Firestore justo antes de guardar.
  // "local": STATE tal como está en ESTE dispositivo ahora mismo.
  // "base": la última versión que este dispositivo sabe que coincidía con Firestore.
  // Se compara local contra base para saber exactamente qué se editó acá, y esos cambios
  // puntuales se aplican encima de freshRemote (que puede traer cosas nuevas de otro
  // dispositivo que acá todavía no se habían visto).
  function mergeFlatMap(mergedParent, key, localMap, baseMap){
    var remoteMap = mergedParent[key] || {};
    var out = Object.assign({}, remoteMap);
    Object.keys(localMap).forEach(function(k){
      if(localMap[k] !== baseMap[k]){ out[k] = localMap[k]; }
    });
    Object.keys(baseMap).forEach(function(k){
      if(!(k in localMap) && remoteMap[k] === baseMap[k]){ delete out[k]; }
    });
    mergedParent[key] = out;
  }
  function mergeSection(mergedSec, localSec, baseSec){
    ["am","pm"].forEach(function(shift){
      var localArr = (localSec && localSec[shift]) || [];
      var baseArr = (baseSec && baseSec[shift]) || [];
      if(!mergedSec[shift]) mergedSec[shift] = [];
      var fields = shift === "am" ? ["a","i1","i2","i3","m","f","vc"] : ["i1","i2","i3","m","f","vc"];
      for(var i = 0; i < localArr.length; i++){
        var localRow = localArr[i];
        var baseRow = baseArr[i];
        if(!mergedSec[shift][i]){ mergedSec[shift][i] = deepClone(localRow); continue; }
        fields.forEach(function(f){
          var baseVal = baseRow ? baseRow[f] : undefined;
          if(localRow[f] !== baseVal){ mergedSec[shift][i][f] = localRow[f]; }
        });
      }
    });
    mergeFlatMap(mergedSec, "agAm", (localSec && localSec.agAm) || {}, (baseSec && baseSec.agAm) || {});
    mergeFlatMap(mergedSec, "agPm", (localSec && localSec.agPm) || {}, (baseSec && baseSec.agPm) || {});
  }
  // Igual que mergeSection, pero para las filas de Metas (una fila por producto, con un
  // valor por subcolumna -- p.ej. jugos/batidos/frozen en Frutas -- en vez de a/i1/i2/i3/m/f/vc).
  function mergeMetasSection(mergedSec, localSec, baseSec, cat){
    var fields = cat.subcols.map(function(sc){ return sc.key; });
    ["am","pm"].forEach(function(shift){
      var localArr = (localSec && localSec[shift]) || [];
      var baseArr = (baseSec && baseSec[shift]) || [];
      if(!mergedSec[shift]) mergedSec[shift] = [];
      for(var i = 0; i < localArr.length; i++){
        var localRow = localArr[i];
        var baseRow = baseArr[i];
        if(!mergedSec[shift][i]){ mergedSec[shift][i] = deepClone(localRow); continue; }
        fields.forEach(function(f){
          var baseVal = baseRow ? baseRow[f] : undefined;
          if(localRow[f] !== baseVal){ mergedSec[shift][i][f] = localRow[f]; }
        });
      }
    });
  }
  // Movimientos (lista de salidas de Otros: producto + cantidad + nota, ver buildMovimientosPanel)
  // es una LISTA, no columnas fijas por posición -- así que se combina distinto a mergeSection:
  // cada entrada tiene su propio "id" que nunca cambia, y solo se agrega o se borra entera (nunca
  // se edita a la mitad). Dos dispositivos agregando entradas distintas al mismo tiempo se quedan
  // con las dos; si uno borra una entrada que el otro no tocó, se borra igual.
  function mergeMovimientosSection(mergedSec, localSec, baseSec){
    ["am","pm"].forEach(function(shift){
      var localArr = (localSec && localSec[shift]) || [];
      var baseArr = (baseSec && baseSec[shift]) || [];
      var remoteArr = mergedSec[shift] || [];
      var remoteMap = {}; remoteArr.forEach(function(e){ remoteMap[e.id] = e; });
      var baseMap = {}; baseArr.forEach(function(e){ baseMap[e.id] = e; });
      var out = Object.assign({}, remoteMap);
      localArr.forEach(function(e){
        if(!baseMap[e.id] || JSON.stringify(baseMap[e.id]) !== JSON.stringify(e)){ out[e.id] = e; }
      });
      Object.keys(baseMap).forEach(function(id){
        var stillLocal = localArr.some(function(e){ return e.id === id; });
        if(!stillLocal && remoteMap[id] && JSON.stringify(remoteMap[id]) === JSON.stringify(baseMap[id])){
          delete out[id];
        }
      });
      mergedSec[shift] = Object.keys(out).map(function(id){ return out[id]; })
        .sort(function(a, b){ return (a.hora || "").localeCompare(b.hora || "") || String(a.id).localeCompare(String(b.id)); });
    });
  }
  function mergeDay(mergedDay, localDay, baseDay){
    var turnoFields = ["respAM","respPM","eAM","sAM","ePM","sPM","obsAM","obsPM","notas"];
    if(!mergedDay.turno) mergedDay.turno = {};
    turnoFields.forEach(function(f){
      var baseVal = baseDay && baseDay.turno ? baseDay.turno[f] : undefined;
      var localVal = localDay.turno ? localDay.turno[f] : undefined;
      if(localVal !== undefined && localVal !== baseVal){ mergedDay.turno[f] = localVal; }
    });
    ["p","b","e","t","o"].forEach(function(key){
      if(!localDay[key]) return;
      if(!mergedDay[key]) mergedDay[key] = { am:[], pm:[], agAm:{}, agPm:{} };
      mergeSection(mergedDay[key], localDay[key], baseDay ? baseDay[key] : null);
    });
    if(localDay.movimientos){
      if(!mergedDay.movimientos) mergedDay.movimientos = { am:[], pm:[] };
      mergeMovimientosSection(mergedDay.movimientos, localDay.movimientos, baseDay ? baseDay.movimientos : null);
    }
    METAS_CATEGORIAS.forEach(function(cat){
      if(!localDay.metas || !localDay.metas[cat.key]) return;
      if(!mergedDay.metas) mergedDay.metas = {};
      if(!mergedDay.metas[cat.key]) mergedDay.metas[cat.key] = { am:[], pm:[] };
      mergeMetasSection(mergedDay.metas[cat.key], localDay.metas[cat.key], (baseDay && baseDay.metas) ? baseDay.metas[cat.key] : null, cat);
    });
  }
  // Metas de venta por día de la semana (STATE.metasObjetivos): igual patrón que mergeFlatMap,
  // comparando valor por valor (semana/categoría/turno/subcolumna) para que dos dispositivos
  // editando metas de días distintos de la semana no se pisen entre sí.
  function mergeMetasObjetivos(merged, local, base){
    if(!merged.metasObjetivos) merged.metasObjetivos = {};
    var localObj = local.metasObjetivos || {};
    var baseObj = base.metasObjetivos || {};
    METAS_WEEKDAY_KEYS.forEach(function(wk){
      if(!localObj[wk]) return;
      if(!merged.metasObjetivos[wk]) merged.metasObjetivos[wk] = metasObjetivoDefaultFor(wk);
      METAS_CATEGORIAS.forEach(function(cat){
        if(!cat.conMeta) return;
        var localCat = localObj[wk][cat.key];
        if(!localCat) return;
        var baseCat = (baseObj[wk] && baseObj[wk][cat.key]) || null;
        if(!merged.metasObjetivos[wk][cat.key]) merged.metasObjetivos[wk][cat.key] = { am:[], pm:[] };
        ["am","pm"].forEach(function(shift){
          var localArr = localCat[shift] || [];
          var baseArr = (baseCat && baseCat[shift]) || [];
          if(!merged.metasObjetivos[wk][cat.key][shift]) merged.metasObjetivos[wk][cat.key][shift] = localArr.slice();
          var out = merged.metasObjetivos[wk][cat.key][shift];
          for(var i = 0; i < localArr.length; i++){
            if(localArr[i] !== baseArr[i]){ out[i] = localArr[i]; }
          }
        });
      });
    });
  }
  function mergeStateForSave(freshRemote, local, base){
    var merged = deepClone(freshRemote);
    if(!merged.meta) merged.meta = { businessName:"", lastSavedAt:null, schema:2 };
    var baseBiz = base && base.meta ? base.meta.businessName : undefined;
    if(local.meta && local.meta.businessName !== baseBiz){ merged.meta.businessName = local.meta.businessName; }
    mergeFlatMap(merged, "precios", local.precios || {}, (base && base.precios) || {});
    mergeMetasObjetivos(merged, local, base || {});
    var baseCatalog = (base && base.customCatalog) || [];
    if(JSON.stringify(local.customCatalog || []) !== JSON.stringify(baseCatalog)){
      merged.customCatalog = deepClone(local.customCatalog || []);
    }
    if(!merged.days) merged.days = {};
    Object.keys(local.days || {}).forEach(function(date){
      var localDay = local.days[date];
      var baseDay = (base && base.days && base.days[date]) || null;
      if(!merged.days[date]){ merged.days[date] = deepClone(localDay); return; }
      mergeDay(merged.days[date], localDay, baseDay);
    });
    return merged;
  }
  // Rellena TODOS los días de un STATE suelto (uno que todavía no es el STATE en uso)
  // con el mismo relleno que backfillDay ya hace normalmente -- para poder usarlo como
  // "baseline" (punto de comparación) sin que le falten filas que STATE sí tiene, lo
  // cual haría que la próxima comparación piense que todo cambió acá y pise por encima
  // lo de otro dispositivo por error.
  function backfillAllDays(state){
    Object.keys(state.days || {}).forEach(function(date){
      backfillDay(state.days[date], date);
    });
    return state;
  }

  function doSave(){
    if(readOnly || saving || !db || !dirty) { setSaveStatus(); return; }
    clearTimeout(saveTimer);
    saving = true;
    setSaveStatus();
    stashBackup();
    var genAtStart = editGen;
    var localSnapshot = deepClone(STATE);
    var baseSnapshot = deepClone(baseline) || {};
    var ref = db.collection("arqueo").doc("state");
    var remoteChangedElsewhere = false;
    // Se usa una TRANSACCIÓN de Firestore (no un simple get()+set()) porque dos
    // dispositivos pueden estar guardando casi al mismo instante: sin transacción,
    // el segundo guardado podía leer la base de datos ANTES de que el primero
    // terminara de escribir, calcular su combinación con esa foto vieja, y luego
    // pisar por completo el guardado del primero. La transacción hace que Firestore
    // detecte ese choque y reintente automáticamente con el dato más reciente, así
    // que ningún guardado de otro dispositivo se puede perder de esta forma.
    db.runTransaction(function(transaction){
      return transaction.get(ref).then(function(snap){
        var freshRemote = normalizeState(snap.exists ? snap.data() : {});
        remoteChangedElsewhere = JSON.stringify(freshRemote) !== JSON.stringify(baseSnapshot);
        var merged = mergeStateForSave(freshRemote, localSnapshot, baseSnapshot);
        merged.meta.lastSavedAt = Date.now();
        lastSavedBySelf = merged.meta.lastSavedAt;
        transaction.set(ref, merged);
        return merged;
      });
    }).then(function(merged){
      saving = false;
      baseline = deepClone(merged);
      if(editGen === genAtStart){
        STATE = merged;
        dirty = false;
      } else {
        // Se siguió editando acá mismo mientras esto se guardaba -- no botamos esos
        // cambios nuevos (STATE ya los tiene). El "baseline" recién actualizado hace que
        // el próximo guardado los identifique bien y los mande sin perder nada.
        dirty = true;
        scheduleAutosave();
      }
      clearBackup();
      setSaveStatus();
      if(remoteChangedElsewhere) renderAll();
    }).catch(function(err){
      saving = false;
      setSaveStatus();
      handleSaveError(err);
    });
  }

  function handleSaveError(err){
    var code = err && err.code;
    if(code === "permission-denied"){
      showBanner("bad", "No se pudo guardar: sin permiso de escritura en la base de datos. Avísale al dueño del arqueo.", []);
      setSaveStatus();
      return;
    }
    showToast("No se pudo guardar (revisa tu conexión a internet). Vuelve a intentar en unos segundos.");
    setSaveStatus();
  }

  // ---------- import (reporte de ventas del sistema) ----------
  // Nombres que el sistema exporta distinto al catálogo del arqueo (mismo producto,
  // solo cambia la forma de escribirlo: abreviaturas, singular/plural, una letra de más o menos).
  var IMPORT_ALIASES = {
    "MANT LAIVE 180 GR": "Mantequilla Laive 180g",
    "MANT LAIVE 90 GR": "Mantequilla Laive 90g",
    "CROISANT DE MANJAR": "Croissant De Manjar",
    "OREJAS": "Oreja",
    "MASA MADRE CON FRUTOS ENTERO": "Masa Madre con Frutos",
    "ACEITUNA ENTERA POR KILO": "Aceituna",
    "ACEITUNA ENTERA X KG": "Aceituna",
    "CIABATTA POR KILO": "Ciabatta",
    "LECHE LIGTH CAJA LT - SEMI": "Leche Light Caja LT - Semi",
    "MIEL FRASCO 200 GR": "Miel Frasco 200g",
    "MIEL FRASCO 250 GR": "Miel Frasco 250g",
    "MIEL FRASCO 500 GR": "Miel Frasco 500g",
    "QUESO MOZARELLA": "Queso Mozzarella",
    "TOSTADA AL AJO X 0 130G": "Tostada Ciabatta al Ajo",
    "TOSTADAS MASA MADRE X 0 120GR": "Tostada Masa Madre"
  };
  // Triples: el sistema de ventas registra cada sabor de dos formas — "UND T. X" (unidad suelta)
  // y "TIRA DE X" (la tira entera sin cortar, que son 3 unidades). Como el arqueo se lleva en
  // unidades, cada línea "TIRA DE X" del reporte cuenta triple (mult:3) y se suma a la misma fila
  // que "UND T. X" (mult:1). Pavo y Glaseado Piña no aparecieron en los reportes que revisamos —
  // están puestos siguiendo el mismo patrón, pero avísame si no calzan cuando los vendan.
  var TRIPLE_IMPORT_MAP = {
    "UND T CLASICO": { name: "Triples Clásicos", mult: 1 },
    "TIRA DE CLASICOS": { name: "Triples Clásicos", mult: 3 },
    "UND T ACEITUNA": { name: "Triple de Aceituna", mult: 1 },
    "TIRA DE ACEITUNA": { name: "Triple de Aceituna", mult: 3 },
    "UND T ASADO": { name: "Triple de Asado", mult: 1 },
    "TIRA DE ASADO": { name: "Triple de Asado", mult: 3 },
    "UND T POLLO DURAZNO": { name: "Triple de Pollo Durazno", mult: 1 },
    "TIRA DE POLLO DURAZNO": { name: "Triple de Pollo Durazno", mult: 3 },
    "UND T PAVO": { name: "Triple de Pavo", mult: 1 },
    "TIRA DE PAVO": { name: "Triple de Pavo", mult: 3 },
    "UND T GLASEADO PINA": { name: "Triple Glaseado Piña", mult: 1 },
    "TIRA DE GLASEADO PINA": { name: "Triple Glaseado Piña", mult: 3 },
    "UND T CHAMPINON Y TOCINO": { name: "Triple Champiñón y Tocino", mult: 1 },
    "TIRA DE CHAMPINON Y TOCINO": { name: "Triple Champiñón y Tocino", mult: 3 },
    "UND T POLLO CON JAMON Y QUESO": { name: "Triple Pollo Jamón y Queso", mult: 1 },
    "TIRA DE POLLO CON JAMON Y QUESO": { name: "Triple Pollo Jamón y Queso", mult: 3 }
  };
  function normName(s){
    s = String(s || "").trim().toUpperCase();
    if(s.normalize) s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    s = s.replace(/[.()]/g, " ");
    s = s.replace(/[^A-Z0-9 ]/g, " ");
    s = s.replace(/\s+/g, " ").trim();
    return s;
  }
  function buildCatalogIndex(){
    var idx = {};
    PRODUCT_TABS.forEach(function(tabKey){
      catalogFor(tabKey).forEach(function(name, i){
        idx[normName(name)] = { tab: tabKey, idx: i, name: name };
      });
    });
    return idx;
  }
  function resolveCatalogEntry(catIndex, posName){
    var n = normName(posName);
    if(catIndex[n]) return { hit: catIndex[n], mult: 1 };
    var tri = TRIPLE_IMPORT_MAP[n];
    if(tri){
      var tn = normName(tri.name);
      if(catIndex[tn]) return { hit: catIndex[tn], mult: tri.mult };
    }
    var alias = IMPORT_ALIASES[n];
    if(alias){
      var an = normName(alias);
      if(catIndex[an]) return { hit: catIndex[an], mult: 1 };
    }
    return null;
  }
  // El sistema de ventas exporta a veces un reporte "simple" (Código, Nombre, Cantidad Vendida
  // en las primeras 3 columnas) y a veces uno "detallado por familia" (con Stock, Precio, etc.
  // de por medio, donde Cantidad Vendida cae en otra columna). Por eso buscamos el encabezado
  // real ("CDARTICULO" / "DSARTICULO" / "Cantidad Vendida") y detectamos en qué columna cae
  // cada uno, en vez de asumir siempre las primeras tres columnas.
  function findSalesColumns(aoa){
    for(var r = 0; r < Math.min((aoa || []).length, 40); r++){
      var row = aoa[r] || [];
      var codeCol = -1, nameCol = -1, qtyCol = -1;
      for(var c = 0; c < row.length; c++){
        var cell = String(row[c] == null ? "" : row[c]).trim().toUpperCase();
        if(cell === "CDARTICULO") codeCol = c;
        else if(cell === "DSARTICULO") nameCol = c;
        else if(cell.indexOf("CANTIDAD VENDIDA") === 0) qtyCol = c;
      }
      if(codeCol !== -1 && nameCol !== -1 && qtyCol !== -1) return { code: codeCol, name: nameCol, qty: qtyCol };
    }
    return null;
  }
  // Detecta filas de producto por patrón (código numérico, nombre de texto, cantidad numérica) en
  // vez de depender de encabezados exactos para cada fila — así ignora títulos, "Familia :",
  // subtotales y el total general. Las columnas en sí se ubican con findSalesColumns() arriba.
  function parseSalesAOA(aoa){
    var items = [];
    var cols = findSalesColumns(aoa) || { code: 0, name: 1, qty: 2 };
    (aoa || []).forEach(function(row){
      if(!row || row.length <= Math.max(cols.code, cols.name, cols.qty)) return;
      var code = row[cols.code], name = row[cols.name], qtyRaw = row[cols.qty];
      var codeNum = (typeof code === "number") ? code : parseFloat(String(code == null ? "" : code).replace(",", "."));
      var qtyNum = (typeof qtyRaw === "number") ? qtyRaw : parseFloat(String(qtyRaw == null ? "" : qtyRaw).replace(",", "."));
      if(!isFinite(codeNum) || codeNum <= 0) return;
      if(typeof name !== "string" || !name.trim()) return;
      if(!isFinite(qtyNum)) return;
      items.push({ code: codeNum, name: String(name).trim(), qty: qtyNum });
    });
    return items;
  }
  function applyImport(items, date, shift){
    var catIndex = buildCatalogIndex();
    var day = ensureDay(date);
    var updated = { panes:0, bebidas:0, embutidos:0, triples:0, otros:0 };
    var skipped = [];
    // Varias líneas del reporte pueden apuntar al mismo producto del catálogo (p.ej. Triples:
    // "unidad suelta" + "tira"), así que primero sumamos todo por producto y recién al final
    // escribimos una vez por fila — así no se pisan entre sí ni se duplican si se reimporta.
    var sums = {};
    var hits = {};
    items.forEach(function(item){
      var resolved = resolveCatalogEntry(catIndex, item.name);
      if(!resolved){ skipped.push(item.name); return; }
      var key = resolved.hit.tab + ":" + resolved.hit.idx;
      if(!(key in sums)){ sums[key] = 0; hits[key] = resolved.hit; }
      sums[key] += item.qty * resolved.mult;
    });
    // El reporte de cierre de la tarde (10pm) trae el total del día completo (mañana + tarde
    // juntas, según confirmó Jessica), no solo lo de la tarde — así que al importarlo en el
    // turno "pm" hay que restarle, producto por producto, lo que ya está en "Ventas Caja
    // Mañana" para quedarnos con la venta real de la tarde sola.
    var sinMananaCount = 0;
    var totalGeneralPm = 0;
    var totalRestadoPm = 0;
    Object.keys(sums).forEach(function(key){
      var hit = hits[key];
      var section = SECTIONS[hit.tab];
      var sec = day[section.key];
      var row = shift === "am" ? sec.am[hit.idx] : sec.pm[hit.idx];
      if(shift === "pm"){
        var amRow = sec.am[hit.idx];
        var amVc = (amRow && amRow.vc !== null) ? amRow.vc : 0;
        if(!amRow || amRow.vc === null) sinMananaCount++;
        var general = sums[key];
        var soloTarde = general - amVc;
        row.vc = soloTarde;
        totalGeneralPm += general;
        totalRestadoPm += soloTarde;
      } else {
        row.vc = sums[key];
      }
      updated[hit.tab]++;
    });
    return {
      updated: updated, skipped: skipped,
      totalUpdated: updated.panes + updated.bebidas + updated.embutidos + updated.triples + updated.otros,
      sinMananaCount: sinMananaCount,
      totalGeneralPm: shift === "pm" ? totalGeneralPm : null,
      totalRestadoPm: shift === "pm" ? totalRestadoPm : null
    };
  }
  // Llena Metas a partir del mismo reporte de ventas que ya se importa para Panes/Bebidas/
  // Embutidos/Triples -- usa METAS_ITEM_LINKS (ver más arriba) para saber, de cada producto de
  // Metas, si toca buscarlo por código en el reporte ("cod") o copiar el dato que ya se calculó
  // en el catálogo de Panes ("cat"). Se llama SIEMPRE después de applyImport, con la misma
  // fecha/turno, sobre el mismo día -- así lo de "cat" ya encuentra el dato de Panes fresco.
  // Nunca escribe en Panes/Bebidas/Embutidos/Triples, solo lee de ahí.
  function applyImportToMetas(items, date, shift){
    var day = ensureDay(date);
    var codeSums = {};
    items.forEach(function(item){
      if(!(item.code in codeSums)) codeSums[item.code] = 0;
      codeSums[item.code] += item.qty;
    });
    var catIndex = buildCatalogIndex();
    var updatedMetas = 0;
    METAS_CATEGORIAS.forEach(function(cat){
      var linkMap = METAS_ITEM_LINKS[cat.key];
      if(!linkMap) return;
      var sec = day.metas[cat.key];
      if(!sec) return;
      cat.items.forEach(function(itemName, idx){
        var link = linkMap[itemName];
        if(!link) return;
        if(!sec.am[idx]) sec.am[idx] = {};
        if(!sec.pm[idx]) sec.pm[idx] = {};
        if(link.src === "cod"){
          cat.subcols.forEach(function(sc, si){
            var code = link.codes[si];
            if(code === null || code === undefined) return;
            if(!(code in codeSums)) return;
            var general = codeSums[code];
            if(shift === "pm"){
              var amVal = (sec.am[idx][sc.key] != null) ? sec.am[idx][sc.key] : 0;
              sec.pm[idx][sc.key] = general - amVal;
            } else {
              sec.am[idx][sc.key] = general;
            }
            updatedMetas++;
          });
        } else if(link.src === "cat"){
          var hit = catIndex[normName(link.name)];
          if(!hit) return; // no debería pasar, pero por seguridad no se rompe nada si el nombre cambia
          var panSec = day[SECTIONS[hit.tab].key];
          var amRow = panSec.am[hit.idx];
          var prow = shift === "am" ? amRow : panSec.pm[hit.idx];
          var venta = shift === "am" ? ventasAm(prow) : ventasPm(prow, amRow);
          // Si todavía no se puede calcular la venta (falta el conteo físico "Saldo Final"),
          // no se toca la casilla de Metas -- se queda como estaba hasta que sí se pueda.
          if(venta === null) return;
          var subKey = cat.subcols[0].key;
          sec[shift][idx][subKey] = venta;
          updatedMetas++;
        }
      });
    });
    return { updatedMetas: updatedMetas };
  }
  function handleImportFile(file, date, shift, statusEl){
    if(readOnly){ showToast("Vista de solo lectura: no puedes importar aquí."); return; }
    if(typeof XLSX === "undefined"){ showToast("No se pudo cargar el lector de Excel. Revisa tu conexión e intenta de nuevo."); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var data = new Uint8Array(e.target.result);
        var wb = XLSX.read(data, { type:"array" });
        var ws = wb.Sheets[wb.SheetNames[0]];
        var aoa = XLSX.utils.sheet_to_json(ws, { header:1, defval:"", raw:true });
        var items = parseSalesAOA(aoa);
        if(items.length === 0){
          showToast("No se reconocieron filas de productos en ese archivo. ¿Es el reporte de ventas del sistema?");
          return;
        }
        var result = applyImport(items, date, shift);
        result.updatedMetas = applyImportToMetas(items, date, shift).updatedMetas;
        markDirty();
        scheduleAutosave();
        // Guardamos el resumen ANTES de repintar el panel, para que el bloque "Última
        // importación" ya salga completo la primera vez (si no, renderPanel() reconstruye
        // el control de importar con el resumen anterior, o vacío, y hay que esperar a un
        // segundo repintado para verlo).
        showImportSummary(result, date, shift, statusEl);
        renderTabs();
        if(currentTab === "turno") renderPanel();
      }catch(err){
        showToast("No se pudo leer ese archivo. Revisa que sea el reporte de ventas exportado del sistema (.xls, .xlsx o .csv).");
      }
    };
    reader.onerror = function(){ showToast("No se pudo leer el archivo."); };
    reader.readAsArrayBuffer(file);
  }
  // Arma el bloque "Última importación" a partir de lastImportSummary[shift] — se llama tanto
  // al construir el panel (para que sobreviva un renderPanel()) como justo después de importar.
  function renderImportStatus(statusEl, shift){
    if(!statusEl) return;
    statusEl.innerHTML = "";
    var saved = lastImportSummary[shift];
    if(!saved) return;
    var p = document.createElement("div");
    p.className = "hint";
    p.style.margin = ".5rem 0 0";
    p.textContent = "Última importación (" + SHIFT_LABEL[shift] + ", " + fmtDateLabel(saved.date) + "): " + saved.msg;
    statusEl.appendChild(p);
    if(saved.skipped && saved.skipped.length){
      var det = document.createElement("details");
      det.style.fontSize = ".76rem";
      det.style.color = "var(--ink-muted)";
      det.style.marginTop = ".3rem";
      var sum = document.createElement("summary");
      sum.style.cursor = "pointer";
      sum.textContent = "Ver productos del archivo que no se reconocieron";
      det.appendChild(sum);
      var listDiv = document.createElement("div");
      listDiv.style.marginTop = ".3rem";
      listDiv.textContent = saved.skipped.slice(0, 60).join(", ") + (saved.skipped.length > 60 ? "…" : "");
      det.appendChild(listDiv);
      statusEl.appendChild(det);
    }
  }
  function showImportSummary(result, date, shift, statusEl){
    var n = result.totalUpdated;
    var s = result.skipped.length;
    var msg = n + " producto" + (n===1?"":"s") + " actualizado" + (n===1?"":"s") +
      " (Panes " + result.updated.panes + " · Bebidas " + result.updated.bebidas + " · Embutidos " + result.updated.embutidos +
      " · Triples " + result.updated.triples + " · Otros " + result.updated.otros + ")" +
      (result.updatedMetas ? " · Metas " + result.updatedMetas + " casilla" + (result.updatedMetas===1?"":"s") : "") +
      (s ? " — " + s + " fila" + (s===1?"":"s") + " del archivo no está" + (s===1?"":"n") + " en tu arqueo." : "");
    if(shift === "pm" && result.totalGeneralPm !== null){
      msg += " — Total del reporte (día completo): " + fmt(result.totalGeneralPm) +
        ", ya restando lo de la mañana → Ventas Caja Tarde: " + fmt(result.totalRestadoPm) + ".";
      if(result.sinMananaCount > 0){
        msg += " Ojo: " + result.sinMananaCount + " producto" + (result.sinMananaCount===1?"":"s") +
          " no tenía" + (result.sinMananaCount===1?"":"n") + " ventas de mañana registradas todavía, así que para " +
          (result.sinMananaCount===1?"ese producto":"esos productos") + " se tomó el total del reporte tal cual.";
      }
    }
    // Mensaje largo (sobre todo el de la tarde, con la resta) — le damos más tiempo en
    // pantalla que al toast normal, y además queda guardado de forma permanente abajo del
    // botón (renderImportStatus), porque el toast igual se cierra solo.
    showToast(msg, 7000);
    lastImportSummary[shift] = { msg: msg, skipped: result.skipped, date: date };
    renderImportStatus(statusEl, shift);
  }
  function buildImportControl(shift){
    var wrap = document.createElement("div");
    wrap.style.marginTop = ".5rem";
    var label = document.createElement("label");
    label.className = "btn btn-sm";
    label.style.display = "inline-flex";
    label.style.cursor = "pointer";

    var statusEl = document.createElement("div");

  }

  // ---------- print report ----------
  function printableRows(tabKey, shift, day){
    var section = SECTIONS[tabKey];
    var amRows = day[section.key].am;
    var pmRows = day[section.key].pm;
    var out = [];
    catalogFor(tabKey).forEach(function(name, idx){
      var amRow = amRows[idx];
      var row = shift === "am" ? amRow : pmRows[idx];
      var saldoAnt = shift === "am" ? row.a : amRow.f;
      // "Saldo Final" pendiente de contar (null) no cuenta como "se movió" — antes sí generaba
      // un falso movimiento porque null nunca es igual al saldo anterior.
      var fChanged = row.f !== null && row.f !== saldoAnt;
      var moved = row.i1 || row.i2 || row.i3 || row.m || fChanged || row.vc !== null;
      if(!moved) return;
      var v = ventasOf(row, shift, amRow);
      var c = cuadreOf(row, v);
      out.push({
        name: name, saldoAnt: saldoAnt, ing: row.i1 + row.i2 + row.i3, m: row.m, f: row.f,
        v: v, vc: row.vc, c: c, flagged: isFlagged(row, shift, amRow)
      });
    });
    return out;
  }

            "</td><td>" + fmt(r.ing) + "</td><td>" + fmt(r.m) + "</td><td>" + (r.f === null ? "—" : fmt(r.f)) + "</td><td>" + (r.v === null ? "—" : fmt(r.v)) +
            "</td><td>" + (r.vc === null ? "—" : fmt(r.vc)) + "</td><td>" + (r.c === null ? "—" : fmt(r.c)) + "</td></tr>";
        });

      });

  // Si la persona aprieta Control+P (o usa el menú del navegador) directamente, SIN pasar
  // por ninguno de los botones de "Imprimir...", igual queremos que salga algo -- lo mismo
  // que se está viendo en pantalla ahora mismo, no una hoja en blanco (porque el resto de la
  // app se oculta al imprimir; solo se ve lo que haya adentro de #printArea). "explicitPrint"
  // se pone en true justo antes de que un botón de imprimir arme su propio contenido, para
  // que este armado automático no lo pise.
  var explicitPrint = false;
  // Tamaño de hoja dinámico: las vistas del arqueo con muchas columnas necesitan hoja
  // horizontal, pero las pre-órdenes de pedido y los reportes de pedidos son angostos y se
  // ven mejor -- en su tamaño de hoja de siempre -- en vertical. En vez de un solo @page fijo
  // para toda la app (que hacía que TODO saliera horizontal, incluida la pre-orden), esta
  // función arma/actualiza un <style> aparte justo antes de cada impresión, según lo que
  // corresponda a esa impresión en particular.
  function setPrintOrientation(landscape){
    var el = document.getElementById("printPageSize");
    if(!el){
      el = document.createElement("style");
      el.id = "printPageSize";
      (document.head || document.documentElement).appendChild(el);
    }
    el.textContent = landscape ? "@media print{ @page{ size:A4 landscape; margin:10mm; } }" : "";
  }
  // Se actualiza en CADA render (no solo al momento de imprimir) porque en algunos
  // navegadores/dispositivos apretar Control+P varias veces seguidas no siempre vuelve a
  // avisar justo antes de imprimir -- así, #printArea ya viene lista de antemano con lo
  // mismo que se está viendo en pantalla en ese momento, y no hace falta depender de que
  // ese aviso llegue a tiempo.
  function syncPrintAreaToCurrentView(){
    if(explicitPrint) return;
    if(!STATE) return;
    var area = document.getElementById("printArea");
    if(!area) return;
    // Las dos vistas que arma esta función (categoría/turno actual, o el reporte completo)
    // siempre necesitan hoja horizontal.
    setPrintOrientation(true);
    if(PRODUCT_TABS.indexOf(currentTab) !== -1){
      area.innerHTML = buildPrintCurrentViewHTML(currentTab, shiftView[currentTab], currentDate);
    } else {
      area.innerHTML = buildPrintHTML(currentDate);
    }
  }
  window.addEventListener("beforeprint", syncPrintAreaToCurrentView);
  function doWindowPrint(tempTitle){
    // Cambiamos el título de la página mientras se imprime para que el navegador
    // no muestre "Arqueo Diario" en el encabezado del PDF/impresión.
    explicitPrint = true;
    var oldTitle = document.title;
    document.title = tempTitle;
    var restored = false;
    function restore(){
      if(restored) return;
      restored = true;
      explicitPrint = false;
      document.title = oldTitle;
      window.removeEventListener("afterprint", restore);
    }
    window.addEventListener("afterprint", restore);
    setTimeout(function(){
      window.print();
      setTimeout(restore, 1500);
    }, 30);
  }
  function doPrint(date){
    setPrintOrientation(true);
    var area = document.getElementById("printArea");
    area.innerHTML = buildPrintHTML(date);
    doWindowPrint("Arqueo " + (date || ""));
  }

  // ---------- resumen simple para imprimir (una sola tabla por categoría, mañana y tarde
  // juntas en la misma fila, sin Ventas Físicas / Ventas Caja / Cuadre / Se agotó -- solo lo
  // básico que Jessica pidió: Saldo Anterior, Ingreso AM, Ingreso PM, Merma y Saldo Final). ----
  function printableRowsSimple(tabKey, day){
    var section = SECTIONS[tabKey];
    var amRows = day[section.key].am;
    var pmRows = day[section.key].pm;
    var out = [];
    catalogFor(tabKey).forEach(function(name, idx){
      var amRow = amRows[idx];
      var pmRow = pmRows[idx];
      var saldoAnt = amRow.a;
      var ingAm = amRow.i1 + amRow.i2 + amRow.i3;
      var ingPm = pmRow.i1 + pmRow.i2 + pmRow.i3;
      var merma = amRow.m + pmRow.m;
      // Saldo Final = el cierre real del día: el de la tarde si ya se contó, y si no,
      // el de la mañana (por ejemplo, un producto que no tuvo movimiento en la tarde).
      var saldoFinal = pmRow.f !== null ? pmRow.f : amRow.f;
      var amFChanged = amRow.f !== null && amRow.f !== saldoAnt;
      var pmFChanged = pmRow.f !== null && pmRow.f !== amRow.f;
      var moved = ingAm || ingPm || merma || amFChanged || pmFChanged || amRow.vc !== null || pmRow.vc !== null;
      if(!moved) return;
      out.push({ name: name, saldoAnt: saldoAnt, ingAm: ingAm, ingPm: ingPm, merma: merma, saldoFinal: saldoFinal });
    });
    return out;
  }
  function buildPrintSimpleHTML(date){

        "<th>Merma</th><th>Saldo final</th></tr></thead><tbody>";
      rows.forEach(function(r){
        html += "<tr><td>" + esc(r.name) + "</td><td>" + (r.saldoAnt === null ? "—" : fmt(r.saldoAnt)) +
          "</td><td>" + fmt(r.ingAm) + "</td><td>" + fmt(r.ingPm) + "</td><td>" + fmt(r.merma) +
          "</td><td>" + (r.saldoFinal === null ? "—" : fmt(r.saldoFinal)) + "</td></tr>";
      });
      html += "</tbody></table>";
    });
    html += '<div class="print-footer">Generado ' + esc(new Date().toLocaleString("es-PE",{ timeZone:"America/Lima" })) + "</div>";
    return html;

  // ---------- imprimir la vista tal como se ve en pantalla (una sola tabla, con las mismas
  // columnas y el mismo orden que la tabla de la categoría/turno que se está viendo, incluido
  // "Se agotó") -- para que no haga falta recortar una captura de pantalla y pegarla en Word. ----
  function printableRowsCurrent(tabKey, shift, day){
    var section = SECTIONS[tabKey];
    var amRows = day[section.key].am;
    var pmRows = day[section.key].pm;
    var agMap = shift === "am" ? day[section.key].agAm : day[section.key].agPm;
    var closeTime = shift === "am" ? day.turno.sAM : day.turno.sPM;
    var out = [];
    catalogFor(tabKey).forEach(function(name, idx){
      if(isDescontinuado(tabKey, name)) return;
      var amRow = amRows[idx];
      var row = shift === "am" ? amRow : pmRows[idx];
      var saldoAnt = shift === "am" ? row.a : amRow.f;
      var v = ventasOf(row, shift, amRow);
      var c = cuadreOf(row, v);
      var agTime = agMap[idx];
      var dur = fmtDuration(minutesBetween(agTime, closeTime));
      out.push({
        name: name, saldoAnt: saldoAnt, ing: row.i1 + row.i2 + row.i3, m: row.m, f: row.f,
        agLabel: agTime ? (agTime + (dur ? " — " + dur : "")) : "—",
        v: v, vc: row.vc, c: c, flagged: isFlagged(row, shift, amRow)
      });
    });
    return out;
  }
  function buildPrintCurrentViewHTML(tab, shift, date){
    var day = getDay(date);
    var section = SECTIONS[tab];
    var rows = printableRowsCurrent(tab, shift, day);
    var html = "";
    html += "<h1>" + esc(STATE.meta.businessName || "Arqueo Diario") + "</h1>";
    html += '<div class="print-sub">' + esc(section.label) + " — " + esc(SHIFT_LABEL[shift]) + " · " + esc(fmtDateLabel(date)) + "</div>";
    if(rows.length === 0){
      html += '<p class="print-empty">Sin productos registrados en esta categoría.</p>';

        "<th>Saldo final</th><th>Se agotó</th><th>Ventas físicas</th><th>Ventas caja</th><th>Cuadre</th></tr></thead><tbody>";
      rows.forEach(function(r){
        html += '<tr class="' + (r.flagged ? "flagged" : "") + '"><td>' + esc(r.name) + "</td><td>" + (r.saldoAnt === null ? "—" : fmt(r.saldoAnt)) +
          "</td><td>" + fmt(r.ing) + "</td><td>" + fmt(r.m) + "</td><td>" + (r.f === null ? "—" : fmt(r.f)) +
          "</td><td>" + esc(r.agLabel) + "</td><td>" + (r.v === null ? "—" : fmt(r.v)) +
          "</td><td>" + (r.vc === null ? "—" : fmt(r.vc)) + "</td><td>" + (r.c === null ? "—" : fmt(r.c)) + "</td></tr>";
      });

    }
    html += '<div class="print-footer">Generado ' + esc(new Date().toLocaleString("es-PE",{ timeZone:"America/Lima" })) + "</div>";

  function doPrintCurrentView(tab, shift, date){
